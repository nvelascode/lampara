function authSave(){try{if(AU)localStorage.setItem(AUTHKEY,JSON.stringify(AU));else localStorage.removeItem(AUTHKEY);}catch(e){}}
async function authCall(path,body,token){
  const hd={'Content-Type':'application/json',apikey:CFG.key};
  if(token)hd.Authorization='Bearer '+token;else if(/^eyJ/.test(CFG.key))hd.Authorization='Bearer '+CFG.key;
  const r=await fetch(CFG.url.replace(/\/$/,'')+path,{method:'POST',headers:hd,body:JSON.stringify(body||{})});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.msg||j.error_description||j.message||j.error))||('http '+r.status));e.status=r.status;e.code=(j&&(j.error_code||j.code))||'';throw e;}
  return j;
}
function authMsg(e){
  const m=String((e&&e.message)||'').toLowerCase(),c=String((e&&e.code)||'').toLowerCase();
  if(c==='over_email_send_rate_limit'||e.status===429||/rate limit|only request this after|security purposes/.test(m))return 'Espera un minuto antes de pedir otro código.';
  if(/unable to validate email|invalid format|email address.*invalid|invalid.*email/.test(m)||c==='email_address_invalid')return 'Revisa que el correo esté bien escrito.';
  if(c==='otp_expired'||/expired|invalid|incorrect/.test(m))return 'Ese código no es correcto o ya venció. Pide uno nuevo.';
  if(c==='signup_disabled'||/signups not allowed/.test(m))return 'Los registros nuevos están desactivados en Supabase.';
  if(/failed to fetch|networkerror|load failed|network/.test(m))return 'Sin conexión. Inténtalo de nuevo.';
  if(/smtp|error sending|sending (confirmation|magic|email)/.test(m))return 'No se pudo enviar el correo. Revisa el correo (SMTP) en Supabase.';
  return 'No se pudo completar. Inténtalo de nuevo.';
}
let _refreshP=null;
async function authToken(){
  if(!signedIn())return null;
  if(AU.exp&&AU.exp-Date.now()>60000)return AU.at;
  if(!_refreshP){
    _refreshP=(async()=>{
      try{
        const j=await authCall('/auth/v1/token?grant_type=refresh_token',{refresh_token:AU.rt});
        AU.at=j.access_token;AU.rt=j.refresh_token||AU.rt;AU.exp=Date.now()+(j.expires_in||3600)*1000;authSave();return AU.at;
      }catch(e){
        if(e.status===400||e.status===401||e.status===403){AU=null;authSave();CLOUD.state='out';try{renderTabs();}catch(x){}}
        return null;
      }finally{_refreshP=null;}
    })();
  }
  return _refreshP;
}
async function cloudReq(method,path,body,extra){
  const tok=await authToken();if(!tok){const e=new Error('sin sesión');e.status=401;throw e;}
  const hd={'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+tok};
  if(extra)Object.assign(hd,extra);
  const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/'+path,{method,headers:hd,body:body?JSON.stringify(body):undefined});
  if(!r.ok){let m='';try{m=(await r.json()).message||'';}catch(e){}const e=new Error(m||('http '+r.status));e.status=r.status;throw e;}
  const t=await r.text();return t?JSON.parse(t):null;
}
/* ---- unir dos avances sin perder nada ---- */
function deepMerge(a,b){
  if(a===undefined||a===null)return b===undefined?a:b;
  if(b===undefined||b===null)return a;
  if(typeof a==='number'&&typeof b==='number')return Math.max(a,b);
  if(typeof a==='boolean'&&typeof b==='boolean')return a||b;
  if(Array.isArray(a)&&Array.isArray(b)){const seen=new Set(),out=[];a.concat(b).forEach(x=>{const k=JSON.stringify(x);if(!seen.has(k)){seen.add(k);out.push(x);}});return out;}
  if(typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){const o={};new Set(Object.keys(a).concat(Object.keys(b))).forEach(k=>{o[k]=deepMerge(a[k],b[k]);});return o;}
  return a;
}
function mergeProgress(loc,rem){
  const m=deepMerge(loc,rem);
  /* racha: la del día más reciente (si empatan, la más larga) */
  const la=loc.lastDay||'',lb=rem.lastDay||'';
  const pick=la>lb?loc:lb>la?rem:((loc.streak||0)>=(rem.streak||0)?loc:rem);
  m.lastDay=pick.lastDay||null;m.streak=pick.streak||0;m.best=Math.max(loc.best||0,rem.best||0,m.streak);
  m.freezes=Math.min(2,Math.max(loc.freezes||0,rem.freezes||0));m.froze=0;
  /* XP: nunca menos que la suma de los días unidos */
  const sum=Object.keys(m.days||{}).reduce((t,k)=>t+(+m.days[k]||0),0);m.xp=Math.max(m.xp||0,sum);

  const fresh=!((loc.lessons||0)>0||(loc.xp||0)>0||Object.keys(loc.done||{}).length);
  ['course','theme','sound','haptic','tipHide','goal','g','badge'].forEach(k=>{

function cloudSchedule(){
  if(!signedIn()||!cloudOn()||CLOUD.applying)return;
  CLOUD.dirty=true;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>{cloudSync();},4000);
}
async function cloudSync(opts){
  if(!signedIn()||!cloudOn())return {ok:false};
  if(CLOUD.busy){CLOUD.again=true;return {ok:false,busy:true};}
  CLOUD.busy=true;CLOUD.state='sync';updateCloudUI();
  let merged=false,had=false;
  try{
    const rows=await cloudReq('GET','lampara_progress?select=data,updated_at&user_id=eq.'+AU.uid);
    const row=rows&&rows[0]||null;had=!!row;
    if(row&&row.data&&row.updated_at!==AU.seen){
      CLOUD.applying=true;
      try{S=Object.assign(defaults(),mergeProgress(S,row.data));S.cloudUid=AU.uid;merged=true;save();}finally{CLOUD.applying=false;}
    }
    if(S.cloudUid!==AU.uid){CLOUD.applying=true;try{S.cloudUid=AU.uid;save();}finally{CLOUD.applying=false;}}
    const up=await cloudReq('POST','lampara_progress?on_conflict=user_id&select=updated_at',{user_id:AU.uid,data:S},{Prefer:'resolution=merge-duplicates,return=representation'});
    AU.seen=(up&&up[0]&&up[0].updated_at)||AU.seen;authSave();
    CLOUD.dirty=false;CLOUD.state='ok';CLOUD.last=Date.now();
    if(merged&&!(opts&&opts.render===false)&&!G&&!L&&!RM.code)render();
    return {ok:true,merged,had};
  }catch(e){
    CLOUD.state=(typeof navigator!=='undefined'&&navigator.onLine===false)?'offline':'err';
    return {ok:false,err:e};
  }finally{
    CLOUD.busy=false;updateCloudUI();
    if(CLOUD.again){CLOUD.again=false;cloudSchedule();}
  }
}
function cloudStatText(){
  if(CLOUD.state==='sync')return 'Sincronizando…';
  if(CLOUD.state==='offline')return 'Sin conexión. Se guardará al volver.';
  if(CLOUD.state==='err')return 'No se pudo sincronizar. Lo intentaremos otra vez.';
  if(CLOUD.state==='out')return 'La sesión venció. Vuelve a entrar con tu correo.';
  const t=CLOUD.last||(AU&&AU.synced)||0;
  if(!t)return CLOUD.dirty?'Guardando…':'Listo.';
  const mn=Math.floor((Date.now()-t)/60000);
  return 'Guardado '+(mn<1?'hace un momento':mn<60?'hace '+mn+' min':mn<1440?'hace '+Math.floor(mn/60)+' h':'hace '+Math.floor(mn/1440)+' d')+'.';
}

function refreshStreak(){
  if(!S.lastDay||S.streak===0)return;
  const gap=diffDays(S.lastDay,today());
  if(gap<=1)return;
  const missed=gap-1;
  if(S.freezes>=missed){S.freezes-=missed;S.froze=missed;S.lastDay=addDays(today(),-1);}
  else{S.streak=0;}
  save();
}
function recordDay(xp){
  const t=today();let newDay=false,gotFreeze=false;
  if(S.lastDay!==t){
    newDay=true;
    S.streak=(S.streak>0&&S.lastDay===addDays(t,-1))?S.streak+1:1;
    S.lastDay=t;
    if(S.streak>S.best)S.best=S.streak;
    if(S.streak%7===0&&S.freezes<2){S.freezes++;gotFreeze=true;}
  }
  const before=S.days[t]||0;
  S.days[t]=before+xp;S.xp+=xp;
  return {newDay,gotFreeze,goalHit:before<S.goal&&S.days[t]>=S.goal};
}

function mkMC(h){const opts=shuffle([h[1],...h[2]]);return {type:'mc',prompt:h[0],ref:h[3],opts,a:opts.indexOf(h[1]),tries:0,nota:h[4]||''};}
function mkRef(v){
  const same=ALLV.filter(x=>x.r!==v.r&&x.u===v.u),other=ALLV.filter(x=>x.u!==v.u);
  const ds=[...shuffle(other),...shuffle(same)].slice(0,3).map(x=>x.r); /* prefiere otros libros: más fácil de distinguir */
  const opts=shuffle([v.r,...ds]);
  return {type:'ref',prompt:'¿Qué pasaje es este?',ref:v.r,opts,a:opts.indexOf(v.r),tries:0};
}
function pickBlank(v){
  const bl=BLANKS[v.r];if(!bl||!bl.length)return null;
  const toks=v.t.split(/\s+/);
  const opts=shuffle(bl);
  for(const [word,ds] of opts){
    const idx=toks.findIndex(w=>coreOf(w).core===word);
    if(idx>=0){const p=coreOf(toks[idx]);return {toks,idx,pre:p.pre,suf:p.suf,word,ds};}
  }
  return null;
}
function mkFill(v){
  const b=pickBlank(v);
  if(!b)return mkOrder(v,true);
  const opts=shuffle([b.word,...b.ds]);
  return {type:'fill',prompt:'Completa el versículo',ref:v.r,toks:b.toks,idx:b.idx,pre:b.pre,suf:b.suf,opts,a:opts.indexOf(b.word),tries:0};
}
function mkOrder(v,noFill){
  const toks=v.t.split(/\s+/);
  if(toks.length>16||toks.length<4)return noFill?mkRef(v):mkFill(v);
  let bank=toks.map((w,i)=>({id:i,w})),n=0;
  do{bank=shuffle(bank);n++;}while(bank.map(b=>b.w).join(' ')===v.t&&n<10);
  return {type:'order',prompt:'Ordena las palabras del versículo',ref:v.r,toks,bank,tries:0};
}
const mk=(k,v)=>k==='fill'?mkFill(v):k==='ref'?mkRef(v):mkOrder(v);
/* ============================================================
   EJERCICIOS NUEVOS: ¿verdadero o falso? y unir pares
   ============================================================ */
function mkTF(v,hand){
  const fbv={v:v.t,r:v.r},roll=Math.random();
  /* 1) Preguntas de la lección con una respuesta propuesta: las falsas son los distractores
        escritos a mano (verosímiles), así que no se adivinan por el tono de la frase. */
  if(hand&&hand.length&&roll<0.55){
    const h=pickOne(hand),truth=Math.random()<0.5,prop=truth?h[1]:pickOne(h[2]),vv=VBY[h[3]];
    return {type:'tf',ref:h[3],tries:0,prompt:'¿Es correcta esta respuesta?',shown:h[0]+' — «'+prop+'»',cite:h[3],
      opts:['Sí, es correcta','No, es incorrecta'],a:truth?0:1,
      fb:Object.assign({t:truth?'Así es: «'+h[1]+'».':'La respuesta correcta es «'+h[1]+'», no «'+prop+'».'},vv?{v:vv.t,r:vv.r}:{})};
  }
  /* 2) ¿Es esta la cita correcta? Ahora la cita falsa sale de la misma unidad (otro capítulo si se puede): exige conocer el pasaje. */
  if(roll<0.75){
    const truth=Math.random()<0.5,ch=x=>x.r.replace(/:.*$/,'');
    const near=ALLV.filter(x=>x.r!==v.r&&x.u===v.u&&ch(x)!==ch(v)),same=ALLV.filter(x=>x.r!==v.r&&x.u===v.u),far=ALLV.filter(x=>x.r!==v.r);
    const o=pickOne(near.length?near:same.length?same:far);
    return Object.assign({type:'tf',ref:v.r,tries:0},{prompt:'¿Esta cita es correcta?',shown:v.t,cite:truth?v.r:o.r,opts:['Sí, es la cita correcta','No, es otro pasaje'],a:truth?0:1,
      fb:Object.assign({t:truth?'Así es: este versículo está en '+v.r+'.':'Este versículo es de '+v.r+', no de '+o.r+'.'},fbv)});
  }
  /* 3) El versículo tal cual o con una palabra cambiada. */
  const truth=Math.random()<0.5,b=truth?null:pickBlank(v),base={type:'tf',ref:v.r,tries:0};
  if(!b)return Object.assign(base,{prompt:'¿Así dice el versículo?',shown:v.t,cite:v.r,opts:['Sí, así dice','No, tiene un error'],a:0,fb:Object.assign({t:'Así es: el versículo dice exactamente eso.'},fbv)});
  const bad=pickOne(b.ds),toks=b.toks.slice();toks[b.idx]=b.pre+bad+b.suf;
  return Object.assign(base,{prompt:'¿Así dice el versículo?',shown:toks.join(' '),cite:v.r,opts:['Sí, así dice','No, tiene un error'],a:1,
    fb:Object.assign({t:'El versículo dice «'+b.word+'», no «'+bad+'».'},fbv)});
}
function mkMatch(items,prompt,lgk,rgk,done){
  const ids=items.map((_,i)=>i);
  return {type:'match',prompt,items,lo:shuffle(ids),ro:shuffle(ids),lgk:!!lgk,rgk:!!rgk,tries:0,ref:null,
    fb:{t:done||'Todas las parejas quedaron bien.'}};
}
function mkMatchVerses(vs){
  const picks=shuffle(vs).slice(0,Math.min(4,vs.length));
  if(picks.length<3)return null;
  const hs=picks.map(v=>({v,w:v.t.split(/\s+/),n:6}));
  const txt=h=>{const n=Math.min(h.n,h.w.length);return h.w.slice(0,n).join(' ').replace(/[\s,;:.]+$/,'')+(n<h.w.length?'…':'');};
  let g=0;while(new Set(hs.map(txt)).size<hs.length&&g++<8)hs.forEach(h=>{if(h.n<h.w.length)h.n++;});
  if(new Set(hs.map(txt)).size<hs.length)return null;
  const q=mkMatch(hs.map(h=>({l:h.v.r,r:txt(h),ref:h.v.r})),'Une cada cita con su versículo',false,false,'Cada cita quedó con su versículo.');
  return q;
}
function mkMatchLetters(idx){
  const pick=shuffle(idx).slice(0,Math.min(5,idx.length));
  if(pick.length<3)return null;
  return mkMatch(pick.map(i=>({l:GK_LET[i][0]+' '+GK_LET[i][1],r:GK_LET[i][2]})),'Une cada letra con su nombre',true,false,'Cada letra quedó con su nombre.');
}
function mkMatchWords(mine){
  const seen={},pick=[];
  shuffle(mine).forEach(e=>{const r=e.es.split(';')[0].trim();if(!seen[r]&&pick.length<4){seen[r]=1;pick.push({l:e.g,r,wid:e.id});}});
  return pick.length<3?null:mkMatch(pick,'Une cada palabra griega con su significado',true,false,'Cada palabra quedó con su significado.');
}
function withMatch(qs,m){if(m&&qs.length)qs.splice(rnd(qs.length),1,m);return qs;}
function matchTap(side,id){
  if(!L||!L.cur||L.cur.type!=='match'||L.ui.checked)return;
  const q=L.cur,m=L.ui.m||(L.ui.m={sel:null,done:{},wrong:0,wrongIds:{},flash:null});
  if(m.done[id]||m.flash)return;
  if(!m.sel||m.sel.s===side){m.sel=(m.sel&&m.sel.s===side&&m.sel.id===id)?null:{s:side,id};renderLesson();return;}
  const l=side==='l'?id:m.sel.id,r=side==='r'?id:m.sel.id;
  if(l===r){
    m.done[l]=true;m.sel=null;beep('good');haptic(10);
    if(Object.keys(m.done).length>=q.items.length){matchFinish();return;}
    renderLesson();return;
  }
  m.wrong++;m.wrongIds[l]=true;m.flash={l,r};m.sel=null;beep('bad');haptic([30,40,30]);renderLesson();
  setTimeout(()=>{if(L&&L.cur===q&&L.ui.m===m){m.flash=null;renderLesson();}},550);
}
function matchFinish(){
  const q=L.cur,ui=L.ui,m=ui.m;
  ui.checked=true;ui.ok=true;ui.fresh=false;
  q.items.forEach((it,i)=>{
    const bad=!!m.wrongIds[i];
    if(it.ref){const st=S.verses[it.ref]||(S.verses[it.ref]={c:0,w:0});if(bad)st.w++;else st.c++;}
    if(it.wid){S.gw=S.gw||{};const g=S.gw[it.wid]||(S.gw[it.wid]={c:0,w:0});if(bad)g.w++;else g.c++;}
  });
  L.done++;
  if(m.wrong===0){L.firstTry++;L.xp+=2;L.combo++;ui.fresh=true;ui.head=pickOne(['¡Todas unidas!','¡Pareja perfecta!','¡Sin un error!']);if(L.combo>0&&L.combo%5===0)confetti(50);}
  else{L.mistakes++;L.combo=0;ui.head=pickOne(['¡Las uniste todas!','¡Lo lograste!']);}
  beep('good');haptic(15);save();renderLesson();
}

function mkOrderCx(prompt,items){
  let bank=items.map((w,i)=>({id:i,w})),n=0;
  do{bank=shuffle(bank);n++;}while(bank.map(b=>b.w).join('|')===items.join('|')&&n<12);
  return {type:'order',prompt,ref:'',toks:items.slice(),bank,tries:0,fb:{t:'El orden correcto es: '+items.join(', ')+'.'}};
}
function mkMcCx(prompt,right,wrongs,nota){
  const opts=shuffle([right,...wrongs.slice(0,3)]);
  return {type:'mc',prompt,ref:'',opts,a:opts.indexOf(right),tries:0,nota:nota||''};
}
function mkCx(s){
  if(s.k==='order'){const ch=shuffle(s.chunks).slice(0,s.n||1);return ch.map(c=>mkOrderCx(s.prompt,c));}
  if(s.k==='match')return [mkMatch(s.pairs.map(p=>({l:p[0],r:p[1]})),s.prompt,false,false,s.done)];
  const a=s.range[0],b=s.range[1],out=[],used=new Set();
  for(let t=0;t<(s.n||1);t++){
    let j,g=0;do{j=a+rnd(b-a+1);g++;}while(used.has(j)&&g<30);used.add(j);const bk=BK[j];
    if(s.k==='next'){
      /* se evitan los pares obvios (1 Tesalonicenses → 2 Tesalonicenses): se elige otro libro y las opciones no repiten el nombre */
      const base=n=>String(n).replace(/^\d\s+/,'');
      let jj=j,fwd,k,g2=0;
      do{
        if(g2>0)jj=a+rnd(b-a+1);
        fwd=jj<BK.length-1&&(jj===0||Math.random()<.7);k=fwd?jj+1:jj-1;g2++;
      }while(g2<60&&(k<0||k>=BK.length||base(BK[k].n)===base(BK[jj].n)));
      used.add(jj);
      const bk2=BK[jj],lo=bk2.d==='evan'||jj>=39?39:0,hi=jj>=39?BK.length-1:38;
      let pool=[];for(let x=Math.max(lo,k-5);x<=Math.min(hi,k+5);x++)if(x!==jj&&x!==k&&base(BK[x].n)!==base(BK[jj].n)&&base(BK[x].n)!==base(BK[k].n))pool.push(BK[x].n);
      out.push(mkMcCx(fwd?'¿Qué libro viene después de «'+bk2.n+'»?':'¿Qué libro viene antes de «'+bk2.n+'»?',BK[k].n,shuffle(pool),'Van en este orden: '+BK[Math.min(jj,k)].n+', '+BK[Math.max(jj,k)].n+'.'));
    }else if(s.k==='division'){
      if(bk.n==='Hechos'){t--;continue;}
      const opts=(j>=39?DIVS_NT:DIVS_AT).map(d=>DIVN[d]);
      out.push(mkMcCx('¿A qué división pertenece «'+bk.n+'»?',DIVN[bk.d],opts.filter(x=>x!==DIVN[bk.d]),bk.n+' es uno de los libros de '+DIVN[bk.d]+'.'));
    }else if(s.k==='testament'){
      const right=j>=39?'Nuevo Testamento':'Antiguo Testamento';
      out.push(mkMcCx('¿En qué parte de la Biblia está el libro de «'+bk.n+'»?',right,[j>=39?'Antiguo Testamento':'Nuevo Testamento'],bk.n+' está en el '+right+'.'));
    }
  }
  return out;
}
function buildQuestions(verses,hand,max=10,cx){
  const off=rnd(3);
  const kindsFor=v=>v.key?['fill','order','ref']:['fill','order'];
  const prim=verses.map((v,i)=>{const k=kindsFor(v);return mk(k[(i+off)%k.length],v);});
  const extras=shuffle(verses.map((v,i)=>{const k=kindsFor(v),p=(i+off)%k.length;return mk(k[(p+1+rnd(k.length-1))%k.length],v);}));
  const core=[...prim,...hand.map(mkMC)];
  const bonus=[],mt=verses.length>=3?mkMatchVerses(verses):null;
  if(mt)bonus.push(mt);
  shuffle(verses).slice(0,2).forEach(v=>bonus.push(mkTF(v,hand)));
  const qs=[...core,...bonus.slice(0,Math.max(0,max-core.length))];
  while(qs.length<max&&extras.length)qs.push(extras.pop());
  const cxq=(cx||[]).flatMap(mkCx);
  if(!cxq.length)return shuffle(qs).slice(0,max);
  return shuffle([...cxq,...shuffle(qs).slice(0,Math.max(4,max-cxq.length))]);
}

   La llama de Lampy refleja tu racha del día: si ya practicaste, brilla entera; si todavía no y tienes

let flameNow=()=>new Date();
function flameLevel(d){
  d=d||flameNow();
  if(S.lastDay===dstr(d))return 1;
  if(!(S.streak>0))return .6;
  const hh=d.getHours()+d.getMinutes()/60,pr=Math.min(1,Math.max(0,(hh-6)/18));
  return +(1-.65*pr).toFixed(3);
}
function flameLeft(d){
  d=d||flameNow();
  const left=Math.max(0,24-(d.getHours()+d.getMinutes()/60));
  if(left<1)return 'Te queda menos de una hora';
  const n=Math.floor(left);return (n===1?'Te queda 1 hora':'Te quedan '+n+' horas');
}
const flameAtRisk=()=>S.streak>0&&S.lastDay!==dstr(flameNow());
function flameMsg(){
  const n=S.streak;
  return '¡Cuida tu llamita! Tu racha de '+n+(n===1?' día':' días')+' se apaga a medianoche. '+flameLeft()+' para hacer una lección.';
}

    });

}

let L=null;
function startLesson(meta,qs,intro){
  refreshStreak();

/* La introducción se parte en tarjetas cortas (unos 500 caracteres cada una) y las lecturas de capítulos
   van juntas en una tarjeta al final. El texto de las lecciones no cambia: se parte al mostrarlo. */
function introTitleCase(s){return String(s).toLowerCase().replace(/(^|\s)([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Y|De)\b/g,x=>x.toLowerCase());}
function introSplit(p,max){
  const t=p.replace(/\ba\. C\./g,'a.\u00A0C.');
  const ss=t.match(/[^.!?]+[.!?]+["»)]?(?: +|$)|[^.!?]+$/g)||[t];
  const out=[];let cur='';
  ss.forEach(s=>{ if(cur&&(cur+s).length>max){out.push(cur.trim());cur='';} cur+=s; });
  if(cur.trim())out.push(cur.trim());
  return out;
}
function introHead(p){
  const k=p.indexOf(' — ');
  if(k>1&&k<=40){
    const hd=p.slice(0,k),flat=hd.replace(/\b(y|de)\b/g,'');
    if(!/[.,;:]/.test(hd)&&flat===flat.toUpperCase())return hd.trim();
  }
  return '';
}
function introParaHTML(p){
  const hd=introHead(p);
  if(hd)return '<p><b>'+esc(introTitleCase(hd))+'</b> — '+esc(p.slice(p.indexOf(' — ')+3))+'</p>';
  return '<p>'+esc(p)+'</p>';
}
function introCards(intro,max){
  max=max||520;
  const paras=String(intro.p||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const body=[],reads=[];let book='';
  paras.forEach(p=>{
    if(/^Lecturas:/.test(p)){reads.push({book,text:p.replace(/^Lecturas:\s*/,'')});return;}
    const hd=introHead(p);if(hd)book=hd;
    body.push(p);
  });
  const chunks=[];
  body.forEach(p=>{ if(p.length<=max)chunks.push(p);else introSplit(p,max).forEach(x=>chunks.push(x)); });
  const cards=[];let cur=[],len=0;
  chunks.forEach(c=>{ if(cur.length&&len+c.length>max){cards.push({kind:'text',html:cur.map(introParaHTML).join('')});cur=[];len=0;} cur.push(c);len+=c.length; });
  if(cur.length)cards.push({kind:'text',html:cur.map(introParaHTML).join('')});
  if(reads.length){
    const lines=reads.map(r=>{
      const nm=introTitleCase(r.book||''),txt=r.text.trim();
      if(nm&&txt.toLowerCase().indexOf(nm.toLowerCase())===0)return '<p class="rl">📖 <b>'+esc(txt.slice(0,nm.length))+'</b>'+esc(txt.slice(nm.length))+'</p>';
      return '<p class="rl">📖 '+(nm?'<b>'+esc(nm)+':</b> ':'')+esc(txt)+'</p>';
    }).join('');
    cards.push({kind:'read',html:'<p style="font-size:16px;color:var(--muted);margin:0 0 12px">Lee estos capítulos para reforzar lo que aprendiste:</p>'+lines});
  }
  if(!cards.length)cards.push({kind:'text',html:'<p>'+esc(intro.p||'')+'</p>'});
  return cards;
}
function introGo(d){
  const n=(L.introCards||[]).length;

}

function renderLesson(){

      return '<button class="mi'+(m.done[id]?' ok':'')+(on?' sel':'')+(bad?' bad':'')+((side==='l'?q.lgk:q.rgk)?' gko':'')+'" data-a="mi" data-s="'+side+'" data-id="'+id+'" '+(m.done[id]||ui.checked?'disabled':'')+'>'+esc(side==='l'?it.l:it.r)+'</button>';}).join('');
    body+=say+'<p class="mcount">'+Object.keys(m.done).length+' de '+q.items.length+' unidas</p><div class="mt"><div class="mcol">'+col(q.lo,'l')+'</div><div class="mcol">'+col(q.ro,'r')+'</div></div>';
  }

  else if(q.type==='fill'){
    const parts=q.toks.map((w,i)=>{
      if(i!==q.idx)return esc(w);

     ui.placed.map(id=>{const b=q.bank.find(x=>x.id===id);return '<button class="w" data-a="unplace" data-id="'+id+'" '+(ui.checked?'disabled':'')+'>'+esc(b.w)+'</button>';}).join('')+'</div>'+
     '<div class="bank">'+q.bank.map(b=>'<button class="w '+(ui.placed.includes(b.id)?'used':'')+'" data-a="place" data-id="'+b.id+'" '+(ui.checked||ui.placed.includes(b.id)?'disabled':'')+'>'+esc(b.w)+'</button>').join('')+'</div>';

  }else{

    let ans='';
    if(!ui.ok&&q.type!=='order')ans='Respuesta correcta: <b>'+esc(q.opts[q.a])+'</b><br>';
    const sub=ui.ok?(ui.fresh?'+2 XP':(q.tries>0?'¡Repasada! Ya la tienes':'')):'Volverá a salir al final para repasarla';
    foot='<div class="lf '+(ui.ok?'good':'bad')+'" role="status"><div class="in">'+(ui.fresh?'<div class="xpfloat">+2 XP</div>':'')+
     '<div class="fbhead">'+mascot(ui.ok?'cheer':'sad',58)+'<div><h4>'+esc(ui.head||'')+'</h4>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div></div>'+
     '<div class="fbox">'+fbHTML(q,v,fbk,ans)+(q.nota?'<div class="nota"><b>Nota:</b> '+esc(q.nota)+'</div>':'')+'</div>'+
     '<button class="btn '+(ui.ok?'good':'bad')+'" data-a="next">Continuar</button></div></div>';
  }

function check(){
  if(!canCheck())return;

  ui.checked=true;ui.ok=ok;ui.fresh=false;
  const st=q.ref?(S.verses[q.ref]||(S.verses[q.ref]={c:0,w:0})):{c:0,w:0};
  const gw=q.wid?((S.gw=S.gw||{})[q.wid]||(S.gw[q.wid]={c:0,w:0})):null;
  if(ok){
    if(q.tries===0){L.firstTry++;L.xp+=2;st.c++;if(gw)gw.c++;L.combo++;ui.fresh=true;}
    L.done++;
    ui.head=L.combo>=3&&q.tries===0?'¡'+L.combo+' seguidas!':pickOne(['¡Eso es!','¡Perfecto!','¡Muy bien!','¡Así se hace!','¡Genial!','¡Excelente!']);
    beep('good');
    if(q.tries===0&&L.combo>0&&L.combo%5===0)confetti(50);
  }else{
    if(q.tries===0){st.w++;if(gw)gw.w++;}
    q.tries++;L.mistakes++;L.queue.push(q);L.combo=0;
    ui.head=pickOne(['¡Casi!','¡Uy, esa no!','¡Ups!','Se te escapó']);
    beep('bad');
  }

}

function finishLesson(){
  const bonus=5+(L.mistakes===0?5:0);
  const xp=L.xp+bonus;
  const r=recordDay(xp);
  const isReview=L.meta.type==='review';
  L.wasDone=!isReview&&!!S.done[L.meta.key];
  if(isReview)S.reviews++;
  else{const p=S.done[L.meta.key]||{n:0};S.done[L.meta.key]={n:p.n+1,acc:Math.max(p.acc||0,L.firstTry/L.total)};}
  if(!isReview){
    const gkc=L.meta.course==='gk',UU=gkc?GK_UNITS:UNITS,ui0=unitOf(UU,L.meta.key);
    if(!L.wasDone&&ui0>=0&&unitDone(UU[ui0])&&!(S.cel&&S.cel[UU[ui0].title])){S.cel=S.cel||{};S.cel[UU[ui0].title]=1;L.unitCel={ui:ui0,gk:gkc};}
  }
  S.lessons++;if(L.mistakes===0)S.perfect++;
  if(S.lessons===1&&!S.cloudAsked&&cloudOn()&&!signedIn())L.offerCloud=true;
  if(S.lessons>=2&&!L.offerCloud&&pushCanOffer())L.offerPush=true;

   '<div class="rs"><div><i>⚡</i><b>+'+xp+'</b><span>XP</span></div><div><i>🎯</i><b>'+acc+'%</b><span>Al primer intento</span></div><div><i>🔥</i><b>'+S.streak+'</b><span>Días de racha</span></div></div>'+

   (r.newDay?'<div class="note fl">🔥 <b>¡Racha de '+S.streak+(S.streak===1?' día':' días')+'!</b> Vuelve mañana para mantenerla.</div>':'<div class="note">Hoy tu racha ya estaba asegurada. ¡Sigue sumando!</div>')+
   (r.gotFreeze?'<div class="note fl">🛡️ <b>¡Ganaste un protector de racha!</b> Cubre un día si no puedes practicar.</div>':'')+
   (r.goalHit?'<div class="note">🎯 <b>¡Meta diaria cumplida!</b> '+S.days[today()]+' XP hoy.</div>':'')+
   fresh.map(a=>'<div class="note">'+(ACH_E[a.id]||'⭐')+' <b>Logro: '+a.t+'.</b> '+a.d+'.</div>').join('')+
   (gws.length?'<div class="vs"><h3>Palabras de esta lección</h3><div class="dlist">'+gws.map(e=>'<button class="dentry" data-a="dic-peek" data-w="'+e.id+'"><span class="dg gk">'+esc(e.g)+'</span><span class="dm"><b>'+esc(e.tr)+'</b> '+esc(e.es)+'</span></button>').join('')+'</div></div>':'')+
   (vs.length?'<div class="vs"><h3>Versículos de esta lección</h3><div class="list">'+vs.map(v=>'<div class="li"><cite>'+esc(v.r)+'</cite><p>'+esc(v.t)+'</p></div>').join('')+'</div></div>':'')+
   '</div></div><div class="lf"><div class="in"><div class="row2"><button class="btn ghost" data-a="share" data-k="lesson">📣 Compartir</button><button class="btn" data-a="finish">Continuar</button></div></div></div>';
  L.finished=true;
  LASTRES={title:L.meta.title||'una lección',xp,acc,streak:S.streak,review:isReview};

const sayClean=t=>String(t).replace(/[«»]/g,'').replace(/_{2,}/g,'...');
const sayRef=r=>r.replace(':',' versículo ').replace('-',' al ');
/* La voz lee el texto en trozos, con una pausa entre ellos. Se cortan en el guion largo (—) y en «||».
   Así, en «Según Proverbios…, ¿con qué fundó Jehová la tierra? — «Con fuerza»» hace una pausa antes de la respuesta propuesta. */
let SPK_TOKEN=0,SPK_PAUSE=700;
function stopSpeak(){SPK_TOKEN++;try{if(canSpeak())speechSynthesis.cancel();}catch(e){}}
function speak(t){
  if(!S.g.voice||!canSpeak()||!t)return;
  try{
    speechSynthesis.cancel();
    const token=++SPK_TOKEN;
    const parts=String(t).split(/\s*(?:\u2014|\|\|)\s*/).map(x=>x.trim()).filter(Boolean);
    const v=(speechSynthesis.getVoices()||[]).find(x=>/^es/i.test(x.lang));
    const next=i=>{
      if(token!==SPK_TOKEN||i>=parts.length)return;
      const u=new SpeechSynthesisUtterance(sayClean(parts[i]));
      if(v){u.voice=v;u.lang=v.lang;}else u.lang='es-ES';
      u.rate=.95;
      u.onend=()=>{if(i+1<parts.length)setTimeout(()=>next(i+1),SPK_PAUSE);};
      speechSynthesis.speak(u);
    };
    next(0);
  }catch(e){}
}
const nameOf=i=>((S.g.names[i]||'').trim())||('Jugador '+(i+1));

/* ---- Memoria de preguntas ya vistas: no se repite nada hasta recorrer todo el banco ---- */
function gSeen(id){S.gseen=S.gseen||{};return new Set(S.gseen[id]||[]);}
function gMark(id,k){S.gseen=S.gseen||{};const a=S.gseen[id]||(S.gseen[id]=[]);if(a.indexOf(k)<0)a.push(k);}
function gFresh(id,arr,kf){const s=gSeen(id),f=arr.filter(x=>!s.has(kf(x)));if(f.length)return f;S.gseen[id]=[];return arr;}
function gTake(id,arr,kf,n){
  const out=[];
  for(let i=0;i<n;i++){
    const pool=gFresh(id,arr.filter(x=>out.indexOf(x)<0),kf);
    if(!pool.length)break;
    const it=pickOne(pool);out.push(it);gMark(id,kf(it));
  }
  save();return out;
}
/* Verdadero o falso: frases escritas a mano + las preguntas de las lecciones con una respuesta propuesta (verosímil) */
let VFP=null;
function vfPool(){
  if(VFP)return VFP;
  VFP=GFALSO.map(x=>({k:x[0],f:x}));
  UNITS.forEach(u=>u.lessons.forEach(l=>(l.qs||[]).forEach(h=>{if(h[3])VFP.push({k:'qa|'+h[0],h});})));
  return VFP;
}
function vfTake(n){return gTake('vf',vfPool(),p=>p.k,n);}
function vfItem(p){
  if(p.f){const x=p.f;return {c:x[0],truth:!!x[1],ref:x[2],why:x[3]};}
  const h=p.h,truth=Math.random()<0.5,prop=truth?h[1]:pickOne(h[2]);
  return {c:h[0]+' — «'+prop+'»',truth,ref:h[3],why:truth?'Así es: «'+h[1]+'».':'La respuesta correcta es «'+h[1]+'».'};
}
function mkItem(label,html,say,ansHtml,ansSay){return {label,html,say,ansHtml,ansSay};}
function dQuien(n){return gTake('quien',GQUIEN,x=>x.q,n).map(x=>mkItem('¿Quién dijo esto?','<blockquote class="verse gbig">'+esc(x.q)+'</blockquote>','¿Quién dijo esto? '+x.q,'<b>'+esc(x.a)+'</b><span>'+esc(x.ref)+'</span>',x.a+'. '+sayRef(x.ref)));}
function dVF(n){return vfTake(n).map(p=>{const x=vfItem(p);return mkItem('¿Verdadero o falso?','<blockquote class="verse gbig">'+esc(x.c)+'</blockquote>','¿Verdadero o falso? || '+x.c,'<b>'+(x.truth?'Verdadero':'Falso')+'</b><span>'+esc(x.ref)+'</span><p>'+esc(x.why)+'</p>',(x.truth?'Verdadero. ':'Falso. ')+x.why+' '+sayRef(x.ref));});}
function dPers(n){return gTake('pers',GPERS,x=>x.a,n).map(x=>{const it=mkItem('¿Quién es este personaje?','','','<b>'+esc(x.a)+'</b>',x.a);it.clues=x.c;return it;});}
function dComp(n){
  const vs=gTake('comp',ALLV.filter(v=>v.t.split(/\s+/).length<=26&&BLANKS[v.r]),v=>v.r,n);
  return vs.map(v=>{
    const b=pickBlank(v);
    const disp=b.toks.map((w,i)=>i===b.idx?esc(b.pre)+'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'+esc(b.suf):esc(w)).join(' ');
    const sayT=b.toks.map((w,i)=>i===b.idx?b.pre+' ... '+b.suf:w).join(' ');
    return mkItem('Completa el versículo','<blockquote class="verse gbig">'+disp+'</blockquote>','Completa el versículo. '+sayT+' ¿Qué palabra falta?','<b>'+esc(b.word)+'</b><span>'+esc(v.r)+'</span><p>'+esc(v.t)+'</p>',b.word+'. '+sayRef(v.r));
  });
}
function dLibros(n){
  return gTake('libros',GLIBROS,x=>x[0],n).map(x=>mkItem('¿En qué libro de la Biblia está?','<p class="gq">'+esc(x[0])+'</p>','¿En qué libro de la Biblia está: '+x[0]+'?','<b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span>',x[1]+'. '+sayRef(x[2])));
}
function dConv(n){
  return gTake('conv',GCONV,x=>x.ref,n).map(x=>{
    const t=x.t||VBY[x.ref].t;
    const it=mkItem('Para conversar','<blockquote class="verse gbig">'+esc(t)+'<cite class="vref">'+esc(x.ref)+'</cite></blockquote><p class="gq">'+esc(x.q)+'</p>',sayRef(x.ref)+'. '+t+' Pregunta: '+x.q,'','');
    return it;
  });
}
const DECKS={quien:dQuien,pers:dPers,vf:dVF,comp:dComp,libros:dLibros,conv:dConv};

function gStart(){

}
function gCur(){return G.deck[G.i];}
function gSpeakQ(){const it=gCur();speak(it.clues?it.label+'. Pista 1. '+it.clues[0][0]:it.say);}
function gRender(){
  const it=gCur(),sc=G.game.scored,pct=Math.round(100*G.i/G.total),last=G.i===G.total-1;
  const pts=it.clues?4-G.cl:1;
  let body='<div class="lb">';
  if(sc)body+='<div class="sb">'+G.scores.map((s,i)=>'<span class="sbp">'+av(i)+'<b>'+esc(nameOf(i))+'</b> '+s+'</span>').join('')+'</div>';
  body+='<p class="glabel">'+esc(it.label)+' <span>· '+(G.i+1)+' de '+G.total+'</span></p>';
  if(it.clues)body+='<ol class="clues">'+it.clues.slice(0,G.cl).map((c,k)=>'<li><span>Pista '+(k+1)+'</span>'+esc(c[0])+(G.phase==='a'?'<cite>'+esc(c[1])+'</cite>':'')+'</li>').join('')+'</ol>';
  else body+=it.html;

  }else if(G.phase==='q'){
    const more=it.clues&&G.cl<it.clues.length?'<button class="btn ghost" data-a="g-clue">💡 Otra pista</button>':'';
    foot='<div class="lf"><div class="in">'+((rep||more)?'<div class="row2">'+rep+more+'</div>':'')+'<button class="btn" data-a="g-reveal" data-primary>Ver respuesta</button></div></div>';
  }else if(G.scores.length===1){
    foot='<div class="lf"><div class="in"><p style="margin:0 0 8px;font-weight:900">¿Acertaste? <span class="muted" style="font-weight:800">(+'+pts+')</span></p><div class="row2"><button class="btn bad" data-a="g-solo" data-ok="0">❌ No</button><button class="btn good" data-a="g-solo" data-ok="1" data-primary>✅ Sí</button></div></div></div>';
  }else{
    foot='<div class="lf"><div class="in"><p style="margin:0 0 8px;font-weight:900">¿Quién acertó? <span class="muted" style="font-weight:800">(+'+pts+')</span></p><div class="who">'+
     G.scores.map((_,i)=>'<button class="pl '+(G.win.includes(i)?'on':'')+'" data-a="g-win" data-p="'+i+'" aria-pressed="'+G.win.includes(i)+'">'+av(i)+esc(nameOf(i))+'</button>').join('')+
     '</div><button class="btn" data-a="g-next" data-primary>'+(last?'Ver resultados':'Siguiente ronda')+'</button></div></div>';
  }

   '<div class="lh"><button class="x" data-a="g-close" aria-label="Salir del juego">'+IC.close+'</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></div>'+body+foot;
}
function gNext(){
  if(G.game.scored){const pts=gCur().clues?4-G.cl:1;G.win.forEach(i=>{G.scores[i]+=pts;});}
  G.win=[];G.i++;G.cl=1;G.phase='q';
  if(G.i>=G.total){gEnd();return;}
  gRender();gSpeakQ();
}
function gEnd(){
  const sc=G.game.scored;
  const r=recordDay(10);S.gplays=(S.gplays||0)+1;
  const fresh=ACH.filter(a=>!S.ach[a.id]&&a.f(S));fresh.forEach(a=>S.ach[a.id]=true);save();
  stopSpeak();
  let head='¡Se acabaron las preguntas!',rank='';
  if(sc){
    const arr=G.scores.map((s,i)=>({s,n:nameOf(i),i})).sort((a,b)=>b.s-a.s);
    const top=arr.filter(x=>x.s===arr[0].s);
    const solo=G.scores.length===1,maxPts=G.deck.reduce((a,it)=>a+(it.clues?3:1),0);

  }

   '<div class="lb"><div class="res"><div style="display:flex;justify-content:center">'+mascot(sc&&G.scores.length===1&&head.indexOf('Buen intento')>=0?'wink':'cheer',130)+'</div><h1>'+esc(head)+'</h1><p class="muted" style="margin:0">'+esc(G.game.t)+'</p>'+rank+

   (r.newDay?'<div class="note fl">🔥 <b>¡Racha de '+S.streak+(S.streak===1?' día':' días')+'!</b> Jugar en familia también cuenta.</div>':'')+
   (r.gotFreeze?'<div class="note fl">🛡️ <b>¡Ganaste un protector de racha!</b></div>':'')+
   fresh.map(a=>'<div class="note">'+(ACH_E[a.id]||'⭐')+' <b>Logro: '+a.t+'.</b> '+a.d+'.</div>').join('')+
   '</div></div><div class="lf"><div class="in"><div class="row2"><button class="btn ghost" data-a="g-exit">Salir</button><button class="btn" data-a="g-again" data-primary>Jugar otra vez</button></div></div></div>';
  G.finished=true;
  setTimeout(famSync,400);
  beep('win');confetti(120);haptic([20,70,20,70,50]);
}
function gAct(a,b){
  const c=S.g;
  if(a==='g-open')gSetup(b.dataset.g);
  else if(!G)return;
  else if(a==='g-n'){c.n=Math.max(1,Math.min(8,c.n+(+b.dataset.d)));save();gRenderSetup();}
  else if(a==='g-solo'){G.win=b.dataset.ok==='1'?[0]:[];gNext();}
  else if(a==='g-r'){c.rounds=+b.dataset.r;save();gRenderSetup();}
  else if(a==='g-voice'){c.voice=b.dataset.v==='1';save();gRenderSetup();if(c.voice)speak('Lectura en voz alta activada.');}
  else if(a==='g-start')gStart();
  else if(a==='g-reveal'){G.phase='a';gRender();speak(gCur().ansSay);}
  else if(a==='g-clue'){G.cl++;gRender();speak('Pista '+G.cl+'. '+gCur().clues[G.cl-1][0]);}
  else if(a==='g-win'){const p=+b.dataset.p,k=G.win.indexOf(p);if(k>=0)G.win.splice(k,1);else{G.win.push(p);beep('good');confetti(30);haptic(15);}gRender();}
  else if(a==='g-next')gNext();
  else if(a==='g-repeat'){if(G.phase==='a')speak(gCur().ansSay);else gSpeakQ();}
  else if(a==='g-close'){if(G.deck&&!G.finished)showModal('<h3>¿Salir del juego?</h3><p>Se perderá el marcador de esta partida.</p><button class="btn" data-a="stay">Seguir jugando</button><button class="btn ghost" data-a="g-leave">Salir</button>');else gClose();}
  else if(a==='g-leave'){hideModal();gClose();}
  else if(a==='g-again'){const id=G.id,game=G.game;G={id,game};gStart();}
  else if(a==='g-exit')gClose();
}

    const ids=seen.map(id=>({id,s:S.gw[id].c-S.gw[id].w*1.5+Math.random()})).sort((x,y)=>x.s-y.s).slice(0,6).map(x=>x.id);
    startLesson({type:'review',title:'Repaso diario',verses:[],words:ids,course:'gk'},gkWords({ids}));
  }
  else if(a==='review'){
    const seen=Object.keys(S.verses).filter(r=>VBY[r]);if(seen.length<3)return;
    const pick5=seen.map(r=>({r,s:S.verses[r].c-S.verses[r].w*1.5+Math.random()})).sort((x,y)=>x.s-y.s).slice(0,5).map(x=>VBY[x.r]);
    startLesson({type:'review',title:'Repaso diario',verses:pick5},buildQuestions(pick5,[],8));
  }
  else if(a==='begin'){if(L&&L.intro){L.intro=null;nextQ();}}
  else if(a==='intro-next'){if(L&&L.intro)introGo(1);}
  else if(a==='intro-back'){if(L&&L.intro)introGo(-1);}
  else if(a==='pick')pick(+b.dataset.i);
  else if(a==='mi')matchTap(b.dataset.s,+b.dataset.id);
  else if(a==='place'){if(L&&!L.ui.checked){L.ui.placed.push(+b.dataset.id);renderLesson();}}
  else if(a==='unplace'){if(L&&!L.ui.checked){L.ui.placed=L.ui.placed.filter(id=>id!==+b.dataset.id);renderLesson();}}
  else if(a==='check')check();
  else if(a==='next')nextQ();
  else if(a==='close'){showModal('<h3>¿Salir de la lección?</h3><p>Perderás el avance de esta lección.</p><button class="btn" data-a="stay">Seguir aprendiendo</button><button class="btn ghost" data-a="leave">Salir</button>');}
  else if(a==='stay')hideModal();
  else if(a==='leave'){hideModal();closeLesson();}
  else if(a==='finish'){const uc=L&&L.unitCel,oc=L&&L.offerCloud,po=L&&L.offerPush;closeLesson();if(uc)setTimeout(()=>showUnitCel(uc),300);else if(oc){S.cloudAsked=true;save();setTimeout(()=>authOpen(),450);}else if(po&&pushCanOffer())setTimeout(pushOffer,500);}
  else if(a==='share'){doShare(b.dataset.k,b.dataset.id);}
  else if(a==='rd-plan'){RDSET.plan=b.dataset.p;render();}
  else if(a==='rd-yrs'){RDSET.yrs=+b.dataset.y;render();}
  else if(a==='rd-mode'){RDSET.mode=b.dataset.m;if(RDSET.mode==='other'&&!RDSET.other)RDSET.other=today();render();}
  else if(a==='rd-start'){rdStartPlan();}
  else if(a==='rd-toggle'){rdToggle(+b.dataset.i);}
  else if(a==='rd-day'){rdDayModal(+b.dataset.i);}
  else if(a==='rd-tog-close'){hideModal();rdToggle(+b.dataset.i);}
  else if(a==='rd-reset'){showModal('<h3>¿Empezar un plan nuevo?</h3><p>Se borrarán las lecturas que marcaste en este plan. Tu racha de lectura y tus logros se conservan.</p><button class="btn" data-a="stay">Seguir con mi plan</button><button class="btn ghost" data-a="rd-reset-yes">Sí, empezar de nuevo</button>');}
  else if(a==='rd-reset-yes'){hideModal();S.rd=null;save();render();window.scrollTo(0,0);}
  else if(a==='rm-open'){RM.pick=[];rmOpenMenu('create',b.dataset.m);}
  else if(a==='rm-pick'){rmPickToggle(b.dataset.d);}
  else if(a==='rm-invite-open'){rmInviteOpen();}
  else if(a==='rm-inv-send'){rmInviteSend(b.dataset.to);}
  else if(a==='rm-total'){RM.cfg.total=+b.dataset.v;rmMenuRefresh();}
  else if(a==='rm-create'){rmCreate();}
  else if(a==='rm-exit'){if(!RM.code){$('#room').hidden=true;$('#room').innerHTML='';document.body.style.overflow='';render();}else showModal('<h3>¿Salir de la sala?</h3><p>Dejarás la partida y los demás seguirán sin ti.</p><button class="btn" data-a="stay">Quedarme</button><button class="btn ghost" data-a="rm-exit-yes">Salir</button>');}
  else if(a==='rm-exit-yes'){rmLeave();}
  else if(a==='rm-team'){rpc('fr_room_team',frArgs({p_code:RM.code,p_team:+b.dataset.t})).then(r=>{if(!(r&&r.ok))toast(famMsg(r&&r.error));rmPoll();}).catch(()=>toast('Sin conexión.'));}
  else if(a==='rm-start'){rmStart();}
  else if(a==='rm-ans'){rmAnswer(+b.dataset.i);}
  else if(a==='rm-piece'){RM.sel=(RM.sel===+b.dataset.i)?null:+b.dataset.i;rmRender();}
  else if(a==='rm-slot'){rmPlace(+b.dataset.i);}
  else if(a==='rm-invite'){rmInvite();}
  else if(a==='rm-again'){rpc('fr_room_again',frArgs({p_code:RM.code})).then(r=>{if(!(r&&r.ok))toast(famMsg(r&&r.error));RM.rewarded='';RM.my=null;RM.sel=null;rmPoll();}).catch(()=>toast('Sin conexión.'));}
  else if(a==='gift-open'){giftOpen(b.dataset.to,b.dataset.n);}
  else if(a==='gift-kind'){giftForm(b.dataset.k);}
  else if(a==='gift-badge'){GIFT.badge=b.dataset.k;document.querySelectorAll('#gbadges .avb').forEach(x=>x.classList.toggle('on',x.dataset.k===GIFT.badge));}
  else if(a==='gift-send'){giftSend();}
  else if(a==='gift-inbox'){giftInbox();}
  else if(a==='gift-claim'){giftClaim(+b.dataset.id);}
  else if(a==='gift-mine'){giftMine();}
  else if(a==='gift-equip'){giftEquip(b.dataset.k);}
  else if(a==='fam-open'){famOpen();}
  else if(a==='fr-go'){TAB='fr';render();window.scrollTo(0,0);frOpened();}
  else if(a==='fr-play'){RM.pick=[b.dataset.to];TAB='games';render();window.scrollTo(0,0);rmOpenMenu('create','race');}
  else if(a==='fr-av'){FRE.name=(($('#frname')||{}).value||FRE.name);FRE.avatar=b.dataset.v;render();}
  else if(a==='fr-create'){frCreate();}
  else if(a==='fr-follow'){frFollow((($('#frcode')||{}).value||''));}
  else if(a==='fr-back'){frFollowBack(b.dataset.to);}
  else if(a==='fr-cheer'){frCheer(b.dataset.to,b.dataset.k,b);}
  else if(a==='fr-unf'){frAskUnf(b.dataset.to,b.dataset.n);}
  else if(a==='fr-unf-yes'){frUnfollow(b.dataset.to);}
  else if(a==='fr-rem'){frAskRem(b.dataset.to,b.dataset.n);}
  else if(a==='fr-rem-yes'){frRemove(b.dataset.to);}
  else if(a==='fr-invite'){frInvite();}
  else if(a==='fr-copy'){frCopy();}
  else if(a==='fr-reload'){FR.err='';frPoll(true,TAB==='fr');}
  else if(a==='fr-vis'){frVisible(b.dataset.v==='1');}
  else if(a==='fr-code-ask'){frAskCode();}
  else if(a==='fr-code-yes'){frNewCode();}
  else if(a==='push-enable'||a==='push-enable-m'){if(a==='push-enable-m')hideModal();pushEnable();}
  else if(a==='push-off'){pushDisable();}
  else if(a==='push-pref'){const P=Object.assign({},PUSH_DEF,(S.push&&S.push.prefs)||{});pushPref(b.dataset.k,!P[b.dataset.k]);}
  else if(a==='push-test'){pushTest();}
  else if(a==='wel-av'){WEL.name=(($('#welname')||{}).value||WEL.name);WEL.avatar=b.dataset.v;welcomeRender();}
  else if(a==='wel-go'){welcomeSave();}
  else if(a==='fr-edit'){frEditOpen();}
  else if(a==='fr-edit-ask'){FRM.ask=true;FRM.name='';FRM.avatar=(FR.data&&FR.data.me&&FR.data.me.avatar)||'🙂';frEditModal();}
  else if(a==='fr-name-later'){S.frNameAsk=today();save();hideModal();setTimeout(frMaybePrompts,400);}
  else if(a==='fr-alias'){frAliasOpen(b.dataset.to,b.dataset.n,false);}
  else if(a==='fr-alias-save'){frAliasSave(b.dataset.to);}
  else if(a==='fr-alias-del'){frAliasDel(b.dataset.to);}
  else if(a==='fr-ask-yes'){hideModal();frFollowBack(b.dataset.to);setTimeout(frMaybePrompts,1200);}
  else if(a==='fr-ask-no'){hideModal();setTimeout(frMaybePrompts,400);}
  else if(a==='fr-medit-av'){FRM.name=(($('#frmname')||{}).value||FRM.name);FRM.avatar=b.dataset.v;frEditModal();}
  else if(a==='fr-edit-save'){frEditSave();}
  else if(a==='fr-del'){showModal('<h3>¿Eliminar tu perfil de amigos?</h3><p>Dejarás de seguir a todos y te dejarán de seguir. Tu progreso en Lampy no se toca.</p><button class="btn bad" data-a="fr-del-yes">Eliminar perfil</button><button class="btn ghost" data-a="stay">Cancelar</button>');}
  else if(a==='fr-del-yes'){frDelete();}
  else if(a==='fam-close'){famClose();}
  else if(a==='fam-av'){famEdit.name=(($('#fname')||{}).value||famEdit.name);famEdit.avatar=b.dataset.v;famRender();}
  else if(a==='fam-create'){famDo('create');}
  else if(a==='fam-join'){famDo('join');}
  else if(a==='fam-cheer'){famCheer(b.dataset.to,b.dataset.k,b);}
  else if(a==='fam-invite'){famInvite();}
  else if(a==='fam-refresh'){famOpen();}
  else if(a==='fam-leave'){showModal('<h3>¿Salir del grupo?</h3><p>Dejarás de ver a tu familia y ellos dejarán de verte.</p><button class="btn" data-a="stay">Quedarme</button><button class="btn ghost" data-a="fam-leave-yes">Salir</button>');}
  else if(a==='fam-leave-yes'){famLeave();}
  else if(a==='goal'){S.goal=+b.dataset.g;save();render();}
  else if(a==='cmenu'){setCmenu(!CMENU);}
  else if(a==='cmenu-close'){setCmenu(false);}
  else if(a==='course'){S.course=b.dataset.c;TAB='path';CMENU=false;save();render();window.scrollTo(0,0);}
  else if(a==='dic-open'||a==='dic-peek'){dicOpen(b.dataset.w);}
  else if(a==='dic-close'){dicClose();}
  else if(a==='abc-go'){DICV='a';S.course='gk';TAB='dic';render();window.scrollTo(0,0);}
  else if(a==='dicv'){DICV=b.dataset.v;render();window.scrollTo(0,0);}
  else if(a==='say-l'){sayLetter(+b.dataset.i);}
  else if(a==='say-w'){sayWord(b.dataset.w);}
  else if(a==='say-t'){gkSpeak(b.dataset.t,{rate:.75});}
  else if(a==='theme'){S.theme=b.dataset.v;save();applyTheme();render();}
  else if(a==='sound'){S.sound=b.dataset.v==='1';save();render();if(S.sound)beep('good');}
  else if(a==='haptic'){S.haptic=b.dataset.v==='1';save();render();if(S.haptic)haptic([30,40,30]);}
  else if(a==='tip'){S.tipHide=true;save();render();}
  else if(a==='bk-copy'){
    const ta=$('#bk');if(!ta)return;ta.value=exportCode();ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    try{if(navigator.clipboard){navigator.clipboard.writeText(ta.value);ok=true;}}catch(e){}
    toast(ok?'¡Código copiado! Guárdalo en tus notas.':'Copia el código de la caja de texto.');
  }
  else if(a==='bk-restore'){
    const ta=$('#bk');if(!ta)return;
    if(importCode(ta.value)){toast('¡Progreso restaurado!');render();}else toast('Ese código no es válido.');
  }
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;render();}
    else{
      const was=signedIn();
      const keepFr=S.fr,keepFam=S.fam;S=defaults();S.fr=keepFr||null;if(keepFam)S.fam=keepFam;if(was)S.cloudUid=AU.uid;
      if(was){CLOUD.applying=true;}
      save();resetArmed=false;
      if(was){CLOUD.applying=false;cloudReq('DELETE','lampara_progress?user_id=eq.'+AU.uid).then(()=>{AU.seen=null;authSave();cloudSync({render:false});}).catch(()=>{CLOUD.state='err';updateCloudUI();});}
      render();
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='auth-email'){e.preventDefault();authSend();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='auth-code'){e.preventDefault();authVerify();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='welname'){e.preventDefault();welcomeSave();return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='frcode'){e.preventDefault();frFollow(e.target.value);return;}
  if(e.key==='Enter'&&e.target&&e.target.id==='frname'){e.preventDefault();frCreate();return;}
  if(G&&e.key==='Enter'&&$('#modal').hidden&&e.target.tagName!=='INPUT'){const pb=document.querySelector('#game [data-primary]');if(pb){e.preventDefault();pb.click();}return;}
  if(!L||!$('#modal').hidden)return;
  if(L.intro){if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();introGo(1);}else if(e.key==='ArrowLeft'){e.preventDefault();introGo(-1);}return;}
  if(e.key==='Enter'){
    if(L.finished){closeLesson();return;}
    if(L.ui&&L.ui.checked){e.preventDefault();nextQ();}
    else if(canCheck()){e.preventDefault();check();}
  }else if(/^[1-4]$/.test(e.key)&&!L.finished&&L.ui){pick(+e.key-1);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{if(frActive()){frSync();frPoll(false,TAB==='fr');}if(RM.code)rmPoll();if(!L&&!G&&!RM.code)render();}});
window.addEventListener('pagehide',()=>{try{save();}catch(e){}});

load();render();cloudBoot();pwaBoot();
welcomeCheck();
frBoot();
</script>
</body>
</html>
