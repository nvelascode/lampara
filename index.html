function nextQ(){
  L.cur=L.queue.shift();
  if(!L.cur){finishLesson();return;}
  L.ui={sel:null,placed:[],checked:false,ok:null};
  renderLesson();
}
function canCheck(){const q=L.cur,ui=L.ui;return !ui.checked&&(q.type==='order'?ui.placed.length===q.bank.length:ui.sel!=null);}
function optsHTML(q,ui){
  return '<div class="opts">'+q.opts.map((o,i)=>{
    let c='';if(ui.checked){if(i===q.a)c='good';else if(i===ui.sel)c='bad';}else if(i===ui.sel)c='sel';
    return '<button class="opt '+c+'" data-a="pick" data-i="'+i+'" '+(ui.checked?'disabled':'')+'><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>';
  }).join('')+'</div>';
}
function renderLesson(){
  const q=L.cur,ui=L.ui,pct=Math.round(100*L.done/L.total);
  const mood=ui.checked?(ui.ok?'cheer':'sad'):(q.tries>0?'think':'happy');
  const say='<div class="say">'+mascot(mood,76)+'<div class="bubble"><p class="prompt">'+esc(q.prompt)+'</p></div></div>';
  let body='';
  if(q.tries>0&&!ui.checked)body+='<div class="retry">'+mascot('think',42)+'<span>¡Repaso! Esta te salió mal antes. Ahora sí.</span></div>';
  if(q.type==='mc')body+=say+optsHTML(q,ui);
  else if(q.type==='ref')body+=say+'<blockquote class="verse">'+esc(VBY[q.ref].t)+'</blockquote>'+optsHTML(q,ui);
  else if(q.type==='fill'){
    const parts=q.toks.map((w,i)=>{
      if(i!==q.idx)return esc(w);
      const chosen=ui.sel!=null?esc(q.opts[ui.sel]):'&nbsp;&nbsp;&nbsp;';
      const cls=ui.checked?(ui.ok?' good':' bad'):'';
      return esc(q.pre)+'<span class="blank'+cls+'">'+chosen+'</span>'+esc(q.suf);
    }).join(' ');
    body+=say+'<blockquote class="verse">'+parts+'</blockquote>'+optsHTML(q,ui);
  }else{
    body+=say+'<div class="answer '+(ui.checked?(ui.ok?'good':'bad'):'')+'" aria-label="Tu respuesta">'+
     ui.placed.map(id=>{const b=q.bank.find(x=>x.id===id);return '<button class="w" data-a="unplace" data-id="'+id+'" '+(ui.checked?'disabled':'')+'>'+esc(b.w)+'</button>';}).join('')+'</div>'+
     '<div class="bank">'+q.bank.map(b=>'<button class="w '+(ui.placed.includes(b.id)?'used':'')+'" data-a="place" data-id="'+b.id+'" '+(ui.checked||ui.placed.includes(b.id)?'disabled':'')+'>'+esc(b.w)+'</button>').join('')+'</div>';
  }
  let foot;
  if(!ui.checked){
    foot='<div class="lf"><div class="in"><button class="btn" data-a="check" '+(canCheck()?'':'disabled')+'>Comprobar</button></div></div>';
  }else{
    const v=VBY[q.ref];
    let ans='';
    if(!ui.ok&&q.type!=='order')ans='Respuesta correcta: <b>'+esc(q.opts[q.a])+'</b><br>';
    const sub=ui.ok?(ui.fresh?'+2 XP':(q.tries>0?'¡Repasada! Ya la tienes':'')):'Volverá a salir al final para repasarla';
    foot='<div class="lf '+(ui.ok?'good':'bad')+'" role="status"><div class="in">'+(ui.fresh?'<div class="xpfloat">+2 XP</div>':'')+
     '<div class="fbhead">'+mascot(ui.ok?'cheer':'sad',58)+'<div><h4>'+esc(ui.head||'')+'</h4>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div></div>'+
     '<div class="fbox"><p class="fv">'+ans+'<em>'+esc(v.t)+'</em> <cite>'+esc(v.r)+'</cite></p>'+(q.nota?'<div class="nota"><b>Nota:</b> '+esc(q.nota)+'</div>':'')+'</div>'+
     '<button class="btn '+(ui.ok?'good':'bad')+'" data-a="next">Continuar</button></div></div>';
  }
  $('#lesson').innerHTML=
   '<div class="lh"><button class="x" data-a="close" aria-label="Salir de la lección">'+IC.close+'</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+(L.combo>=3?'<div class="combo" aria-label="'+L.combo+' aciertos seguidos">'+IC.flame+L.combo+'</div>':'')+'</div>'+
   '<div class="lb">'+body+'</div>'+foot;
}
function check(){
  if(!canCheck())return;
  const q=L.cur,ui=L.ui;let ok;
  if(q.type==='order')ok=ui.placed.map(id=>q.bank.find(b=>b.id===id).w).join(' ')===q.toks.join(' ');
  else ok=ui.sel===q.a;
  ui.checked=true;ui.ok=ok;ui.fresh=false;
  const st=S.verses[q.ref]||(S.verses[q.ref]={c:0,w:0});
  if(ok){
    if(q.tries===0){L.firstTry++;L.xp+=2;st.c++;L.combo++;ui.fresh=true;}
    L.done++;
    ui.head=L.combo>=3&&q.tries===0?'¡'+L.combo+' seguidas!':pickOne(['¡Eso es!','¡Perfecto!','¡Muy bien!','¡Así se hace!','¡Genial!','¡Excelente!']);
    beep('good');
    if(q.tries===0&&L.combo>0&&L.combo%5===0)confetti(50);
  }else{
    if(q.tries===0)st.w++;
    q.tries++;L.mistakes++;L.queue.push(q);L.combo=0;
    ui.head=pickOne(['¡Casi!','¡Uy, esa no!','¡Ups!','Se te escapó']);
    beep('bad');
  }
  try{if(navigator.vibrate)navigator.vibrate(ok?15:[30,40,30]);}catch(e){}
  save();renderLesson();
}
function finishLesson(){
  const bonus=5+(L.mistakes===0?5:0);
  const xp=L.xp+bonus;
  const r=recordDay(xp);
  const isReview=L.meta.type==='review';
  if(isReview)S.reviews++;
  else{const p=S.done[L.meta.key]||{n:0};S.done[L.meta.key]={n:p.n+1,acc:Math.max(p.acc||0,L.firstTry/L.total)};}
  S.lessons++;if(L.mistakes===0)S.perfect++;
  S.froze=0;
  const fresh=ACH.filter(a=>!S.ach[a.id]&&a.f(S));fresh.forEach(a=>S.ach[a.id]=true);
  save();
  const acc=Math.round(100*L.firstTry/L.total);
  const vs=L.meta.verses||[];
  $('#lesson').innerHTML=
   '<div class="lb"><div class="res"><div style="display:flex;justify-content:center">'+mascot('cheer',140)+'</div><h1>'+(isReview?'¡Repaso listo!':'¡Lección completada!')+'</h1>'+
   '<p class="muted" style="margin:0">'+esc(L.meta.title||'')+'</p>'+
   '<div class="rs"><div><i>⚡</i><b>+'+xp+'</b><span>XP</span></div><div><i>🎯</i><b>'+acc+'%</b><span>Al primer intento</span></div><div><i>🔥</i><b>'+S.streak+'</b><span>Días de racha</span></div></div>'+
   (L.mistakes>0?'<div class="revbox">🔄 Repasaste '+L.mistakes+(L.mistakes===1?' pregunta':' preguntas')+' que fallaste. ¡Así se aprende!</div>':'<div class="revbox" style="background:var(--green-bg);border-color:var(--green)">💯 ¡Sin errores! Lección perfecta.</div>')+
   (r.newDay?'<div class="note fl">🔥 <b>¡Racha de '+S.streak+(S.streak===1?' día':' días')+'!</b> Vuelve mañana para mantenerla.</div>':'<div class="note">Hoy tu racha ya estaba asegurada. ¡Sigue sumando!</div>')+
   (r.gotFreeze?'<div class="note fl">🛡️ <b>¡Ganaste un protector de racha!</b> Cubre un día si no puedes practicar.</div>':'')+
   (r.goalHit?'<div class="note">🎯 <b>¡Meta diaria cumplida!</b> '+S.days[today()]+' XP hoy.</div>':'')+
   fresh.map(a=>'<div class="note">'+(ACH_E[a.id]||'⭐')+' <b>Logro: '+a.t+'.</b> '+a.d+'.</div>').join('')+
   (vs.length?'<div class="vs"><h3>Versículos de esta lección</h3><div class="list">'+vs.map(v=>'<div class="li"><cite>'+esc(v.r)+'</cite><p>'+esc(v.t)+'</p></div>').join('')+'</div></div>':'')+
   '</div></div><div class="lf"><div class="in"><button class="btn" data-a="finish">Continuar</button></div></div>';
  L.finished=true;
  beep('win');confetti(120);
}

const canSpeak=()=>{try{return 'speechSynthesis' in window;}catch(e){return false;}};
const sayClean=t=>String(t).replace(/[«»]/g,'').replace(/_{2,}/g,'...');
const sayRef=r=>r.replace(':',' versículo ').replace('-',' al ');
function speak(t){
  if(!S.g.voice||!canSpeak()||!t)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(sayClean(t));
    const v=(speechSynthesis.getVoices()||[]).find(x=>/^es/i.test(x.lang));
    if(v){u.voice=v;u.lang=v.lang;}else u.lang='es-ES';
    u.rate=.95;speechSynthesis.speak(u);
  }catch(e){}
}
const nameOf=i=>((S.g.names[i]||'').trim())||('Jugador '+(i+1));

function mkItem(label,html,say,ansHtml,ansSay){return {label,html,say,ansHtml,ansSay};}
function dQuien(n){return shuffle(GQUIEN).slice(0,n).map(x=>mkItem('¿Quién dijo esto?','<blockquote class="verse gbig">'+esc(x.q)+'</blockquote>','¿Quién dijo esto? '+x.q,'<b>'+esc(x.a)+'</b><span>'+esc(x.ref)+'</span>',x.a+'. '+sayRef(x.ref)));}
function dVF(n){return shuffle(GFALSO).slice(0,n).map(x=>mkItem('¿Verdadero o falso?','<blockquote class="verse gbig">'+esc(x[0])+'</blockquote>','¿Verdadero o falso? '+x[0],'<b>'+(x[1]?'Verdadero':'Falso')+'</b><span>'+esc(x[2])+'</span><p>'+esc(x[3])+'</p>',(x[1]?'Verdadero. ':'Falso. ')+x[3]+' '+sayRef(x[2])));}
function dPers(n){return shuffle(GPERS).slice(0,n).map(x=>{const it=mkItem('¿Quién es este personaje?','','','<b>'+esc(x.a)+'</b>',x.a);it.clues=x.c;return it;});}
function dComp(n){
  const vs=shuffle(ALLV.filter(v=>v.t.split(/\s+/).length<=26&&BLANKS[v.r])).slice(0,n);
  return vs.map(v=>{
    const b=pickBlank(v);
    const disp=b.toks.map((w,i)=>i===b.idx?esc(b.pre)+'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'+esc(b.suf):esc(w)).join(' ');
    const sayT=b.toks.map((w,i)=>i===b.idx?b.pre+' ... '+b.suf:w).join(' ');
    return mkItem('Completa el versículo','<blockquote class="verse gbig">'+disp+'</blockquote>','Completa el versículo. '+sayT+' ¿Qué palabra falta?','<b>'+esc(b.word)+'</b><span>'+esc(v.r)+'</span><p>'+esc(v.t)+'</p>',b.word+'. '+sayRef(v.r));
  });
}
function dLibros(n){
  return shuffle(GLIBROS).slice(0,n).map(x=>mkItem('¿En qué libro de la Biblia está?','<p class="gq">'+esc(x[0])+'</p>','¿En qué libro de la Biblia está: '+x[0]+'?','<b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span>',x[1]+'. '+sayRef(x[2])));
}
function dConv(n){
  return shuffle(GCONV).slice(0,n).map(x=>{
    const t=x.t||VBY[x.ref].t;
    const it=mkItem('Para conversar','<blockquote class="verse gbig">'+esc(t)+'<cite class="vref">'+esc(x.ref)+'</cite></blockquote><p class="gq">'+esc(x.q)+'</p>',sayRef(x.ref)+'. '+t+' Pregunta: '+x.q,'','');
    return it;
  });
}
const DECKS={quien:dQuien,pers:dPers,vf:dVF,comp:dComp,libros:dLibros,conv:dConv};

let G=null;
function av(i){return '<span class="av" style="background:'+PCOL[i%PCOL.length]+'">'+esc(nameOf(i).charAt(0).toUpperCase())+'</span>';}
function gamesHTML(){
  return '<h1 class="page">Juegos en grupo</h1>'+
   '<div class="hero">'+mascot('cheer',84)+'<div class="bubble">¡Elijan un juego! Uno lee la pantalla y los demás responden.</div></div>'+
   '<div class="gtiles">'+GAMES.map(g=>'<button class="gcard" style="--gc:'+g.c+'" data-a="g-open" data-g="'+g.id+'"><span class="gemo" aria-hidden="true">'+g.emo+'</span><b>'+esc(g.t)+'</b><span>'+esc(g.d)+'</span></button>').join('')+'</div>';
}
function gShow(){$('#game').hidden=false;document.body.style.overflow='hidden';}
function gTheme(){const el=$('#game');el.className='overlay gamed';if(G&&G.game){el.style.setProperty('--gc',G.game.c);el.style.setProperty('--gcol',G.game.c);}}
function gClose(){if(canSpeak())try{speechSynthesis.cancel();}catch(e){}$('#game').hidden=true;$('#game').innerHTML='';$('#game').className='overlay';document.body.style.overflow='';G=null;render();}
function gSetup(id){G={id,game:GAMES.find(x=>x.id===id),deck:null};gTheme();gRenderSetup();gShow();}
function gRenderSetup(){
  const g=G.game,c=S.g,sc=g.scored,canV=canSpeak();
  const names=Array.from({length:c.n},(_,i)=>'<input class="inp" data-i="'+i+'" value="'+esc(c.names[i]||'')+'" placeholder="Jugador '+(i+1)+'" maxlength="14" aria-label="Nombre del jugador '+(i+1)+'">').join('');
  $('#game').innerHTML=
   '<div class="lh"><button class="x" data-a="g-close" aria-label="Cerrar">'+IC.close+'</button><div class="bar"><i style="width:0%"></i></div></div>'+
   '<div class="lb"><div class="gsetup"><span style="font-size:52px;line-height:1" aria-hidden="true">'+g.emo+'</span><div><h1>'+esc(g.t)+'</h1><p>'+esc(g.d)+'</p></div></div>'+
   (sc?'<section class="sec"><h3>Jugadores</h3><div class="stepper"><button data-a="g-n" data-d="-1" aria-label="Menos jugadores">−</button><b>'+c.n+'</b><button data-a="g-n" data-d="1" aria-label="Más jugadores">+</button></div><div class="names">'+names+'</div></section>':'')+
   '<section class="sec"><h3>'+(sc?'Rondas':'Preguntas')+'</h3><div class="seg">'+[5,10,15].map(r=>'<button class="'+(c.rounds===r?'on':'')+'" data-a="g-r" data-r="'+r+'">'+r+'</button>').join('')+'</div></section>'+
   '<section class="sec"><h3>🔊 Leer en voz alta</h3>'+(canV?'<div class="seg"><button class="'+(c.voice?'on':'')+'" data-a="g-voice" data-v="1">Sí</button><button class="'+(!c.voice?'on':'')+'" data-a="g-voice" data-v="0">No</button></div><p class="muted" style="font-size:14px;margin:8px 0 0">El teléfono lee cada pregunta y cada respuesta.</p>':'<p class="muted" style="font-size:14px;margin:0">Este navegador no ofrece lectura en voz alta.</p>')+'</section>'+
   '<p class="muted" style="font-size:14px">Al terminar sumas +10 XP a tu racha. 🔥</p></div>'+
   '<div class="lf"><div class="in"><button class="btn" data-a="g-start" data-primary>¡A jugar!</button></div></div>';
}
function gStart(){
  const c=S.g,deck=DECKS[G.id](c.rounds);
  G={id:G.id,game:G.game,deck,i:0,cl:1,phase:'q',win:[],scores:Array(c.n).fill(0),total:deck.length};
  gTheme();gRender();gSpeakQ();
}
function gCur(){return G.deck[G.i];}
function gSpeakQ(){const it=gCur();speak(it.clues?it.label+'. Pista 1. '+it.clues[0][0]:it.say);}
function gRender(){
  const it=gCur(),sc=G.game.scored,pct=Math.round(100*G.i/G.total),last=G.i===G.total-1;
  const pts=it.clues?4-G.cl:1;
  let body='<div class="lb">';
  if(sc)body+='<div class="sb">'+G.scores.map((s,i)=>'<span class="sbp">'+av(i)+'<b>'+esc(nameOf(i))+'</b> '+s+'</span>').join('')+'</div>';
  body+='<p class="glabel">'+esc(it.label)+' <span>· '+(G.i+1)+' de '+G.total+'</span></p>';
  if(it.clues)body+='<ol class="clues">'+it.clues.slice(0,G.cl).map((c,k)=>'<li><span>Pista '+(k+1)+'</span>'+esc(c[0])+(G.phase==='a'?'<cite>'+esc(c[1])+'</cite>':'')+'</li>').join('')+'</ol>';
  else body+=it.html;
  if(G.phase==='a')body+='<div class="gans">'+it.ansHtml+'</div>';
  body+='</div>';
  let foot;
  const rep=S.g.voice&&canSpeak()?'<button class="btn ghost" data-a="g-repeat">🔁 Repetir</button>':'';
  if(!sc){
    foot='<div class="lf"><div class="in"><div class="row2">'+rep+'<button class="btn" data-a="g-next" data-primary>'+(last?'Terminar':'Siguiente')+'</button></div></div></div>';
  }else if(G.phase==='q'){
    const more=it.clues&&G.cl<it.clues.length?'<button class="btn ghost" data-a="g-clue">💡 Otra pista</button>':'';
    foot='<div class="lf"><div class="in">'+((rep||more)?'<div class="row2">'+rep+more+'</div>':'')+'<button class="btn" data-a="g-reveal" data-primary>Ver respuesta</button></div></div>';
  }else{
    foot='<div class="lf"><div class="in"><p style="margin:0 0 8px;font-weight:900">¿Quién acertó? <span class="muted" style="font-weight:800">(+'+pts+')</span></p><div class="who">'+
     G.scores.map((_,i)=>'<button class="pl '+(G.win.includes(i)?'on':'')+'" data-a="g-win" data-p="'+i+'" aria-pressed="'+G.win.includes(i)+'">'+av(i)+esc(nameOf(i))+'</button>').join('')+
     '</div><button class="btn" data-a="g-next" data-primary>'+(last?'Ver resultados':'Siguiente ronda')+'</button></div></div>';
  }
  $('#game').innerHTML=
   '<div class="lh"><button class="x" data-a="g-close" aria-label="Salir del juego">'+IC.close+'</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></div>'+body+foot;
}
function gNext(){
  if(G.game.scored){const pts=gCur().clues?4-G.cl:1;G.win.forEach(i=>{G.scores[i]+=pts;});}
  G.win=[];G.i++;G.cl=1;G.phase='q';
  if(G.i>=G.total){gEnd();return;}
  gRender();gSpeakQ();
}
function gEnd(){
  const sc=G.game.scored;
  const r=recordDay(10);S.gplays=(S.gplays||0)+1;
  const fresh=ACH.filter(a=>!S.ach[a.id]&&a.f(S));fresh.forEach(a=>S.ach[a.id]=true);save();
  if(canSpeak())try{speechSynthesis.cancel();}catch(e){}
  let head='¡Se acabaron las preguntas!',rank='';
  if(sc){
    const arr=G.scores.map((s,i)=>({s,n:nameOf(i),i})).sort((a,b)=>b.s-a.s);
    const top=arr.filter(x=>x.s===arr[0].s);
    head=arr[0].s===0?'¡Partida terminada!':top.length>1?'¡Empate!':'¡Ganó '+arr[0].n+'!';
    const medals=['🥇','🥈','🥉'];
    rank='<div class="list" style="text-align:left;margin-top:14px">'+arr.map((x,k)=>'<div class="li rk"><span style="display:flex;align-items:center;gap:10px"><span class="medal">'+(medals[k]||'🎖️')+'</span>'+av(x.i)+'<b>'+esc(x.n)+'</b></span><b style="font-size:22px">'+x.s+'</b></div>').join('')+'</div>';
  }
  $('#game').innerHTML=
   '<div class="lb"><div class="res"><div style="display:flex;justify-content:center">'+mascot('cheer',130)+'</div><h1>'+esc(head)+'</h1><p class="muted" style="margin:0">'+esc(G.game.t)+'</p>'+rank+
   '<div class="rs" style="grid-template-columns:1fr 1fr"><div><i>⚡</i><b>+10</b><span>XP</span></div><div><i>🔥</i><b>'+S.streak+'</b><span>Días de racha</span></div></div>'+
   (r.newDay?'<div class="note fl">🔥 <b>¡Racha de '+S.streak+(S.streak===1?' día':' días')+'!</b> Jugar en familia también cuenta.</div>':'')+
   (r.gotFreeze?'<div class="note fl">🛡️ <b>¡Ganaste un protector de racha!</b></div>':'')+
   fresh.map(a=>'<div class="note">'+(ACH_E[a.id]||'⭐')+' <b>Logro: '+a.t+'.</b> '+a.d+'.</div>').join('')+
   '</div></div><div class="lf"><div class="in"><div class="row2"><button class="btn ghost" data-a="g-exit">Salir</button><button class="btn" data-a="g-again" data-primary>Jugar otra vez</button></div></div></div>';
  G.finished=true;
  beep('win');confetti(120);
}
function gAct(a,b){
  const c=S.g;
  if(a==='g-open')gSetup(b.dataset.g);
  else if(!G)return;
  else if(a==='g-n'){c.n=Math.max(2,Math.min(8,c.n+(+b.dataset.d)));save();gRenderSetup();}
  else if(a==='g-r'){c.rounds=+b.dataset.r;save();gRenderSetup();}
  else if(a==='g-voice'){c.voice=b.dataset.v==='1';save();gRenderSetup();if(c.voice)speak('Lectura en voz alta activada.');}
  else if(a==='g-start')gStart();
  else if(a==='g-reveal'){G.phase='a';gRender();speak(gCur().ansSay);}
  else if(a==='g-clue'){G.cl++;gRender();speak('Pista '+G.cl+'. '+gCur().clues[G.cl-1][0]);}
  else if(a==='g-win'){const p=+b.dataset.p,k=G.win.indexOf(p);if(k>=0)G.win.splice(k,1);else{G.win.push(p);beep('good');confetti(30);}gRender();}
  else if(a==='g-next')gNext();
  else if(a==='g-repeat'){if(G.phase==='a')speak(gCur().ansSay);else gSpeakQ();}
  else if(a==='g-close'){if(G.deck&&!G.finished)showModal('<h3>¿Salir del juego?</h3><p>Se perderá el marcador de esta partida.</p><button class="btn" data-a="stay">Seguir jugando</button><button class="btn ghost" data-a="g-leave">Salir</button>');else gClose();}
  else if(a==='g-leave'){hideModal();gClose();}
  else if(a==='g-again'){const id=G.id,game=G.game;G={id,game};gStart();}
  else if(a==='g-exit')gClose();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('inp')){const i=+t.dataset.i;S.g.names[i]=t.value;save();}
});

/* ============================================================
   EVENTOS
   ============================================================ */
function pick(i){if(!L||L.ui.checked)return;const q=L.cur;if(q.type==='order'||i>=q.opts.length)return;L.ui.sel=i;renderLesson();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a.startsWith('g-')){gAct(a,b);return;}
  if(a==='tab'){TAB=b.dataset.t;resetArmed=false;render();window.scrollTo(0,0);}
  else if(a==='lesson'){
    const ui=+b.dataset.u,li=+b.dataset.l,les=UNITS[ui].lessons[li];
    startLesson({type:'lesson',key:lk(ui,li),title:les.title,verses:les.verses},buildQuestions(les.verses,les.qs,10),les.intro);
  }
  else if(a==='review'){
    const seen=Object.keys(S.verses).filter(r=>VBY[r]);if(seen.length<3)return;
    const pick5=seen.map(r=>({r,s:S.verses[r].c-S.verses[r].w*1.5+Math.random()})).sort((x,y)=>x.s-y.s).slice(0,5).map(x=>VBY[x.r]);
    startLesson({type:'review',title:'Repaso diario',verses:pick5},buildQuestions(pick5,[],8));
  }
  else if(a==='begin'){if(L&&L.intro){L.intro=null;nextQ();}}
  else if(a==='pick')pick(+b.dataset.i);
  else if(a==='place'){if(L&&!L.ui.checked){L.ui.placed.push(+b.dataset.id);renderLesson();}}
  else if(a==='unplace'){if(L&&!L.ui.checked){L.ui.placed=L.ui.placed.filter(id=>id!==+b.dataset.id);renderLesson();}}
  else if(a==='check')check();
  else if(a==='next')nextQ();
  else if(a==='close'){showModal('<h3>¿Salir de la lección?</h3><p>Perderás el avance de esta lección.</p><button class="btn" data-a="stay">Seguir aprendiendo</button><button class="btn ghost" data-a="leave">Salir</button>');}
  else if(a==='stay')hideModal();
  else if(a==='leave'){hideModal();closeLesson();}
  else if(a==='finish')closeLesson();
  else if(a==='goal'){S.goal=+b.dataset.g;save();render();}
  else if(a==='sound'){S.sound=b.dataset.v==='1';save();render();if(S.sound)beep('good');}
  else if(a==='tip'){S.tipHide=true;save();render();}
  else if(a==='bk-copy'){
    const ta=$('#bk');if(!ta)return;ta.value=exportCode();ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    try{if(navigator.clipboard){navigator.clipboard.writeText(ta.value);ok=true;}}catch(e){}
    toast(ok?'¡Código copiado! Guárdalo en tus notas.':'Copia el código de la caja de texto.');
  }
  else if(a==='bk-restore'){
    const ta=$('#bk');if(!ta)return;
    if(importCode(ta.value)){toast('¡Progreso restaurado!');render();}else toast('Ese código no es válido.');
  }
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;render();}
    else{S=defaults();save();resetArmed=false;render();}
  }
});
document.addEventListener('keydown',e=>{
  if(G&&e.key==='Enter'&&$('#modal').hidden&&e.target.tagName!=='INPUT'){const pb=document.querySelector('#game [data-primary]');if(pb){e.preventDefault();pb.click();}return;}
  if(!L||!$('#modal').hidden)return;
  if(L.intro){if(e.key==='Enter'){L.intro=null;nextQ();}return;}
  if(e.key==='Enter'){
    if(L.finished){closeLesson();return;}
    if(L.ui&&L.ui.checked){e.preventDefault();nextQ();}
    else if(canCheck()){e.preventDefault();check();}
  }else if(/^[1-4]$/.test(e.key)&&!L.finished&&L.ui){pick(+e.key-1);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(!L&&!G)render();});
window.addEventListener('pagehide',()=>{try{save();}catch(e){}});

load();render();
</script>
