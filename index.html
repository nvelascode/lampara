 {"title": "Historia Sagrada: el Nuevo Testamento", "sub": "De Juan el Bautista al progreso de la Iglesia", "lessons": [{"title": "Silencio y Juan el Bautista", "intro": {"t": "La Historia Sagrada continúa", "p": "La Historia Sagrada tiene dos partes: la del Antiguo y la del Nuevo Testamento. Ya vimos los 10 tiempos del Antiguo; ahora vemos los 4 primeros del Nuevo: 1) el tiempo de Juan el Bautista, 2) el tiempo de Jesucristo en la tierra, 3) el tiempo del principio de la Iglesia cristiana y 4) el tiempo del progreso de la Iglesia cristiana. Estos cuatro tiempos duraron solamente unos 100 años, y comenzaron hace unos 2000 años. (El quinto tiempo, el porvenir de la Iglesia, es el que aún está por venir.)\nDurante 400 años, desde la restauración hasta Juan el Bautista, Dios no envió más profetas: fue un tiempo de «silencio». Algunos judíos esperaban una nueva palabra de Dios y la venida del Cristo, que esperaban que los librara del dominio de los romanos. Pero muchos no obedecían a Dios de corazón: cumplían los ritos, leían las Escrituras y guardaban las fiestas, pero vivían esclavos del pecado.\nEntonces se presentó Juan el Bautista, hijo de unos judíos ancianos y piadosos: el profeta prometido por los profetas, que prepararía la venida del Cristo. Hizo tres cosas: predicaba (el reino de Dios se acercaba; arrepentíos), bautizaba (un símbolo de que Dios limpia del pecado; él bautizaba en agua, Jesucristo bautizaría en el Espíritu Santo) y señaló a Jesucristo. Con Juan empieza el tiempo del Nuevo Testamento: la historia de la salvación llega a su punto más importante."}, "verses": [{"r": "Isaías 40:3", "t": "Voz que clama en el desierto: Preparad camino a Jehová; enderezad calzada en la soledad a nuestro Dios."}, {"r": "Mateo 3:1-2", "t": "En aquellos días vino Juan el Bautista predicando en el desierto de Judea, y diciendo: Arrepentíos, porque el reino de los cielos se ha acercado."}, {"r": "Mateo 3:11", "t": "Yo a la verdad os bautizo en agua para arrepentimiento; pero el que viene tras mí, cuyo calzado yo no soy digno de llevar, es más poderoso que yo; él os bautizará en Espíritu Santo y fuego."}, {"r": "Juan 1:36", "t": "Y mirando a Jesús que andaba por allí, dijo: He aquí el Cordero de Dios."}], "qs": [["¿Cuáles son los 4 tiempos de la Historia Sagrada que estudiamos en el Nuevo Testamento?", "Juan el Bautista, Jesucristo en la tierra, el principio de la Iglesia y el progreso de la Iglesia", ["Los Principios, los Patriarcas, Moisés y la Conquista", "Los Jueces, el Reino Unido, el Reino Dividido y Judá Solo", "El Cautiverio, la Restauración, Juan el Bautista y Jesucristo"], "", ""], ["¿Cuántos años duraron los 4 primeros tiempos de la Historia Sagrada del Nuevo Testamento?", "Unos 100 años", ["Unos 400 años", "Unos 40 años", "Unos 1000 años"], "", ""], ["¿Cómo llamamos a los 400 años antes de la venida de Jesucristo?", "Los 400 años de «silencio»", ["Los 400 años del templo", "Los 400 años de los jueces", "Los 400 años del exilio"], "", ""], ["¿Qué ocurrió con los profetas durante los 400 años entre Malaquías y Juan el Bautista?", "Dios no envió más profetas", ["Dios envió muchos profetas nuevos", "Los profetas vivían en Roma", "Los profetas escribieron el Nuevo Testamento"], "", ""], ["¿Qué esperaban algunos judíos en los días de Juan el Bautista?", "La venida del Cristo, que los librara del dominio de los romanos", ["Una nueva ley de Moisés", "La vuelta de los reyes de Babilonia", "La caída del templo"], "", ""], ["¿Cómo estaba la nación cuando se presentó Juan el Bautista?", "Muchos cumplían los ritos pero no amaban de corazón al Señor", ["Todos obedecían a Dios de corazón", "Estaban en el desierto", "Vivían libres del pecado"], "", ""], ["¿Quién era Juan el Bautista?", "Un profeta enviado por Dios, hijo de unos judíos ancianos y piadosos, para preparar la venida del Cristo", ["Un rey de Israel", "Un apóstol de Pablo", "Un sacerdote del templo de Roma"], "", ""], ["¿Cuáles fueron las tres cosas que hizo Juan el Bautista?", "Predicó, bautizó y señaló a Jesucristo", ["Escribió, viajó y gobernó", "Hizo milagros, pagó impuestos y enseñó la ley", "Predicó, construyó y juzgó"], "", ""], ["¿Para qué servía el bautismo que hacía Juan?", "Para mostrar que Dios limpia a la persona de su pecado", ["Para unirse a un ejército", "Para pagar un impuesto", "Para entrar al templo"], "", ""], ["Según Isaías 40:3, ¿qué dice la voz que clama en el desierto?", "Preparad camino a Jehová", ["Edificad un templo", "Huid de la ira", "Guardad silencio"], "Isaías 40:3", ""], ["Según Mateo 3:1-2, ¿qué predicaba Juan el Bautista?", "Arrepentíos, porque el reino de los cielos se ha acercado", ["Edificad un templo", "Guardad el día de reposo", "Esperad a un nuevo rey"], "Mateo 3:1-2", ""], ["Según Mateo 3:11, ¿en qué bautizaría el que venía tras Juan?", "En Espíritu Santo y fuego", ["Solo en agua", "En el Jordán únicamente", "En la sangre de los corderos"], "Mateo 3:11", ""], ["Según Juan 1:36, ¿qué dijo Juan al ver a Jesús?", "He aquí el Cordero de Dios", ["He aquí el rey de Israel", "He aquí un profeta de Nazaret", "He aquí el hijo del carpintero"], "Juan 1:36", ""]], "cx": [{"k": "order", "prompt": "Ordena los tiempos de la Historia Sagrada desde la Restauración", "chunks": [["La Restauración", "Los 400 años de silencio", "Juan el Bautista", "Jesucristo en la tierra"]]}, {"k": "match", "prompt": "Une cada cosa que hizo Juan con su descripción", "pairs": [["Predicaba", "Decía que el reino de Dios se acercaba"], ["Bautizaba", "Un símbolo de que Dios limpia del pecado"], ["Señaló a Jesucristo", "Así se supo que había llegado el Salvador"]], "done": "Cada una quedó con su descripción."}], "max": 12}, {"title": "Jesucristo: su vida y su obra", "intro": {"t": "El tiempo de Jesucristo en la tierra (1)", "p": "Juan el Bautista señaló a Jesús de Nazaret como el Salvador del mundo. El Hijo de Dios existía eternamente; llegó a ser hombre cuando nació de la virgen María por obra del Espíritu Santo. Nació en Belén, y los ángeles anunciaron su nacimiento. Vivió con José y María en Nazaret; José trabajaba como carpintero.\nA los 12 años fue con ellos a Jerusalén a la fiesta de la Pascua, y mostró que era el Hijo de Dios: tenía mucha sabiduría y estaba en el templo, en los negocios de su Padre. Después siguió creciendo «en sabiduría y en estatura, y en gracia para con Dios y los hombres» (Lucas 2:52). Casi no sabemos más de sus primeros 29 años.\nA los 30 empezó su trabajo público, que duró unos 3 años: anunciaba el reino de Dios, enseñaba cómo era la vida que Dios quería, daba a conocer a su Padre, predicaba e invitaba a creer en él. Decía que había venido del cielo para salvar a los pecadores por medio de su muerte y su resurrección. Muchas veces enseñaba con parábolas: historias de la vida común para enseñar una verdad espiritual. Los milagros apoyaban sus enseñanzas y mostraban que era Dios, que traía la Palabra de Dios y que podía librar al hombre de su pecado y miseria. Obraba con poder, con verdad y con compasión, y no tuvo pecado.\nTenía muchos enemigos: muy pocos judíos creían en él, y los dirigentes religiosos (fariseos, saduceos y escribas) lo odiaban. De los que sí creían escogió a 12 apóstoles, que serían el fundamento de la Iglesia."}, "verses": [{"r": "Lucas 2:49", "t": "Entonces él les dijo: ¿Por qué me buscabais? ¿No sabíais que en los negocios de mi Padre me es necesario estar?"}, {"r": "Lucas 2:52", "t": "Y Jesús crecía en sabiduría y en estatura, y en gracia para con Dios y los hombres."}, {"r": "Mateo 4:23", "t": "Y recorrió Jesús toda Galilea, enseñando en las sinagogas de ellos, y predicando el evangelio del reino, y sanando toda enfermedad y toda dolencia en el pueblo."}, {"r": "Mateo 13:3", "t": "Y les habló muchas cosas por parábolas, diciendo: He aquí, el sembrador salió a sembrar."}, {"r": "Hebreos 4:15", "t": "Porque no tenemos un sumo sacerdote que no pueda compadecerse de nuestras debilidades, sino uno que fue tentado en todo según nuestra semejanza, pero sin pecado."}, {"r": "Marcos 3:14", "t": "Y estableció a doce, para que estuviesen con él, y para enviarlos a predicar,"}], "qs": [["¿Empezó a existir el Hijo de Dios cuando nació de la virgen?", "No: existía eternamente, y llegó a ser hombre al nacer de María", ["Sí, empezó a existir en Belén", "Sí, empezó a existir en el Jordán", "No existió hasta la resurrección"], "", ""], ["¿Cuáles son las dos naturalezas de Jesucristo?", "Es Dios y hombre a la vez", ["Es ángel y hombre", "Es profeta y rey", "Es sacerdote y juez"], "", ""], ["¿Dónde nació Jesús, y dónde vivió con José y María?", "Nació en Belén y vivió en Nazaret", ["Nació en Nazaret y vivió en Belén", "Nació en Jerusalén y vivió en Egipto", "Nació en Roma y vivió en Galilea"], "", ""], ["¿Qué hacía Jesucristo en su trabajo público?", "Anunciaba el reino de Dios, enseñaba, daba a conocer a su Padre e invitaba a creer en él", ["Gobernaba como rey", "Guardaba el templo", "Escribía las leyes de Israel"], "", ""], ["¿Cuánto duró su trabajo público?", "Unos 3 años", ["Unos 12 años", "Unos 40 años", "Unos 7 años"], "", ""], ["¿Qué es una parábola?", "Una historia de algo de la vida común para enseñar una verdad espiritual", ["Una ley del templo", "Un milagro de sanidad", "Una oración larga"], "", ""], ["¿Con qué apoyaba Jesús sus enseñanzas?", "Con milagros", ["Con ejércitos", "Con oro", "Con leyes civiles"], "", ""], ["¿De qué podía librar Jesús a los que creían en él?", "De su pecado y miseria", ["De los romanos", "De la pobreza", "De los viajes"], "", ""], ["¿Quiénes no creían en Jesucristo, en su mayoría?", "Los judíos, sobre todo sus dirigentes religiosos", ["Los romanos solamente", "Los apóstoles", "Los niños"], "", ""], ["¿Qué podemos decir del pecado de Jesús?", "No tuvo pecado, y siempre hizo lo que agradaba a su Padre", ["Pecó una vez", "Pecó solo de niño", "Tuvo el mismo pecado que los demás"], "", ""], ["¿Para qué serviría el grupo de los 12 apóstoles?", "Serían el fundamento de la Iglesia cristiana", ["Ser ndenaron porque no creían que fuera el enviado de Dios, el Mesías, ni Dios mismo, y no les gustaba que los reprendiera por su pecado.\nSu muerte fue especial: no murió por pecado propio, ni porque no pudiera escapar de sus enemigos (se entregó voluntariamente), ni solo para dar un ejemplo de sacrificio o de amor. Murió para pagar a Dios lo que los pecadores escogidos le debían: la paga del pecado es la muerte. Murió en lugar de ellos, para calmar la ira de Dios contra los pecadores y para que Dios pudiera perdonar y a la vez seguir siendo justo.\n¿Pagó todo? Sí: la prueba es que resucitó de entre los muertos el primer día de la semana, una victoria gloriosa sobre la muerte, el pecado y el diablo. Así mostró que era Dios, que su palabra era verdadera y que había pagado completamente por el pecado.\nDespués ascendió al cielo para presentarse a favor de su pueblo y preparar lugar para él. Antes de subir hizo dos promesas: enviaría al Espíritu Santo para que estuviera con ellos para siempre, y volvería otra vez para llevar a los suyos con él. Y dio una tarea: predicar el evangelio en todo el mundo. Los que creyeran formarían la iglesia de Cristo, y él estaría con ellos mediante su Espíritu."}, "verses": [{"r": "Lucas 19:10", "t": "Porque el Hijo del Hombre vino a buscar y a salvar lo que se había perdido."}, {"r": "Juan 10:18", "t": "Nadie me la quita, sino que yo de mí mismo la pongo. Tengo poder para ponerla, y tengo poder para volverla a tomar. Este mandamiento recibí de mi Padre."}, {"r": "1 Pedro 3:18", "t": "Porque también Cristo padeció una sola vez por los pecados, el justo por los injustos, para llevarnos a Dios, siendo a la verdad muerto en la carne, pero vivificado en espíritu;"}, {"r": "Juan 14:3", "t": "Y si me fuere y os preparare lugar, vendré otra vez, y os tomaré a mí mismo, para que donde yo estoy, vosotros también estéis."}, {"r": "Marcos 16:15", "t": "Y les dijo: Id por todo el mundo y predicad el evangelio a toda criatura."}], "qs": [["¿Por qué muri ón y tener comunión. Al principio seguían asistiendo al templo y se reunían aparte también; su forma de servicio era parecida a la de las sinagogas. Guardaban el primer día de la semana recordando la resurrección. Leemos de este tiempo en los primeros 12 capítulos de Hechos, donde se habla sobre todo de Pedro y de dos diáconos, Felipe y Esteban, que ayudaban en lo material y en lo espiritual; Esteban fue el primer mártir.\nPronto hubo una cruel persecución; uno de los perseguidores principales era Saulo de Tarso, a quien Dios convirtió después. Los cristianos salieron de Jerusalén anunciando el evangelio, aun a los gentiles. Dios mandó a Pedro a la casa de Cornelio, un gentil, para mostrar que en la Iglesia habría gente de todas las naciones."}, "verses": [{"r": "Juan 14:26", "t": "Mas el Consolador, el Espíritu Santo, a quien el Padre enviará en mi nombre, él os enseñará todas las cosas, y os recordará todo lo que yo os he dicho."}, {"r": "Hechos 2:42", "t": "Y perseveraban en la doctrina de los apóstoles, en la comunión unos con otros, en el partimiento del pan y en las oraciones."}, {"r": "Hechos 8:1", "t": "Y Saulo consentía en su muerte. En aquel día hubo una gran persecución contra la iglesia que estaba en Jerusalén; y todos fueron esparcidos por las tierras de Judea y de Samaria, salvo los apóstoles."}, {"r": "Hechos 10:34-35", "t": "Entonces Pedro, abriendo la boca, dijo: En verdad comprendo que Dios no hace acepción de personas, sino que en toda nación se agrada del que le teme y hace justicia."}, {"r": "Hechos 11:26", "t": "Y se congregaron allí todo un año con la iglesia, y enseñaron a mucha gente; y a los discípulos se les llamó cristianos por primera vez en Antioquía."}], "qs": [["¿Quién vino de parte de Jesucristo para ayudar a sus seguidores?", "El Espíritu Santo, el Consolador", ["Los ángeles", "Moisés", "Los profetas antiguos"], "", ""], ["¿Qué día vino de una nueva forma el Espíritu Santo, con poder y plenitud?", "El día de Pentecostés", ["El día d  Dios bendijo su obra y muchísimas personas se convirtieron; en cada ciudad con convertidos se formaba la iglesia local.\nHabía persecución casi en todas partes, pero el poder de Dios guardó a su pueblo. Los cristianos cambiaron su conducta: dejaron la idolatría para servir al Dios vivo y verdadero, y dejaron la inmoralidad y los pleitos; se formaba un nuevo estilo de vida.\nSin embargo, no todo era como Dios quería: quedaban rastros de error, surgían errores nuevos, volvían pecados antiguos y las iglesias tenían preguntas sobre conducta y organización. Pablo escribió cartas a las iglesias que fundó: explicó de nuevo el evangelio con detalle y profundidad, y animó a los hermanos. No fue el único: trabajaron los demás apóstoles, evangelistas enviados por las iglesias y muchos cristianos sin puesto oficial; también escribieron cartas Juan, Pedro, Santiago y Judas.\nCada iglesia se reunía para dar culto, predicar y enseñar, servir con una conducta ejemplar y ayudar a los necesitados. Para dirigirla, Dios mandó ordenar «ancianos» u «obispos» (dos palabras para el mismo puesto), normalmente varios, que gobernaban y enseñaban; los que se ocupaban más de la enseñanza eran llamados maestros o pastores. Los «diáconos» atendían los asuntos materiales, sobre todo a los pobres y enfermos. Las iglesias se consultaban entre sí, pero ninguna tenía autoridad sobre otra, y todas unidas formaban la Iglesia cristiana, unida en doctrina y en espíritu.\nLa Iglesia es el cuerpo de Cristo, y por medio de ella Cristo va formando su reino en la tierra. Hoy vivimos en el tiempo de su progreso, que no terminará hasta que el Señor Jesús venga en su gloria a llevar a su pueblo a su hogar eterno."}, "verses": [{"r": "Hechos 13:2", "t": "Ministrando éstos al Señor, y ayunando, dijo el Espíritu Santo: Apartadme a Bernabé y a Saulo para la obra a que los he llamado."}, {"r": "Hechos 13:46", "t": "Entonces Pablo y Bernabé, hablando con denuedo, dijeron: A vosotros a la verdad era necesario que se os  {"title": "Temas y lecturas: Génesis a Ester", "sub": "El tema y las lecturas clave de cada libro", "lessons": [{"title": "Leer toda la Biblia", "intro": {"t": "Un repaso rápido de Génesis a Ester", "p": "Esta materia da un repaso rápido a la primera mitad del Antiguo Testamento, de Génesis a Ester. La Biblia es la Palabra de Dios y es importantísimo leerla toda, tantas veces como uno pueda: es un proceso sin fin a lo largo de la vida cristiana. Muchos errores y defectos resultan sencillamente de no conocer la Biblia a fondo, y cada parte ofrece una ayuda especial para conocer y hacer la voluntad de Dios.\nLas metas: aprender el tema de cada libro; conocer su contenido en un resumen breve; leer más o menos la mitad de cada libro (en cada lección verás qué capítulos); y aprender de memoria seis versículos. Todo busca llevarnos directamente a la Biblia: oír a Dios mismo, y no solo por medio de las obras de los hombres.\nLos seis versículos: Génesis 1:1; Éxodo 19:5-6; Éxodo 34:6-7; Levítico 11:45; Números 23:19 y Deuteronomio 10:12-13."}, "verses": [{"r": "Éxodo 19:5-6", "t": "Ahora, pues, si diereis oído a mi voz, y guardareis mi pacto, vosotros seréis mi especial tesoro sobre todos los pueblos; porque mía es toda la tierra. Y vosotros me seréis un reino de sacerdotes, y gente santa. Estas son las palabras que dirás a los hijos de Israel."}, {"r": "Éxodo 34:6-7", "t": "Y pasando Jehová por delante de él, proclamó: ¡Jehová! ¡Jehová! fuerte, misericordioso y piadoso; tardo para la ira, y grande en misericordia y verdad; que guarda misericordia a millares, que perdona la iniquidad, la rebelión y el pecado, y que de ningún modo tendrá por inocente al malvado; que visita la iniquidad de los padres sobre los hijos y sobre los hijos de los hijos, hasta la tercera y cuarta generación."}, {"r": "Levítico 11:45", "t": "Porque yo soy Jehová, que os hago subir de la tierra de Egipto para ser vuestro Dios: seréis, pues, santos, porque yo soy santo."}, {"r": "Deuteronomio 10:12-13", "t": "Ahora, pues, Israel, ¿qué pide Jehová tu Dios de ti, sino que temas a Jehová tu Dios, que andes en todos sus caminos, y que lo ames, y sirvas a Jehová tu Dios con todo tu corazón y con toda tu alma; que guardes los mandamientos de Jehová y sus estatutos, que yo te prescribo hoy, para que tengas prosperidad?"}], "qs": [["¿Cuál es el propósito de esta materia?", "Dar un repaso rápido a la primera mitad del Antiguo Testamento, de Génesis a Ester", ["Reemplazar la lectura de la Biblia", "Estudiar solo el Nuevo Testamento", "Leer toda la Biblia en una semana"], "", ""], ["¿Por qué es tan importante leer toda la Biblia?", "Porque cada parte ofrece una ayuda especial para conocer y hacer la voluntad de Dios", ["Porque así se termina más rápido", "Porque solo importan algunos libros", "Porque es lo único que hace falta saber de memoria"], "", ""], ["Según esta lección, ¿de dónde resultan muchos errores y defectos?", "De no conocer la Biblia a fondo", ["De leer demasiado la Biblia", "De leer solo el Antiguo Testamento", "De conocer muchos libros de los hombres"], "", ""], ["¿Cuánto de cada libro vamos a leer en esta materia?", "Más o menos la mitad", ["Todo el libro, de corrido", "Solo un versículo", "Nada, solo estudiar los resúmenes"], "", ""], ["¿A qué quiere llevarnos todo este estudio?", "Directamente a la Biblia, para oír a Dios mismo", ["A depender de los libros de los hombres", "A leer solo comentarios", "A memorizar sin leer"], "", ""], ["¿Cuántos versículos aprenderemos de memoria en esta materia?", "Seis", ["Tres", "Diez", "Veinte"], "", ""], ["Según Génesis 1:1, ¿qué creó Dios en el principio?", "Los cielos y la tierra", ["Solo la luz", "Solo al hombre", "Las estrellas y los ángeles"], "Génesis 1:1", ""], ["Según Éxodo 19:5-6, ¿qué serían los israelitas para Dios si guardaban su pacto?", "Un reino de sacerdotes y gente santa", ["Un pueblo sin ley", "Un reino de guerreros", "Un pueblo sin templo"], "Éxodo 19:5-6", ""], ["Según Éxodo 34:6, ¿cómo se proclam n."}, {"r": "Génesis 45:5", "t": "Ahora, pues, no os entristezcáis, ni os pese de haberme vendido acá; porque para preservación de vida me envió Dios delante de vosotros."}, {"r": "Éxodo 3:7", "t": "Dijo luego Jehová: Bien he visto la aflicción de mi pueblo que está en Egipto, y he oído su clamor a causa de sus exactores; pues he conocido sus angustias,"}, {"r": "Éxodo 15:2", "t": "Jehová es mi fortaleza y mi cántico, Y ha sido mi salvación. Este es mi Dios, y lo alabaré; Dios de mi padre, y lo enalteceré."}], "qs": [["¿Quién escribió Génesis?", "Moisés", ["Josué", "Samuel", "Esdras"], "", ""], ["¿Cuál es el tema de Génesis?", "Principios", ["Libertad bajo ley", "Leyes de santidad", "Repaso de la ley"], "", ""], ["¿Qué principios cuenta Génesis?", "Los del universo, de la humanidad y de la nación de Israel", ["Solo los de Egipto", "Solo los de los reyes", "Solo los de la ley"], "", ""], ["¿Qué explica Génesis acerca del hombre?", "Su caída en el pecado y cómo algunos se salvan por la misericordia de Dios", ["Que nunca pecó", "Que se salva por sus obras", "Que no necesita a Dios"], "", ""], ["¿Cuál es el tema de Éxodo?", "Libertad bajo ley", ["Principios", "Leyes de santidad", "Fracaso en los viajes a Canaán"], "", ""], ["¿Qué cuenta Éxodo?", "Cuando Israel salió libre de Egipto", ["Cuando Israel conquistó Canaán", "Cuando se dividió el reino", "Cuando volvieron de Babilonia"], "", ""], ["¿Para qué sacó Dios a los israelitas de Egipto?", "Para que fueran una nación especial para él y le sirvieran", ["Para que fueran un imperio", "Para que dejaran de adorar", "Para que se dispersaran"], "", ""], ["¿Qué nos hace entender Éxodo?", "Que Dios salva a su pueblo para que su pueblo le sirva", ["Que Dios salva sin esperar nada", "Que la ley no importa", "Que Egipto era más fuerte"], "", ""], ["Según Génesis 12:2, ¿qué haría Dios de Abraham?", "Una nación grande", ["Un rey de Egipto", "Un juez de Israel", "Un sacerdote del templo"], "Génesis 12:2", ""], ["Según Génesis 45:5, ¿ , 7, 8, 9, 10, 11, 18, 23, 24, 25, 29, 31 y 34."}, "verses": [{"r": "Levítico 19:2", "t": "Habla a toda la congregación de los hijos de Israel, y diles: Santos seréis, porque santo soy yo Jehová vuestro Dios."}, {"r": "Números 6:24-26", "t": "Jehová te bendiga, y te guarde; Jehová haga resplandecer su rostro sobre ti, y tenga de ti misericordia; Jehová alce sobre ti su rostro, y ponga en ti paz."}, {"r": "Deuteronomio 6:5", "t": "Y amarás a Jehová tu Dios de todo tu corazón, y de toda tu alma, y con todas tus fuerzas."}, {"r": "Deuteronomio 31:6", "t": "Esforzaos y cobrad ánimo; no temáis, ni tengáis miedo de ellos, porque Jehová tu Dios es el que va contigo; no te dejará, ni te desamparará."}], "qs": [["¿Cuál es el tema de Levítico?", "Leyes de santidad", ["Principios", "Libertad bajo ley", "Repaso de la ley"], "", ""], ["¿De qué trata Levítico?", "De las leyes sobre las ofrendas y muchas otras leyes para el pueblo de Dios", ["Del viaje por el desierto", "De la conquista de Canaán", "De los reyes de Israel"], "", ""], ["¿Para quiénes era Levítico una instrucción especial?", "Para los sacerdotes, que guiaban al pueblo", ["Para los reyes", "Para los extranjeros", "Para los jueces"], "", ""], ["¿Qué nos hace ver Levítico?", "Que debemos ser un pueblo santo en todo", ["Que la santidad no importa", "Que solo los sacerdotes deben obedecer", "Que Dios cambia sus leyes"], "", ""], ["¿Cuál es el tema de Números?", "Fracaso en los viajes a Canaán", ["Leyes de santidad", "Principios", "Repaso de la ley"], "", ""], ["¿Qué cuenta Números?", "El viaje desde el monte Sinaí hasta la frontera de la tierra prometida", ["La conquista de Jericó", "El exilio en Babilonia", "La vida de los patriarcas"], "", ""], ["¿Por cuánto tiempo dieron vueltas los israelitas en el desierto?", "40 años", ["7 años", "70 años", "100 años"], "", ""], ["¿Cuál es el tema de Deuteronomio?", "Repaso de la ley", ["Leyes de santidad", "Libertad bajo ley", "Fracaso en los viajes a Canaán"], "", ""], ["¿Por qué  {"title": "Temas y lecturas: Job a Malaquías", "sub": "Poesía y profecía, libro por libro", "lessons": [{"title": "De Job a Malaquías", "intro": {"t": "Un repaso rápido de Job a Malaquías", "p": "En esta segunda parte repasamos de Job a Malaquías: los libros de la poesía y de la profecía. Las metas son las mismas: aprender el tema de cada libro, conocer su contenido en un resumen breve, leer más o menos la mitad de cada uno (verás los capítulos en cada lección) y aprender de memoria seis textos. Lo que importa es llegar directamente a la Biblia y oír a Dios mismo.\nLos seis textos: Salmo 100; Proverbios 9:10; Isaías 9:6; Lamentaciones 3:22-24; Ezequiel 33:11 y Daniel 4:35."}, "verses": [{"r": "Salmo 100:4", "t": "Entrad por sus puertas con acción de gracias, Por sus atrios con alabanza; Alabadle, bendecid su nombre."}, {"r": "Proverbios 9:10", "t": "El temor de Jehová es el principio de la sabiduría, Y el conocimiento del Santísimo es la inteligencia."}, {"r": "Isaías 9:6", "t": "Porque un niño nos es nacido, hijo nos es dado, y el principado sobre su hombro; y se llamará su nombre Admirable, Consejero, Dios Fuerte, Padre Eterno, Príncipe de Paz."}, {"r": "Lamentaciones 3:22-24", "t": "Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad. Mi porción es Jehová, dijo mi alma; por tanto, en él esperaré."}, {"r": "Ezequiel 33:11", "t": "Diles: Vivo yo, dice Jehová el Señor, que no quiero la muerte del impío, sino que se vuelva el impío de su camino, y que viva. Volveos, volveos de vuestros malos caminos; ¿por qué moriréis, oh casa de Israel?"}], "qs": [["¿Qué libros repasamos en esta segunda parte?", "De Job a Malaquías: la poesía y la profecía", ["De Génesis a Ester", "Los cuatro evangelios", "Las cartas de Pablo"], "", ""], ["¿Cuántos textos aprenderemos de memoria?", "Seis", ["Tres", "Diez", "Veinte"], "", ""], ["¿Qué es lo más importante de esta materia de Temas y Lecturas?" consuelo para los pocos fieles de Judá: Dios guardaría a los suyos.\nLecturas: Sofonías 1 y 3."}, "verses": [{"r": "Miqueas 6:8", "t": "Oh hombre, él te ha declarado lo que es bueno, y qué pide Jehová de ti: solamente hacer justicia, y amar misericordia, y humillarte ante tu Dios."}, {"r": "Nahum 1:7", "t": "Jehová es bueno, fortaleza en el día de la angustia; y conoce a los que en él confían."}, {"r": "Habacuc 2:4", "t": "He aquí que aquel cuya alma no es recta, se enorgullece; mas el justo por su fe vivirá."}], "qs": [["¿Cuál es el tema de Miqueas?", "Regaño y restauración", ["La ruina de Nínive", "Diálogos sobre los juicios de Dios", "El día de la ira de Jehová"], "", ""], ["¿Cuándo profetizó Miqueas?", "Más o menos en el mismo tiempo que Isaías", ["En el cautiverio", "Después del cautiverio", "En tiempos de Jesús"], "", ""], ["¿Qué anunciaba Miqueas, como otros profetas?", "Salvación mediante el Mesías", ["Que no habría castigo", "La caída de Egipto", "Un nuevo templo de oro"], "", ""], ["¿Cuál es el tema de Nahum?", "La ruina de Nínive", ["Regaño y restauración", "Diálogos sobre los juicios de Dios", "El día de la ira de Jehová"], "", ""], ["¿Qué hizo Nínive después del arrepentimiento bajo Jonás?", "Se rebeló otra vez contra Dios", ["Siguió a Dios para siempre", "Conquistó a Egipto", "Desapareció sola"], "", ""], ["¿Cuál es el tema de Habacuc?", "Diálogos sobre los juicios de Dios", ["La ruina de Nínive", "Regaño y restauración", "El día de la ira de Jehová"], "", ""], ["¿A quiénes enviaría Dios para castigar a Judá, según Habacuc?", "A los caldeos (babilonios)", ["A los egipcios", "A los filisteos", "A los romanos"], "", ""], ["¿Cuál es el tema de Sofonías?", "El día de la ira de Jehová", ["Diálogos sobre los juicios de Dios", "La ruina de Nínive", "Regaño y restauración"], "", ""], ["¿Qué habla Sofonías para los pocos fieles de Judá?", "Consuelo: Dios guardaría a los suyos", ["Un castigo sin remedio", "Una orden de huir", "Una promesa de riquezas"], "", ""], ["Según Miqueas 6:8, ¿qué pide Jehová de ti?", "Hacer justicia, amar misericordia y humillarte ante tu Dios", ["Ofrecer más holocaustos", "Edificar un templo", "Ayunar cuarenta días"], "Miqueas 6:8", ""], ["Según Nahum 1:7, ¿cómo es Jehová en el día de la angustia?", "Bueno, una fortaleza", ["Lejano", "Silencioso", "Terrible"], "Nahum 1:7", ""], ["Según Habacuc 2:4, ¿cómo vivirá el justo?", "Por su fe", ["Por sus obras", "Por su fuerza", "Por sus riquezas"], "Habacuc 2:4", ""]], "cx": [{"k": "match", "prompt": "Une cada libro con su tema", "pairs": [["Miqueas", "Regaño y restauración"], ["Nahum", "La ruina de Nínive"], ["Habacuc", "Diálogos sobre los juicios de Dios"], ["Sofonías", "El día de la ira de Jehová"]], "done": "Cada libro quedó con su tema."}], "max": 12}, {"title": "Hageo, Zacarías y Malaquías", "intro": {"t": "Hageo, Zacarías y Malaquías", "p": "HAGEO — Llamamiento a edificar el templo. Vivió después de los setenta años de cautiverio, cuando Dios hizo que unos judíos volvieran a la tierra prometida. El pueblo debía edificar de nuevo el templo, pero no obedecía; Hageo logró animarlo y prometió la ayuda de Dios.\nLecturas: todo el libro de Hageo.\nZACARÍAS — El lugar del pueblo de Dios en el reino de Dios. Vivió después del cautiverio y también animó al pueblo a edificar el templo; habló para fortalecerlo y para advertirle sobre su pecado. Como Ezequiel y Daniel, recibía visiones, que daban a entender la importancia de la nación de Dios para establecer su reino.\nLecturas: Zacarías 1 al 4, 8, 9, 13 y 14.\nMALAQUÍAS — Las últimas advertencias proféticas. Vivió después del cautiverio, unos cuatrocientos años antes del nacimiento de Cristo. El pueblo seguía en su pecado, y el profeta dio las últimas palabras de Dios antes de la venida del Salvador. Se vale de preguntas para hacer reflexionar al pueblo, y hay consuelo para los fieles.\nLecturas: Malaquías 1 al 4.\nEn resumen, las cuatro divisiones del Antiguo Testamento son: la Ley, la Historia, la Poesía y la Profecía."}, "verses": [{"r": "Hageo 2:9", "t": "La gloria postrera de esta casa será mayor que la primera, ha dicho Jehová de los ejércitos; y daré paz en este lugar, dice Jehová de los ejércitos."}, {"r": "Zacarías 4:6", "t": "Entonces respondió y me habló diciendo: Esta es palabra de Jehová a Zorobabel, que dice: No con ejército, ni con fuerza, sino con mi Espíritu, ha dicho Jehová de los ejércitos."}, {"r": "Zacarías 9:9", "t": "Alégrate mucho, hija de Sion; da voces de júbilo, hija de Jerusalén; he aquí tu rey vendrá a ti, justo y salvador, humilde, y cabalgando sobre un asno, sobre un pollino hijo de asna."}, {"r": "Malaquías 3:1", "t": "He aquí, yo envío mi mensajero, el cual preparará el camino delante de mí; y vendrá súbitamente a su templo el Señor a quien vosotros buscáis, y el ángel del pacto, a quien deseáis vosotros. He aquí viene, ha dicho Jehová de los ejércitos."}], "qs": [["¿Cuál es el tema de Hageo?", "Llamamiento a edificar el templo", ["El lugar del pueblo de Dios en el reino de Dios", "Las últimas advertencias proféticas", "La ruina de Nínive"], "", ""], ["¿Cuándo vivió Hageo?", "Después de los setenta años de cautiverio", ["Antes del cautiverio", "En tiempos de los jueces", "En tiempos de Moisés"], "", ""], ["¿Qué debía hacer el pueblo, según Hageo?", "Edificar de nuevo el templo", ["Conquistar Canaán", "Salir de Egipto", "Elegir un rey"], "", ""], ["¿Cuál es el tema de Zacarías?", "El lugar del pueblo de Dios en el reino de Dios", ["Llamamiento a edificar el templo", "Las últimas advertencias proféticas", "Regaño y restauración"], "", ""], ["¿Qué recibía Zacarías, como Ezequiel y Daniel?", "Visiones", ["Cartas de los reyes", "Una nueva ley de piedra", "Una corona"], "", ""], ["¿Cuál es el tema de Malaquías?", "Las últimas advertencias proféticas", ["Llamamiento a edificar el templo", "El lugar del pueblo de Dios en el reino de Dios", "Condenación sobre Israel"], "", ""], ["¿Cuándo vivió Malaquías?", "Unos cuatrocientos años antes del nacim  {"title": "Temas y lecturas: Nuevo Testamento", "sub": "El tema y las lecturas clave de cada libro", "lessons": [{"title": "Leer todo el Nuevo Testamento", "intro": {"t": "Un repaso rápido del Nuevo Testamento", "p": "Esta materia da un repaso rápido al Nuevo Testamento. La Biblia es la Palabra de Dios y es importantísimo leerla toda: toda la Escritura es inspirada por Dios y útil para que lleguemos a ser enteramente preparados para toda buena obra (2 Timoteo 3:16-17). Cada parte ofrece una ayuda única para conocer y entender la voluntad de Dios; no leerla toda implica tener deficiencias en lo que Dios quiere que sepamos.\nLas metas: aprender de memoria el tema de cada libro; conocer su contenido en un resumen breve; leer más o menos la mitad de cada libro (en cada lección verás los capítulos); aprender de memoria las tres secciones del Nuevo Testamento; y aprender de memoria doce versículos. Todo el propósito es llevarnos directamente a la Biblia y oír la Palabra de Dios mismo.\nLas tres secciones: Los Libros de Historia (los cuatro Evangelios y Hechos, unidos aquí en una sola división), Las cartas de los apóstoles y El libro de profecía.\nLos doce versículos: Mateo 28:18-20; Marcos 10:45; Lucas 19:10; Juan 20:30-31; Hechos 1:8; Romanos 1:16-17; 1 Corintios 10:31; 2 Corintios 4:5; Gálatas 5:1; Efesios 1:11-12; Filipenses 1:21 y Colosenses 2:9-10."}, "verses": [{"r": "Mateo 28:18-20", "t": "Y Jesús se acercó y les habló diciendo: Toda potestad me es dada en el cielo y en la tierra. Por tanto, id, y haced discípulos a todas las naciones, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo; enseñándoles que guarden todas las cosas que os he mandado; y he aquí yo estoy con vosotros todos los días, hasta el fin del mundo. Amén."}, {"r": "Juan 20:30-31", "t": "Hizo además Jesús muchas otras señales en presencia de sus discípulos, las cuales no están escritas en este libro. Pero éstas se han escrito para que creáis que Jesús es el Cristo, el Hijo de Dios, y para que creyendo, tengáis vida en su nombre."}, {"r": "Romanos 1:16-17", "t": "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego. Porque en el evangelio la justicia de Dios se revela por fe y para fe, como está escrito: Mas el justo por la fe vivirá."}, {"r": "1 Corintios 10:31", "t": "Si, pues, coméis o bebéis, o hacéis otra cosa, hacedlo todo para la gloria de Dios."}], "qs": [["¿Cuál es el propósito de esta materia?", "Dar un repaso rápido al Nuevo Testamento", ["Reemplazar la lectura de la Biblia", "Estudiar solo el Antiguo Testamento", "Leer todo el Nuevo Testamento en un día"], "", ""], ["¿Qué implica no leer toda la Biblia?", "Tener deficiencias en cuanto a lo que Dios quiere que sepamos", ["Que no pasa nada", "Que sobra tiempo", "Que la Biblia pierde valor"], "", ""], ["¿Cuánto de cada libro vamos a leer en esta materia?", "Más o menos la mitad", ["Todo el libro", "Solo el primer capítulo", "Nada"], "", ""], ["¿A qué quiere llevarnos todo este curso?", "Directamente a la Biblia, para oír la Palabra de Dios mismo", ["A depender de los libros de los hombres", "A memorizar sin leer", "A estudiar otros libros"], "", ""], ["¿Cuáles son las tres secciones del Nuevo Testamento en esta materia?", "Los Libros de Historia, las cartas de los apóstoles y el libro de profecía", ["La Ley, la Historia y la Profecía", "Los Evangelios, Hechos y Apocalipsis", "Las cartas de Pablo, de Pedro y de Juan"], "", ""], ["¿Qué libros forman «Los Libros de Historia» en esta materia?", "Los cuatro Evangelios y Hechos", ["Solo los cuatro Evangelios", "Hechos y Romanos", "Mateo y Apocalipsis"], "", ""], ["¿Cuál es el libro de profecía del Nuevo Testamento?", "Apocalipsis", ["Hechos", "Romanos", "Hebreos"], "", ""], ["¿Cuántos versículos aprenderemos de memoria en esta materia?", "Doce", ["Seis", "Tres", "Veinte"], "", ""], ["Según Mateo 28:18, ¿qué dijo Jesús que le fue dado en el cielo y en la tierra?", "Toda potestad", ["Un reino terrenal", "Una gran riqueza", "Un nuevo nombre"], "Mateo 28:18-20", ""], ["Según Marcos 10:45, ¿a qué no vino el Hijo del Hombre?", "A ser servido, sino a servir", ["A ser juez, sino a ser rey", "A ser rico, sino a ser pobre", "A ser conocido, sino a ser oculto"], "Marcos 10:45", ""], ["Según Lucas 19:10, ¿a qué vino el Hijo del Hombre?", "A buscar y salvar lo que se había perdido", ["A fundar un reino terrenal", "A cobrar tributo", "A juzgar a Israel"], "Lucas 19:10", ""], ["Según Juan 20:30-31, ¿para qué se han escrito estas señales?", "Para que creamos que Jesús es el Cristo, el Hijo de Dios, y tengamos vida en su nombre", ["Para que conozcamos la genealogía de los reyes", "Para que guardemos las fiestas", "Para que recordemos las leyes"], "Juan 20:30-31", ""], ["Según Hechos 1:8, ¿qué recibirían los discípulos cuando viniera sobre ellos el Espíritu Santo?", "Poder, para ser testigos de Jesús", ["Riquezas", "Descanso", "Un reino terrenal"], "Hechos 1:8", ""], ["Según Romanos 1:16, ¿qué es el evangelio?", "Poder de Dios para salvación a todo aquel que cree", ["Una ley antigua", "Una promesa solo para los judíos", "Un mensaje para los sabios"], "Romanos 1:16-17", ""], ["Según 1 Corintios 10:31, ¿para qué debemos hacerlo todo?", "Para la gloria de Dios", ["Para el bien de la ciudad", "Para ganar riquezas", "Para ser vistos"], "1 Corintios 10:31", ""], ["Según Filipenses 1:21, ¿qué es para Pablo el vivir?", "Cristo", ["Ganancia", "Descanso", "Gloria"], "Filipenses 1:21", ""]], "cx": [{"k": "match", "prompt": "Une cada cita con su idea", "pairs": [["Mateo 28:18-20", "Id y haced discípulos a todas las naciones"], ["Juan 20:30-31", "Creer que Jesús es el Cristo y tener vida"], ["Romanos 1:16-17", "El evangelio es poder de Dios para salvación"], ["1 Corintios 10:31", "Hacedlo todo para la gloria de Dios"]], "done": "Cada cita quedó con su idea."}, {"k": "order", "prompt": "Ordena las tres secciones del Nuevo Testamento", "chunks": [["Los Libros de Historia", "Las cartas de los apóstoles", "El libro de profecía"]]}], "max": 12}, {"title": "Mateo y Marcos", "intro": {"t": "Mateo y Marcos", "p": "Cada evangelio presenta a Jesús desde cierto punto de vista; así tenemos un cuadro completo de lo que Cristo hizo y dijo.\nMATEO — El evangelio del Rey. Mateo quería convencer a sus lectores de que Jesús de Nazaret era el rey prometido en el Antiguo Testamento, que salvaría a su pueblo escogido. Cristo cumplió las profecías. Según Mateo, Jesús es el Rey poderoso y victorioso que dio su vida en rescate por su pueblo y resucitó; ahora tiene toda autoridad en el cielo y en la tierra.\nLecturas: Mateo 1:18-25 y los capítulos 2, 3, 4, 5, 8, 10, 11, 13, 15, 21, 24, 26, 27 y 28.\nMARCOS — Jesucristo, el poderoso Siervo del Señor. Presenta a Cristo obrando y enseñando con gran poder para ayudar y salvar a su pueblo; lo vemos sirviendo. Pero este siervo del Señor es también el Hijo de Dios, y como tal llama a la fe en él y al arrepentimiento hacia Dios.\nLecturas: Marcos 1, 2, 9, 10, 12, 14, 15 y 16."}, "verses": [{"r": "Mateo 2:2", "t": "diciendo: ¿Dónde está el rey de los judíos, que ha nacido? Porque su estrella hemos visto en el oriente, y venimos a adorarle."}, {"r": "Mateo 21:5", "t": "Decid a la hija de Sion: He aquí, tu Rey viene a ti, Manso, y sentado sobre una asna, Sobre un pollino, hijo de animal de carga."}, {"r": "Marcos 9:35", "t": "Entonces él se sentó y llamó a los doce, y les dijo: Si alguno quiere ser el primero, será el postrero de todos, y el servidor de todos."}, {"r": "Marcos 14:36", "t": "Y decía: Abba, Padre, todas las cosas son posibles para ti; aparta de mí esta copa; mas no lo que yo quiero, sino lo que tú."}], "qs": [["¿Qué evangelio presenta a Jesús como el Rey prometido en el Antiguo Testamento?", "Mateo", ["Marcos", "Lucas", "Juan"], "", ""], ["¿Cuál es el tema de Mateo?", "El evangelio del Rey", ["El evangelio explicado", "Jesucristo, supremo y suficiente", "Un cuadro del pe risto crucificado, y no quiere que caigan en la esclavitud de buscar la salvación por sus propias obras.\nLecturas: Gálatas 1, 3 y 5.\nEFESIOS — Las riquezas y la conducta de la iglesia, el cuerpo de Cristo. Es una carta de alabanza a Dios por sus grandes obras de salvación: ha salvado tanto a los gentiles como a los judíos y los ha unido en un solo cuerpo, la iglesia cristiana, de la cual Cristo es la cabeza. Por medio de la iglesia, Dios cumple ahora grandes propósitos de amor y de soberanía en el mundo. Pablo explica los deberes de los miembros de la iglesia.\nLecturas: toda la carta.\nFILIPENSES — El verdadero gozo cristiano. Es una nota de agradecimiento por una ofrenda que le habían enviado. En amor, Pablo habla de asuntos personales, sus planes y su situación, trata ciertos problemas pequeños y anima a vivir gozosos en toda circunstancia.\nLecturas: toda la carta.\nCOLOSENSES — Jesucristo, supremo y suficiente. Pablo corrige errores en la iglesia de Colosas: los creyentes no querían contentarse con solo creer en Cristo y buscaban su salvación más allá de él. Pablo explica otra vez quién es Cristo: el Creador de todo y un Salvador perfecto. En Cristo el creyente tiene todo; no debe buscar más allá.\nLecturas: toda la carta."}, "verses": [{"r": "Gálatas 2:20", "t": "Con Cristo estoy juntamente crucificado, y ya no vivo yo, mas vive Cristo en mí; y lo que ahora vivo en la carne, lo vivo en la fe del Hijo de Dios, el cual me amó y se entregó a sí mismo por mí."}, {"r": "Gálatas 5:1", "t": "Estad, pues, firmes en la libertad con que Cristo nos hizo libres, y no estéis otra vez sujetos al yugo de esclavitud."}, {"r": "Efesios 1:11-12", "t": "En él asimismo tuvimos herencia, habiendo sido predestinados conforme al propósito del que hace todas las cosas según el designio de su voluntad, a fin de que seamos para alabanza de su gloria, nosotros los que primeramente esperábamos en Cristo."}, {"r": "Filipenses 4:4", "t": "Regocijaos en el Señor siempre. Otra vez digo: ¡R  {title:'La creación',sub:'Génesis 1–2',lessons:[
  {title:'Principio y luz',verses:[
    {r:'Génesis 1:1',t:"En el principio creó Dios los cielos y la tierra."},
    {r:'Génesis 1:2',t:"Y la tierra estaba desordenada y vacía, y las tinieblas estaban sobre la faz del abismo, y el Espíritu de Dios se movía sobre la faz de las aguas."},
    {r:'Génesis 1:3',t:"Y dijo Dios: Sea la luz; y fue la luz."},
    {r:'Génesis 1:4',t:"Y vio Dios que la luz era buena; y separó Dios la luz de las tinieblas."},
    {r:'Génesis 1:5',t:"Y llamó Dios a la luz Día, y a las tinieblas llamó Noche. Y fue la tarde y la mañana un día."}],
   qs:[
    ["¿Qué creó Dios en el principio?","Los cielos y la tierra",["La luz y las tinieblas","Al hombre","Los peces del mar"],"Génesis 1:1"],
    ["¿Cómo llamó Dios a la luz?","Día",["Noche","Tarde","Mañana"],"Génesis 1:5"]]},
  {title:'Cielos, tierra y mares',verses:[
    {r:'Génesis 1:6',t:"Luego dijo Dios: Haya expansión en medio de las aguas, y separe las aguas de las aguas."},
    {r:'Génesis 1:8',t:"Y llamó Dios a la expansión Cielos. Y fue la tarde y la mañana el día segundo."},
    {r:'Génesis 1:9',t:"Dijo también Dios: Júntense las aguas que están debajo de los cielos en un lugar, y descúbrase lo seco. Y fue así."},
    {r:'Génesis 1:10',t:"Y llamó Dios a lo seco Tierra, y a la reunión de las aguas llamó Mares. Y vio Dios que era bueno."},
    {r:'Génesis 1:11',t:"Después dijo Dios: Produzca la tierra hierba verde, hierba que dé semilla; árbol de fruto que dé fruto según su género, que su semilla esté en él, sobre la tierra. Y fue así."}],
   qs:[
    ["¿Cómo llamó Dios a la expansión?","Cielos",["Aguas","Tierra","Mares"],"Génesis 1:8"],
    ["¿Cómo llamó Dios a lo seco?","Tierra",["Cielos","Mares","Expansión"],"Génesis 1:10"],
    ["Según Génesis 1:11, ¿qué ordenó Dios que produjera la tierra?","Hierba verde y árboles de fruto",["Aves y peces","Estrellas y lumbreras","Bestias y serpientes"],"Génesis 1:11"]]},
  {title:'Lumbreras, aves y peces',verses:[
    {r:'Génesis 1:14',t:"Dijo luego Dios: Haya lumbreras en la expansión de los cielos para separar el día de la noche; y sirvan de señales para las estaciones, para días y años,"},
    {r:'Génesis 1:16',t:"E hizo Dios las dos grandes lumbreras; la lumbrera mayor para que señorease en el día, y la lumbrera menor para que señorease en la noche; hizo también las estrellas."},
    {r:'Génesis 1:20',t:"Dijo Dios: Produzcan las aguas seres vivientes, y aves que vuelen sobre la tierra, en la abierta expansión de los cielos."},
    {r:'Génesis 1:21',t:"Y creó Dios los grandes monstruos marinos, y todo ser viviente que se mueve, que las aguas produjeron según su género, y toda ave alada según su especie. Y vio Dios que era bueno."},
    {r:'Génesis 1:22',t:"Y Dios los bendijo, diciendo: Fructificad y multiplicaos, y llenad las aguas en los mares, y multiplíquense las aves en la tierra."}],
   qs:[
    ["Según Génesis 1:14, ¿para qué dijo Dios que hubiera lumbreras en la expansión?","Para separar el día de la noche",["Para dar calor a los animales","Para hacer crecer las plantas","Para marcar el camino de los ángeles"],"Génesis 1:14"],
    ["¿Qué hizo Dios además de las dos grandes lumbreras?","Las estrellas",["Las nubes","Los ríos","Los montes"],"Génesis 1:16"],
    ["¿Qué les dijo Dios a los seres vivientes de las aguas y del cielo al bendecirlos?","Fructificad y multiplicaos",["Alabadme y servidme","Guardad mi ley","Señoread sobre el hombre"],"Génesis 1:22"]]},
  {title:'A imagen de Dios',verses:[
    {r:'Génesis 1:26',t:"Entonces dijo Dios: Hagamos al hombre a nuestra imagen, conforme a nuestra semejanza; y señoree en los peces del mar, en las aves de los cielos, en las bestias, en toda la tierra, y en todo animal que se arrastra sobre la tierra."},
    {r:'Génesis 1:27',t:"Y creó Dios al hombre a su imagen, a imagen de Dios lo creó; varón y hembra los creó."},
    {r:'Génesis 1:28',t:"Y los bendijo Dios, y les dijo: Fructificad y multiplicaos; llenad la tierra, y sojuzgadla, y señoread en los peces del mar, en las aves de los cielos, y en todas las bestias que se mueven sobre la tierra."},
    {r:'Génesis 1:29',t:"Y dijo Dios: He aquí que os he dado toda planta que da semilla, que está sobre toda la tierra, y todo árbol en que hay fruto y que da semilla; os serán para comer."}],
   qs:[
    ["¿A imagen de quién creó Dios al hombre?","A imagen de Dios",["A imagen de los ángeles","A imagen de la tierra","A imagen de los animales"],"Génesis 1:27","Ser imagen de Dios da al ser humano un valor único. Por eso la vida humana es sagrada (Génesis 9:6)."],
    ["Según Génesis 1:26, ¿sobre quiénes dijo Dios que señoreara el hombre?","Sobre los peces, las aves, las bestias y todo animal",["Sobre los ángeles","Sobre otros hombres","Sobre las estrellas"],"Génesis 1:26"],
    ["Según Génesis 1:28, ¿qué les dijo Dios al bendecirlos?","Fructificad y multiplicaos; llenad la tierra",["Guardad el huerto","Edificad una ciudad","Apartaos de los animales"],"Génesis 1:28"]]},
  {title:'El hombre y el reposo',verses:[

    {r:'Génesis 2:2',t:"Y acabó Dios en el día séptimo la obra que hizo; y reposó el día séptimo de toda la obra que hizo."},
    {r:'Génesis 2:3',t:"Y bendijo Dios al día séptimo, y lo santificó, porque en él reposó de toda la obra que había hecho en la creación."},
    {r:'Génesis 2:7',t:"Entonces Jehová Dios formó al hombre del polvo de la tierra, y sopló en su nariz aliento de vida, y fue el hombre un ser viviente."}],

    ["¿Cómo vio Dios todo lo que había hecho?","Bueno en gran manera",["Perfecto y sin cambio","Digno de reposo","Grande y santo"],"Génesis 1:31"]]},
  {title:'El huerto del Edén',verses:[

   qs:[

    ["Según Génesis 2:17, ¿qué pasaría el día que el hombre comiera de ese árbol?","Ciertamente moriría",["Se le abrirían los ojos","Sería como Dios","Sería expulsado al instante"],"Génesis 2:16-17"]]},
  {title:'La mujer y el matrimonio',verses:[

 {title:'La caída',sub:'Génesis 3 y sus consecuencias',lessons:[
  {title:'La serpiente y la pregunta',verses:[
    {r:'Génesis 3:1',t:"Pero la serpiente era astuta, más que todos los animales del campo que Jehová Dios había hecho; la cual dijo a la mujer: ¿Conque Dios os ha dicho: No comáis de todo árbol del huerto?"},
    {r:'Génesis 3:2-3',t:"Y la mujer respondió a la serpiente: Del fruto de los árboles del huerto podemos comer; pero del fruto del árbol que está en medio del huerto dijo Dios: No comeréis de él, ni le tocaréis, para que no muráis."},
    {r:'Génesis 3:4-5',t:"Entonces la serpiente dijo a la mujer: No moriréis; sino que sabe Dios que el día que comáis de él, serán abiertos vuestros ojos, y seréis como Dios, sabiendo el bien y el mal."}],

    ["Según Génesis 3:3, ¿qué pasaría si comían del árbol que estaba en medio del huerto?","Morirían",["Serían expulsados","Serían como Dios","Perderían el huerto"],"Génesis 3:2-3"],
    ["Según Génesis 3:4, ¿qué le dijo la serpiente a la mujer?","No moriréis",["Moriréis ese mismo día","Dios os ama","Comed y viviréis para siempre"],"Génesis 3:4-5"],
    ["Según Génesis 3:5, ¿qué prometió la serpiente que serían?","Como Dios, sabiendo el bien y el mal",["Reyes sobre toda la tierra","Inmortales en el huerto","Ángeles servidores de Dios"],"Génesis 3:4-5"]]},
  {title:'Comieron',verses:[
    {r:'Génesis 3:6',t:"Y vio la mujer que el árbol era bueno para comer, y que era agradable a los ojos, y árbol codiciable para alcanzar la sabiduría; y tomó de su fruto, y comió; y dio también a su marido, el cual comió así como ella."},
    {r:'Génesis 3:7',t:"Entonces fueron abiertos los ojos de ambos, y conocieron que estaban desnudos; entonces cosieron hojas de higuera, y se hicieron delantales."},
    {r:'Génesis 3:8',t:"Y oyeron la voz de Jehová Dios que se paseaba en el huerto, al aire del día; y el hombre y su mujer se escondieron de la presencia de Jehová Dios entre los árboles del huerto."}],
   qs:[

    ["Según Génesis 3:7, ¿qué conocieron cuando fueron abiertos sus ojos?","Que estaban desnudos",["Que Dios los había abandonado","Que habían sido engañados","Que el árbol era bueno"],"Génesis 3:7"],
    ["Según Génesis 3:7, ¿qué se hicieron con hojas de higuera?","Delantales",["Techos","Coronas","Cestas"],"Génesis 3:7"],
    ["Según Génesis 3:8, ¿qué hicieron el hombre y su mujer al oír la voz de Jehová Dios?","Se escondieron entre los árboles",["Corrieron a su encuentro","Se postraron a orar","Salieron del huerto"],"Génesis 3:8"]]},
  {title:'¿Dónde estás tú?',verses:[
    {r:'Génesis 3:9',t:"Mas Jehová Dios llamó al hombre, y le dijo: ¿Dónde estás tú?"},
    {r:'Génesis 3:10',t:"Y él respondió: Oí tu voz en el huerto, y tuve miedo, porque estaba desnudo; y me escondí."},
    {r:'Génesis 3:11',t:"Y Dios le dijo: ¿Quién te enseñó que estabas desnudo? ¿Has comido del árbol de que yo te mandé no comieses?"},
    {r:'Génesis 3:12',t:"Y el hombre respondió: La mujer que me diste por compañera me dio del árbol, y yo comí."},
    {r:'Génesis 3:13',t:"Entonces Jehová Dios dijo a la mujer: ¿Qué es lo que has hecho? Y dijo la mujer: La serpiente me engañó, y comí."}],
   qs:[
    ["¿Qué le preguntó Jehová Dios al hombre en Génesis 3:9?","¿Dónde estás tú?",["¿Qué has hecho?","¿Por qué te escondes?","¿Quién te enseñó?"],"Génesis 3:9"],
    ["Según Génesis 3:10, ¿por qué tuvo miedo el hombre?","Porque estaba desnudo",["Porque oyó un trueno","Porque vio la espada encendida","Porque vio a la serpiente"],"Génesis 3:10"],
    ["¿A quién culpó el hombre en Génesis 3:12?","A la mujer que Dios le dio por compañera",["A la serpiente","A sí mismo","A los ángeles"],"Génesis 3:12","Nadie asume la culpa: el hombre señala a la mujer, y la mujer a la serpiente."],
    ["¿A quién culpó la mujer en Génesis 3:13?","A la serpiente",["Al hombre","A sí misma","A Dios"],"Génesis 3:13"]]},
  {title:'Las consecuencias',verses:[
    {r:'Génesis 3:14',t:"Y Jehová Dios dijo a la serpiente: Por cuanto esto hiciste, maldita serás entre todas las bestias y entre todos los animales del campo; sobre tu pecho andarás, y polvo comerás todos los días de tu vida."},
    {r:'Génesis 3:16',t:"A la mujer dijo: Multiplicaré en gran manera los dolores en tus preñeces; con dolor darás a luz los hijos; y tu deseo será para tu marido, y él se enseñoreará de ti."},
    {r:'Génesis 3:17',t:"Y al hombre dijo: Por cuanto obedeciste a la voz de tu mujer, y comiste del árbol de que te mandé diciendo: No comerás de él; maldita será la tierra por tu causa; con dolor comerás de ella todos los días de tu vida."},
    {r:'Génesis 3:19',t:"Con el sudor de tu rostro comerás el pan hasta que vuelvas a la tierra, porque de ella fuiste tomado; pues polvo eres, y al polvo volverás."}],
   qs:[
    ["Según Génesis 3:14, ¿sobre qué andaría la serpiente?","Sobre su pecho",["Sobre la tierra seca","Sobre sus pies","Sobre las aguas"],"Génesis 3:14"],
    ["Según Génesis 3:17, ¿qué fue maldecido por causa del hombre?","La tierra",["El huerto","El mar","El árbol"],"Génesis 3:17"],

    ["Según Génesis 3:19, ¿a qué volvería el hombre?","Al polvo",["Al huerto","Al mar","Al cielo"],"Génesis 3:19"]]},
  {title:'La promesa y la gracia',verses:[

    ["¿Qué nombre puso Adán a su mujer, y por qué?","Eva, por ser madre de todos los vivientes",["Sara, por ser madre de naciones","Ana, por ser sierva del Señor","Eva, por ser la primera en pecar"],"Génesis 3:20"],
    ["Según Génesis 3:21, ¿qué hizo Jehová Dios por el hombre y su mujer?","Les hizo túnicas de pieles y los vistió",["Los dejó desnudos","Les dio hojas de higuera","Les dio un manto de lino"],"Génesis 3:21","Dios los cubre: sigue cuidando de ellos aun después de la caída."]]},
  {title:'Expulsados del huerto',verses:[

    {r:'Génesis 3:23',t:"Y lo sacó Jehová del huerto del Edén, para que labrase la tierra de que fue tomado."},
    {r:'Génesis 3:24',t:"Echó, pues, fuera al hombre, y puso al oriente del huerto de Edén querubines, y una espada encendida que se revolvía por todos lados, para guardar el camino del árbol de la vida."}],
   qs:[

    ["Según Génesis 3:24, ¿qué puso Dios al oriente del huerto?","Querubines y una espada encendida",["Un muro de piedra","Un río de fuego","Dos ángeles con trompetas"],"Génesis 3:24"],
    ["Según Génesis 3:24, ¿qué debían guardar los querubines y la espada?","El camino del árbol de la vida",["El árbol de la ciencia del bien y del mal","La puerta del huerto","La tierra de Edén"],"Génesis 3:24"]]},
  {title:'El primer y el postrer Adán',verses:[

 {title:'Los Diez Mandamientos',sub:'Éxodo 20',lessons:[
  {title:'Primeros mandamientos',verses:[
    {r:'Éxodo 20:2',t:"Yo soy Jehová tu Dios, que te saqué de la tierra de Egipto, de casa de servidumbre."},
    {r:'Éxodo 20:3',t:"No tendrás dioses ajenos delante de mí."},
    {r:'Éxodo 20:7',t:"No tomarás el nombre de Jehová tu Dios en vano; porque no dará por inocente Jehová al que tomare su nombre en vano."},
    {r:'Éxodo 20:8',t:"Acuérdate del día de reposo para santificarlo."}],
   qs:[
    ["¿De dónde sacó Jehová al pueblo?","De la tierra de Egipto",["De Babilonia","De Canaán","Del desierto"],"Éxodo 20:2"],
    ["¿Qué dice el mandamiento que no se debe tomar en vano?","El nombre de Jehová tu Dios",["El día de reposo","La casa del prójimo","El pan de cada día"],"Éxodo 20:7"]]},
  {title:'Hacia el prójimo',verses:[
    {r:'Éxodo 20:12',t:"Honra a tu padre y a tu madre, para que tus días se alarguen en la tierra que Jehová tu Dios te da."},
    {r:'Éxodo 20:13',t:"No matarás."},
    {r:'Éxodo 20:14',t:"No cometerás adulterio."},
    {r:'Éxodo 20:15',t:"No hurtarás."},
    {r:'Éxodo 20:16',t:"No hablarás contra tu prójimo falso testimonio."},
    {r:'Éxodo 20:17',t:"No codiciarás la casa de tu prójimo, no codiciarás la mujer de tu prójimo, ni su siervo, ni su criada, ni su buey, ni su asno, ni cosa alguna de tu prójimo."}],
   qs:[
    ["¿Qué mandamiento va seguido de «para que tus días se alarguen»?","Honra a tu padre y a tu madre",["No hurtarás","No matarás","No cometerás adulterio"],"Éxodo 20:12"],
    ["¿Qué no se debe hablar contra el prójimo?","Falso testimonio",["Alabanza","Consejos","Oraciones"],"Éxodo 20:16"]]},
  {title:'Jesús y el homicidio',verses:[
    {r:'Mateo 5:17',t:"No penséis que he venido para abrogar la ley o los profetas; no he venido para abrogar, sino para cumplir."},
    {r:'Mateo 5:21',t:"Oísteis que fue dicho a los antiguos: No matarás; y cualquiera que matare será culpable de juicio."},
    {r:'Mateo 5:22',t:"Pero yo os digo que cualquiera que se enoje contra su hermano, será culpable de juicio; y cualquiera que diga: Necio, a su hermano, será culpable ante el concilio; y cualquiera que le diga: Fatuo, quedará expuesto al infierno de fuego."},
    {r:'1 Juan 3:15',t:"Todo aquel que aborrece a su hermano es homicida; y sabéis que ningún homicida tiene vida eterna permanente en él."}],
   qs:[
    ["Según Mateo 5:17, ¿para qué dijo Jesús que había venido, respecto a la ley y los profetas?","Para cumplir",["Para abrogar","Para reemplazar","Para olvidar"],"Mateo 5:17"],
    ["Según Mateo 5:21, ¿qué mandamiento cita Jesús?","No matarás",["No hurtarás","No cometerás adulterio","No codiciarás"],"Mateo 5:21"],
    ["Según Mateo 5:22, ¿quién será culpable de juicio?","Cualquiera que se enoje contra su hermano",["Solo el que mate con la mano","Solo el que robe","Solo el que mienta"],"Mateo 5:22","Jesús lleva el mandamiento hasta el corazón: el enojo y el desprecio ya son pecado ante Dios, no solo el acto de matar."],
    ["Según 1 Juan 3:15, ¿quién es homicida?","Todo aquel que aborrece a su hermano",["Solo quien hiere a otro","Quien discute con su hermano","Quien se aleja de su hermano"],"1 Juan 3:15"],
    ["Éxodo 20:13 dice «No matarás». ¿Qué muestra Jesús sobre este mandamiento?","Que alcanza también al enojo y al desprecio del corazón",["Que ya no está vigente","Que solo aplica a los jueces","Que solo aplica dentro de Israel"],"Éxodo 20:13"]]},
  {title:'Jesús y el adulterio',verses:[
    {r:'Mateo 5:27',t:"Oísteis que fue dicho: No cometerás adulterio."},
    {r:'Mateo 5:28',t:"Pero yo os digo que cualquiera que mira a una mujer para codiciarla, ya adulteró con ella en su corazón."},
    {r:'Mateo 5:29',t:"Por tanto, si tu ojo derecho te es ocasión de caer, sácalo, y échalo de ti; pues mejor te es que se pierda uno de tus miembros, y no que todo tu cuerpo sea echado al infierno."},
    {r:'Mateo 15:19',t:"Porque del corazón salen los malos pensamientos, los homicidios, los adulterios, las fornicaciones, los hurtos, los falsos testimonios, las blasfemias."}],
   qs:[
    ["Según Mateo 5:27, ¿qué mandamiento cita Jesús?","No cometerás adulterio",["No matarás","No hurtarás","No codiciarás"],"Mateo 5:27"],
    ["Según Mateo 5:28, ¿quién ya adulteró en su corazón?","El que mira a una mujer para codiciarla",["El que habla con una mujer","El que no cumple sus votos","El que no se casa"],"Mateo 5:28","Como con el homicidio, Jesús muestra que la ley de Dios mira el corazón: el deseo codicioso ya es pecado, aunque no llegue al acto."],
    ["Según Mateo 15:19, ¿de dónde salen los malos pensamientos, los homicidios y los adulterios?","Del corazón",["De los ojos","De las manos","Del mundo"],"Mateo 15:19"],
    ["Éxodo 20:14 dice «No cometerás adulterio». ¿Qué enseña Jesús sobre este mandamiento?","Que también alcanza a la mirada y al deseo del corazón",["Que ya no está vigente","Que solo aplica a los casados","Que solo se trata del acto físico"],"Éxodo 20:14"],
    ["Según Mateo 5:29, ¿qué tan en serio debemos tomar el pecado?","Es mejor perder un miembro que ser echado al infierno",["Solo importa si otros nos ven","Solo importa si es un pecado grande","Se resuelve con paciencia, sin cambiar nada"],"Mateo 5:29"]]},
  {title:'El resumen de la ley',verses:[
    {r:'Mateo 22:37',t:"Jesús le dijo: Amarás al Señor tu Dios con todo tu corazón, y con toda tu alma, y con toda tu mente."},

    {r:'Romanos 13:10',t:"El amor no hace mal al prójimo; así que el cumplimiento de la ley es el amor."},
    {r:'Gálatas 5:14',t:"Porque toda la ley en esta sola palabra se cumple: Amarás a tu prójimo como a ti mismo."}],
   qs:[
    ["Según Mateo 22:37, ¿con qué debemos amar al Señor nuestro Dios?","Con todo el corazón, toda el alma y toda la mente",["Solo con obras y sacrificios","Solo con el corazón","Con la fuerza y el dinero"],"Mateo 22:37"],
    ["Según Mateo 22:39, ¿cómo debemos amar al prójimo?","Como a nosotros mismos",["Más que a nosotros mismos","Solo si nos aman","Según lo que merezca"],"Mateo 22:39","Los diez mandamientos se resumen así: los primeros, amar a Dios; los demás, amar al prójimo."],
    ["Según Mateo 22:40, ¿de qué depende toda la ley y los profetas?","De estos dos mandamientos",["De los diez mandamientos solamente","De los sacrificios","Del templo"],"Mateo 22:40"],
    ["Según Romanos 13:10, ¿cuál es el cumplimiento de la ley?","El amor",["El sacrificio","La obediencia externa","El temor"],"Romanos 13:10"]]}

 ]},

  {title:'Sal y luz',verses:[

  {title:'La ley y la justicia mayor',verses:[
