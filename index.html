<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lampy · Curso bíblico diario</title>
<meta name="description" content="Aprende la Biblia cada día con preguntas, rachas y juegos en familia. Texto: Reina-Valera 1960.">
<meta name="theme-color" content="#58CC02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lampy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Serif:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Serif:wght@600;700&display=swap"></noscript>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F7F7F7; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5;
  --green:#58CC02; --green-d:#58A700; --green-bg:#D7FFB8; --green-ink:#3F8C00;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-bg:#DDF4FF; --blue-ink:#1273A6;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-bg:#FFDFE0; --red-ink:#C42B2B;
  --orange:#FF9600; --orange-d:#CC7900; --orange-bg:#FFEFD0; --orange-ink:#B05F00;
  --yellow:#FFC800; --yellow-d:#E5A600; --yellow-bg:#FFF6CC; --yellow-ink:#9A7000;
  --purple:#CE82FF; --purple-d:#A560E8; --purple-bg:#F3E3FF;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shade:rgba(0,0,0,.2);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131F24; --surface:#1B2B33; --surface2:#233640; --ink:#EAF2F6; --muted:#9FB0B8; --line:#2F4550;
    --green-bg:#1E3A14; --green-ink:#8CE63A; --blue-bg:#123A4D; --blue-ink:#6CCBF7;
    --red-bg:#40202A; --red-ink:#FF8A8A; --orange-bg:#40290F; --orange-ink:#FFB347;
    --yellow-bg:#3D3410; --yellow-ink:#FFD84D; --purple-bg:#32204A; --shade:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131F24; --surface:#1B2B33; --surface2:#233640; --ink:#EAF2F6; --muted:#9FB0B8; --line:#2F4550;
  --green-bg:#1E3A14; --green-ink:#8CE63A; --blue-bg:#123A4D; --blue-ink:#6CCBF7;
  --red-bg:#40202A; --red-ink:#FF8A8A; --orange-bg:#40290F; --orange-ink:#FFB347;
  --yellow-bg:#3D3410; --yellow-ink:#FFD84D; --purple-bg:#32204A; --shade:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}
#app{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3,h4{font-weight:900}

/* ---------- animaciones ---------- */
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.9}}
@keyframes floatup{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
.mas{display:inline-block;flex:none;line-height:0}
.mas svg{width:100%;height:100%;overflow:visible}
.mas .fl{transform-origin:50px 32px;animation:flick 1.6s ease-in-out infinite}
.mas.cheer{animation:bounce .8s ease-out 2}
.mas .tw{transform-origin:80px 49px;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.55) rotate(25deg);opacity:.7}}
.mas.sad{animation:wiggle .9s ease-in-out 2}
.pop{animation:pop .35s ease-out}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:-.02em;color:var(--green)}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;padding:4px 8px;border-radius:12px}
.chip svg{width:22px;height:22px}
.chip.streak{color:var(--orange)}
.chip.streak.off{color:var(--muted);filter:grayscale(1)}
.chip.streak.risk svg{animation:pulse 1.2s infinite}
.chip.xp{color:var(--yellow-d)}
.chip.shield{color:var(--blue)}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:16px;margin:0 0 14px}
.hero{display:flex;gap:10px;align-items:center;margin:4px 0 16px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.3;flex:1}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.goalrow{display:flex;gap:14px;align-items:center}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:76px;height:76px}
.ring circle{fill:none;stroke-width:8}
.ring .rbg{stroke:var(--line)}
.ring .rfg{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900}
.goalrow h3{margin:0 0 2px;font-size:18px}
.goalrow p{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:800}
.dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:transparent}
.dot svg{width:15px;height:15px}
.dot.on{background:var(--orange);border-color:var(--orange);color:#fff}
.dot.today{border-color:var(--blue)}
.dot.on.today{border-color:var(--orange)}
.votd{background:var(--blue-bg);border-color:var(--blue)}
.votd .tagv{display:inline-block;background:var(--blue);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:2px 12px;margin-bottom:8px}
.votd q{display:block;quotes:none;font-size:19px;line-height:1.45;margin:2px 0 6px;font-weight:800}
.votd cite{font-style:normal;font-weight:900;color:var(--blue-ink);font-size:14px}
.votd .think{margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:800}
.votd .think b{color:var(--orange)}
.banner{background:var(--orange-bg);border:2px solid var(--orange);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:15px;font-weight:800}
.install{background:var(--purple-bg);border:2px solid var(--purple);border-radius:18px;padding:14px;margin:0 0 14px;font-size:15px}
.install b{font-weight:900}
.install button{margin-top:10px}

/* ---------- ruta ---------- */
.unit{margin:30px 0 8px}
.unit-h{display:flex;justify-content:space-between;align-items:center;gap:12px;background:color-mix(in srgb,var(--u) 78%,#000);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--shade)}
.unit-h h2{margin:0;font-size:21px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.unit-h p{margin:2px 0 0;font-size:14px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.uemo{font-size:40px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.count{display:inline-block;margin-top:6px;font-weight:900;background:rgba(0,0,0,.36);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;text-shadow:none}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 0 6px}
.stop{display:grid;justify-items:center;gap:8px;transform:translateX(var(--off,0px));max-width:200px;position:relative}
.node{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--u);color:#fff;box-shadow:0 7px 0 var(--shade);transition:transform .08s,box-shadow .08s;font-size:34px;line-height:1}
.node svg{width:34px;height:34px}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--shade)}
.node.done{background:var(--yellow);color:#fff}
.node.locked{background:var(--line);color:var(--muted);cursor:not-allowed}
.node.current{animation:pulse 1.8s ease-in-out infinite;outline:6px solid color-mix(in srgb,var(--u) 28%,transparent);outline-offset:3px}
.stop span{font-size:14px;font-weight:800;text-align:center;color:var(--muted)}
.stop.cur span{color:var(--ink);font-weight:900}
.start-tip{position:absolute;top:-30px;background:var(--surface);color:var(--green);border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-weight:900;font-size:14px;letter-spacing:.04em;animation:bounce 1.6s infinite;white-space:nowrap}
.start-tip::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-6px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.cbtn{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:900;font-size:17px;color:var(--ink)}
.cbtn .ci{font-size:24px;line-height:1;display:grid;place-items:center}
.cbtn .ci .flag{width:30px;height:20px;border-radius:4px;display:block}
.cbtn .car{font-size:12px;color:var(--muted);transition:transform .2s}
.cbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.ucel{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--u) 13%,var(--bg)),var(--bg) 72%);text-align:center;overflow:auto;animation:ucin .35s ease-out}
.ucel[hidden]{display:none}
@keyframes ucin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ucel{--ucTxt:color-mix(in srgb,var(--u) 55%,#000)}
:root[data-theme="dark"] .ucel{--ucTxt:color-mix(in srgb,var(--u) 60%,#fff)}
.uctag{background:color-mix(in srgb,var(--u) 52%,#000);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);font-weight:900;font-size:13px;letter-spacing:.08em;padding:6px 14px;border-radius:999px;animation:ucpop .5s .15s both cubic-bezier(.2,1.6,.4,1)}
@keyframes ucpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.ucrow{display:flex;align-items:center;justify-content:center;margin:2px 0}
.ucbadge{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:64px;background:var(--surface);border:6px solid var(--u);box-shadow:0 0 0 10px color-mix(in srgb,var(--u) 25%,transparent);animation:ucpop .6s .25s both cubic-bezier(.2,1.6,.4,1)}
.ucbadge::before{content:"";position:absolute;inset:-46px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--u) 30%,transparent) 0 10deg,transparent 10deg 30deg);animation:ucspin 14s linear infinite;-webkit-mask:radial-gradient(circle,transparent 73px,#000 75px,#000 100%,transparent 100%);mask:radial-gradient(circle,transparent 73px,#000 75px,#000 100%,transparent 100%)}
@keyframes ucspin{to{transform:rotate(360deg)}}
.ucbadge .md{position:absolute;right:-8px;bottom:-6px;font-size:40px;animation:ucpop .5s .7s both cubic-bezier(.2,1.6,.4,1)}
.ucrow .mas{margin-left:-14px}
.ucel h1{margin:0;font-size:26px;line-height:1.15;max-width:420px}
.uctag,.ucel h1,.ucel .ucsub{position:relative;z-index:2}
.ucel .ucsub{margin:0;color:var(--muted);font-weight:800;font-size:15px}
.ucprog{width:min(320px,86%);height:14px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.ucprog i{display:block;height:100%;background:var(--u);border-radius:999px;transition:width .9s .5s ease-out}
.ucnext{display:flex;align-items:center;gap:14px;text-align:left;width:min(420px,100%);padding:14px 16px;border-radius:20px;border:3px solid var(--u);border-bottom-width:6px;background:var(--surface);animation:ucpop .5s .9s both cubic-bezier(.2,1.4,.4,1)}
.ucnext .uce{font-size:40px;line-height:1}
.ucnext small{display:block;color:var(--ucTxt);font-weight:900;letter-spacing:.06em;font-size:12px;text-transform:uppercase}
.ucnext b{display:block;font-size:18px;line-height:1.2}
.ucnext span.s{color:var(--muted);font-size:14px;font-weight:800}
.ucel .btn{width:min(420px,100%)}
.newtag{display:inline-block;margin-left:8px;background:var(--orange);color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:999px;vertical-align:middle;animation:pulse 1.8s ease-in-out infinite}
.count.full{background:#fff;color:color-mix(in srgb,var(--u) 50%,#000);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.offbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 6px);z-index:9;background:#3C3C3C;color:#fff;font-weight:900;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
.offbar[hidden]{display:none}
.updbar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:9;display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--blue);border-radius:16px;padding:8px 10px 8px 14px;font-weight:900;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:520px;margin:0 auto}
.updbar[hidden]{display:none}
.updbar span{flex:1}
.updbar .btn{width:auto;padding:8px 14px;font-size:13px}
.updbar .x{color:var(--muted);font-size:18px;padding:4px 6px}
.authov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);overflow:auto;animation:ucin .25s ease-out}
.authov[hidden]{display:none}
.auin{width:min(420px,100%);display:grid;gap:14px;text-align:center}
.auin h1{margin:0;font-size:26px;line-height:1.15}
.ausub{margin:0;color:var(--muted);font-weight:800;font-size:15px;line-height:1.4}
.aurow{display:flex;justify-content:center}
.auin .inp{text-align:center;font-size:18px}
.auin .inp.code6{font-size:28px;letter-spacing:.35em;font-weight:900}
.aumsg{margin:0;color:var(--red);font-weight:900;font-size:14px}
.link-plain{color:var(--blue);font-weight:900;padding:8px}
.link-plain[disabled]{color:var(--muted)}
.cloudb{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--blue) 12%,var(--surface));border:2px solid var(--blue);border-radius:18px;padding:10px 12px;margin:0 0 12px}
.cloudb>div{flex:1;min-width:0}
.cloudb small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.cloudb .btn{width:auto;padding:8px 14px;font-size:13px}
.cloudb .x{color:var(--muted);font-size:18px;padding:6px}
.cmenu-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:12}
.cmenu{position:fixed;top:0;left:0;right:0;z-index:13;background:var(--bg);border-bottom:2px solid var(--line);border-radius:0 0 22px 22px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 20px;animation:cmdown .22s ease-out;max-height:92vh;overflow:auto}
@keyframes cmdown{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.cmenu .in{max-width:560px;margin:0 auto}
.cmenu h2{margin:0 0 4px;font-size:22px}
.cmenu .sub{margin:0 0 12px;color:var(--muted);font-size:14px;font-weight:800}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ctile{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:18px;border:3px solid var(--line);border-bottom-width:5px;background:var(--surface);font-weight:900;text-align:center}
.ctile.on{border-color:var(--blue);background:var(--blue-bg)}
.ctile[disabled]{opacity:.55}
.ctile .ci{font-size:38px;line-height:1;height:42px;display:grid;place-items:center}
.ctile .ci .flag{width:54px;height:36px;border-radius:6px}
.ctile b{font-size:15px}
.ctile small{font-size:12px;color:var(--muted);font-weight:800}
.cmenu .cl{margin:14px auto 0;display:block;color:var(--muted);font-weight:900}
.goto{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:var(--blue);color:#fff;font-weight:900;font-size:15px;border:0;border-bottom:4px solid rgba(0,0,0,.22);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.goto{animation:gotoPulse 2.6s ease-in-out infinite}
@keyframes gotoPulse{0%,100%{transform:scale(1);box-shadow:0 6px 18px rgba(0,0,0,.25),0 0 0 0 rgba(28,176,246,.45)}50%{transform:scale(1.045);box-shadow:0 8px 22px rgba(0,0,0,.28),0 0 0 9px rgba(28,176,246,0)}}
.goto .mas{margin:-6px 0 -6px -6px}
.goto:active{animation:none;transform:translateY(2px);border-bottom-width:2px}
.goto[hidden]{display:none}
.stop.ping .node{animation:pulse .5s ease-in-out 3}
.tabs>div{display:flex;width:100%;max-width:560px;gap:2px}
.tab{flex:1;min-width:0;display:grid;justify-items:center;gap:1px;padding:6px 1px;border-radius:14px;font-size:11px;font-weight:900;color:var(--muted);border:2px solid transparent}
.tab{position:relative}
.tab svg{width:26px;height:26px}
.tab .dot{position:absolute;top:3px;left:calc(50% + 6px);width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gear{width:46px;height:46px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:22px;display:grid;place-items:center}
.back{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:900;font-size:16px;padding:8px 0}
.tab span{white-space:nowrap}
@media (max-width:380px){.tab{font-size:10px;padding:6px 0}.tab svg{width:24px;height:24px}}
.tab.on{color:var(--blue);background:var(--blue-bg);border-color:var(--blue)}

/* ---------- botones ---------- */
.btn{display:block;width:100%;background:var(--green);color:#fff;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px;border-radius:16px;border-bottom:4px solid var(--shade);text-align:center;transition:transform .08s,border-bottom-width .08s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px}
.btn:disabled{background:var(--line);color:var(--muted);border-bottom-color:transparent;cursor:not-allowed}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.purple{background:var(--purple-d)}
.btn.good{background:var(--green)}
.btn.bad{background:var(--red)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);border-bottom-width:4px}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:14px}

/* ---------- progreso ---------- */
h1.page{font-size:30px;margin:10px 0 14px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.stat .se{font-size:30px;line-height:1}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px;font-weight:800}
.stat.s1{background:var(--orange-bg);border-color:var(--orange)}
.stat.s2{background:var(--purple-bg);border-color:var(--purple)}
.stat.s3{background:var(--yellow-bg);border-color:var(--yellow)}
.stat.s4{background:var(--green-bg);border-color:var(--green)}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;font-weight:900;background:var(--surface)}
.seg button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a{display:grid;justify-items:center;text-align:center;gap:2px;padding:12px 8px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface)}
.a .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:28px;filter:grayscale(1);opacity:.6}
.a.on{border-color:var(--yellow);background:var(--yellow-bg)}
.a.on .ico{background:var(--yellow);filter:none;opacity:1}
.a b{display:block;font-size:14px;line-height:1.15;margin-top:4px}
.a small{color:var(--muted);font-size:12px;font-weight:700;line-height:1.2}
.list{display:grid;gap:10px}
.li{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
.li cite{font-style:normal;font-weight:900;color:var(--blue);font-size:14px}
.li p{margin:4px 0 0;font-size:16px;line-height:1.5;font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px}
.muted{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin:26px 0 0;line-height:1.5;font-weight:700}
.link-danger{color:var(--red);font-weight:900;padding:10px 0;text-align:left}
textarea.code{width:100%;min-height:76px;font:inherit;font-size:13px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2);color:var(--ink);resize:vertical;word-break:break-all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:900;z-index:80;animation:slideup .25s ease-out;max-width:90%;text-align:center}

/* ---------- lección ---------- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.overlay[hidden],.modal[hidden]{display:none}
.lh{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:640px;width:100%;margin:0 auto}
.x{width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:12px;flex:none}
.x svg{width:26px;height:26px}
.bar{flex:1;height:18px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gcol,var(--green));border-radius:99px;transition:width .4s ease;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}
.combo{display:flex;align-items:center;gap:2px;color:var(--orange);font-weight:900;font-size:18px;flex:none;animation:pop .3s ease-out}
.combo svg{width:24px;height:24px}
.lb{flex:1;overflow:auto;padding:6px 16px 24px;max-width:640px;width:100%;margin:0 auto}
.say{display:flex;gap:10px;align-items:center;margin:6px 0 16px}
.prompt{font-size:21px;line-height:1.25;margin:0;font-weight:900;letter-spacing:-.01em}
.say .bubble{font-size:20px;font-weight:900}
.verse{position:relative;margin:0 0 18px;padding:16px 16px 16px 44px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:18px;font-size:20px;line-height:1.6;font-weight:800}
.verse::before{content:"\201C";position:absolute;left:12px;top:6px;font-size:52px;line-height:1;color:var(--blue);font-weight:900}
.blank{display:inline-block;min-width:84px;text-align:center;border-bottom:4px solid var(--blue);color:var(--blue-ink);background:var(--blue-bg);border-radius:8px 8px 0 0;font-weight:900;padding:0 8px}
.blank.good{border-color:var(--green);color:var(--green-ink);background:var(--green-bg)}
.blank.bad{border-color:var(--red);color:var(--red-ink);background:var(--red-bg)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;font-weight:800;font-size:18px;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt kbd{font:inherit;font-size:14px;font-weight:900;border:2px solid var(--line);border-radius:10px;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}
.opt.sel kbd{border-color:var(--blue);color:var(--blue)}
.opt.good{border-color:var(--green);background:var(--green-bg);color:var(--green-ink);animation:pop .35s ease-out}
.opt.good kbd{border-color:var(--green);color:var(--green-ink)}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:var(--red-ink);animation:shake .45s}
.opt.bad kbd{border-color:var(--red);color:var(--red-ink)}
.opt:disabled{cursor:default}
.answer{min-height:68px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.w{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 14px;font-size:18px;font-weight:800}
.w:active{transform:translateY(2px)}
.w.used{visibility:hidden}
.answer.good .w{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.answer.bad{animation:shake .45s}
.answer.bad .w{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.retry{display:flex;align-items:center;gap:10px;margin:2px 0 12px;padding:8px 14px 8px 8px;background:var(--orange-bg);border:2px dashed var(--orange);border-radius:18px;color:var(--orange-ink);font-weight:900;font-size:15px;animation:slideup .3s ease-out}
.lf{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--surface);position:relative}
.lf .in{max-width:640px;margin:0 auto}
.lf.good{background:var(--green-bg);border-color:var(--green)}
.lf.bad{background:var(--red-bg);border-color:var(--red)}
.lf.good .in,.lf.bad .in{animation:slideup .25s ease-out}
.fbhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lf h4{margin:0;font-size:24px;line-height:1.1}
.lf.good h4{color:var(--green-ink)}
.lf.bad h4{color:var(--red-ink)}
.lf .sub{font-size:14px;font-weight:800;color:var(--muted)}
.fbox{max-height:42vh;overflow:auto;margin-bottom:12px}
.lf .fv{margin:0 0 8px;font-size:16px;line-height:1.5;font-weight:700}
.lf .fv em{font-style:normal}
.lf .fv cite{font-style:normal;font-weight:900}
.lf.good .fv{color:var(--green-ink)}
.lf.bad .fv{color:var(--red-ink)}
.nota{font-size:14px;line-height:1.45;padding:9px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--ink);margin:0 0 4px;font-weight:700}
.nota b{color:var(--blue)}
.xpfloat{position:absolute;right:20px;top:-18px;font-weight:900;font-size:22px;color:var(--yellow-d);animation:floatup 1.1s ease-out forwards;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.intro{padding-top:6px}
.icard{animation:icin .28s ease-out}
@keyframes icin{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.idots{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}
.idots i{display:block;width:9px;height:9px;border-radius:999px;background:var(--line);transition:all .25s}
.idots i.on{background:var(--blue);width:24px}
.idots i.dn{background:var(--blue);opacity:.55}
.intro .h2s{font-size:20px;color:var(--muted);margin:0 0 10px}
.intro p.rl{font-size:17px;line-height:1.5;margin:0 0 12px;padding:10px 12px;border-radius:14px;background:var(--surface2,var(--surface));border:2px solid var(--line)}
.intro p b{font-weight:900}
.intro .tag{display:inline-block;font-size:13px;font-weight:900;color:#fff;background:var(--blue);border-radius:999px;padding:3px 14px;margin:6px 0 10px}
.intro h2{font-size:30px;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.intro p{font-size:19px;line-height:1.55;margin:0 0 14px;font-weight:700}

/* ---------- resultado ---------- */
.res{text-align:center;padding-top:10px}
.res h1{font-size:34px;margin:6px 0 2px;letter-spacing:-.02em;color:var(--green)}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rs div{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 4px;background:var(--surface);animation:pop .4s ease-out backwards}
.rs div:nth-child(1){background:var(--yellow-bg);border-color:var(--yellow);animation-delay:.1s}
.rs div:nth-child(2){background:var(--green-bg);border-color:var(--green);animation-delay:.25s}
.rs div:nth-child(3){background:var(--orange-bg);border-color:var(--orange);animation-delay:.4s}
.rs i{display:block;font-style:normal;font-size:22px;line-height:1}
.rs b{display:block;font-size:24px}
.rs span{font-size:12px;color:var(--muted);font-weight:800}
.note{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;text-align:left;font-size:15px;font-weight:700}
.note.fl{border-color:var(--orange);background:var(--orange-bg)}
.note b{font-weight:900}
.vs{text-align:left;margin-top:16px}
.vs h3{font-size:17px;margin:0 0 8px}
.revbox{text-align:left;margin-top:8px;background:var(--orange-bg);border:2px solid var(--orange);border-radius:16px;padding:10px 14px;font-weight:800;font-size:15px}

/* ---------- repaso ---------- */
.revhero{display:flex;gap:12px;align-items:center;background:var(--orange-bg);border:2px solid var(--orange);border-bottom-width:5px;border-radius:22px;padding:16px;margin-bottom:14px}
.revhero h2{margin:0 0 4px;font-size:22px;color:var(--orange-ink)}
.revhero p{margin:0 0 12px;font-size:15px;font-weight:800}
.lvl{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:1px 10px;color:#fff}

/* ---------- juegos ---------- */
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{display:grid;justify-items:center;gap:4px;text-align:center;width:100%;background:var(--surface);border:2px solid var(--gc);border-bottom-width:6px;border-radius:22px;padding:16px 10px 14px;transition:transform .08s}
.gcard:active{transform:translateY(3px);border-bottom-width:3px}
.gcard .gemo{font-size:44px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.gcard b{font-size:17px;line-height:1.15;color:var(--gc)}
.gcard span{color:var(--muted);font-size:13px;font-weight:700;line-height:1.25}
.inp{width:100%;font:inherit;font-weight:800;padding:11px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:26px;font-weight:900;color:var(--gc,var(--blue))}
.stepper b{font-size:28px;min-width:32px;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 8px;font-size:17px}
.gsetup{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.gsetup h1{margin:0;font-size:26px;line-height:1.1}
.gsetup p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.glabel{font-weight:900;color:var(--gc,var(--blue));margin:6px 0 10px;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.glabel span{color:var(--muted);font-weight:800}
.gbig{font-size:23px;line-height:1.5}
.vref{display:block;font-style:normal;font-size:14px;font-weight:900;color:var(--blue);margin-top:8px}
.gq{font-size:25px;line-height:1.35;margin:6px 0 14px;font-weight:900}
.gans{border:2px solid var(--green);border-bottom-width:5px;background:var(--green-bg);border-radius:18px;padding:12px 16px;margin-top:14px;animation:pop .35s ease-out}
.gans b{display:block;font-size:26px;color:var(--green-ink)}
.gans span{font-weight:900;color:var(--green-ink);font-size:14px}
.gans p{margin:8px 0 0;font-size:16px;line-height:1.5;font-weight:700}
.sb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sbp{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:3px;border-radius:999px;padding:2px 12px 2px 3px;font-weight:800}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none}
.sbp b{font-weight:900}
.clues{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.clues li{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--gc,var(--blue));border-radius:16px;padding:10px 14px;font-size:20px;line-height:1.4;font-weight:800;animation:slideup .3s ease-out}
.clues li span{display:block;font-size:12px;font-weight:900;color:var(--gc,var(--blue));letter-spacing:.05em;text-transform:uppercase}
.clues cite{display:block;font-style:normal;font-size:13px;font-weight:900;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:900}
.pl.on{border-color:var(--green);background:var(--green-bg);color:var(--green-ink);animation:pop .3s}
.row2{display:flex;gap:10px;margin-bottom:10px}
.row2 .btn{flex:1}
.rk{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rk .medal{font-size:26px;line-height:1}
.gamed .btn:not(.ghost):not(.good):not(.bad){background:var(--gc)}
.gamed .seg button.on{border-color:var(--gc);color:var(--gc);background:var(--surface2)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.6);z-index:40;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:24px;padding:20px;max-width:380px;width:100%;display:grid;gap:12px;text-align:center;animation:pop .25s ease-out}
.modal .box .mas{margin:0 auto}
.modal h3{margin:0;font-size:22px}
.modal p{margin:0;color:var(--muted)}
.cf{position:fixed;top:-16px;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

/* ---------- griego y diccionario ---------- */
.gk{font-family:'Noto Serif','Gentium Plus','Times New Roman',Georgia,serif;font-weight:700}
.cswitch{display:flex;gap:8px;margin:2px 0 14px}
.cs{flex:1;padding:10px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;font-weight:900;background:var(--surface)}
.cs{display:flex;align-items:center;justify-content:center;gap:8px}
.cs .flag{width:26px;height:17px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:none}
.cs.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}
.gkbig{margin:0 0 16px;padding:14px 12px;text-align:center;font-size:30px;line-height:1.4;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--surface2);letter-spacing:.02em}
.gko .opt span{font-family:'Noto Serif','Gentium Plus',Georgia,serif;font-size:21px;font-weight:700}
.gkbig.xl{font-size:64px;line-height:1.15;padding:8px 12px}
.gkline{font-size:19px;line-height:1.5}
.wotd{background:var(--purple-bg);border-color:var(--purple)}
.wotd .tagv{display:inline-block;background:var(--purple-d);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:2px 12px;margin-bottom:8px}
.wotd .wg{font-size:42px;line-height:1.2}
.wotd .wm{font-size:17px;font-weight:800;margin:2px 0 10px}
.dsearch{margin:6px 0 12px;font-size:17px}
.dlist{display:grid;gap:8px}
.dentry{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 14px}
.dentry:active{transform:translateY(2px)}
.dg{font-size:26px;min-width:96px;line-height:1.2;color:var(--blue-ink)}
.dm{flex:1;font-size:15px;line-height:1.3;font-weight:700;color:var(--muted)}
.dm b{color:var(--ink);font-weight:900;margin-right:2px}
.dn{font-size:18px;flex:none}
.dhead{text-align:center;padding:4px 0 8px}
.dbig{font-size:54px;line-height:1.2;color:var(--blue-ink)}
.dsub{font-size:17px;margin:2px 0 10px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dchip{background:var(--blue-bg);color:var(--blue-ink);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:900}
#dic .lb h3{font-size:18px;margin:20px 0 8px}
.dmean{font-size:20px;font-weight:900;margin:0}
.tl{display:grid;gap:12px}
.tl-item{display:flex;gap:12px;align-items:flex-start}
.tl-item b{font-size:15px}
.tl-item p{margin:2px 0 0;font-size:16px;line-height:1.5;font-weight:700}
.tl-dot{width:16px;height:16px;border-radius:50%;margin-top:4px;flex:none;background:var(--orange)}
.tl-dot.t1{background:var(--purple-d)}
.tl-dot.t2{background:var(--green)}
.cogs{display:flex;flex-wrap:wrap;gap:6px}
.cog{background:var(--yellow-bg);border:2px solid var(--yellow);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800}

.splash{display:grid;justify-items:center;gap:10px;padding:90px 0;color:var(--green);font-size:20px}
.splash .spl{font-size:64px;animation:pulse 1.2s ease-in-out infinite}
.abcseg{display:flex;gap:8px;margin:0 0 12px}
.abc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.atile{display:grid;justify-items:center;gap:0;padding:8px 2px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);transition:transform .08s}
.atile:active{transform:translateY(2px)}
.atile.on{border-color:var(--blue);background:var(--blue-bg)}
.atile .al{font-size:28px;line-height:1.2;color:var(--blue-ink)}
.atile .an{font-size:12px;color:var(--muted);font-weight:800}
.abcinfo{margin:12px 0 4px;padding:12px 14px;border-radius:16px;background:var(--blue-bg);border:2px solid var(--blue);font-size:16px;font-weight:800;line-height:1.4;position:sticky;bottom:78px}
.abcinfo .gk{font-size:24px}
.a.on{cursor:pointer}
.letchips{display:flex;gap:10px;margin:2px 0 8px}
.letchip{display:grid;justify-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:2px 16px 4px;min-width:74px}

 {"title": "La historia y el mensaje de la Biblia", "sub": "De la Historia Sagrada a lo que enseña", "lessons": [{"title": "La Historia Sagrada", "intro": {"t": "La Historia Sagrada", "p": "La Biblia cuenta la Historia Sagrada: la historia de cómo Dios salva a su pueblo. Empieza en el Antiguo Testamento y concluye en el Nuevo. Queremos conocerla porque en ella Dios se da a conocer.\nPara recordarla mejor, la repartimos en 15 tiempos: 10 del Antiguo Testamento y 5 del Nuevo. Antiguo Testamento: los Principios, los Patriarcas, Moisés, la Conquista, los Jueces, el Reino Unido, el Reino Dividido, Judá Solo, el Cautiverio y la Restauración. Luego, 400 años de silencio entre los dos Testamentos.\nNuevo Testamento: Juan el Bautista, Jesucristo en la tierra, el principio de la Iglesia, el desarrollo de la Iglesia y el porvenir de la Iglesia.\nEl tema es el pueblo escogido de Dios: en el Antiguo Testamento, la nación de Israel; en el Nuevo, personas de todas las naciones: la Iglesia."}, "verses": [{"r": "Lucas 24:27", "t": "Y comenzando desde Moisés, y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían."}, {"r": "Gálatas 4:4", "t": "Pero cuando vino el cumplimiento del tiempo, Dios envió a su Hijo, nacido de mujer y nacido bajo la ley,"}, {"r": "Isaías 46:10", "t": "que anuncio lo por venir desde el principio, y desde la antigüedad lo que aún no era hecho; que digo: Mi consejo permanecerá, y haré todo lo que quiero;"}], "qs": [["¿En cuántos tiempos repartimos la Historia Sagrada?", "15", ["10", "5", "66"], "", ""], ["¿Cuántos tiempos tiene el Antiguo Testamento?", "10", ["5", "15", "12"], "", ""], ["¿Cuántos tiempos tiene el Nuevo Testamento?", "5", ["10", "15", "4"], "", ""], ["¿Por qué queremos conocer la Historia Sagrada?", "Porque en ella Dios se da a conocer y salva a su pueblo", ["Porque es la historia de los reyes del mundo", "Porque reemplaza a los evangelios", "Porque solo habla del pasado"], "", ""], ["¿De qué nos cuenta la  14 del capítulo 10 y el 28 del capítulo 15.\nPara saber por dónde empezar, piensa en la parte de la Biblia: Juan es uno de los cuatro evangelios, que están al principio del Nuevo Testamento."}, "verses": [{"r": "Salmo 119:105", "t": "Lámpara es a mis pies tu palabra, Y lumbrera a mi camino."}, {"r": "Isaías 53:6", "t": "Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino; mas Jehová cargó en él el pecado de todos nosotros."}, {"r": "2 Timoteo 2:15", "t": "Procura con diligencia presentarte a Dios aprobado, como obrero que no tiene de qué avergonzarse, que usa bien la palabra de verdad."}], "qs": [["En la Biblia, ¿qué indican los números grandes?", "Los capítulos", ["Los versículos", "Los libros", "Las páginas"], "", ""], ["En la Biblia, ¿qué indican los números pequeños?", "Los versículos", ["Los capítulos", "Los libros", "Los títulos"], "", ""], ["En «Juan 3:16», ¿qué número es el capítulo?", "3", ["16", "1", "6"], "", ""], ["En «Isaías 53:6», ¿qué número es el versículo?", "6", ["53", "5", "3"], "", ""], ["¿Qué significa «Mateo 3:1-11»?", "El capítulo 3, desde el versículo 1 hasta el 11", ["Los capítulos 3 al 11, versículo 1", "El capítulo 3 y el capítulo 11", "El versículo 3, capítulos 1 al 11"], "", ""], ["¿Qué significa «Proverbios 10:14,19»?", "Capítulo 10, versículos 14 y 19", ["Capítulo 10, del versículo 14 al 19", "Capítulos 14 y 19", "Capítulo 10 y capítulo 14"], "", ""], ["Según Salmo 119:105, ¿qué es la palabra de Dios?", "Lámpara a mis pies y lumbrera a mi camino", ["Roca en el desierto", "Espada de dos filos", "Escudo contra el mal"], "Salmo 119:105", ""], ["Según 2 Timoteo 2:15, ¿qué debemos procurar con diligencia?", "Presentarnos a Dios aprobados", ["Ser admirados por los hombres", "Evitar a los demás obreros", "Callar la palabra de verdad"], "2 Timoteo 2:15", ""]], "cx": [{"k": "match", "prompt": "Une cada cita con lo que significa", "pairs": [["Juan 3:16", "Capítulo 3, versículo 16"], ["Mateo 3:1-11", "Capítulo 3, del versículo 1 al 11"], ["Proverbios 10:14,19", "Capítulo 10, versículos 14 y 19"], ["Proverbios 10:14; 15:28", "Capítulo 10, versículo 14; capítulo 15, versículo 28"]], "done": "Cada cita quedó con su significado."}, {"k": "testament", "range": [0, 65], "n": 2}, {"k": "division", "range": [0, 65], "n": 1}], "max": 12}, {"title": "Muchas versiones, una Biblia", "intro": {"t": "Una sola Biblia", "p": "La Biblia es una sola. Fue escrita principalmente en hebreo (Antiguo Testamento) y en griego (Nuevo Testamento), y después hombres sabios la pasaron al español.\nPor eso hay muchas versiones: cada traductor buscó la manera más clara de decir lo mismo, y a veces usan palabras distintas con el mismo sentido. Algunas son más literales y otras más libres; conviene leer una versión libre comparándola con otra más fiel.\nEn este curso usamos los 66 libros de la Biblia en la versión Reina-Valera 1960. Lo más importante no es cuál versión leer, sino leer la Biblia de verdad."}, "verses": [{"r": "Nehemías 8:8", "t": "Y leían en el libro de la ley de Dios claramente, y ponían el sentido, de modo que entendiesen la lectura."}, {"r": "Hechos 17:11", "t": "Y éstos eran más nobles que los que estaban en Tesalónica, pues recibieron la palabra con toda solicitud, escudriñando cada día las Escrituras para ver si estas cosas eran así."}, {"r": "Isaías 40:8", "t": "Sécase la hierba, marchítase la flor; mas la palabra del Dios nuestro permanece para siempre."}, {"r": "Salmo 12:6", "t": "Las palabras de Jehová son palabras limpias, Como plata refinada en horno de tierra, Purificada siete veces."}], "qs": [["¿En qué idiomas fue escrita principalmente la Biblia?", "En hebreo y en griego", ["En latín y en español", "En arameo y en latín", "En inglés y en hebreo"], "", ""], ["¿Por qué hay tantas versiones de la Biblia en español?", "Porque distintos traductores buscaron la manera más clara de decir lo mismo", ["Porque la Biblia cambió con el tiempo", "Porque cada libro tiene dos versiones", "Porque Dios dio varios libros distintos"], "", ""], ["Si dos versiones usan palabras distintas pero con el mismo sentido, ¿qué concluimos?", "Que es solo una diferencia de traducción", ["Que enseñan cosas opuestas", "Que una de ellas es otro libro", "Que no se puede confiar en ninguna"], "", ""], ["¿Qué conviene hacer con una versión muy libre?", "Leerla comparándola con otra más fiel", ["Dejar de leer la Biblia", "Usarla como única fuente", "Cambiar sus palabras por las nuestras"], "", ""], ["¿Cuántos libros usamos en este curso?", "66", ["39", "27", "100"], "", ""], ["Según esta lección, ¿cuál es el problema más importante?", "Que muchas personas no leen la Biblia", ["Que hay muchas versiones", "Que la Biblia es muy antigua", "Que tiene muchos capítulos"], "", ""], ["Según Nehemías 8:8, ¿para qué ponían el sentido cuando leían el libro de la ley?", "Para que entendiesen la lectura", ["Para que la memorizaran en una noche", "Para que la copiaran", "Para que la cantaran"], "Nehemías 8:8", ""], ["Según Hechos 17:11, ¿qué hacían cada día los que eran más nobles que los de Tesalónica?", "Escudriñaban las Escrituras para ver si eran así", ["Ayunaban y velaban", "Ofrecían sacrificios", "Viajaban a Jerusalén"], "Hechos 17:11", ""], ["Según Isaías 40:8, ¿qué permanece para siempre?", "La palabra del Dios nuestro", ["La hierba del campo", "Los reinos de la tierra", "La flor del campo"], "Isaías 40:8", ""], ["Según Salmo 12:6, ¿cómo son las palabras de Jehová?", "Limpias, como plata refinada", ["Ocultas, como un tesoro", "Pesadas, como hierro", "Pasajeras, como la hierba"], "Salmo 12:6", ""]], "cx": [{"k": "match", "prompt": "Une cada versículo con su idea", "pairs": [["Nehemías 8:8", "Leer para entender"], ["Hechos 17:11", "Examinar las Escrituras cada día"], ["Isaías 40:8", "La palabra permanece"], ["Salmo 12:6", "Palabras limpias"]], "done": "Cada versículo quedó con su idea."}], "max": 12}, {"title": "Lo que enseña la Biblia (1)", "intro": {"t": "Dios, el hombre y el pecado", "p": "La Biblia cuenta lo que Dios hizo y hace para salvar a su pueblo. En resumen, enseña que:\n1. El único Dios verdadero, Padre, Hijo y Espíritu Santo, creó todas las cosas para su propia gloria.\n2. Este Dios es santo, justo, bueno, sabio y todopoderoso; gobierna, cuida y sustenta todas las cosas.\n3. Hizo al hombre a su imagen y lo puso bajo ley para que le sirviera y gozara de él.\n4. Adán y Eva desobedecieron a Dios, y todos nacen ahora culpables y dañados ante él, sin poder cambiar ni salvarse.\n5. Por su sola bondad, Dios resolvió salvar a muchos de estos pecadores que merecían castigo."}, "verses": [{"r": "Romanos 11:36", "t": "Porque de él, y por él, y para él, son todas las cosas. A él sea la gloria por los siglos. Amén."}, {"r": "Efesios 1:4-5", "t": "según nos escogió en él antes de la fundación del mundo, para que fuésemos santos y sin mancha delante de él, en amor habiéndonos predestinado para ser adoptados hijos suyos por medio de Jesucristo, según el puro afecto de su voluntad,"}, {"r": "Efesios 2:4-5", "t": "Pero Dios, que es rico en misericordia, por su gran amor con que nos amó, aun estando nosotros muertos en pecados, nos dio vida juntamente con Cristo (por gracia sois salvos),"}], "qs": [["¿Quién creó todas las cosas, según esta lección?", "El único Dios verdadero: Padre, Hijo y Espíritu Santo", ["Los ángeles", "Los reyes de la tierra", "Las fuerzas de la naturaleza"], "", ""], ["¿Para qué creó Dios todas las cosas?", "Para su propia gloria", ["Para que los hombres reinaran solos", "Para estar solo", "Para que no tuvieran ley"], "", ""], ["¿Cómo es Dios, según esta lección?", "Santo, justo, bueno, sabio y todopoderoso", ["Bueno, pero limitado en poder", "Poderoso, pero distante", "Justo, pero cambiante"], "", ""], ["¿Para qué hizo Dios al hombre a su imagen?", "Para que le sirviera y gozara de él", ["Para que fuera su rival", "Para que viviera sin ley", "Para que se escondiera de él"], "", ""], ["¿Qué hicieron Adán y Eva?", "Desobedecieron a Dios", ["Edificaron una torre", "Salieron a otra tierra", "Ofrecieron un sacrificio perfecto"], "", ""], ["¿Por qué resolvió Dios salvar a pecadores?", "Solo por su bondad", ["Por los méritos de ellos", "Por su fuerza", "Por su costumbre"], "", ""], ["Según Romanos 11:36, ¿para quién son todas las cosas?", "Para él: a él sea la gloria por los siglos", ["Para los hombres sabios", "Para los ángeles", "Para los reyes"], "Romanos 11:36", ""], ["Según Efesios 1:4, ¿cuándo nos escogió Dios en Cristo?", "Antes de la fundación del mundo", ["Después del diluvio", "Cuando nacimos", "El día de Pentecostés"], "Efesios 1:4-5", ""], ["Según Efesios 2:4, ¿cómo es Dios?", "Rico en misericordia", ["Pobre en bondad", "Lento para amar", "Cercano solo a los reyes"], "Efesios 2:4-5", ""]], "cx": [{"k": "match", "prompt": "Une cada dato con su idea", "pairs": [["El único Dios verdadero", "Padre, Hijo y Espíritu Santo"], ["Adán y Eva", "Desobedecieron a Dios"], ["El hombre fue hecho", "A imagen de Dios"], ["Dios salva", "Por su sola bondad"]], "done": "Cada dato quedó con su idea."}], "max": 12}, {"title": "Lo que enseña la Biblia (2)", "intro": {"t": "Cristo, la fe y la vida eterna", "p": "Continuamos con lo que enseña la Biblia:\n6. Dios envió a su Hijo eterno, Jesucristo, en forma humana, para pagar con su muerte el pecado que los pecadores debían pagar. Resucitó para mostrar que había pagado todo lo que Dios exigía.\n7. El Espíritu Santo obra en estos pecadores para darles vida espiritual; al oír las buenas nuevas sobre Jesucristo, se arrepienten y creen en él.\n8. Dios declara justos a los que creen en Jesucristo: no por méritos propios, sino por los de Él.\n9. Dios, por su Espíritu, también los cambia en su corazón y en su conducta; así andan en la ley de Dios, por amor y en gratitud.\n10. Los que creen gozan de vida eterna y vivirán con Cristo para siempre. Cuando Cristo venga otra vez, juzgará a todos y restaurará todas las cosas que el pecado dañó."}, "verses": [{"r": "Hechos 20:21", "t": "testificando a judíos y a gentiles acerca del arrepentimiento para con Dios, y de la fe en nuestro Señor Jesucristo."}, {"r": "Romanos 3:28", "t": "Concluimos, pues, que el hombre es justificado por fe sin las obras de la ley."}, {"r": "Filipenses 2:13", "t": "porque Dios es el que en vosotros produce así el querer como el hacer, por su buena voluntad."}, {"r": "1 Tesalonicenses 4:16-17", "t": "Porque el Señor mismo con voz de mando, con voz de arcángel, y con trompeta de Dios, descenderá del cielo; y los muertos en Cristo resucitarán primero. Luego nosotros los que vivimos, los que hayamos quedado, seremos arrebatados juntamente con ellos en las nubes para recibir al Señor en el aire, y así estaremos siempre con el Señor."}, {"r": "Apocalipsis 21:4", "t": "Enjugará Dios toda lágrima de los ojos de ellos; y ya no habrá muerte, ni habrá más llanto, ni clamor, ni dolor; porque las primeras cosas pasaron."}], "qs": [["¿Qué hizo Jesucristo por los pecadores, según esta lección?", "Pagó con su muerte el pecado que ellos debían", ["Les enseñó a pagar por sí mismos", "Les dio una ley nueva para ganarse el perdón", "Los dejó solos con su culpa"], "", ""], ["¿Para qué resucitó Jesucristo?", "Para mostrar que había pagado todo lo que Dios exigía", ["Para quedarse en la tierra", "Para empezar un reino político", "Para escribir los evangelios"], "", ""], ["¿Quién da vida espiritual al pecador para que crea?", "El Espíritu Santo", ["Los sacerdotes", "Los ángeles", "La propia persona sola"], "", ""], ["Al oír las buenas nuevas de Jesucristo, ¿qué hacen los que reciben vida espiritual?", "Se arrepienten y creen en Cristo", ["Esperan sin hacer nada", "Se esconden de Dios", "Piden mérito propio"], "", ""], ["¿Por los méritos de quién declara Dios justos a los que creen?", "Por los de Jesucristo", ["Por los propios", "Por los de sus padres", "Por los de la iglesia"], "", ""], ["¿Qué pasará cuando Cristo venga otra vez?", "Juzgará a todos y restaurará todas las cosas", ["Cambiará de plan", "Volverá a morir", "Fundará una nueva religión"], "", ""], ["Según Hechos 20:21, ¿acerca de qué testificaba Pablo a judíos y a gentiles?", "Del arrepentimiento para con Dios y de la fe en Jesucristo", ["De las leyes de Roma", "De la historia de Israel", "De las fiestas del templo"], "Hechos 20:21", ""], ["Según Romanos 3:28, ¿cómo es justificado el hombre?", "Por fe, sin las obras de la ley", ["Por las obras de la ley", "Por su linaje", "Por su fuerza"], "Romanos 3:28", ""], ["Según Filipenses 2:13, ¿quién produce en nosotros el querer y el hacer?", "Dios", ["Nosotros solos", "Los ángeles", "La ley"], "Filipenses 2:13", ""], ["Según 1 Tesalonicenses 4:16, ¿quiénes resucitarán primero?", "Los muertos en Cristo", ["Los reyes de la tierra", "Los ángeles", "Los que viven"], "1 Tesalonicenses 4:16-17", ""], ["Según Apocalipsis 21:4, ¿qué enjugará Dios de los ojos de ellos?", "Toda lágrima", ["Toda sed", "Todo pecado", "Toda ceniza"], "Apocalipsis 21:4", ""]], "cx": [{"k": "match", "prompt": "Une cada uno con lo que hace o recibe", "pairs": [["Jesucristo", "Pagó con su muerte el pecado"], ["El Espíritu Santo", "Da vida espiritual"], ["Los que creen en Cristo", "Son declarados justos"], ["Los justificados", "Gozan de vida eterna"]], "done": "Cada uno quedó con su idea."}], "max": 12}]},
 {"title": "Historia Sagrada: el Antiguo Testamento (1)", "sub": "De la creación a la tierra prometida", "lessons": [{"title": "¿Qué es la Historia Sagrada?", "intro": {"t": "La Historia Sagrada", "p": "La Historia Sagrada es la historia que Dios nos cuenta en la Biblia: todo lo que Dios hizo y dijo para salvarnos. También la llamamos la historia de la salvación, y comienza con la nación de Israel. Dios nos salva por medio de su Hijo Jesucristo.\nTiene dos divisiones: el Antiguo y el Nuevo Testamento. El Antiguo explica las cosas de manera velada, con muchos símbolos y figuras (una figura es algo que representa otra cosa). Al principio todo es oscuro y poco a poco se va aclarando: Génesis 3:15 enseña que el Salvador vendría de la simiente de la mujer; Levítico, que nos salvaría mediante un sacrificio de sangre; 2 Samuel, que sería también un Rey.\nLos 10 tiempos del Antiguo Testamento: los Principios, los Patriarcas, Moisés, la Conquista, los Jueces, el Reino Unido, el Reino Dividido, Judá Solo, el Cautiverio y la Restauración."}, "verses": [{"r": "Levítico 17:11", "t": "Porque la vida de la carne en la sangre está, y yo os la he dado para hacer expiación sobre el altar por vuestras almas; y la misma sangre hará expiación de la persona."}, {"r": "Hebreos 10:1", "t": "Porque la ley, teniendo la sombra de los bienes venideros, no la imagen misma de las cosas, nunca puede, por los mismos sacrificios que se ofrecen continuamente cada año, hacer perfectos a los que se acercan."}, {"r": "Génesis 22:18", "t": "En tu simiente serán benditas todas las naciones de la tierra, por cuanto obedeciste a mi voz."}], "qs": [["¿Qué otro nombre se puede dar a la Historia Sagrada?", "La historia de la salvación", ["La historia de los reyes", "La historia del templo", "La historia de las naciones"], "", ""], ["¿Con qué tiene que ver la Historia Sagrada?", "Con todo lo que Dios hizo y dijo para salvarnos", ["Con las guerras de Israel", "Con las leyes de los reyes", "Con los viajes de los apóstoles"], "", ""], ["¿De qué manera explica el Antiguo Testamento la historia de la salvación?", "De manera velada, con muchos símbolos y figuras", ["Con todo claro desde el primer capítulo", "Solo con listas de leyes", "Solo con relatos de batallas"], "", ""], ["¿Qué es una figura?", "Algo que representa otra cosa", ["Una persona muy importante", "Un libro de la ley", "Un canto del templo"], "", ""], ["¿Qué nos enseña Génesis 3:15 acerca del Salvador?", "Que vendría de la simiente de la mujer", ["Que sería un rey en Jerusalén", "Que vendría de Egipto", "Que nacería en un templo"], "", ""], ["¿Qué nos hace ver el libro de Levítico acerca del Salvador?", "Que nos salvaría mediante un sacrificio de sangre", ["Que sería un gran guerrero", "Que vendría con ejércitos", "Que reinaría sin morir"], "", ""], ["¿Qué agrega 2 Samuel acerca del Salvador?", "Que sería también un Rey", ["Que sería también un juez", "Que sería un sacerdote de Egipto", "Que no vendría"], "", ""], ["Según Levítico 17:11, ¿dónde está la vida de la carne?", "En la sangre", ["En el corazón", "En el aliento", "En los huesos"], "Levítico 17:11", ""], ["Según Hebreos 10:1, ¿qué tenía la ley?", "La sombra de los bienes venideros", ["La imagen misma de las cosas", "El poder de hacer perfectos a los que se acercan", "Solo promesas para los reyes"], "Hebreos 10:1", ""], ["Según Génesis 22:18, ¿qué serían benditas en la simiente de Abraham?", "Todas las naciones de la tierra", ["Solo las tribus de Israel", "Solo los hijos de Isaac", "Solo los animales del campo"], "Génesis 22:18", ""]], "cx": [{"k": "order", "prompt": "Ordena los 10 tiempos del Antiguo Testamento", "chunks": [["Los Principios", "Los Patriarcas", "Moisés", "La Conquista", "Los Jueces", "El Reino Unido", "El Reino Dividido", "Judá Solo", "El Cautiverio", "La Restauración"]]}, {"k": "match", "prompt": "Une cada libro con lo que va aclarando del Salvador", "pairs": [["Génesis 3:15", "Vendría de la simiente de la mujer"], ["Levítico", "Nos salvaría con un sacrificio de sangre"], ["2 Samuel", "Sería también un Rey"], ["Antiguo Testamento", "Lo explica con símbolos y figuras"]], "done": "Cada dato quedó con su pareja."}], "max": 12}, {"title": "Los Principios", "intro": {"t": "El primer tiempo: los Principios", "p": "Leemos de este tiempo en Génesis 1 al 11. Muchas cosas tuvieron su principio: Dios hizo el mundo y todo lo que hay en él; hizo al primer hombre y a la primera mujer a su imagen; los unió en el primer matrimonio; y declaró el primer día de reposo.\nPero Adán y Eva desobedecieron por primera vez a Dios, y pecaron en nombre de todos nosotros. Lo llamamos «pecado original»: todos nacemos con él. El pecado llegó a ser tanto que Dios destruyó a los hombres con el diluvio; solo Noé y su familia escaparon en el arca. Después, el pecado aumentó otra vez y Dios castigó la rebeldía de la torre de Babel confundiendo el idioma. Unos pocos buscaban a Dios; Abraham fue uno de ellos, el primer patriarca.\nEn este tiempo Dios enseñaba a acercarse a él por medio de sacrificios de animales: algo muere en lugar del pecador. No sabemos cuántos años duró, pero sabemos que Dios hizo todo, y le debemos obediencia porque él es nuestro dueño."}, "verses": [{"r": "Génesis 5:1", "t": "Este es el libro de las generaciones de Adán. El día en que creó Dios al hombre, a semejanza de Dios lo hizo."}, {"r": "Éxodo 20:11", "t": "Porque en seis días hizo Jehová los cielos y la tierra, el mar, y todas las cosas que en ellos hay, y reposó en el séptimo día; por tanto, Jehová bendijo el día de reposo y lo santificó."}, {"r": "Hebreos 11:4", "t": "Por la fe Abel ofreció a Dios más excelente sacrificio que Caín, por lo cual alcanzó testimonio de que era justo, dando Dios testimonio de sus ofrendas; y muerto, aún habla por ella."}, {"r": "Hebreos 11:7", "t": "Por la fe Noé, cuando fue advertido por Dios acerca de cosas que aún no se veían, con temor preparó el arca en que su casa se salvase; y por esa fe condenó al mundo, y fue hecho h  {"title": "Historia Sagrada: el Antiguo Testamento (2)", "sub": "De los jueces a la restauración", "lessons": [{"title": "Los Jueces", "intro": {"t": "El quinto tiempo: los Jueces", "p": "Los jueces gobernaban a los israelitas después de la conquista. Mientras Josué los dirigía servían al Señor, pero cuando murió el pueblo abandonó los caminos de Dios: idolatría, abandono de la ley, inmoralidad; cada uno hacía como bien quería.\nEra un tiempo de sufrimiento y tristeza. Dios castigaba dejando que las naciones vecinas afligieran a Israel; cuando el pueblo pedía ayuda, Dios levantaba a un juez, también llamado libertador o salvador. Algunos fueron Otoniel, Barac, Gedeón, Jefté y Sansón. El ciclo se repitió una y otra vez: el pueblo abandona a Dios, Dios envía enemigos, el pueblo clama, Dios levanta un juez, el pueblo vuelve a servir a Dios por un tiempo.\nSiempre hubo personas fieles, como Rut y su familia, de la cual vendría el Salvador. Leemos de este tiempo en Jueces y Rut; duró más de 200 años."}, "verses": [{"r": "Jueces 2:11", "t": "Después los hijos de Israel hicieron lo malo ante los ojos de Jehová, y sirvieron a los baales."}, {"r": "Jueces 2:16", "t": "Y Jehová levantó jueces que los librasen de mano de los que les despojaban;"}, {"r": "Jueces 21:25", "t": "En estos días no había rey en Israel; cada uno hacía lo que bien le parecía."}, {"r": "Rut 4:17", "t": "Y le dieron nombre las vecinas, diciendo: Le ha nacido un hijo a Noemí; y lo llamaron Obed. Este es padre de Isaí, padre de David."}], "qs": [["¿Quiénes eran los jueces?", "Las personas que gobernaban a los israelitas después de la conquista", ["Los sacerdotes del templo", "Los reyes de Israel", "Los profetas del exilio"], "", ""], ["¿Qué otros nombres damos a los jueces, y por qué?", "Libertadores o salvadores, porque Dios salvaba a su pueblo por medio de ellos", ["Reyes, porque gobernaban todo", "Sacerdotes, porque ofrecían sacrificios", "Profetas, porque escribieron libros"], "", ""], ["¿Cómo era el "Cada paso quedó con su dato."}], "max": 12}, {"title": "El Reino Unido", "intro": {"t": "El sexto tiempo: el Reino Unido", "p": "Samuel fue el último de los jueces y un fiel profeta; llamó al pueblo a dejar la idolatría. Cuando era viejo, el pueblo pidió un rey que los defendiera. No era malo pedir un rey; lo malo era confiar en él y no en Dios. Samuel ungió a Saúl, que al principio fue bueno, pero después desobedeció, y Dios le quitó el reino.\nSamuel ungió entonces a David, un rey muy bueno que dio paz y prosperidad. Dios le prometió que siempre habría alguien de su familia gobernando al pueblo de Dios, promesa que se cumplió en Jesucristo. Después reinó Salomón, a quien Dios dio sabiduría, paz y riqueza, y que edificó el templo; pero se apartó de Dios y sirvió a los dioses falsos de sus esposas.\nLeemos de este tiempo en 1 y 2 de Samuel, 1 de Reyes y 1 de Crónicas. Entonces se escribieron Salmos, Proverbios, Eclesiastés y Cantares. Los tres reyes vivieron entre 1060 y 940 años antes de Cristo, con las doce tribus unidas."}, "verses": [{"r": "1 Samuel 8:7", "t": "Y dijo Jehová a Samuel: Oye la voz del pueblo en todo lo que te digan; porque no te han desechado a ti, sino a mí me han desechado, para que no reine sobre ellos."}, {"r": "1 Samuel 16:13", "t": "Y Samuel tomó el cuerno del aceite, y lo ungió en medio de sus hermanos; y desde aquel día en adelante el Espíritu de Jehová vino sobre David. Se levantó luego Samuel, y se volvió a Ramá."}, {"r": "1 Reyes 3:12", "t": "he aquí lo he hecho conforme a tus palabras; he aquí que te he dado corazón sabio y entendido, tanto que no ha habido antes de ti otro como tú, ni después de ti se levantará otro como tú."}], "qs": [["¿Qué ayuda prestó Samuel a Israel?", "Como fiel profeta, llamó al pueblo a dejar la idolatría", ["Edificó el templo", "Conquistó Canaán", "Escribió la ley"], "", ""], ["¿Quiénes fueron los tres reyes que gobernaron sobre las doce tribus unidas?", "Saúl, David y Salomón", ["David, Salomón y Roboam", " ey de Israel"], ["David", "Rey muy bueno; Dios le hizo una promesa"], ["Salomón", "Edificó el templo"]], "done": "Cada uno quedó con su dato."}], "max": 12}, {"title": "El Reino Dividido", "intro": {"t": "El séptimo tiempo: el Reino Dividido", "p": "El reino siguió unido 120 años con Saúl, David y Salomón. Con la muerte de Salomón se dividió, y así siguió unos 250 años. La división fue un castigo de Dios por el mucho pecado de Salomón, y a la vez el pecado de las diez tribus ayudó a causarla.\nDios dejó dos tribus al hijo de Salomón para cumplir su promesa a David: eran las del sur, llamadas Judá, con capital en Jerusalén. Las diez del norte siguieron con el nombre Israel, con capital en Samaria.\nTodos los reyes de Israel fueron malos: idolatría, injusticia e inmoralidad. Profetas como Elías y Eliseo los advirtieron sin éxito. Dios mandó a los asirios, que en el año 722 antes de Cristo conquistaron Israel y llevaron cautivas a las diez tribus. En Judá hubo algunos reyes buenos, y así siguió adelante el pueblo verdadero de Dios y las promesas del Salvador. Leemos de este tiempo en 1 y 2 de Reyes, 1 y 2 de Crónicas y los profetas Isaías, Oseas, Joel, Amós, Jonás y Miqueas."}, "verses": [{"r": "1 Reyes 11:11", "t": "Y dijo Jehová a Salomón: Por cuanto ha habido esto en ti, y no has guardado mi pacto y mis estatutos que yo te mandé, romperé de ti el reino, y lo entregaré a tu siervo."}, {"r": "1 Reyes 12:19", "t": "Así se apartó Israel de la casa de David hasta hoy."}, {"r": "2 Reyes 17:6", "t": "En el año nueve de Oseas, el rey de Asiria tomó Samaria, y llevó a Israel cautivo a Asiria, y los puso en Halah, en Habor junto al río Gozán, y en las ciudades de los medos."}, {"r": "2 Reyes 17:13", "t": "Jehová amonestó entonces a Israel y a Judá por medio de todos los profetas y de todos los videntes, diciendo: Volveos de vuestros malos caminos, y guardad mis mandamientos y mis ordenanzas, conforme a todas las leyes que yo prescribí a vuestros padres, y que os he enviado po ieron nunca, pero había miembros de ellas viviendo en Judá; así Dios salvó a algunos de toda la nación."}, "verses": [{"r": "Jeremías 25:11", "t": "Toda esta tierra será puesta en ruinas y en espanto; y servirán estas naciones al rey de Babilonia setenta años."}, {"r": "Jeremías 29:10", "t": "Porque así dijo Jehová: Cuando en Babilonia se cumplan los setenta años, yo os visitaré, y despertaré sobre vosotros mi buena palabra, para haceros volver a este lugar."}, {"r": "Salmo 137:1", "t": "Junto a los ríos de Babilonia, Allí nos sentábamos, y aun llorábamos, Acordándonos de Sion."}], "qs": [["¿En qué año llevaron cautivos los babilonios a los judíos?", "586 a. C. (la caída de Jerusalén)", ["722 a. C.", "536 a. C.", "1400 a. C."], "", ""], ["¿Cuánto tiempo duró el cautiverio?", "70 años", ["40 años", "140 años", "250 años"], "", ""], ["¿Cómo era el cautiverio para los judíos?", "Con cierta libertad (casas, tierras, religión), pero con tristeza y sin templo", ["Eran perseguidos todos los días sin descanso", "Vivían sin ninguna libertad", "Vivían mejor que antes"], "", ""], ["¿Por qué deshonró a Dios el cautiverio?", "Ya no había nación, ni templo, ni sacrificios que dieran testimonio de él", ["Porque los babilonios eran más fuertes", "Porque no había reyes", "Porque se perdieron las Escrituras"], "", ""], ["¿En qué libros leemos del tiempo del Cautiverio?", "Jeremías, Ezequiel, Daniel, Lamentaciones y el final de 2 Reyes y 2 Crónicas", ["Génesis y Éxodo", "Josué y Jueces", "Hageo y Malaquías"], "", ""], ["¿Qué pasó a las diez tribus del norte?", "No volvieron nunca; pero había miembros de ellas viviendo en Judá", ["Volvieron todas en el tiempo de Ciro", "Se unieron a Babilonia", "Fueron destruidas sin que quedara nadie"], "", ""], ["¿Fue el cautiverio el fin del pueblo de Dios?", "No: Dios haría volver a los judíos, y de ellos vendría el Salvador", ["Sí, Dios los abandonó para siempre", "Sí, desaparecieron como nación", "No, porque los babilonios los protegieron"], "", n entonces, y Ester cuenta cómo Dios guardó a los judíos que se quedaron en Babilonia.\nMalaquías fue el último profeta. Los 39 libros decían todo lo necesario para preparar la llegada de Cristo, y el pueblo tendría que meditarlos 400 años mientras esperaba al Salvador. Por fin vendría el anuncio del ángel: «os ha nacido hoy… un Salvador, que es Cristo el Señor». Ahí termina la primera parte de la Historia Sagrada y comienza la segunda: el Nuevo Testamento."}, "verses": [{"r": "Daniel 9:2", "t": "en el año primero de su reinado, yo Daniel miré atentamente en los libros el número de los años de que habló Jehová al profeta Jeremías, que habían de cumplirse las desolaciones de Jerusalén en setenta años."}, {"r": "Esdras 1:1", "t": "En el primer año de Ciro rey de Persia, para que se cumpliese la palabra de Jehová por boca de Jeremías, despertó Jehová el espíritu de Ciro rey de Persia, el cual hizo pregonar de palabra y también por escrito por todo su reino, diciendo:"}, {"r": "Nehemías 6:15", "t": "Fue terminado, pues, el muro, el veinticinco del mes de Elul, en cincuenta y dos días."}, {"r": "Lucas 2:10-11", "t": "Pero el ángel les dijo: No temáis; porque he aquí os doy nuevas de gran gozo, que será para todo el pueblo: que os ha nacido hoy, en la ciudad de David, un Salvador, que es CRISTO el Señor."}], "qs": [["¿Cómo supo Daniel que el cautiverio llegaba a su fin?", "Leyendo el libro del profeta Jeremías", ["Por un sueño del rey", "Porque lo dijo Ciro", "Por una señal en el cielo"], "", ""], ["¿Qué rey decretó que los judíos podían volver a su tierra?", "Ciro", ["Nabucodonosor", "Darío de Asiria", "Herodes"], "", ""], ["¿Quiénes dirigieron el regreso de los judíos?", "Zorobabel y Josué, el sumo sacerdote", ["Daniel y Ezequiel", "Saúl y David", "Jeremías y Ester"], "", ""], ["¿Quiénes ayudaron más tarde?", "Esdras y Nehemías", ["Hageo y Abdías", "Elías y Eliseo", "Gedeón y Sansón"], "", ""], ["¿Qué cosas construyeron los judíos al volver?", "El templo y los muros de
