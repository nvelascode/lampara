  {title:'Amad a vuestros enemigos',verses:[
    {r:'Mateo 5:38-39',t:"Oísteis que fue dicho: Ojo por ojo, y diente por diente. Pero yo os digo: No resistáis al que es malo; antes, a cualquiera que te hiera en la mejilla derecha, vuélvele también la otra;"},
    {r:'Mateo 5:41',t:"Y a cualquiera que te obligue a llevar carga por una milla, ve con él dos."},
    {r:'Mateo 5:43-44',t:"Oísteis que fue dicho: Amarás a tu prójimo, y aborrecerás a tu enemigo. Pero yo os digo: Amad a vuestros enemigos, bendecid a los que os maldicen, haced bien a los que os aborrecen, y orad por los que os ultrajan y os persiguen;"},
    {r:'Mateo 5:45',t:"para que seáis hijos de vuestro Padre que está en los cielos, que hace salir su sol sobre malos y buenos, y que hace llover sobre justos e injustos."}],
   qs:[
    ["Según Mateo 5:39, si alguien te hiere en la mejilla derecha, ¿qué dijo Jesús que hicieras?","Volverle también la otra",["Devolver el golpe","Acusarlo ante el juez","Huir de él"],"Mateo 5:38-39"],
    ["Según Mateo 5:41, si alguien te obliga a llevar carga por una milla, ¿qué debes hacer?","Ir con él dos",["Negarte","Cobrarle","Ir solo una"],"Mateo 5:41"],
    ["Según Mateo 5:44, ¿qué dijo Jesús que hiciéramos con nuestros enemigos?","Amarlos y orar por los que nos persiguen",["Evitarlos","Olvidarlos","Vencerlos"],"Mateo 5:43-44"],
    ["Según Mateo 5:45, ¿sobre quiénes hace salir el Padre su sol?","Sobre malos y buenos",["Solo sobre los justos","Solo sobre Israel","Solo sobre los que oran"],"Mateo 5:45","Amar al enemigo refleja el carácter del Padre, que da su sol y su lluvia a todos."]]},
  {title:'Hijos del Padre',verses:[
    {r:'Mateo 5:46',t:"Porque si amáis a los que os aman, ¿qué recompensa tendréis? ¿No hacen también lo mismo los publicanos?"},
    {r:'Mateo 5:48',t:"Sed, pues, vosotros perfectos, como vuestro Padre que está en los cielos es perfecto."},
    {r:'Mateo 6:1',t:"Guardaos de hacer vuestra justicia delante de los hombres, para ser vistos de ellos; de otra manera no tendréis recompensa de vuestro Padre que está en los cielos."}],
   qs:[
    ["Según Mateo 5:46, ¿quiénes también aman a los que los aman?","Los publicanos",["Los sacerdotes","Los escribas","Los levitas"],"Mateo 5:46"],
    ["Según Mateo 5:48, ¿cómo dijo Jesús que debemos ser?","Perfectos, como nuestro Padre celestial es perfecto",["Fuertes, como nuestro Padre es fuerte","Sabios, como nuestro Padre es sabio","Piadosos solo delante de los hombres"],"Mateo 5:48"],
    ["Según Mateo 6:1, ¿de qué debemos guardarnos?","De hacer nuestra justicia delante de los hombres para ser vistos de ellos",["De orar en la mañana","De hablar con los pecadores","De ayunar los lunes"],"Mateo 6:1"]]},
  {title:'Dar y orar en secreto',verses:[
    {r:'Mateo 6:4',t:"para que sea tu limosna en secreto; y tu Padre que ve en lo secreto te recompensará en público."},
    {r:'Mateo 6:6',t:"Mas tú, cuando ores, entra en tu aposento, y cerrada la puerta, ora a tu Padre que está en secreto; y tu Padre que ve en lo secreto te recompensará en público."},
    {r:'Mateo 6:7',t:"Y orando, no uséis vanas repeticiones, como los gentiles, que piensan que por su palabrería serán oídos."},
    {r:'Mateo 6:8',t:"No os hagáis, pues, semejantes a ellos; porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis."}],
   qs:[
    ["Según Mateo 6:4, ¿cómo te recompensará el Padre que ve en lo secreto?","En público",["En secreto","Con silencio","Con riquezas"],"Mateo 6:4"],
    ["Según Mateo 6:6, ¿dónde debes orar?","En tu aposento, con la puerta cerrada",["En la plaza para ser visto","Solo en el templo","Solo en la sinagoga"],"Mateo 6:6"],
    ["Según Mateo 6:7, ¿qué no debemos usar al orar?","Vanas repeticiones",["Palabras en voz baja","Lágrimas","Cantos"],"Mateo 6:7"],
    ["Según Mateo 6:8, ¿qué sabe el Padre antes de que le pidamos?","De qué cosas tenemos necesidad",["Cuánto hemos pecado","Quién nos escucha","Cuántas oraciones hemos hecho"],"Mateo 6:8"]]},
  {title:'Padre nuestro',verses:[
    {r:'Mateo 6:9',t:"Vosotros, pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre."},
    {r:'Mateo 6:10',t:"Venga tu reino. Hágase tu voluntad, como en el cielo, así también en la tierra."},
    {r:'Mateo 6:11',t:"El pan nuestro de cada día, dánoslo hoy."},
    {r:'Mateo 6:12',t:"Y perdónanos nuestras deudas, como también nosotros perdonamos a nuestros deudores."}],
   qs:[
    ["«Hágase tu voluntad, como en el cielo…», ¿qué sigue?","Así también en la tierra",["Por siempre y para siempre","Hoy y todos los días","En tu santo nombre"],"Mateo 6:10"],
    ["¿Qué se pide que se nos dé hoy?","El pan nuestro de cada día",["Las riquezas del reino","El descanso de la noche","La sabiduría de lo alto"],"Mateo 6:11"]]},
  {title:'Perdonar y ser perdonado',verses:[
    {r:'Mateo 6:14',t:"Porque si perdonáis a los hombres sus ofensas, os perdonará también a vosotros vuestro Padre celestial;"},
    {r:'Mateo 6:15',t:"mas si no perdonáis a los hombres sus ofensas, tampoco vuestro Padre os perdonará vuestras ofensas."}],
   qs:[
    ["Según Mateo 6:14, si perdonáis a los hombres sus ofensas, ¿qué pasa?","Vuestro Padre celestial os perdonará también",["Los hombres os perdonarán","Seréis libres de toda deuda","Dios olvidará vuestras ofensas pasadas"],"Mateo 6:14"],
    ["Según Mateo 6:15, si no perdonáis a los hombres sus ofensas, ¿qué pasa?","Tampoco vuestro Padre os perdonará",["Los hombres se alejarán de vosotros","Dios os castigará de inmediato","Nada cambia"],"Mateo 6:15","Quien ha sido perdonado, perdona. Jesús lo ilustra con el siervo que no perdonó (Mateo 18:21-35)."],
    ["En el Padre nuestro (Mateo 6:12), ¿cómo pedimos que se nos perdonen las deudas?","Como nosotros perdonamos a nuestros deudores",["Según nuestros méritos","Cuando lo merezcamos","Solo al final de la vida"],"Mateo 6:12"]]},
  {title:'Tesoros en el cielo',verses:[
    {r:'Mateo 6:19',t:"No os hagáis tesoros en la tierra, donde la polilla y el orín corrompen, y donde ladrones minan y hurtan;"},
    {r:'Mateo 6:20',t:"sino haceos tesoros en el cielo, donde ni la polilla ni el orín corrompen, y donde ladrones no minan ni hurtan."},
    {r:'Mateo 6:21',t:"Porque donde esté vuestro tesoro, allí estará también vuestro corazón."},
    {r:'Mateo 6:24',t:"Ninguno puede servir a dos señores; porque o aborrecerá al uno y amará al otro, o estimará al uno y menospreciará al otro. No podéis servir a Dios y a las riquezas."}],
   qs:[
    ["Según Mateo 6:19, ¿qué corrompen la polilla y el orín?","Los tesoros de la tierra",["Las obras de la ley","Las ofrendas del templo","Los frutos del huerto"],"Mateo 6:19"],
    ["Según Mateo 6:20, ¿dónde debemos hacernos tesoros?","En el cielo",["En los graneros","En el templo","En la casa"],"Mateo 6:20"],
    ["Según Mateo 6:21, ¿dónde estará nuestro corazón?","Donde esté nuestro tesoro",["Donde esté nuestra familia","Donde esté nuestro trabajo","Donde esté nuestro hogar"],"Mateo 6:21"],
    ["Según Mateo 6:24, ¿a quiénes no podemos servir a la vez?","A Dios y a las riquezas",["A Dios y al César","A Dios y a los hombres","A Dios y a la ley"],"Mateo 6:24"]]},
  {title:'Las aves y los lirios',verses:[
    {r:'Mateo 6:25',t:"Por tanto os digo: No os afanéis por vuestra vida, qué habéis de comer o qué habéis de beber; ni por vuestro cuerpo, qué habéis de vestir. ¿No es la vida más que el alimento, y el cuerpo más que el vestido?"},
    {r:'Mateo 6:26',t:"Mirad las aves del cielo, que no siembran, ni siegan, ni recogen en graneros; y vuestro Padre celestial las alimenta. ¿No valéis vosotros mucho más que ellas?"},
    {r:'Mateo 6:28-29',t:"Y por el vestido, ¿por qué os afanáis? Considerad los lirios del campo, cómo crecen: no trabajan ni hilan; pero os digo, que ni aun Salomón con toda su gloria se vistió así como uno de ellos."}],
   qs:[
    ["Según Mateo 6:25, ¿qué dijo Jesús que no hiciéramos por nuestra vida?","Afanarnos por qué comer o beber",["Trabajar por el pan de cada día","Guardar para el futuro","Dar gracias antes de comer"],"Mateo 6:25"],
    ["Según Mateo 6:26, ¿quién alimenta a las aves del cielo?","Vuestro Padre celestial",["Los sembradores","La naturaleza","Los ángeles"],"Mateo 6:26"],
    ["Según Mateo 6:28-29, ¿qué ejemplo usa Jesús al hablar del vestido?","Los lirios del campo",["Las aves del cielo","Los árboles del huerto","Las ovejas del pastor"],"Mateo 6:28-29"],
    ["Según Mateo 6:29, ¿quién no se vistió con toda su gloria como uno de los lirios?","Salomón",["David","Moisés","Elías"],"Mateo 6:28-29"]]},
  {title:'Buscad primeramente el reino',verses:[
    {r:'Mateo 6:31-32',t:"No os afanéis, pues, diciendo: ¿Qué comeremos, o qué beberemos, o qué vestiremos? Porque los gentiles buscan todas estas cosas; pero vuestro Padre celestial sabe que tenéis necesidad de todas estas cosas."},
    {r:'Mateo 6:33',t:"Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas."},
    {r:'Mateo 6:34',t:"Así que, no os afanéis por el día de mañana, porque el día de mañana traerá su afán. Basta a cada día su propio mal."}],
   qs:[
    ["Según Mateo 6:32, ¿quiénes buscan todas estas cosas?","Los gentiles",["Los publicanos","Los escribas","Los fariseos"],"Mateo 6:31-32"],
    ["Según Mateo 6:33, ¿qué debemos buscar primeramente?","El reino de Dios y su justicia",["Las riquezas y la salud","La paz y el descanso","El reconocimiento de los hombres"],"Mateo 6:33"],
    ["Según Mateo 6:33, ¿qué nos será añadido?","Todas estas cosas",["Una larga vida","La sabiduría","Un gran nombre"],"Mateo 6:33"],
    ["Según Mateo 6:34, ¿qué basta a cada día?","Su propio mal",["Su propia luz","Su propio pan","Su propio descanso"],"Mateo 6:34"]]}
 ]},
 {title:'El Evangelio de Juan',sub:'Juan 1, 3, 6, 8, 10, 11, 14',lessons:[
  {title:'El Verbo y el amor de Dios',verses:[
    {r:'Juan 1:1',t:"En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios."},
    {r:'Juan 1:14',t:"Y aquel Verbo fue hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad."},
    {r:'Juan 3:16',t:"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."},
    {r:'Juan 11:35',t:"Jesús lloró."}],
   qs:[
    ["¿Quién era con Dios y era Dios, según Juan 1:1?","El Verbo",["El profeta","El ángel","El sacerdote"],"Juan 1:1"],
    ["¿A quién ha dado Dios, según Juan 3:16?","A su Hijo unigénito",["A su siervo Moisés","A su pueblo Israel","A su ángel"],"Juan 3:16"]]},
  {title:'Yo soy',verses:[
    {r:'Juan 6:35',t:"Jesús les dijo: Yo soy el pan de vida; el que a mí viene, nunca tendrá hambre; y el que en mí cree, no tendrá sed jamás."},
    {r:'Juan 8:12',t:"Otra vez Jesús les habló, diciendo: Yo soy la luz del mundo; el que me sigue, no andará en tinieblas, sino que tendrá la luz de la vida."},
    {r:'Juan 10:11',t:"Yo soy el buen pastor; el buen pastor su vida da por las ovejas."},
    {r:'Juan 14:6',t:"Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí."}],
   qs:[
    ["Según Juan 6:35, ¿qué dijo Jesús que es?","El pan de vida",["La sal de la tierra","El agua del pozo","La roca del desierto"],"Juan 6:35"],
    ["Según Juan 8:12, ¿qué tendrá el que sigue a Jesús?","La luz de la vida",["Riquezas","Reposo","Un nombre nuevo"],"Juan 8:12"],
    ["Según Juan 10:11, ¿qué da el buen pastor por las ovejas?","Su vida",["Su manto","Su vara","Su pan"],"Juan 10:11"]]}
 ]},
 {title:'Salvación por gracia',sub:'Romanos y Efesios',lessons:[
  {title:'Pecado y gracia',verses:[
    {r:'Romanos 3:23',t:"por cuanto todos pecaron, y están destituidos de la gloria de Dios,"},
    {r:'Romanos 5:8',t:"Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros."},
    {r:'Romanos 6:23',t:"Porque la paga del pecado es muerte, mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro."},
    {r:'Romanos 8:1',t:"Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, sino conforme al Espíritu."}],
   qs:[
    ["Según Romanos 6:23, ¿cuál es la paga del pecado?","Muerte",["Esclavitud","Tristeza","Olvido"],"Romanos 6:23"],
    ["Según Romanos 6:23, ¿qué es la dádiva de Dios en Cristo Jesús?","Vida eterna",["Paz en la tierra","Riquezas del cielo","Sabiduría"],"Romanos 6:23"],
    ["Según Romanos 5:8, ¿cuándo murió Cristo por nosotros?","Siendo aún pecadores",["Cuando lo buscamos","Cuando obedecimos la ley","Cuando lo pedimos"],"Romanos 5:8"]]},
  {title:'Fe y salvación',verses:[
    {r:'Romanos 8:28',t:"Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados."},
    {r:'Romanos 10:9',t:"que si confesares con tu boca que Jesús es el Señor, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo."},
    {r:'Efesios 2:8',t:"Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;"},
    {r:'Efesios 2:9',t:"no por obras, para que nadie se gloríe."}],
   qs:[
    ["Según Efesios 2:8, ¿por medio de qué somos salvos?","Por medio de la fe",["Por medio de la ley","Por medio del esfuerzo","Por medio del ayuno"],"Efesios 2:8"],
    ["Según Efesios 2:9, ¿para qué la salvación no es por obras?","Para que nadie se gloríe",["Para que todos trabajen","Para que la ley se cumpla","Para que haya reposo"],"Efesios 2:9"],
    ["Según Romanos 10:9, ¿qué se confiesa con la boca?","Que Jesús es el Señor",["Que Dios es justo","Que el pecado es grande","Que el cielo es eterno"],"Romanos 10:9"]]}
 ]}
 ,{title:'Atributos de Dios (1)',sub:'Su ser y su conocimiento',lessons:[
  {title:'Santo, espíritu y uno',verses:[
    {r:'Isaías 6:3',t:"Y el uno al otro daba voces, diciendo: Santo, santo, santo, Jehová de los ejércitos; toda la tierra está llena de su gloria."},
    {r:'Juan 4:24',t:"Dios es Espíritu; y los que le adoran, en espíritu y en verdad es necesario que adoren."},
    {r:'Deuteronomio 6:4',t:"Oye, Israel: Jehová nuestro Dios, Jehová uno es."}],
   qs:[
    ["¿Cuántas veces se repite «santo» en Isaías 6:3?","Tres veces",["Una vez","Dos veces","Siete veces"],"Isaías 6:3"],
    ["Según Juan 4:24, ¿qué es Dios?","Espíritu",["Un ángel","Un hombre","Una fuerza"],"Juan 4:24"],
    ["Según Deuteronomio 6:4, ¿cuántos es Jehová nuestro Dios?","Uno",["Dos","Tres","Muchos"],"Deuteronomio 6:4","Un solo Dios verdadero, que existe eternamente como Padre, Hijo y Espíritu Santo."]]},
  {title:'Dios por sí mismo',intro:{t:'Aseidad: Dios existe por sí mismo',p:'Aseidad significa que Dios tiene vida en sí mismo. No depende de nadie para existir ni para ser quien es; todo lo demás depende de él.'},
   verses:[
    {r:'Juan 5:26',t:"Porque como el Padre tiene vida en sí mismo, así también ha dado al Hijo el tener vida en sí mismo;"},
    {r:'Hechos 17:25',t:"ni es honrado por manos de hombres, como si necesitase de algo; pues él es quien da a todos vida y aliento y todas las cosas."},
    {r:'Jeremías 10:10',t:"Mas Jehová es el Dios verdadero; él es Dios vivo y Rey eterno; a su ira tiembla la tierra, y las naciones no pueden sufrir su indignación."}],
   qs:[
    ["Según Juan 5:26, ¿dónde tiene vida el Padre?","En sí mismo",["En el templo","En los cielos solamente","En sus obras"],"Juan 5:26"],
    ["Según Hechos 17:25, ¿por qué Dios no necesita ser servido por manos de hombres?","Porque él da a todos vida y aliento y todas las cosas",["Porque está lejos de los hombres","Porque los ángeles lo sirven","Porque no se interesa por los hombres"],"Hechos 17:25"],
    ["El nombre «YO SOY EL QUE SOY» apunta a un Dios que…","Existe por sí mismo",["Cambia con el tiempo","Depende de su pueblo","Solo existe en el templo"],"Éxodo 3:14","«YO SOY» expresa que Dios existe por sí mismo y no depende de nadie."],
    ["Según Jeremías 10:10, ¿cómo es Jehová?","El Dios verdadero, Dios vivo y Rey eterno",["Un dios entre muchos","Un dios de los montes","Un dios olvidado"],"Jeremías 10:10"]]},
  {title:'Creador de todas las cosas',verses:[
    {r:'Salmo 33:6',t:"Por la palabra de Jehová fueron hechos los cielos, Y todo el ejército de ellos por el aliento de su boca."},
    {r:'Salmo 33:9',t:"Porque él dijo, y fue hecho; Él mandó, y existió."},
    {r:'Apocalipsis 4:11',t:"Señor, digno eres de recibir la gloria y la honra y el poder; porque tú creaste todas las cosas, y por tu voluntad existen y fueron creadas."},
    {r:'Hebreos 11:3',t:"Por la fe entendemos haber sido constituido el universo por la palabra de Dios, de modo que lo que se ve fue hecho de lo que no se veía."},
    {r:'Colosenses 1:16',t:"Porque en él fueron creadas todas las cosas, las que hay en los cielos y las que hay en la tierra, visibles e invisibles; sean tronos, sean dominios, sean principados, sean potestades; todo fue creado por medio de él y para él."}],
   qs:[
    ["Según Salmo 33:6, ¿por qué fueron hechos los cielos?","Por la palabra de Jehová",["Por el poder de los ángeles","Por el paso del tiempo","Por la voluntad de los reyes"],"Salmo 33:6"],
    ["Según Salmo 33:9, ¿qué pasó cuando Dios dijo?","Fue hecho",["Fue detenido","Fue olvidado","Fue postergado"],"Salmo 33:9"],
    ["Según Apocalipsis 4:11, ¿por qué existen y fueron creadas todas las cosas?","Por la voluntad de Dios",["Por el azar","Por la necesidad","Por los hombres"],"Apocalipsis 4:11"]]},
  {title:'Sabio, presente y eterno',verses:[
    {r:'Salmo 147:5',t:"Grande es el Señor nuestro, y de mucho poder; Y su entendimiento es infinito."},
    {r:'Salmo 139:7',t:"¿A dónde me iré de tu Espíritu? ¿Y a dónde huiré de tu presencia?"},
    {r:'Salmo 90:2',t:"Antes que naciesen los montes Y formases la tierra y el mundo, Desde el siglo y hasta el siglo, tú eres Dios."}],
   qs:[
    ["Según Salmo 147:5, ¿cómo es el entendimiento del Señor?","Infinito",["Limitado","Oculto","Cambiante"],"Salmo 147:5"],
    ["En Salmo 139:7, el salmista pregunta: «¿A dónde huiré de…?»","Tu presencia",["Tu ley","Tu templo","Tu ira"],"Salmo 139:7"],
    ["Según Salmo 90:2, ¿desde cuándo y hasta cuándo es Dios?","Desde el siglo y hasta el siglo",["Desde el diluvio hasta hoy","Desde Abraham hasta Cristo","Desde la creación del hombre"],"Salmo 90:2"]]},
  {title:'Todo lo conoce',verses:[
    {r:'Salmo 139:1-2',t:"Oh Jehová, tú me has examinado y conocido. Tú has conocido mi sentarme y mi levantarme; Has entendido desde lejos mis pensamientos."},
    {r:'Hebreos 4:13',t:"Y no hay cosa creada que no sea manifiesta en su presencia; antes bien todas las cosas están desnudas y abiertas a los ojos de aquel a quien tenemos que dar cuenta."},
    {r:'1 Juan 3:20',t:"pues si nuestro corazón nos reprende, mayor que nuestro corazón es Dios, y él sabe todas las cosas."},
    {r:'Mateo 10:29-30',t:"¿No se venden dos pajarillos por un cuarto? Con todo, ni uno de ellos cae a tierra sin vuestro Padre. Pues aun vuestros cabellos están todos contados."}],
   qs:[
    ["Según Salmo 139:1-2, ¿qué ha entendido Dios desde lejos?","Mis pensamientos",["Mis obras","Mis viajes","Mis sueños"],"Salmo 139:1-2"],
    ["Según Hebreos 4:13, ¿cómo están todas las cosas ante los ojos de Dios?","Desnudas y abiertas",["Ocultas y cerradas","Olvidadas","Sin importancia"],"Hebreos 4:13"],
    ["Según 1 Juan 3:20, ¿qué sabe Dios?","Todas las cosas",["Solo lo que hacemos","Solo lo pasado","Solo lo bueno"],"1 Juan 3:20"],
    ["Según Mateo 10:30, ¿qué está contado por el Padre?","Los cabellos de vuestra cabeza",["Los pasos del camino","Las lágrimas de los justos","Los años de la vida"],"Mateo 10:29-30"]]},
  {title:'Presente en todo lugar',verses:[
    {r:'Jeremías 23:24',t:"¿Se ocultará alguno, dice Jehová, en escondrijos que yo no lo vea? ¿No lleno yo, dice Jehová, el cielo y la tierra?"},
    {r:'Salmo 139:8',t:"Si subiere a los cielos, allí estás tú; Y si en el Seol hiciere mi estrado, he aquí, allí tú estás."},
    {r:'Salmo 139:9-10',t:"Si tomare las alas del alba Y habitare en el extremo del mar, Aun allí me guiará tu mano, Y me asirá tu diestra."}],
   qs:[
    ["Según Jeremías 23:24, ¿qué llena Jehová?","El cielo y la tierra",["Solo el templo","Solo Jerusalén","Solo el cielo"],"Jeremías 23:24"],
    ["Según Salmo 139:8, si el salmista sube a los cielos, ¿quién está allí?","Dios",["Nadie","Solo los ángeles","El silencio"],"Salmo 139:8"],
    ["Según Salmo 139:9-10, aun en el extremo del mar, ¿qué lo guiaría?","La mano de Dios",["El viento","Una estrella","Su propia fuerza"],"Salmo 139:9-10"]]},
  {title:'Conoce lo por venir',intro:{t:'Presciencia de Dios',p:'Presciencia significa que Dios conoce de antemano lo que sucederá, desde el principio hasta el fin. Nada le sorprende: anuncia lo por venir desde el principio (Isaías 46:10).'},
   verses:[
    {r:'Isaías 46:9-10',t:"Acordaos de las cosas pasadas desde los tiempos antiguos; porque yo soy Dios, y no hay otro Dios, y nada hay semejante a mí, que anuncio lo por venir desde el principio, y desde la antigüedad lo que aún no era hecho; que digo: Mi consejo permanecerá, y haré todo lo que quiero;"},

    {r:'1 Pedro 1:2',t:"elegidos según la presciencia de Dios Padre en santificación del Espíritu, para obedecer y ser rociados con la sangre de Jesucristo: Gracia y paz os sean multiplicadas."}],
   qs:[

    ["Según 1 Pedro 1:2, ¿según qué son elegidos los creyentes?","Según la presciencia de Dios Padre",["Según sus obras","Según su edad","Según la ley"],"1 Pedro 1:2"]]},

  {title:'Grande e incomprensible',verses:[

 ]}
 ,{title:'Atributos de Dios (2)',sub:'Su poder y su carácter',lessons:[
  {title:'Todopoderoso',verses:[
    {r:'Génesis 17:1',t:"Era Abram de edad de noventa y nueve años, cuando le apareció Jehová y le dijo: Yo soy el Dios Todopoderoso; anda delante de mí y sé perfecto."},
    {r:'Job 42:2',t:"Yo conozco que todo lo puedes, Y que no hay pensamiento que se esconda de ti."},
    {r:'Lucas 1:37',t:"porque nada hay imposible para Dios."}],
   qs:[
    ["Según Génesis 17:1, ¿cómo se presenta Dios a Abram?","Como el Dios Todopoderoso",["Como el Dios de los montes","Como el Dios de los hebreos","Como el Dios de los ejércitos"],"Génesis 17:1"],

  {title:'Poder, soberanía y justicia',verses:[

    ["Según Deuteronomio 32:4, ¿cómo son todos los caminos de Dios?","Rectitud",["Misterio","Sombra","Tinieblas"],"Deuteronomio 32:4"]]},
  {title:'Soberano sobre todo',verses:[
    {r:'Daniel 4:35',t:"Todos los habitantes de la tierra son considerados como nada; y él hace según su voluntad en el ejército del cielo, y en los habitantes de la tierra, y no hay quien detenga su mano, y le diga: ¿Qué haces?"},

    {r:'Salmo 103:19',t:"Jehová estableció en los cielos su trono, Y su reino domina sobre todos."}],
   qs:[

    ["Según Proverbios 21:1, ¿en la mano de quién está el corazón del rey?","En la mano de Jehová",["En la mano de sus consejeros","En la mano del pueblo","En la mano de sus enemigos"],"Proverbios 21:1"],
    ["Según Salmo 103:19, ¿sobre quiénes domina el reino de Jehová?","Sobre todos",["Solo sobre Israel","Solo sobre los justos","Solo sobre los ángeles"],"Salmo 103:19"]]},
  {title:'Los decretos de Dios',intro:{t:'Los decretos de Dios',p:'Los decretos de Dios son su plan eterno: lo que él determinó que sucedería. La Escritura dice que su consejo permanece para siempre y que hace todas las cosas según el designio de su voluntad.'},
   verses:[
    {r:'Isaías 14:27',t:"Porque Jehová de los ejércitos lo ha determinado, ¿y quién lo impedirá? Y su mano extendida, ¿quién la hará retroceder?"},
    {r:'Salmo 33:11',t:"El consejo de Jehová permanecerá para siempre; Los pensamientos de su corazón por todas las generaciones."},
    {r:'Efesios 1:11',t:"En él asimismo tuvimos herencia, habiendo sido predestinados conforme al propósito del que hace todas las cosas según el designio de su voluntad,"}],
   qs:[
    ["Según Isaías 14:27, cuando Jehová determina algo, ¿quién puede impedirlo?","Nadie",["Los reyes","Los ángeles","El pueblo si ora"],"Isaías 14:27"],
    ["Según Salmo 33:11, ¿por cuánto tiempo permanece el consejo de Jehová?","Para siempre",["Por una generación","Hasta que el pueblo lo cambie","Por siete años"],"Salmo 33:11"],
    ["Según Efesios 1:11, ¿conforme a qué hace Dios todas las cosas?","Conforme al designio de su voluntad",["Conforme a la suerte","Conforme a los deseos de los hombres","Conforme a la ley natural"],"Efesios 1:11"]]},
  {title:'Inmutable, amor y verdad',verses:[

    ["Según 1 Juan 4:8, el que no ama no ha conocido a Dios, porque Dios es…","Amor",["Justicia","Poder","Silencio"],"1 Juan 4:8"],

  {title:'Bueno para con todos',verses:[

    ["Según Salmo 100:5, ¿qué es para siempre?","Su misericordia",["Su ira","Su templo","Su ley"],"Salmo 100:5"]]},
  {title:'Paciente y misericordioso',verses:[
    {r:'Éxodo 34:6',t:"Y pasando Jehová por delante de él, proclamó: ¡Jehová! ¡Jehová! fuerte, misericordioso y piadoso; tardo para la ira, y grande en misericordia y verdad;"},
    {r:'Salmo 103:8',t:"Misericordioso y clemente es Jehová; Lento para la ira, y grande en misericordia."},

    ["Según Romanos 2:4, ¿qué te guía al arrepentimiento?","La benignidad de Dios",["El temor de los hombres","La ley sola","El castigo"],"Romanos 2:4"]]},
  {title:'Fiel y veraz',verses:[

  {title:'Justicia e ira de Dios',verses:[

  {title:'Un Dios celoso',verses:[

    ["Según Deuteronomio 4:24, ¿qué es Jehová tu Dios?","Fuego consumidor",["Luz apacible","Roca sin voz","Río de paz"],"Deuteronomio 4:24"],

  {title:'El amor de Dios',verses:[

    {r:'Sofonías 3:17',t:"Jehová está en medio de ti, poderoso, él salvará; se gozará sobre ti con alegría, callará de amor, se regocijará sobre ti con cánticos."}],

 ,{title:'Doctrinas fundamentales',sub:'Lo esencial del evangelio',lessons:[
  {title:'Pecado',intro:{t:'¿Qué es el pecado?',p:'Según la Biblia, el pecado es infracción de la ley de Dios (1 Juan 3:4). Todos nacen en Adán con una naturaleza inclinada al mal y, por sí mismos, no pueden volverse a Dios.'},
   verses:[
    {r:'1 Juan 3:4',t:"Todo aquel que comete pecado, infringe también la ley; pues el pecado es infracción de la ley."},
    {r:'Romanos 5:12',t:"Por tanto, como el pecado entró en el mundo por un hombre, y por el pecado la muerte, así la muerte pasó a todos los hombres, por cuanto todos pecaron."},
    {r:'Salmo 51:5',t:"He aquí, en maldad he sido formado, Y en pecado me concibió mi madre."},
    {r:'Efesios 2:1',t:"Y él os dio vida a vosotros, cuando estabais muertos en vuestros delitos y pecados,"}],
   qs:[
    ["Según 1 Juan 3:4, ¿qué es el pecado?","Infracción de la ley",["Un error sin culpa","Una debilidad del cuerpo","Una idea equivocada"],"1 Juan 3:4"],
    ["Según Romanos 5:12, ¿cómo entró el pecado en el mundo?","Por un hombre",["Por el mar","Por la ley de Moisés","Por los ángeles"],"Romanos 5:12","Ese hombre es Adán, cabeza de la humanidad: por su pecado entró la muerte a todos (Romanos 5:12-19)."],
    ["Según Efesios 2:1, ¿cómo estaban los creyentes antes de que Dios les diera vida?","Muertos en delitos y pecados",["Enfermos, pero capaces de buscar a Dios","Dormidos en la fe","Ignorantes de la ley"],"Efesios 2:1","El pecado alcanza a toda la persona: mente, afectos y voluntad. Por eso la salvación comienza con Dios, que da vida al que está muerto."]]},
  {title:'Gracia y misericordia',intro:{t:'Gracia y misericordia',p:'Gracia es el favor inmerecido de Dios hacia quien merece castigo. Misericordia es que Dios no nos da el castigo que merecemos. La salvación es toda por gracia: desde la vida nueva que Dios da al muerto en pecados (Efesios 2:5) hasta la fe misma (Efesios 2:8).'},
   verses:[
    {r:'Romanos 11:6',t:"Y si por gracia, ya no es por obras; de otra manera la gracia ya no es gracia."},
    {r:'Efesios 2:4',t:"Pero Dios, que es rico en misericordia, por su gran amor con que nos amó,"},
    {r:'Efesios 2:5',t:"aun estando nosotros muertos en pecados, nos dio vida juntamente con Cristo (por gracia sois salvos),"},
    {r:'Lamentaciones 3:22-23',t:"Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad."},
    {r:'Tito 3:5',t:"nos salvó, no por obras de justicia que nosotros hubiéramos hecho, sino por su misericordia, por el lavamiento de la regeneración y por la renovación en el Espíritu Santo,"}],
   qs:[
    ["Según Romanos 11:6, si la salvación es por gracia, ¿qué ya no es?","Por obras",["Por fe","Por amor","Por la cruz"],"Romanos 11:6"],
    ["Según Tito 3:5, ¿por qué nos salvó Dios?","Por su misericordia",["Por nuestras obras de justicia","Por nuestra sabiduría","Por nuestra fidelidad"],"Tito 3:5"],
    ["Según Efesios 2:5, ¿qué hizo Dios con nosotros estando muertos en pecados?","Nos dio vida juntamente con Cristo",["Nos dio una segunda oportunidad","Nos envió un maestro","Nos dio más tiempo"],"Efesios 2:5","Dios da vida nueva al pecador, y la fe es fruto de esa obra suya."],
    ["¿Cuál es la diferencia entre gracia y misericordia?","Gracia: recibir lo que no merecemos. Misericordia: no recibir lo que merecemos",["Son exactamente lo mismo","Gracia es para los justos; misericordia, para los pecadores","Gracia es obra humana; misericordia es obra divina"],"Efesios 2:4"]]},
  {title:'Redención',intro:{t:'¿Qué es la redención?',p:'Redimir es liberar mediante el pago de un precio. Las Escrituras dicen que el precio fue la sangre de Cristo.'},
   verses:[
    {r:'Efesios 1:7',t:"en quien tenemos redención por su sangre, el perdón de pecados según las riquezas de su gracia,"},
    {r:'1 Pedro 1:18-19',t:"sabiendo que fuisteis rescatados de vuestra vana manera de vivir, la cual recibisteis de vuestros padres, no con cosas corruptibles, como oro o plata, sino con la sangre preciosa de Cristo, como de un cordero sin mancha y sin contaminación,"},
    {r:'Marcos 10:45',t:"Porque el Hijo del Hombre no vino para ser servido, sino para servir, y para dar su vida en rescate por muchos."}],
   qs:[
    ["Según Efesios 1:7, ¿por medio de qué tenemos redención?","Por su sangre",["Por la ley","Por el templo","Por el ayuno"],"Efesios 1:7"],
    ["Según 1 Pedro 1:18-19, ¿con qué fuimos rescatados?","Con la sangre preciosa de Cristo",["Con oro o plata","Con buenas obras","Con sacrificios de animales"],"1 Pedro 1:18-19"],
    ["Según Marcos 10:45, ¿para qué dio su vida el Hijo del Hombre?","En rescate por muchos",["Como simple ejemplo","Para fundar una escuela","Para juzgar a las naciones"],"Marcos 10:45"]]},
  {title:'Expiación y propiciación',intro:{t:'Expiación y propiciación',p:'Cristo llevó el castigo del pecado en lugar de los pecadores. «Propiciación» significa que satisfizo la justa ira de Dios. Murió para salvar con certeza a su pueblo, a sus ovejas (Mateo 1:21; Juan 10:15).'},
   verses:[
    {r:'Isaías 53:5',t:"Mas él herido fue por nuestras rebeliones, molido por nuestros pecados; el castigo de nuestra paz fue sobre él, y por su llaga fuimos nosotros curados."},
    {r:'Romanos 3:25',t:"a quien Dios puso como propiciación por medio de la fe en su sangre, para manifestar su justicia, a causa de haber pasado por alto, en su paciencia, los pecados pasados,"},
    {r:'Hebreos 9:22',t:"Y casi todo es purificado, según la ley, con sangre; y sin derramamiento de sangre no se hace remisión."},
    {r:'Mateo 1:21',t:"Y dará a luz un hijo, y llamarás su nombre JESÚS, porque él salvará a su pueblo de sus pecados."},
    {r:'Juan 10:15',t:"así como el Padre me conoce, y yo conozco al Padre; y pongo mi vida por las ovejas."}],
   qs:[
    ["Según Isaías 53:5, ¿por qué fue molido el Siervo?","Por nuestros pecados",["Por sus propios pecados","Por la ley de Moisés","Por los ángeles"],"Isaías 53:5"],
    ["Según Hebreos 9:22, sin derramamiento de sangre no se hace…","Remisión",["Reposo","Alabanza","Templo"],"Hebreos 9:22"],
    ["¿Qué significa que Cristo es «propiciación»?","Que satisface la justa ira de Dios contra el pecado",["Que es un buen maestro moral","Que revela el camino a Dios","Que anula toda ley"],"Romanos 3:25","Cristo cargó el castigo que merecíamos y satisfizo la justicia de Dios."],
    ["Según Mateo 1:21, ¿a quiénes salvará Jesús de sus pecados?","A su pueblo",["A quienes lo merezcan","A los que guarden la ley","A las naciones que se esfuercen"],"Mateo 1:21","Jesús salva con certeza a «su pueblo» (Mt 1:21) y da su vida por «las ovejas» (Jn 10:15)."]]},
  {title:'Predestinación y elección',intro:{t:'Predestinación y elección',p:'Predestinar es determinar de antemano. La Biblia dice que Dios escogió a los suyos antes de la fundación del mundo (Efesios 1:4-5). Esto no anula el llamado del evangelio a todos: quien viene a Cristo no es echado fuera (Juan 6:37).'},
   verses:[
    {r:'Efesios 1:4',t:"según nos escogió en él antes de la fundación del mundo, para que fuésemos santos y sin mancha delante de él,"},
    {r:'Efesios 1:5',t:"en amor habiéndonos predestinado para ser adoptados hijos suyos por medio de Jesucristo, según el puro afecto de su voluntad,"},

{"title": "De Caín a Babel", "sub": "Génesis 4–11", "lessons": [{"title": "Caín y Abel", "verses": [{"r": "Génesis 4:2", "t": "Después dio a luz a su hermano Abel. Y Abel fue pastor de ovejas, y Caín fue labrador de la tierra."}, {"r": "Génesis 4:3", "t": "Y aconteció andando el tiempo, que Caín trajo del fruto de la tierra una ofrenda a Jehová."}, {"r": "Génesis 4:4", "t": "Y Abel trajo también de los primogénitos de sus ovejas, de lo más gordo de ellas. Y miró Jehová con agrado a Abel y a su ofrenda;"}, {"r": "Génesis 4:5", "t": "pero no miró con agrado a Caín y a la ofrenda suya. Y se ensañó Caín en gran manera, y decayó su semblante."}], "qs": [["Según Génesis 4:2, ¿a qué se dedicaba Abel?", "Era pastor de ovejas", ["Era labrador de la tierra", "Era cazador", "Era constructor de ciudades"], "Génesis 4:2"], ["Según Génesis 4:3, ¿qué trajo Caín a Jehová como ofrenda?", "Del fruto de la tierra", ["De los primogénitos de sus ovejas", "Un cordero sin defecto", "Pan y vino"], "Génesis 4:3"], ["Según Génesis 4:4-5, ¿hacia quién miró Jehová con agrado?", "Hacia Abel y su ofrenda", ["Hacia Caín y su ofrenda", "Hacia los dos hermanos", "Hacia ninguno de los dos"], "Génesis 4:4"], ["Según Génesis 4:5, ¿cómo reaccionó Caín cuando Jehová no miró con agrado su ofrenda?", "Se ensañó en gran manera y decayó su semblante", ["Se arrepintió y trajo otra ofrenda", "Se alegró con su hermano", "Huyó a otra tierra"], "Génesis 4:5"]]}, {"title": "La voz de la sangre", "verses": [{"r": "Génesis 4:7", "t": "Si bien hicieres, ¿no serás enaltecido? y si no hicieres bien, el pecado está a la puerta; con todo esto, a ti será su deseo, y tú te enseñorearás de él."}, {"r": "Génesis 4:8", "t": "Y dijo Caín a su hermano Abel: Salgamos al campo. Y aconteció que estando ellos en el campo, Caín se levantó contra su hermano Abel, y lo mató."}, {"r": "Génesis 4:9", "t": "Y Jehová dijo a Caín: ¿Dónde está Abel tu hermano? Y él respondió: No sé. ¿Soy yo acaso guarda de mi hermano?"}, {"r": "Génesis 4:10", "t": "Y él le dijo: ¿Qué has hecho? La voz de la sangre de tu hermano clama a mí desde la tierra."}], "qs": [["Según Génesis 4:7, si Caín no hacía bien, ¿qué estaba a la puerta?", "El pecado", ["La muerte", "El castigo", "El enemigo"], "Génesis 4:7"], ["Según Génesis 4:8, ¿qué le dijo Caín a su hermano antes de levantarse contra él?", "Salgamos al campo", ["Vamos a la casa", "Subamos al monte", "Ven conmigo al huerto"], "Génesis 4:8"], ["Según Génesis 4:9, cuando Jehová preguntó por Abel, ¿qué respondió Caín?", "No sé. ¿Soy yo acaso guarda de mi hermano?", ["Está con las ovejas en el campo", "Se fue a otra tierra", "Duerme en nuestra tienda"], "Génesis 4:9"], ["Según Génesis 4:10, ¿qué clama a Jehová desde la tierra?", "La voz de la sangre de Abel", ["El llanto de Eva", "El gemido de los animales", "La voz de Abel desde el cielo"], "Génesis 4:10"]]}, {"title": "Set y Enoc", "verses": [{"r": "Génesis 4:15", "t": "Y le respondió Jehová: Ciertamente cualquiera que matare a Caín, siete veces será castigado. Entonces Jehová puso señal en Caín, para que no lo matase cualquiera que le hallara."}, {"r": "Génesis 4:26", "t": "Y a Set también le nació un hijo, y llamó su nombre Enós. Entonces los hombres comenzaron a invocar el nombre de Jehová."}, {"r": "Génesis 5:22", "t": "Y caminó Enoc con Dios, después que engendró a Matusalén, trescientos años, y engendró hijos e hijas."}, {"r": "Génesis 5:24", "t": "Caminó, pues, Enoc con Dios, y desapareció, porque le llevó Dios."}], "qs": [["Según Génesis 4:15, ¿qué puso Jehová en Caín para que no lo matase cualquiera que le hallara?", "Una señal", ["Una corona", "Un muro", "Un nombre nuevo"], "Génesis 4:15"], ["Según Génesis 4:26, ¿qué comenzaron a hacer los hombres en tiempos de Enós, hijo de Set?", "Invocar el nombre de Jehová", ["Edificar ciudades", "Labrar la tierra", "Ofrecer holocaustos"], "Génesis 4:26"], ["Según Génesis 5:22, ¿con quién caminó Enoc?", "Con Dios", ["Con Noé", "Con Matusalén", "Con los ángeles"], "Génesis 5:22"], ["Según Génesis 5:24, ¿qué le pasó a Enoc?", "Desapareció, porque le llevó Dios", ["Fue sepultado por Set", "Se perdió en el desierto", "Murió en su tienda"], "Génesis 5:24"]]}, {"title": "Noé, varón justo", "verses": [{"r": "Génesis 6:5", "t": "Y vio Jehová que la maldad de los hombres era mucha en la tierra, y que todo designio de los pensamientos del corazón de ellos era de continuo solamente el mal."}, {"r": "Génesis 6:6", "t": "Y se arrepintió Jehová de haber hecho hombre en la tierra, y le dolió en su corazón."}, {"r": "Génesis 6:9", "t": "Estas son las generaciones de Noé: Noé, varón justo, era perfecto en sus generaciones; con Dios caminó Noé."}, {"r": "Génesis 6:13", "t": "Dijo, pues, Dios a Noé: He decidido el fin de todo ser, porque la tierra está llena de violencia a causa de ellos; y he aquí que yo los destruiré con la tierra."}], "qs": [["Según Génesis 6:5, ¿cómo eran los pensamientos del corazón de los hombres?", "De continuo solamente el mal", ["Divididos entre el bien y el mal", "Inclinados a buscar a Dios", "Cambiantes cada día"], "Génesis 6:5"], ["Según Génesis 6:6, ¿de qué se arrepintió Jehová?", "De haber hecho hombre en la tierra", ["De haber creado los cielos", "De haber hecho a los animales", "De haber plantado el huerto"], "Génesis 6:6"], ["Según Génesis 6:9, ¿cómo se describe a Noé?", "Varón justo, perfecto en sus generaciones", ["Rey poderoso entre los hombres", "Profeta de las naciones", "Sacerdote del Altísimo"], "Génesis 6:9"], ["Según Génesis 6:13, ¿de qué estaba llena la tierra a causa de los hombres?", "De violencia", ["De idolatría", "De hambre", "De enfermedades"], "Génesis 6:13"]]}, {"title": "El arca", "verses": [{"r": "Génesis 6:14", "t": "Hazte un arca de madera de gofer; harás aposentos en el arca, y la calafatearás con brea por dentro y por fuera."}, {"r": "Génesis 6:22", "t": "Y lo hizo así Noé; hizo conforme a todo lo que Dios le mandó."}, {"r": "Génesis 7:1", "t": "Dijo luego Jehová a Noé: Entra tú y toda tu casa en el arca; porque a ti he visto justo delante de mí en esta generación."}, {"r": "Génesis 7:16", "t": "Y los que vinieron, macho y hembra de toda carne vinieron, como le había mandado Dios; y Jehová le cerró la puerta."}], "qs": [["Según Génesis 6:14, ¿de qué madera mandó Dios hacer el arca?", "De gofer", ["De cedro", "De acacia", "De ciprés"], "Génesis 6:14"], ["Según Génesis 6:14, ¿con qué debía calafatear el arca por dentro y por fuera?", "Con brea", ["Con barro", "Con cera", "Con pieles"], "Génesis 6:14"], ["Según Génesis 6:22, ¿cómo respondió Noé a lo que Dios le mandó?", "Hizo conforme a todo lo que Dios le mandó", ["Pidió más tiempo", "Hizo solo una parte", "Esperó una señal antes de obedecer"], "Génesis 6:22"], ["Según Génesis 7:1, ¿quiénes debían entrar en el arca?", "Noé y toda su casa", ["Solo Noé y sus hijos", "Noé y los ancianos de su pueblo", "Todos los habitantes de la tierra"], "Génesis 7:1"], ["Según Génesis 7:16, ¿quién cerró la puerta del arca?", "Jehová", ["Noé", "Sem, hijo de Noé", "Un ángel"], "Génesis 7:16"]]}, {"title": "Se acordó Dios de Noé", "verses": [{"r": "Génesis 7:11", "t": "El año seiscientos de la vida de Noé, en el mes segundo, a los diecisiete días del mes, aquel día fueron rotas todas las fuentes del grande abismo, y las cataratas de los cielos fueron abiertas,"}, {"r": "Génesis 8:1", "t": "Y se acordó Dios de Noé, y de todos los animales, y de todas las bestias que estaban con él en el arca; e hizo pasar Dios un viento sobre la tierra, y disminuyeron las aguas."}, {"r": "Génesis 8:20", "t": "Y edificó Noé un altar a Jehová, y tomó de todo animal limpio y de toda ave limpia, y ofreció holocausto en el altar."}, {"r": "Génesis 8:22", "t": "Mientras la tierra permanezca, no cesarán la sementera y la siega, el frío y el calor, el verano y el invierno, y el día y la noche."}], "qs": [["Según Génesis 7:11, ¿qué fue roto el día en que comenzó el diluvio?", "Todas las fuentes del grande abismo", ["Las columnas de los cielos", "Los sellos del mar", "Los cimientos de la tierra"], "Génesis 7:11"], ["Según Génesis 8:1, ¿qué hizo pasar Dios sobre la tierra para que disminuyeran las aguas?", "Un viento", ["Un sol ardiente", "Una gran sequía", "Una nube"], "Génesis 8:1"], ["Según Génesis 8:20, ¿qué ofreció Noé sobre el altar?", "Holocausto de animales y aves limpios", ["Primicias de la cosecha", "Pan sin levadura", "Incienso y aceite"], "Génesis 8:20"], ["Según Génesis 8:22, ¿qué no cesará mientras la tierra permanezca?", "La sementera y la siega", ["La lluvia y el viento", "La guerra y la paz", "Los terremotos"], "Génesis 8:22"]]}, {"title": "El pacto y el arco", "verses": [{"r": "Génesis 9:11", "t": "Estableceré mi pacto con vosotros, y no exterminaré ya más toda carne con aguas de diluvio, ni habrá más diluvio para destruir la tierra."}, {"r": "Génesis 9:12", "t": "Y dijo Dios: Esta es la señal del pacto que yo establezco entre mí y vosotros y todo ser viviente que está con vosotros, por siglos perpetuos:"}, {"r": "Génesis 9:16", "t": "Estará el arco en las nubes, y lo veré, y me acordaré del pacto perpetuo entre Dios y todo ser viviente, con toda carne que hay sobre la tierra."}], "qs": [["Según Génesis 9:11, ¿qué prometió Dios que ya no habría más?", "Diluvio para destruir la tierra", ["Lluvia sobre la tierra", "Noche en la tierra", "Pecado entre los hombres"], "Génesis 9:11"], ["Según Génesis 9:12, ¿entre quiénes establece Dios su pacto?", "Entre él, los hombres y todo ser viviente", ["Solo entre él y Noé", "Solo entre él y los hijos de Noé", "Entre él y los ángeles"], "Génesis 9:12"], ["Según Génesis 9:16, cuando Dios vea el arco en las nubes, ¿qué hará?", "Se acordará del pacto perpetuo", ["Enviará otro diluvio", "Hablará con Noé", "Descenderá a la tierra"], "Génesis 9:16"]]}, {"title": "Una sola lengua", "verses": [{"r": "Génesis 11:1", "t": "Tenía entonces toda la tierra una sola lengua y unas mismas palabras."}, {"r": "Génesis 11:4", "t": "Y dijeron: Vamos, edifiquémonos una ciudad y una torre, cuya cúspide llegue al cielo; y hagámonos un nombre, por si fuéremos esparcidos sobre la faz de toda la tierra."}, {"r": "Génesis 11:7", "t": "Ahora, pues, descendamos, y confundamos allí su lengua, para que ninguno entienda el habla de su compañero."}, {"r": "Génesis 11:9", "t": "Por esto fue llamado el nombre de ella Babel, porque allí confundió Jehová el lenguaje de toda la tierra, y desde allí los esparció sobre la faz de toda la tierra."}], "qs": [["Según Génesis 11:1, ¿cuántas lenguas tenía entonces toda la tierra?", "Una sola", ["Dos", "Siete", "Setenta"], "Génesis 11:1"], ["Según Génesis 11:4, ¿qué dijeron que querían edificar?", "Una ciudad y una torre cuya cúspide llegue al cielo", ["Un templo y un altar", "Un arca y un muro", "Un palacio para su rey"], "Génesis 11:4"], ["Según Génesis 11:4, ¿qué temían los que edificaban?", "Ser esparcidos sobre la faz de toda la tierra", ["Un nuevo diluvio", "El hambre", "Sus enemigos"], "Génesis 11:4"], ["Según Génesis 11:7, ¿qué hizo Jehová para que ninguno entendiera el habla de su compañero?", "Confundió su lengua", ["Les quitó la voz", "Les envió fuego", "Les envió una gran sequía"], "Génesis 11:7"], ["Según Génesis 11:9, ¿por qué fue llamada Babel?", "Porque allí confundió Jehová el lenguaje de toda la tierra", ["Porque era la ciudad más grande", "Porque allí nació Noé", "Porque tenía una torre muy alta"], "Génesis 11:9"]]}]},
{"title": "Salmos conocidos", "sub": "Los Salmos que más se citan", "lessons": [{"title": "Dichoso el que medita", "verses": [{"r": "Salmo 1:1", "t": "Bienaventurado el varón que no anduvo en consejo de malos, Ni estuvo en camino de pecadores, Ni en silla de escarnecedores se ha sentado;"}, {"r": "Salmo 1:2", "t": "Sino que en la ley de Jehová está su delicia, Y en su ley medita de día y de noche."}, {"r": "Salmo 1:3", "t": "Será como árbol plantado junto a corrientes de aguas, Que da su fruto en su tiempo, Y su hoja no cae; Y todo lo que hace, prosperará."}], "qs": [["Según el Salmo 1:1, ¿qué no hizo el varón bienaventurado?", "No anduvo en consejo de malos", ["No dejó de ofrecer sacrificios", "No olvidó el día de reposo", "No salió de su ciudad"], "Salmo 1:1"], ["Según el Salmo 1:2, ¿en qué está su delicia?", "En la ley de Jehová", ["En sus riquezas", "En el templo", "En la sabiduría de los hombres"], "Salmo 1:2"], ["Según el Salmo 1:3, ¿a qué será semejante el que medita en la ley de Jehová?", "A un árbol plantado junto a corrientes de aguas", ["A una palmera en el desierto", "A un cedro del Líbano", "A una vid en el huerto"], "Salmo 1:3"]]}, {"title": "Los cielos cuentan", "verses": [{"r": "Salmo 19:1", "t": "Los cielos cuentan la gloria de Dios, Y el firmamento anuncia la obra de sus manos."}, {"r": "Salmo 19:14", "t": "Sean gratos los dichos de mi boca y la meditación de mi corazón delante de ti, Oh Jehová, roca mía, y redentor mío."}, {"r": "Salmo 118:24", "t": "Este es el día que hizo Jehová; Nos gozaremos y alegraremos en él."}], "qs": [["Según el Salmo 19:1, ¿qué cuentan los cielos?", "La gloria de Dios", ["La historia de los hombres", "Las horas del día", "La ley de Moisés"], "Salmo 19:1"], ["Según el Salmo 19:1, ¿qué anuncia el firmamento?", "La obra de sus manos", ["El camino del justo", "El nombre de Jehová", "El día del juicio"], "Salmo 19:1"], ["Según el Salmo 19:14, ¿cómo llama el salmista a Jehová?", "Roca mía y redentor mío", ["Pastor mío y rey mío", "Luz mía y salvación mía", "Escudo mío y castillo mío"], "Salmo 19:14"], ["Según el Salmo 118:24, ¿qué dice el salmista de este día?", "Es el día que hizo Jehová", ["Es el día del gran reposo", "Es el día de la gran fiesta", "Es el día de la ley"], "Salmo 118:24"]]}, {"title": "Cuán glorioso es tu nombre", "verses": [{"r": "Salmo 8:1", "t": "¡Oh Jehová, Señor nuestro, Cuán glorioso es tu nombre en toda la tierra! Has puesto tu gloria sobre los cielos;"}, {"r": "Salmo 8:3", "t": "Cuando veo tus cielos, obra de tus dedos, La luna y las estrellas que tú formaste,"}, {"r": "Salmo 8:4", "t": "Digo: ¿Qué es el hombre, para que tengas de él memoria, Y el hijo del hombre, para que lo visites?"}], "qs": [["Según el Salmo 8:1, ¿qué es glorioso en toda la tierra?", "El nombre de Jehová", ["La ley de Jehová", "La casa de Jehová", "El camino de Jehová"], "Salmo 8:1"], ["Según el Salmo 8:3, ¿qué ve el salmista, obra de los dedos de Dios?", "Los cielos, la luna y las estrellas", ["Los montes y los valles", "El mar y los ríos", "El sol y las nubes"], "Salmo 8:3"], ["Según el Salmo 8:4, ¿qué pregunta hace el salmista?", "¿Qué es el hombre, para que tengas de él memoria?", ["¿Hasta cuándo, Jehová?", "¿Quién subirá al monte de Jehová?", "¿De dónde vendrá mi socorro?"], "Salmo 8:4"]]}, {"title": "Jehová es mi luz", "verses": [{"r": "Salmo 27:1", "t": "Jehová es mi luz y mi salvación; ¿de quién temeré? Jehová es la fortaleza de mi vida; ¿de quién he de atemorizarme?"}, {"r": "Salmo 27:4", "t": "Una cosa he demandado a Jehová, ésta buscaré; Que esté yo en la casa de Jehová todos los días de mi vida, Para contemplar la hermosura de Jehová, y para inquirir en su templo."}, {"r": "Salmo 27:14", "t": "Aguarda a Jehová; Esfuérzate, y aliéntese tu corazón; Sí, espera a Jehová."}], "qs": [["Según el Salmo 27:1, ¿qué dos cosas es Jehová para el salmista?", "Luz y salvación", ["Escudo y fortaleza", "Roca y redentor", "Pastor y rey"], "Salmo 27:1"], ["Según el Salmo 27:4, ¿qué una cosa demandó el salmista a Jehová?", "Estar en la casa de Jehová todos los días de su vida", ["Larga vida y riquezas", "Sabiduría para gobernar", "Victoria sobre sus enemigos"], "Salmo 27:4"], ["Según el Salmo 27:14, ¿qué dice que se debe hacer?", "Aguardar a Jehová y esforzarse", ["Correr a Jehová y descansar", "Clamar a Jehová y ayunar", "Seguir a Jehová sin mirar atrás"], "Salmo 27:14"]]}, {"title": "Nuestro pronto auxilio", "verses": [{"r": "Salmo 46:1", "t": "Dios es nuestro amparo y fortaleza, Nuestro pronto auxilio en las tribulaciones."}, {"r": "Salmo 46:2", "t": "Por tanto, no temeremos, aunque la tierra sea removida, Y se traspasen los montes al corazón del mar;"}, {"r": "Salmo 46:10", "t": "Estad quietos, y conoced que yo soy Dios; Seré exaltado entre las naciones; enaltecido seré en la tierra."}], "qs": [["Según el Salmo 46:1, ¿qué es Dios en las tribulaciones?", "Nuestro pronto auxilio", ["Nuestro juez", "Nuestro maestro", "Nuestro silencio"], "Salmo 46:1"], ["Según el Salmo 46:2, aunque la tierra sea removida, ¿qué no hará el salmista?", "Temer", ["Callar", "Huir", "Dudar"], "Salmo 46:2"], ["Según el Salmo 46:10, ¿qué dice Dios después de «Estad quietos»?", "Conoced que yo soy Dios", ["Esperad en mi salvación", "Temed al Señor", "Aprended mis caminos"], "Salmo 46:10"]]}, {"title": "Cerca de los quebrantados", "verses": [{"r": "Salmo 34:8", "t": "Gustad, y ved que es bueno Jehová; Dichoso el hombre que confía en él."}, {"r": "Salmo 34:18", "t": "Cercano está Jehová a los quebrantados de corazón; Y salva a los contritos de espíritu."}, {"r": "Salmo 51:10", "t": "Crea en mí, oh Dios, un corazón limpio, Y renueva un espíritu recto dentro de mí."}, {"r": "Salmo 51:12", "t": "Vuélveme el gozo de tu salvación, Y espíritu noble me sustente."}], "qs": [["Según el Salmo 34:8, ¿a qué invita el salmista?", "A gustar y ver que es bueno Jehová", ["A callar y ver que es grande Jehová", "A oír y ver que es justo Jehová", "A venir y ver que es fiel Jehová"], "Salmo 34:8"], ["Según el Salmo 34:18, ¿de quiénes está cercano Jehová?", "De los quebrantados de corazón", ["De los que ofrecen holocaustos", "De los poderosos", "De los que ayunan"], "Salmo 34:18"], ["Según el Salmo 51:10, ¿qué pide el salmista que Dios cree en él?", "Un corazón limpio", ["Un corazón fuerte", "Un corazón sabio", "Un corazón valiente"], "Salmo 51:10"], ["Según el Salmo 51:12, ¿qué pide el salmista que Dios le devuelva?", "El gozo de su salvación", ["La paz de su presencia", "La fuerza de su juventud", "El honor de su reino"], "Salmo 51:12"]]}, {"title": "Bajo la sombra del Omnipotente", "verses": [{"r": "Salmo 91:1", "t": "El que habita al abrigo del Altísimo Morará bajo la sombra del Omnipotente."}, {"r": "Salmo 91:2", "t": "Diré yo a Jehová: Esperanza mía, y castillo mío; Mi Dios, en quien confiaré."}, {"r": "Salmo 91:4", "t": "Con sus plumas te cubrirá, Y debajo de sus alas estarás seguro; Escudo y adarga es su verdad."}, {"r": "Salmo 91:11", "t": "Pues a sus ángeles mandará acerca de ti, Que te guarden en todos tus caminos."}], "qs": [["Según el Salmo 91:1, ¿bajo qué morará el que habita al abrigo del Altísimo?", "Bajo la sombra del Omnipotente", ["Bajo las alas del águila", "Bajo el techo del templo", "Bajo la nube de fuego"], "Salmo 91:1"], ["Según el Salmo 91:2, ¿cómo llama el salmista a Jehová?", "Esperanza mía y castillo mío", ["Roca mía y redentor mío", "Luz mía y salvación mía", "Pastor mío y escudo mío"], "Salmo 91:2"], ["Según el Salmo 91:4, ¿con qué te cubrirá y debajo de qué estarás seguro?", "Con sus plumas; debajo de sus alas", ["Con su manto; debajo de su tienda", "Con su mano; debajo de su trono", "Con su luz; debajo de las nubes"], "Salmo 91:4"], ["Según el Salmo 91:11, ¿qué mandará a sus ángeles acerca de ti?", "Que te guarden en todos tus caminos", ["Que te lleven al cielo", "Que peleen por ti en la batalla", "Que te anuncien lo que vendrá"], "Salmo 91:11"]]}, {"title": "Servid con alegría", "verses": [{"r": "Salmo 100:1", "t": "Cantad alegres a Dios, habitantes de toda la tierra."}, {"r": "Salmo 100:2", "t": "Servid a Jehová con alegría; Venid ante su presencia con regocijo."}, {"r": "Salmo 100:3", "t": "Reconoced que Jehová es Dios; Él nos hizo, y no nosotros a nosotros mismos; Pueblo suyo somos, y ovejas de su prado."}], "qs": [["Según el Salmo 100:1, ¿qué deben hacer los habitantes de toda la tierra?", "Cantar alegres a Dios", ["Guardar silencio ante Dios", "Ofrecer holocaustos a Dios", "Edificar un templo a Dios"], "Salmo 100:1"], ["Según el Salmo 100:2, ¿cómo debemos venir ante su presencia?", "Con regocijo", ["Con temblor", "Con silencio", "Con ofrendas"], "Salmo 100:2"], ["Según el Salmo 100:3, ¿qué somos de Jehová?", "Su pueblo y ovejas de su prado", ["Sus siervos y sus hijos", "Sus guerreros y sus testigos", "Su ejército y su heredad"], "Salmo 100:3"]]}, {"title": "Mi socorro viene de Jehová", "verses": [{"r": "Salmo 121:1", "t": "Alzaré mis ojos a los montes; ¿De dónde vendrá mi socorro?"}, {"r": "Salmo 121:2", "t": "Mi socorro viene de Jehová, Que hizo los cielos y la tierra."}, {"r": "Salmo 121:7", "t": "Jehová te guardará de todo mal; Él guardará tu alma."}, {"r": "Salmo 121:8", "t": "Jehová guardará tu salida y tu entrada Desde ahora y para siempre."}], "qs": [["Según el Salmo 121:1, ¿adónde alza el salmista sus ojos?", "A los montes", ["A los cielos", "Al templo", "Al mar"], "Salmo 121:1"], ["Según el Salmo 121:2, ¿de quién viene su socorro?", "De Jehová, que hizo los cielos y la tierra", ["De los montes", "De los príncipes", "De los ángeles"], "Salmo 121:2"], ["Según el Salmo 121:7, ¿de qué guardará Jehová?", "De todo mal", ["De todo enemigo", "De toda tristeza", "De todo temor"], "Salmo 121:7"], ["Según el Salmo 121:8, ¿qué guardará Jehová?", "Tu salida y tu entrada", ["Tu casa y tu familia", "Tu pan y tu agua", "Tu camino y tu descanso"], "Salmo 121:8"]]}]},
{"title": "El Evangelio de Marcos", "sub": "Marcos 1–16", "lessons": [{"title": "Principio del evangelio", "verses": [{"r": "Marcos 1:1", "t": "Principio del evangelio de Jesucristo, Hijo de Dios."}, {"r": "Marcos 1:9", "t": "Aconteció en aquellos días, que Jesús vino de Nazaret de Galilea, y fue bautizado por Juan en el Jordán."}, {"r": "Marcos 1:10", "t": "Y luego, cuando subía del agua, vio abrirse los cielos, y al Espíritu como paloma que descendía sobre él."}, {"r": "Marcos 1:11", "t": "Y vino una voz de los cielos que decía: Tú eres mi Hijo amado; en ti tengo complacencia."}], "qs": [["Según Marcos 1:1, ¿cómo comienza este evangelio?", "Principio del evangelio de Jesucristo, Hijo de Dios", ["En el principio era el Verbo", "Libro de la genealogía de Jesucristo", "Habiendo muchos tratado de poner en orden la historia"], "Marcos 1:1"], ["Según Marcos 1:9, ¿dónde fue bautizado Jesús y por quién?", "En el Jordán, por Juan", ["En el mar de Galilea, por Pedro", "En el Jordán, por Andrés", "En Nazaret, por Juan"], "Marcos 1:9"], ["Según Marcos 1:10, ¿cómo vio Jesús al Espíritu descender sobre él?", "Como paloma", ["Como fuego", "Como una nube", "Como un viento recio"], "Marcos 1:10"], ["Según Marcos 1:11, ¿qué dijo la voz de los cielos?", "Tú eres mi Hijo amado; en ti tengo complacencia", ["Tú eres mi siervo fiel", "Yo estoy contigo", "Te he levantado para ser luz de las naciones"], "Marcos 1:11"]]}, {"title": "Pescadores de hombres", "verses": [{"r": "Marcos 1:15", "t": "diciendo: El tiempo se ha cumplido, y el reino de Dios se ha acercado; arrepentíos, y creed en el evangelio."}, {"r": "Marcos 1:16", "t": "Andando junto al mar de Galilea, vio a Simón y a Andrés su hermano, que echaban la red en el mar; porque eran pescadores."}, {"r": "Marcos 1:17", "t": "Y les dijo Jesús: Venid en pos de mí, y haré que seáis pescadores de hombres."}], "qs": [["Según Marcos 1:15, ¿qué dijo Jesús que se había acercado?", "El reino de Dios", ["El juicio de Dios", "El día del Señor", " const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1,d+n));};
const diffDays=(a,b)=>{const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);};

    d.style.left=(Math.random()*100)+'%';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.5+Math.random()*1.5)+'s';d.style.animationDelay=(Math.random()*.4)+'s';

let AC=null;
function beep(kind){

  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const seq=kind==='good'?[[660,0,.09],[880,.09,.16]]
      :kind==='bad'?[[250,0,.14],[180,.14,.24]]
      :kind==='fan'?[[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.3,.16],[784,.52,.1],[1047,.62,.1],[1319,.74,.5]]
      :kind==='win'?[[523,0,.11],[659,.11,.11],[784,.22,.11],[1047,.33,.34]]
      :[[600,0,.05]];
    seq.forEach(([f,s,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(.16,t+s+.02);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);
      o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+d+.03);
    });
  }catch(e){}
}

function mcq(prompt,correct,pool,extra){
  const uniq=Array.from(new Set(pool.filter(x=>x!==correct)));
  const wrong=((extra&&extra.keep)?uniq:shuffle(uniq)).slice(0,3);
  const opts=shuffle([correct,...wrong]);
  return Object.assign({type:'mc',prompt,opts,a:opts.indexOf(correct),tries:0,nota:''},extra||{});
}
function pickCover(cands,n){
  /* al menos una pregunta por elemento y luego completa al azar hasta n */
  const by={};cands.forEach(c=>{(by[c[0]]=by[c[0]]||[]).push(c[1]);});
  const out=[];Object.keys(by).forEach(k=>{const f=pickOne(by[k]);out.push(f);by[k]=by[k].filter(x=>x!==f);});
  const rest=shuffle(Object.keys(by).flatMap(k=>by[k]));
  while(out.length<n&&rest.length)out.push(rest.pop());
  return shuffle(out).slice(0,n).map(f=>f());
}

function gkUtter(text,opt){
  const voices=(speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
  if(text&&typeof text==='object'){
    const gv=text.lang==='el'?voices.find(x=>/^el/i.test(String(x.lang))):null;
    if(gv){const g=new SpeechSynthesisUtterance(text.t);g.voice=gv;g.lang=gv.lang;g.rate=(opt&&opt.rate)||.8;return g;}
    text=text.alt;
  }
  const u=new SpeechSynthesisUtterance(text);
  const want=(opt&&opt.lang)||'';
  const norm=l=>String(l).replace('_','-').toLowerCase();
  let v=want?voices.find(x=>norm(x.lang)===norm(want)):null;
  v=v||voices.find(x=>/^es-(co|419|mx|us)/i.test(norm(x.lang)))||voices.find(x=>/^es/i.test(norm(x.lang)));
  if(v){u.voice=v;u.lang=v.lang;}else u.lang=want||'es-ES';

  return u;
}
function gkSpeakParts(parts,opt){
  if(!canSpeak()){toast('Este navegador no puede leer en voz alta.');return;}
  try{speechSynthesis.cancel();}catch(e){}
  const token=++SPK,pause=(opt&&opt.pause!=null)?opt.pause:420;let i=0;
  const next=()=>{
    if(token!==SPK||i>=parts.length)return;
    const part=parts[i++];let moved=false;
    const go=()=>{if(moved)return;moved=true;if(i<parts.length)setTimeout(next,pause);};
    try{
      const u=gkUtter(part,opt);u.onend=go;u.onerror=go;
      speechSynthesis.speak(u);
      setTimeout(go,600+String((part&&part.alt)||part).length*110);
    }catch(e){}
  };
  next();
}

function rrect(x,X,Y,W,H,R,fill){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();if(fill){x.fillStyle=fill;x.fill();}}
function wrapText(x,text,cx,y,maxW,lh){
  const words=String(text).split(' ');let line='',yy=y,lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  lines.push(line);lines.forEach((l,i)=>x.fillText(l,cx,y+i*lh));return y+lines.length*lh;
}
function svgToImage(svg){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
async function makeShareCanvas(d){

  x.fillStyle='rgba(255,255,255,.10)';[[120,180,150],[960,260,110],[900,1080,170],[130,1000,100]].forEach(o=>{x.beginPath();x.arc(o[0],o[1],o[2],0,7);x.fill();});

    if(d.sub2){x.font='800 34px '+F;x.fillStyle='#777';wrapText(x,d.sub2,W/2,y+240,W-260,44);}}
  else if(d.stats){

      x.fillStyle='#3C3C3C';x.font='56px '+F;x.fillText(s[0],X+tw/2,ty+62);x.font='900 62px '+F;x.fillText(String(s[1]),X+tw/2,ty+130);

  return c;

async function prepShare(kind,id){
  const d=shareData(kind,id);if(d.noImage||SHC[d.key])return SHC[d.key];
  const c=await makeShareCanvas(d);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(!blob)return null;
  let file=null;try{file=new File([blob],'lampy.png',{type:'image/png'});}catch(e){}
  SHC[d.key]={blob,file,text:d.text};return SHC[d.key];
}
function downloadBlob(blob){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lampy.png';document.body.appendChild(a);a.click();setTimeout(()=>{try{a.remove();URL.revokeObjectURL(a.href);}catch(e){}},500);}catch(e){}}
async function doShare(kind,id){
  const d=shareData(kind,id);
  try{
    if(d.noImage){
      if(navigator.share){await navigator.share({text:d.text});return;}
      window.open('https://wa.me/?text='+encodeURIComponent(d.text),'_blank');return;
    }
    const pre=SHC[d.key]||await prepShare(kind,id);
    if(pre&&pre.file&&navigator.canShare&&navigator.canShare({files:[pre.file]})){await navigator.share({files:[pre.file],text:d.text,title:'Lampy'});return;}
    if(navigator.share){await navigator.share({text:d.text,title:'Lampy'});return;}
    if(pre)downloadBlob(pre.blob);
    try{await navigator.clipboard.writeText(d.text);}catch(e){}
    toast('Imagen guardada y mensaje copiado. ¡Pégalo donde quieras!');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    try{const pre=SHC[d.key];if(pre)downloadBlob(pre.blob);await navigator.clipboard.writeText(d.text);}catch(x){}
    toast('Imagen guardada y mensaje copiado.');
  }
}

const RD_OT=39;                                   // libros 0–38 = Antiguo Testamento; 39–65 = Nuevo
const RD_ATOM={'0:32':1,'18:46':1,'63:0':1};      // capítulos que no se parten (Gn 33, Sal 47, 3 Jn): su conteo difiere entre ediciones
const RD_PLANS={
  a:{id:'a',name:'De tapa a tapa',icon:'📖',desc:'Del Génesis al Apocalipsis, en orden. Un solo pasaje cada día.'},
  b:{id:'b',name:'Antiguo y Nuevo Testamento',icon:'⚖️',desc:'Cada día lees un pasaje del Antiguo y uno del Nuevo Testamento.'}
};
let RD_FLAT=null;
function rdFlat(){
  if(RD_FLAT)return RD_FLAT;
  const ch=[];let cum=0;
  RD_B.forEach((b,bi)=>b[2].forEach((len,ci)=>{ch.push({bi,c:ci+1,len,s:cum,e:cum+len,at:!!RD_ATOM[bi+':'+ci]});cum+=len;}));
  RD_FLAT={ch,T:cum};return RD_FLAT;
}
function rdStreamDef(kind){          // kind: 'all' | 'ot' | 'nt'
  const F=rdFlat();
  const list=F.ch.filter(c=>kind==='all'||(kind==='ot'?c.bi<RD_OT:c.bi>=RD_OT));
  const off=list[0].s,T=list[list.length-1].e-off;
  return {list,off,T};
}
/* Divide un flujo de lectura en n días: porciones casi iguales (en versículos),
   terminando en final de capítulo cuando es posible. Cada versículo cae en un solo día. */
function rdEnds(def,n){
  const {list,off,T}=def,t=T/n,bounds=list.map(c=>c.e-off),ends=[];let prev=0;
  const lb=(a,x)=>{let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<x)lo=m+1;else hi=m;}return lo;};
  for(let d=0;d<n;d++){
    let e;
    if(d===n-1)e=T;
    else{
      const ideal=Math.round((d+1)*T/n),i=lb(bounds,ideal);let best=null;
      [bounds[i],i>0?bounds[i-1]:null].forEach(x=>{if(x!=null&&x>prev&&Math.abs(x-ideal)<=0.5*t&&(best===null||Math.abs(x-ideal)<Math.abs(best-ideal)))best=x;});
      e=best!==null?best:ideal;
      const ci=lb(bounds,e+1);                       // capítulo que contiene el versículo e (índice base 0)
      const c=list[ci];
      if(c&&c.at&&e>c.s-off&&e<c.e-off){            // no partir capítulos «atómicos»
        const a=c.s-off,b=c.e-off;
        e=(a>prev&&Math.abs(a-ideal)<=Math.abs(b-ideal))?a:b;
      }
      e=Math.max(prev+1,Math.min(e,T-(n-1-d)));
    }
    ends.push(e);prev=e;
  }
  return ends;
}
const RD_CACHE={};
function rdPlan(plan,n){
  const key=plan+':'+n;if(RD_CACHE[key])return RD_CACHE[key];
  let days;
  if(plan==='a'){
    const def=rdStreamDef('all'),ends=rdEnds(def,n);let p=0;
    days=ends.map(e=>{const r={a:[def.off+p,def.off+e]};p=e;return r;});
  }else{
    const o=rdStreamDef('ot'),t=rdStreamDef('nt'),eo=rdEnds(o,n),et=rdEnds(t,n);let po=0,pt=0;
    days=eo.map((e,i)=>{const r={ot:[o.off+po,o.off+e],nt:[t.off+pt,t.off+et[i]]};po=e;pt=et[i];return r;});
  }
  const vs=days.map(d=>rdDayParts(plan,d).reduce((a,p)=>a+(p[1][1]-p[1][0]),0));
  return RD_CACHE[key]={days,n,plan,vs};
}
/* Convierte un rango de versículos [s,e) en texto: «Génesis 3:10–24; 4–5; 6:1–12» */
function rdChIdx(v){const F=rdFlat();let lo=0,hi=F.ch.length;while(lo<hi){const m=(lo+hi)>>1;if(F.ch[m].e<=v)lo=m+1;else hi=m;}return lo;}
function rdPartRefs(part){
  const F=rdFlat(),s=part[0],e=part[1],items=[];
  for(let i=rdChIdx(s);i<F.ch.length&&F.ch[i].s<e;i++){
    const c=F.ch[i],a=Math.max(s,c.s)-c.s+1,b=Math.min(e,c.e)-c.s;
    items.push({bi:c.bi,c:c.c,a,b,whole:a===1&&b===c.len});
  }
  const out=[];let cur=null;
  items.forEach(it=>{
    if(!cur||cur.bi!==it.bi){cur={bi:it.bi,segs:[]};out.push(cur);}
    const last=cur.segs[cur.segs.length-1];
    if(it.whole&&last&&last.whole&&last.to===it.c-1)last.to=it.c;
    else cur.segs.push({whole:it.whole,from:it.c,to:it.c,a:it.a,b:it.b});
  });
  return out.map(g=>({bi:g.bi,name:RD_B[g.bi][0],txt:g.segs.map(sg=>sg.whole?(sg.from===sg.to?''+sg.from:sg.from+'–'+sg.to):(sg.a===sg.b?sg.from+':'+sg.a:sg.from+':'+sg.a+'–'+sg.b)).join('; ')}));
}
function rdPartText(part){return rdPartRefs(part).map(g=>g.name+' '+g.txt).join('; ');}
function rdPartVerses(part){return part[1]-part[0];}
function rdPartBooks(part){const F=rdFlat(),set=[];for(let i=rdChIdx(part[0]);i<F.ch.length&&F.ch[i].s<part[1];i++){if(set.indexOf(F.ch[i].bi)<0)set.push(F.ch[i].bi);}return set;}

/* Duración real del plan: 1 o 2 años de calendario desde la fecha de inicio (365/366 y 730/731 días) */
function rdSpan(start,yrs){
  const [y,m,d]=start.split('-').map(Number);
  const endD=new Date(y+yrs,m-1,d);                        // el 29 de febrero pasa al 1 de marzo si el año destino no es bisiesto
  const endS=dstr(endD),n=diffDays(start,endS),leaps=[];
  for(let yy=y;yy<=y+yrs;yy++){
    if((yy%4===0&&yy%100!==0)||yy%400===0){const f=yy+'-02-29';if(diffDays(start,f)>=0&&diffDays(f,endS)>0)leaps.push(f);}
  }
  return {n,end:addDays(start,n-1),leaps};
}

function rdToggle(i){

function rmSplit(t){
  const w=t.split(/\s+/),n=w.length,k=Math.max(3,Math.min(8,Math.round(n/4))),size=n/k,cuts=[];
  for(let j=1;j<k;j++){
    const ideal=Math.round(j*size),last=cuts.length?cuts[cuts.length-1]:0;let best=null;
    for(let d=0;d<=2&&best===null;d++)for(const c of [ideal-d,ideal+d])if(best===null&&c>last&&c<=n-(k-j)&&/[,;:.!?»]$/.test(w[c-1]))best=c;
    if(best===null)best=Math.min(Math.max(ideal,last+1),n-(k-j));
    cuts.push(best);
  }
  const out=[];let prev=0;[...cuts,n].forEach(c=>{out.push(w.slice(prev,c).join(' '));prev=c;});
  return out;
}

   quick=true: sondeo rápido (para ver invitaciones a jugar casi al instante). */
async function frPoll(force,mark,quick){
  if(!frActive())return;
  if(!force&&Date.now()-FR.last<(quick?3000:60000))return;
  FR.last=Date.now();
  try{
    const d=await rpc('fr_list',frArgs({p_today:today(),p_mark:!!mark}));
    if(d&&d.ok){
      FR.err='';
      const raw=JSON.stringify(d);
      if(mark){
        if((d.cheers||[]).length)FR.recv=FR.recv.concat(d.cheers);
        (d.followers||[]).forEach(f=>{if(f.new&&FR.recvNew.indexOf(f.device)<0)FR.recvNew.push(f.device);});
        d.cheers=[];d.new_followers=0;
      }
      const sig=raw+'|'+FR.recv.length+'|'+FR.recvNew.length;
      const changed=sig!==FR.sig;
      FR.data=d;FR.sig=sig;
      if(d.me&&(S.fr.code!==d.me.code||S.fr.name!==d.me.name||S.fr.avatar!==d.me.avatar)){S.fr={on:true,code:d.me.code,name:d.me.name,avatar:d.me.avatar};save();}
      frAchCheck(d);
      if(changed||force)frRefresh();
      setTimeout(frMaybePrompts,600);
    }else if(d&&d.error==='perfil_no_existe'){S.fr=null;save();FR.data=null;FR.sig='';frRefresh();}
    else if(d&&d.error){FR.err=famMsg(d.error);if(!FR.data)frRefresh();}
  }catch(e){FR.err=frMsg(e);if(!FR.data)frRefresh();}
}

/* ============================================================
   NOTIFICACIONES (Web Push)
   Cada teléfono se suscribe una vez (con permiso) y la base de datos le manda avisos:
   invitaciones, ánimos, regalos, seguidores nuevos y «tu llamita se está apagando».
   Lo que se ejecuta en el servidor: supabase-notificaciones.sql + la función lampy-push.
   ============================================================ */
const PUSH={busy:false};
const PUSH_DEF={invite:true,cheer:true,gift:true,follow:true,streak:true,hour:18};
const pushSupported=()=>{try{return famOn()&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https?:/.test(location.protocol);}catch(e){return false;}};
const pushNeedsInstall=()=>isIOS()&&!isStandalone();      /* en iPhone solo funcionan con la app instalada */
const pushPerm=()=>{try{return Notification.permission;}catch(e){return 'default';}};
const pushOn=()=>!!(S.push&&S.push.on&&pushPerm()==='granted');
const pushTz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Bogota';}catch(e){return 'America/Bogota';}};
function pushB64(s){const pad='='.repeat((4-s.length%4)%4),raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a;}
function pushErrMsg(e){
  const m=String((e&&e.message)||''),n=String((e&&e.name)||'');
  if(/Could not find the function|schema cache|PGRST202/i.test(m))return 'Falta ejecutar en Supabase el SQL de notificaciones (supabase-notificaciones.sql).';
  if(n==='NotAllowedError')return 'El teléfono no dio permiso para las notificaciones.';
  if(n==='AbortError'||n==='InvalidStateError')return 'El servicio de notificaciones del navegador no respondió. Inténtalo en un rato.';
  return rpcMsg(e);
}
const pushHourLabel=h=>h===12?'12:00 del día':(h<12?h+':00 am':(h-12)+':00 pm');
async function pushSubscribeNow(key){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(sub&&S.push&&S.push.key&&S.push.key!==key){try{await sub.unsubscribe();}catch(e){}sub=null;}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushB64(key)});
  const j=sub.toJSON();
  const r=await rpc('push_subscribe',frArgs({p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_tz:pushTz(),p_ua:String(navigator.userAgent||'').slice(0,180)}));
  return {r,j};
}
async function pushEnable(){
  if(PUSH.busy)return;
  if(!pushSupported()){toast('Este navegador no permite notificaciones.');return;}
  if(pushNeedsInstall()){toast('En iPhone, instala primero Lampy en la pantalla de inicio.');return;}
  PUSH.busy=true;
  try{
    let perm=pushPerm();
    if(perm==='default')perm=await Notification.requestPermission();      /* debe pedirse dentro del toque */
    if(perm!=='granted'){
      S.push=Object.assign({},S.push,{on:false,asked:true});save();
      toast(perm==='denied'?'Las notificaciones están bloqueadas. Actívalas en los ajustes del navegador.':'No se activaron los avisos.');
      return;
    }
    if(!frActive())await frEnsure();
    if(!frActive()){toast('Primero crea tu perfil en Amigos.');return;}
    const key=await rpc('push_public_key',{});
    if(!key){toast('Los avisos todavía no están listos en el servidor. Inténtalo en un minuto.');return;}
    const {r,j}=await pushSubscribeNow(key);
    if(r&&r.ok){S.push={on:true,endpoint:j.endpoint,key,prefs:Object.assign({},PUSH_DEF,r.prefs),asked:true,at:Date.now()};save();toast('🔔 ¡Avisos activados!');beep('good');haptic(15);}
    else toast(famMsg(r&&r.error));
  }catch(e){toast(pushErrMsg(e));}
  finally{PUSH.busy=false;if(!L&&!G&&TAB==='set')render();}
}
async function pushDisable(){
  let ep=(S.push&&S.push.endpoint)||'';
  try{
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){ep=sub.endpoint||ep;try{await sub.unsubscribe();}catch(e){}}
    if(ep)await rpc('push_unsubscribe',frArgs({p_endpoint:ep}));
  }catch(e){}
  S.push=Object.assign({},S.push,{on:false,endpoint:''});save();
  toast('Avisos desactivados en este teléfono.');render();
}

/* Al abrir la app: si el teléfono ya había activado los avisos, se comprueba que sigan vivos y se renuevan en silencio. */
async function pushSync(force){
  if(!pushSupported()||!S.push||!S.push.on||!frActive())return;
  if(pushPerm()!=='granted'){S.push.on=false;save();return;}
  try{
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(!force&&sub&&sub.endpoint===S.push.endpoint&&Date.now()-(S.push.at||0)<6*86400000)return;
    const key=await rpc('push_public_key',{});if(!key)return;
    const {r,j}=await pushSubscribeNow(key);
    if(r&&r.ok){S.push=Object.assign({},S.push,{on:true,endpoint:j.endpoint,key,prefs:Object.assign({},PUSH_DEF,r.prefs),at:Date.now()});save();}
  }catch(e){}

/* Ir a una pantalla (lo usa el toque en una notificación) */
function goTab(t){
  if(L||G||RM.code||!/^(fr|games|path)$/.test(t))return;
  TAB=t;render();window.scrollTo(0,0);
  if(t==='fr'&&frActive())frOpened();
  if(t==='games'&&frActive())frPoll(true,false);
}
async function frCreate(){
  const nm=(($('#frname')||{}).value||'').trim();
  if(!nm){toast('Escribe tu nombre para que te reconozcan.');const i=$('#frname');if(i)i.focus();return;}
  FRE.name=nm;S.me={name:nm,avatar:FRE.avatar||'🙂'};S.frOff=false;save();
  try{
    const r=await rpc('fr_me',frArgs({p_name:nm,p_avatar:FRE.avatar}));
    if(r&&r.ok){
      S.fr={on:true,code:r.code,name:r.name,avatar:r.avatar};save();
      FR.data=null;FR.sig='';FR.recv=[];FR.recvNew=[];
      await frSync();
      await frPoll(true,true);
      render();confetti(70);beep('win');toast('¡Perfil creado! Comparte tu código.');
      frApplyPending();
    }else toast(famMsg(r&&r.error));
  }catch(e){toast(frMsg(e));}
}
function frFollowedOk(name){
  S.frFollowed=1;
  const fresh=ACH.filter(a=>!S.ach[a.id]&&a.f(S));fresh.forEach(a=>S.ach[a.id]=true);save();
  beep('good');confetti(40);haptic(15);
  toast('✅ Ahora sigues a '+name+'.'+(fresh.length?'  🏅 Logro: '+fresh[0].t:''));
}
async function frFollow(code){
  code=String(code||'').trim().toUpperCase();
  if(code.length<4){toast('Escribe el código de amigo.');const i=$('#frcode');if(i)i.focus();return;}
  try{
    const r=await rpc('fr_follow',frArgs({p_code:code}));
    if(r&&r.ok){
      const i=$('#frcode');if(i)i.value='';
      frFollowedOk(r.name);
      await frPoll(true,TAB==='fr');
      if(frGeneric(r.name)&&r.device)setTimeout(()=>frAliasOpen(r.device,r.name,true),700);
    }else toast(famMsg(r&&r.error));
  }catch(e){toast(frMsg(e));}
}
async function frFollowBack(to){
  try{
    const r=await rpc('fr_follow_back',frArgs({p_to:to}));
    if(r&&r.ok){frFollowedOk(r.name);await frPoll(true,true);if(frGeneric(r.name)&&r.device)setTimeout(()=>frAliasOpen(r.device,r.name,true),700);}

function frInviteText(){
  const link=appLink(),c=S.fr&&S.fr.code;
  return '👥 ¡Sígueme en Lampy!'+(link?' Abre este enlace y quedarás siguiéndome:\n'+link+'?a='+c+'\n\nO escribe mi código de amigo: '+c:' Mi código de amigo es: '+c);
}
async function frInvite(){
  const text=frInviteText();
  try{if(navigator.share){await navigator.share({text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function frCopy(){
  const c=S.fr&&S.fr.code;if(!c)return;
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c);ok=true;}}catch(e){}
  toast(ok?'Código copiado: '+c:'Tu código es '+c);
}

function frHeroMsg(){
  if(!frActive())return S.frPending?'¡Te invitaron! Crea tu perfil y quedarás siguiendo a tu amigo.':'¡Mira cómo van los tuyos! Crea tu perfil y sigue a tu familia y amigos.';
  const d=FR.data;
  if(!d)return 'Buscando a tus amigos…';
  const f=d.following;
  if(!f.length)return d.followers.length?'Ya te siguen. Escribe el código de alguien para seguirlo tú también.':'Empieza siguiendo a alguien: escribe su código, o comparte el tuyo.';
  const t=f.filter(frToday).map(frName),me=S.lastDay===today();
  if(t.length===f.length)return t.length===1?(t[0]+' ya practicó hoy'+(me?' y tú también. ¡Qué bien!':'. ¿Y tú?')):('¡Todos practicaron hoy'+(me?', tú también!':'! ¿Y tú?'));
  if(t.length){
    const who=t.length<=2?t.join(' y '):t[0]+', '+t[1]+' y '+(t.length-2)+' más';
    return who+(t.length===1?' ya practicó':' ya practicaron')+' hoy.'+(me?'':' ¿Y tú?');
  }
  return me?'Hoy practicaste primero. ¡Anima a los demás!':'Nadie ha practicado hoy todavía. ¡Sé el primero!';
}

const AUTHKEY='lampara.auth.v1';
