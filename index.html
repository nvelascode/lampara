 ]},
{"title": "De Caín a Babel", "sub": "Génesis 4–11", "lessons": [{"title": "Caín y Abel", "verses": [{"r": "Génesis 4:2", "t": "Después dio a luz a su hermano Abel. Y Abel fue pastor de ovejas, y Caín fue labrador de la tierra."}, {"r": "Génesis 4:3", "t": "Y aconteció andando el tiempo, que Caín trajo del fruto de la tierra una ofrenda a Jehová."}, {"r": "Génesis 4:4", "t": "Y Abel trajo también de los primogénitos de sus ovejas, de lo más gordo de ellas. Y miró Jehová con agrado a Abel y a su ofrenda;"}, {"r": "Génesis 4:5", "t": "pero no miró con agrado a Caín y a la ofrenda suya. Y se ensañó Caín en gran manera, y decayó su semblante."}], "qs": [["Según Génesis 4:2, ¿a qué se dedicaba Abel?", "Era pastor de ovejas", ["Era labrador de la tierra", "Era cazador", "Era constructor de ciudades"], "Génesis 4:2"], ["Según Génesis 4:3, ¿qué trajo Caín a Jehová como ofrenda?", "Del fruto de la tierra", ["De los primogénitos de sus ovejas", "Un cordero sin defecto", "Pan y vino"], "Génesis 4:3"], ["Según Génesis 4:4-5, ¿hacia quién miró Jehová con agrado?", "Hacia Abel y su ofrenda", ["Hacia Caín y su ofrenda", "Hacia los dos hermanos", "Hacia ninguno de los dos"], "Génesis 4:4"], ["Según Génesis 4:5, ¿cómo reaccionó Caín cuando Jehová no miró con agrado su ofrenda?", "Se ensañó en gran manera y decayó su semblante", ["Se arrepintió y trajo otra ofrenda", "Se alegró con su hermano", "Huyó a otra tierra"], "Génesis 4:5"]]}, {"title": "La voz de la sangre", "verses": [{"r": "Génesis 4:7", "t": "Si bien hicieres, ¿no serás enaltecido? y si no hicieres bien, el pecado está a la puerta; con todo esto, a ti será su deseo, y tú te enseñorearás de él."}, {"r": "Génesis 4:8", "t": "Y dijo Caín a su hermano Abel: Salgamos al campo. Y aconteció que estando ellos en el campo, Caín se levantó contra su hermano Abel, y lo mató."}, {"r": "Génesis 4:9", "t": "Y Jehová dijo a Caín: ¿Dónde está Abel tu hermano? Y él respondió: No sé. ¿Soy yo acaso guarda de mi hermano?"}, {"r": "Génesis 4:10", "t": "Y él le dijo: ¿Qué has hecho? La voz de la sangre de tu hermano clama a mí desde la tierra."}], "qs": [["Según Génesis 4:7, si Caín no hacía bien, ¿qué estaba a la puerta?", "El pecado", ["La muerte", "El castigo", "El enemigo"], "Génesis 4:7"], ["Según Génesis 4:8, ¿qué le dijo Caín a su hermano antes de levantarse contra él?", "Salgamos al campo", ["Vamos a la casa", "Subamos al monte", "Ven conmigo al huerto"], "Génesis 4:8"], ["Según Génesis 4:9, cuando Jehová preguntó por Abel, ¿qué respondió Caín?", "No sé. ¿Soy yo acaso guarda de mi hermano?", ["Está con las ovejas en el campo", "Se fue a otra tierra", "Duerme en nuestra tienda"], "Génesis 4:9"], ["Según Génesis 4:10, ¿qué clama a Jehová desde la tierra?", "La voz de la sangre de Abel", ["El llanto de Eva", "El gemido de los animales", "La voz de Abel desde el cielo"], "Génesis 4:10"]]}, {"title": "Set y Enoc", "verses": [{"r": "Génesis 4:15", "t": "Y le respondió Jehová: Ciertamente cualquiera que matare a Caín, siete veces será castigado. Entonces Jehová puso señal en Caín, para que no lo matase cualquiera que le hallara."}, {"r": "Génesis 4:26", "t": "Y a Set también le nació un hijo, y llamó su nombre Enós. Entonces los hombres comenzaron a invocar el nombre de Jehová."}, {"r": "Génesis 5:22", "t": "Y caminó Enoc con Dios, después que engendró a Matusalén, trescientos años, y engendró hijos e hijas."}, {"r": "Génesis 5:24", "t": "Caminó, pues, Enoc con Dios, y desapareció, porque le llevó Dios."}], "qs": [["Según Génesis 4:15, ¿qué puso Jehová en Caín para que no lo matase cualquiera que le hallara?", "Una señal", ["Una corona", "Un muro", "Un nombre nuevo"], "Génesis 4:15"], ["Según Génesis 4:26, ¿qué comenzaron a hacer los hombres en tiempos de Enós, hijo de Set?", "Invocar el nombre de Jehová", ["Edificar ciudades", "Labrar la tierra", "Ofrecer holocaustos"], "Génesis 4:26"], ["Según Génesis 5:22, ¿con quién caminó Enoc?", "Con Dios", ["Con Noé", "Con Matusalén", "Con los ángeles"], "Génesis 5:22"], ["Según Génesis 5:24, ¿qué le pasó a Enoc?", "Desapareció, porque le llevó Dios", ["Fue sepultado por Set", "Se perdió en el desierto", "Murió en su tienda"], "Génesis 5:24"]]}, {"title": "Noé, varón justo", "verses": [{"r": "Génesis 6:5", "t": "Y vio Jehová que la maldad de los hombres era mucha en la tierra, y que todo designio de los pensamientos del corazón de ellos era de continuo solamente el mal."}, {"r": "Génesis 6:6", "t": "Y se arrepintió Jehová de haber hecho hombre en la tierra, y le dolió en su corazón."}, {"r": "Génesis 6:9", "t": "Estas son las generaciones de Noé: Noé, varón justo, era perfecto en sus generaciones; con Dios caminó Noé."}, {"r": "Génesis 6:13", "t": "Dijo, pues, Dios a Noé: He decidido el fin de todo ser, porque la tierra está llena de violencia a causa de ellos; y he aquí que yo los destruiré con la tierra."}], "qs": [["Según Génesis 6:5, ¿cómo eran los pensamientos del corazón de los hombres?", "De continuo solamente el mal", ["Divididos entre el bien y el mal", "Inclinados a buscar a Dios", "Cambiantes cada día"], "Génesis 6:5"], ["Según Génesis 6:6, ¿de qué se arrepintió Jehová?", "De haber hecho hombre en la tierra", ["De haber creado los cielos", "De haber hecho a los animales", "De haber plantado el huerto"], "Génesis 6:6"], ["Según Génesis 6:9, ¿cómo se describe a Noé?", "Varón justo, perfecto en sus generaciones", ["Rey poderoso entre los hombres", "Profeta de las naciones", "Sacerdote del Altísimo"], "Génesis 6:9"], ["Según Génesis 6:13, ¿de qué estaba llena la tierra a causa de los hombres?", "De violencia", ["De idolatría", "De hambre", "De enfermedades"], "Génesis 6:13"]]}, {"title": "El arca", "verses": [{"r": "Génesis 6:14", "t": "Hazte un arca de madera de gofer; harás aposentos en el arca, y la calafatearás con brea por dentro y por fuera."}, {"r": "Génesis 6:22", "t": "Y lo hizo así Noé; hizo conforme a todo lo que Dios le mandó."}, {"r": "Génesis 7:1", "t": "Dijo luego Jehová a Noé: Entra tú y toda tu casa en el arca; porque a ti he visto justo delante de mí en esta generación."}, {"r": "Génesis 7:16", "t": "Y los que vinieron, macho y hembra de toda carne vinieron, como le había mandado Dios; y Jehová le cerró la puerta."}], "qs": [["Según Génesis 6:14, ¿de qué madera mandó Dios hacer el arca?", "De gofer", ["De cedro", "De acacia", "De ciprés"], "Génesis 6:14"], ["Según Génesis 6:14, ¿con qué debía calafatear el arca por dentro y por fuera?", "Con brea", ["Con barro", "Con cera", "Con pieles"], "Génesis 6:14"], ["Según Génesis 6:22, ¿cómo respondió Noé a lo que Dios le mandó?", "Hizo conforme a todo lo que Dios le mandó", ["Pidió más tiempo", "Hizo solo una parte", "Esperó una señal antes de obedecer"], "Génesis 6:22"], ["Según Génesis 7:1, ¿quiénes debían entrar en el arca?", "Noé y toda su casa", ["Solo Noé y sus hijos", "Noé y los ancianos de su pueblo", "Todos los habitantes de la tierra"], "Génesis 7:1"], ["Según Génesis 7:16, ¿quién cerró la puerta del arca?", "Jehová", ["Noé", "Sem, hijo de Noé", "Un ángel"], "Génesis 7:16"]]}, {"title": "Se acordó Dios de Noé", "verses": [{"r": "Génesis 7:11", "t": "El año seiscientos de la vida de Noé, en el mes segundo, a los diecisiete días del mes, aquel día fueron rotas todas las fuentes del grande abismo, y las cataratas de los cielos fueron abiertas,"}, {"r": "Génesis 8:1", "t": "Y se acordó Dios de Noé, y de todos los animales, y de todas las bestias que estaban con él en el arca; e hizo pasar Dios un viento sobre la tierra, y disminuyeron las aguas."}, {"r": "Génesis 8:20", "t": "Y edificó Noé un altar a Jehová, y tomó de todo animal limpio y de toda ave limpia, y ofreció holocausto en el altar."}, {"r": "Génesis 8:22", "t": "Mientras la tierra permanezca, no cesarán la sementera y la siega, el frío y el calor, el verano y el invierno, y el día y la noche."}], "qs": [["Según Génesis 7:11, ¿qué fue roto el día en que comenzó el diluvio?", "Todas las fuentes del grande abismo", ["Las columnas de los cielos", "Los sellos del mar", "Los cimientos de la tierra"], "Génesis 7:11"], ["Según Génesis 8:1, ¿qué hizo pasar Dios sobre la tierra para que disminuyeran las aguas?", "Un viento", ["Un sol ardiente", "Una gran sequía", "Una nube"], "Génesis 8:1"], ["Según Génesis 8:20, ¿qué ofreció Noé sobre el altar?", "Holocausto de animales y aves limpios", ["Primicias de la cosecha", "Pan sin levadura", "Incienso y aceite"], "Génesis 8:20"], ["Según Génesis 8:22, ¿qué no cesará mientras la tierra permanezca?", "La sementera y la siega", ["La lluvia y el viento", "La guerra y la paz", "Los terremotos"], "Génesis 8:22"]]}, {"title": "El pacto y el arco", "verses": [{"r": "Génesis 9:11", "t": "Estableceré mi pacto con vosotros, y no exterminaré ya más toda carne con aguas de diluvio, ni habrá más diluvio para destruir la tierra."}, {"r": "Génesis 9:12", "t": "Y dijo Dios: Esta es la señal del pacto que yo establezco entre mí y vosotros y todo ser viviente que está con vosotros, por siglos perpetuos:"}, {"r": "Génesis 9:16", "t": "Estará el arco en las nubes, y lo veré, y me acordaré del pacto perpetuo entre Dios y todo ser viviente, con toda carne que hay sobre la tierra."}], "qs": [["Según Génesis 9:11, ¿qué prometió Dios que ya no habría más?", "Diluvio para destruir la tierra", ["Lluvia sobre la tierra", "Noche en la tierra", "Pecado entre los hombres"], "Génesis 9:11"], ["Según Génesis 9:12, ¿entre quiénes establece Dios su pacto?", "Entre él, los hombres y todo ser viviente", ["Solo entre él y Noé", "Solo entre él y los hijos de Noé", "Entre él y los ángeles"], "Génesis 9:12"], ["Según Génesis 9:16, cuando Dios vea el arco en las nubes, ¿qué hará?", "Se acordará del pacto perpetuo", ["Enviará otro diluvio", "Hablará con Noé", "Descenderá a la tierra"], "Génesis 9:16"]]}, {"title": "Una sola lengua", "verses": [{"r": "Génesis 11:1", "t": "Tenía entonces toda la tierra una sola lengua y unas mismas palabras."}, {"r": "Génesis 11:4", "t": "Y dijeron: Vamos, edifiquémonos una ciudad y una torre, cuya cúspide llegue al cielo; y hagámonos un nombre, por si fuéremos esparcidos sobre la faz de toda la tierra."}, {"r": "Génesis 11:7", "t": "Ahora, pues, descendamos, y confundamos allí su lengua, para que ninguno entienda el habla de su compañero."}, {"r": "Génesis 11:9", "t": "Por esto fue llamado el nombre de ella Babel, porque allí confundió Jehová el lenguaje de toda la tierra, y desde allí los esparció sobre la faz de toda la tierra."}], "qs": [["Según Génesis 11:1, ¿cuántas lenguas tenía entonces toda la tierra?", "Una sola", ["Dos", "Siete", "Setenta"], "Génesis 11:1"], ["Según Génesis 11:4, ¿qué dijeron que querían edificar?", "Una ciudad y una torre cuya cúspide llegue al cielo", ["Un templo y un altar", "Un arca y un muro", "Un palacio para su rey"], "Génesis 11:4"], ["Según Génesis 11:4, ¿qué temían los que edificaban?", "Ser esparcidos sobre la faz de toda la tierra", ["Un nuevo diluvio", "El hambre", "Sus enemigos"], "Génesis 11:4"], ["Según Génesis 11:7, ¿qué hizo Jehová para que ninguno entendiera el habla de su compañero?", "Confundió su lengua", ["Les quitó la voz", "Les envió fuego", "Les envió una gran sequía"], "Génesis 11:7"], ["Según Génesis 11:9, ¿por qué fue llamada Babel?", "Porque allí confundió Jehová el lenguaje de toda la tierra", ["Porque era la ciudad más grande", "Porque allí nació Noé", "Porque tenía una torre muy alta"], "Génesis 11:9"]]}]},
{"title": "Salmos conocidos", "sub": "Los Salmos que más se citan", "lessons": [{"title": "Dichoso el que medita", "verses": [{"r": "Salmo 1:1", "t": "Bienaventurado el varón que no anduvo en consejo de malos, Ni estuvo en camino de pecadores, Ni en silla de escarnecedores se ha sentado;"}, {"r": "Salmo 1:2", "t": "Sino que en la ley de Jehová está su delicia, Y en su ley medita de día y de noche."}, {"r": "Salmo 1:3", "t": "Será como árbol plantado junto a corrientes de aguas, Que da su fruto en su tiempo, Y su hoja no cae; Y todo lo que hace, prosperará."}], "qs": [["Según el Salmo 1:1, ¿qué no hizo el varón bienaventurado?", "No anduvo en consejo de malos", ["No dejó de ofrecer sacrificios", "No olvidó el día de reposo", "No salió de su ciudad"], "Salmo 1:1"], ["Según el Salmo 1:2, ¿en qué está su delicia?", "En la ley de Jehová", ["En sus riquezas", "En el templo", "En la sabiduría de los hombres"], "Salmo 1:2"], ["Según el Salmo 1:3, ¿a qué será semejante el que medita en la ley de Jehová?", "A un árbol plantado junto a corrientes de aguas", ["A una palmera en el desierto", "A un cedro del Líbano", "A una vid en el huerto"], "Salmo 1:3"]]}, {"title": "Los cielos cuentan", "verses": [{"r": "Salmo 19:1", "t": "Los cielos cuentan la gloria de Dios, Y el firmamento anuncia la obra de sus manos."}, {"r": "Salmo 19:14", "t": "Sean gratos los dichos de mi boca y la meditación de mi corazón delante de ti, Oh Jehová, roca mía, y redentor mío."}, {"r": "Salmo 118:24", "t": "Este es el día que hizo Jehová; Nos gozaremos y alegraremos en él."}], "qs": [["Según el Salmo 19:1, ¿qué cuentan los cielos?", "La gloria de Dios", ["La historia de los hombres", "Las horas del día", "La ley de Moisés"], "Salmo 19:1"], ["Según el Salmo 19:1, ¿qué anuncia el firmamento?", "La obra de sus manos", ["El camino del justo", "El nombre de Jehová", "El día del juicio"], "Salmo 19:1"], ["Según el Salmo 19:14, ¿cómo llama el salmista a Jehová?", "Roca mía y redentor mío", ["Pastor mío y rey mío", "Luz mía y salvación mía", "Escudo mío y castillo mío"], "Salmo 19:14"], ["Según el Salmo 118:24, ¿qué dice el salmista de este día?", "Es el día que hizo Jehová", ["Es el día del gran reposo", "Es el día de la gran fiesta", "Es el día de la ley"], "Salmo 118:24"]]}, {"title": "Cuán glorioso es tu nombre", "verses": [{"r": "Salmo 8:1", "t": "¡Oh Jehová, Señor nuestro, Cuán glorioso es tu nombre en toda la tierra! Has puesto tu gloria sobre los cielos;"}, {"r": "Salmo 8:3", "t": "Cuando veo tus cielos, obra de tus dedos, La luna y las estrellas que tú formaste,"}, {"r": "Salmo 8:4", "t": "Digo: ¿Qué es el hombre, para que tengas de él memoria, Y el hijo del hombre, para que lo visites?"}], "qs": [["Según el Salmo 8:1, ¿qué es glorioso en toda la tierra?", "El nombre de Jehová", ["La ley de Jehová", "La casa de Jehová", "El camino de Jehová"], "Salmo 8:1"], ["Según el Salmo 8:3, ¿qué ve el salmista, obra de los dedos de Dios?", "Los cielos, la luna y las estrellas", ["Los montes y los valles", "El mar y los ríos", "El sol y las nubes"], "Salmo 8:3"], ["Según el Salmo 8:4, ¿qué pregunta hace el salmista?", "¿Qué es el hombre, para que tengas de él memoria?", ["¿Hasta cuándo, Jehová?", "¿Quién subirá al monte de Jehová?", "¿De dónde vendrá mi socorro?"], "Salmo 8:4"]]}, {"title": "Jehová es mi luz", "verses": [{"r": "Salmo 27:1", "t": "Jehová es mi luz y mi salvación; ¿de quién temeré? Jehová es la fortaleza de mi vida; ¿de quién he de atemorizarme?"}, {"r": "Salmo 27:4", "t": "Una cosa he demandado a Jehová, ésta buscaré; Que esté yo en la casa de Jehová todos los días de mi vida, Para contemplar la hermosura de Jehová, y para inquirir en su templo."}, {"r": "Salmo 27:14", "t": "Aguarda a Jehová; Esfuérzate, y aliéntese tu corazón; Sí, espera a Jehová."}], "qs": [["Según el Salmo 27:1, ¿qué dos cosas es Jehová para el salmista?", "Luz y salvación", ["Escudo y fortaleza", "Roca y redentor", "Pastor y rey"], "Salmo 27:1"], ["Según el Salmo 27:4, ¿qué una cosa demandó el salmista a Jehová?", "Estar en la casa de Jehová todos los días de su vida", ["Larga vida y riquezas", "Sabiduría para gobernar", "Victoria sobre sus enemigos"], "Salmo 27:4"], ["Según el Salmo 27:14, ¿qué dice que se debe hacer?", "Aguardar a Jehová y esforzarse", ["Correr a Jehová y descansar", "Clamar a Jehová y ayunar", "Seguir a Jehová sin mirar atrás"], "Salmo 27:14"]]}, {"title": "Nuestro pronto auxilio", "verses": [{"r": "Salmo 46:1", "t": "Dios es nuestro amparo y fortaleza, Nuestro pronto auxilio en las tribulaciones."}, {"r": "Salmo 46:2", "t": "Por tanto, no temeremos, aunque la tierra sea removida, Y se traspasen los montes al corazón del mar;"}, {"r": "Salmo 46:10", "t": "Estad quietos, y conoced que yo soy Dios; Seré exaltado entre las naciones; enaltecido seré en la tierra."}], "qs": [["Según el Salmo 46:1, ¿qué es Dios en las tribulaciones?", "Nuestro pronto auxilio", ["Nuestro juez", "Nuestro maestro", "Nuestro silencio"], "Salmo 46:1"], ["Según el Salmo 46:2, aunque la tierra sea removida, ¿qué no hará el salmista?", "Temer", ["Callar", "Huir", "Dudar"], "Salmo 46:2"], ["Según el Salmo 46:10, ¿qué dice Dios después de «Estad quietos»?", "Conoced que yo soy Dios", ["Esperad en mi salvación", "Temed al Señor", "Aprended mis caminos"], "Salmo 46:10"]]}, {"title": "Cerca de los quebrantados", "verses": [{"r": "Salmo 34:8", "t": "Gustad, y ved que es bueno Jehová; Dichoso el hombre que confía en él."}, {"r": "Salmo 34:18", "t": "Cercano está Jehová a los quebrantados de corazón; Y salva a los contritos de espíritu."}, {"r": "Salmo 51:10", "t": "Crea en mí, oh Dios, un corazón limpio, Y renueva un espíritu recto dentro de mí."}, {"r": "Salmo 51:12", "t": "Vuélveme el gozo de tu salvación, Y espíritu noble me sustente."}], "qs": [["Según el Salmo 34:8, ¿a qué invita el salmista?", "A gustar y ver que es bueno Jehová", ["A callar y ver que es grande Jehová", "A oír y ver que es justo Jehová", "A venir y ver que es fiel Jehová"], "Salmo 34:8"], ["Según el Salmo 34:18, ¿de quiénes está cercano Jehová?", "De los quebrantados de corazón", ["De los que ofrecen holocaustos", "De los poderosos", "De los que ayunan"], "Salmo 34:18"], ["Según el Salmo 51:10, ¿qué pide el salmista que Dios cree en él?", "Un corazón limpio", ["Un corazón fuerte", "Un corazón sabio", "Un corazón valiente"], "Salmo 51:10"], ["Según el Salmo 51:12, ¿qué pide el salmista que Dios le devuelva?", "El gozo de su salvación", ["La paz de su presencia", "La fuerza de su juventud", "El honor de su reino"], "Salmo 51:12"]]}, {"title": "Bajo la sombra del Omnipotente", "verses": [{"r": "Salmo 91:1", "t": "El que habita al abrigo del Altísimo Morará bajo la sombra del Omnipotente."}, {"r": "Salmo 91:2", "t": "Diré yo a Jehová: Esperanza mía, y castillo mío; Mi Dios, en quien confiaré."}, {"r": "Salmo 91:4", "t": "Con sus plumas te cubrirá, Y debajo de sus alas estarás seguro; Escudo y adarga es su verdad."}, {"r": "Salmo 91:11", "t": "Pues a sus ángeles mandará acerca de ti, Que te guarden en todos tus caminos."}], "qs": [["Según el Salmo 91:1, ¿bajo qué morará el que habita al abrigo del Altísimo?", "Bajo la sombra del Omnipotente", ["Bajo las alas del águila", "Bajo el techo del templo", "Bajo la nube de fuego"], "Salmo 91:1"], ["Según el Salmo 91:2, ¿cómo llama el salmista a Jehová?", "Esperanza mía y castillo mío", ["Roca mía y redentor mío", "Luz mía y salvación mía", "Pastor mío y escudo mío"], "Salmo 91:2"], ["Según el Salmo 91:4, ¿con qué te cubrirá y debajo de qué estarás seguro?", "Con sus plumas; debajo de sus alas", ["Con su manto; debajo de su tienda", "Con su mano; debajo de su trono", "Con su luz; debajo de las nubes"], "Salmo 91:4"], ["Según el Salmo 91:11, ¿qué mandará a sus ángeles acerca de ti?", "Que te guarden en todos tus caminos", ["Que te lleven al cielo", "Que peleen por ti en la batalla", "Que te anuncien lo que vendrá"], "Salmo 91:11"]]}, {"title": "Servid con alegría", "verses": [{"r": "Salmo 100:1", "t": "Cantad alegres a Dios, habitantes de toda la tierra."}, {"r": "Salmo 100:2", "t": "Servid a Jehová con alegría; Venid ante su presencia con regocijo."}, {"r": "Salmo 100:3", "t": "Reconoced que Jehová es Dios; Él nos hizo, y no nosotros a nosotros mismos; Pueblo suyo somos, y ovejas de su prado."}], "qs": [["Según el Salmo 100:1, ¿qué deben hacer los habitantes de toda la tierra?", "Cantar alegres a Dios", ["Guardar silencio ante Dios", "Ofrecer holocaustos a Dios", "Edificar un templo a Dios"], "Salmo 100:1"], ["Según el Salmo 100:2, ¿cómo debemos venir ante su presencia?", "Con regocijo", ["Con temblor", "Con silencio", "Con ofrendas"], "Salmo 100:2"], ["Según el Salmo 100:3, ¿qué somos de Jehová?", "Su pueblo y ovejas de su prado", ["Sus siervos y sus hijos", "Sus guerreros y sus testigos", "Su ejército y su heredad"], "Salmo 100:3"]]}, {"title": "Mi socorro viene de Jehová", "verses": [{"r": "Salmo 121:1", "t": "Alzaré mis ojos a los montes; ¿De dónde vendrá mi socorro?"}, {"r": "Salmo 121:2", "t": "Mi socorro viene de Jehová, Que hizo los cielos y la tierra."}, {"r": "Salmo 121:7", "t": "Jehová te guardará de todo mal; Él guardará tu alma."}, {"r": "Salmo 121:8", "t": "Jehová guardará tu salida y tu entrada Desde ahora y para siempre."}], "qs": [["Según el Salmo 121:1, ¿adónde alza el salmista sus ojos?", "A los montes", ["A los cielos", "Al templo", "Al mar"], "Salmo 121:1"], ["Según el Salmo 121:2, ¿de quién viene su socorro?", "De Jehová, que hizo los cielos y la tierra", ["De los montes", "De los príncipes", "De los ángeles"], "Salmo 121:2"], ["Según el Salmo 121:7, ¿de qué guardará Jehová?", "De todo mal", ["De todo enemigo", "De toda tristeza", "De todo temor"], "Salmo 121:7"], ["Según el Salmo 121:8, ¿qué guardará Jehová?", "Tu salida y tu entrada", ["Tu casa y tu familia", "Tu pan y tu agua", "Tu camino y tu descanso"], "Salmo 121:8"]]}]},
{"title": "El Evangelio de Marcos", "sub": "Marcos 1–16", "lessons": [{"title": "Principio del evangelio", "verses": [{"r": "Marcos 1:1", "t": "Principio del evangelio de Jesucristo, Hijo de Dios."}, {"r": "Marcos 1:9", "t": "Aconteció en aquellos días, que Jesús vino de Nazaret de Galilea, y fue bautizado por Juan en el Jordán."}, {"r": "Marcos 1:10", "t": "Y luego, cuando subía del agua, vio abrirse los cielos, y al Espíritu como paloma que descendía sobre él."}, {"r": "Marcos 1:11", "t": "Y vino una voz de los cielos que decía: Tú eres mi Hijo amado; en ti tengo complacencia."}], "qs": [["Según Marcos 1:1, ¿cómo comienza este evangelio?", "Principio del evangelio de Jesucristo, Hijo de Dios", ["En el principio era el Verbo", "Libro de la genealogía de Jesucristo", "Habiendo muchos tratado de poner en orden la historia"], "Marcos 1:1"], ["Según Marcos 1:9, ¿dónde fue bautizado Jesús y por quién?", "En el Jordán, por Juan", ["En el mar de Galilea, por Pedro", "En el Jordán, por Andrés", "En Nazaret, por Juan"], "Marcos 1:9"], ["Según Marcos 1:10, ¿cómo vio Jesús al Espíritu descender sobre él?", "Como paloma", ["Como fuego", "Como una nube", "Como un viento recio"], "Marcos 1:10"], ["Según Marcos 1:11, ¿qué dijo la voz de los cielos?", "Tú eres mi Hijo amado; en ti tengo complacencia", ["Tú eres mi siervo fiel", "Yo estoy contigo", "Te he levantado para ser luz de las naciones"], "Marcos 1:11"]]}, {"title": "Pescadores de hombres", "verses": [{"r": "Marcos 1:15", "t": "diciendo: El tiempo se ha cumplido, y el reino de Dios se ha acercado; arrepentíos, y creed en el evangelio."}, {"r": "Marcos 1:16", "t": "Andando junto al mar de Galilea, vio a Simón y a Andrés su hermano, que echaban la red en el mar; porque eran pescadores."}, {"r": "Marcos 1:17", "t": "Y les dijo Jesús: Venid en pos de mí, y haré que seáis pescadores de hombres."}], "qs": [["Según Marcos 1:15, ¿qué dijo Jesús que se había acercado?", "El reino de Dios", ["El juicio de Dios", "El día del Señor", "El templo de Dios"], "Marcos 1:15"], ["Según Marcos 1:15, ¿qué mandó Jesús que hicieran?", "Arrepentirse y creer en el evangelio", ["Ayunar y orar", "Ofrecer sacrificios en el templo", "Esperar en Jerusalén"], "Marcos 1:15"], ["Según Marcos 1:16, ¿qué hacían Simón y Andrés junto al mar de Galilea?", "Echaban la red en el mar", ["Remendaban las redes", "Cobraban impuestos", "Pastoreaban ovejas"], "Marcos 1:16"], ["Según Marcos 1:17, ¿qué dijo Jesús que haría de ellos?", "Pescadores de hombres", ["Pastores de ovejas", "Sacerdotes del templo", "Maestros de la ley"], "Marcos 1:17"]]}, {"title": "Tus pecados te son perdonados", "verses": [{"r": "Marcos 2:5", "t": "Al ver Jesús la fe de ellos, dijo al paralítico: Hijo, tus pecados te son perdonados."}, {"r": "Marcos 2:17", "t": "Al oír esto Jesús, les dijo: Los sanos no tienen necesidad de médico, sino los enfermos. No he venido a llamar a justos, sino a pecadores."}, {"r": "Marcos 2:27", "t": "También les dijo: El día de reposo fue hecho por causa del hombre, y no el hombre por causa del día de reposo."}, {"r": "Marcos 2:28", "t": "Por tanto, el Hijo del Hombre es Señor aun del día de reposo."}], "qs": [["Según Marcos 2:5, ¿qué dijo Jesús al paralítico al ver la fe de ellos?", "Hijo, tus pecados te son perdonados", ["Levántate y anda", "Tu fe te ha salvado", "Ve en paz"], "Marcos 2:5"], ["Según Marcos 2:17, ¿quiénes no tienen necesidad de médico?", "Los sanos", ["Los fuertes", "Los sabios", "Los ricos"], "Marcos 2:17"], ["Según Marcos 2:17, ¿a quiénes vino a llamar Jesús?", "A pecadores", ["A justos", "A los sabios", "A los sacerdotes"], "Marcos 2:17"], ["Según Marcos 2:27, ¿por causa de quién fue hecho el día de reposo?", "Por causa del hombre", ["Por causa de los sacerdotes", "Por causa de los fariseos", "Por causa de los ángeles"], "Marcos 2:27"], ["Según Marcos 2:28, ¿de qué es Señor el Hijo del Hombre?", "Aun del día de reposo", ["Del templo de Jerusalén", "De la ley de Moisés", "De la sinagoga"], "Marcos 2:28"]]}, {"title": "Calla, enmudece", "verses": [{"r": "Marcos 4:39", "t": "Y levantándose, reprendió al viento, y dijo al mar: Calla, enmudece. Y cesó el viento, y se hizo grande bonanza."}, {"r": "Marcos 4:40", "t": "Y les dijo: ¿Por qué estáis así amedrentados? ¿Cómo no tenéis fe?"}, {"r": "Marcos 4:41", "t": "Entonces temieron con gran temor, y se decían el uno al otro: ¿Quién es éste, que aun el viento y el mar le obedecen?"}], "qs": [["Según Marcos 4:39, ¿qué le dijo Jesús al mar?", "Calla, enmudece", ["Sosiégate y descansa", "Aquieta tus aguas", "Retrocede y no avances"], "Marcos 4:39"], ["Según Marcos 4:39, ¿qué sucedió cuando Jesús reprendió al viento?", "Cesó el viento y se hizo grande bonanza", ["Cayó una gran lluvia", "Las olas subieron más alto", "El barco llegó de inmediato a la orilla"], "Marcos 4:39"], ["Según Marcos 4:40, ¿qué preguntó Jesús a sus discípulos?", "¿Cómo no tenéis fe?", ["¿Por qué me habéis despertado?", "¿Dónde está vuestro Dios?", "¿Quién os enseñó a navegar?"], "Marcos 4:40"], ["Según Marcos 4:41, ¿qué se decían unos a otros?", "¿Quién es éste, que aun el viento y el mar le obedecen?", ["¿Es éste el Hijo de David?", "¿Cómo llegaremos a la orilla?", "¿Habrá otra tormenta mañana?"], "Marcos 4:41"]]}, {"title": "No temas, cree solamente", "verses": [{"r": "Marcos 5:36", "t": "Pero Jesús, luego que oyó lo que se decía, dijo al principal de la sinagoga: No temas, cree solamente."}, {"r": "Marcos 5:41", "t": "Y tomando la mano de la niña, le dijo: Talita cumi; que traducido es: Niña, a ti te digo, levántate."}, {"r": "Marcos 9:23", "t": "Jesús le dijo: Si puedes creer, al que cree todo le es posible."}, {"r": "Marcos 9:24", "t": "E inmediatamente el padre del muchacho clamó y dijo: Creo; ayuda mi incredulidad."}], "qs": [["Según Marcos 5:36, ¿qué dijo Jesús al principal de la sinagoga?", "No temas, cree solamente", ["Espera y verás", "Ve y dile que venga", "Levántate y camina"], "Marcos 5:36"], ["Según Marcos 5:41, ¿qué significa «Talita cumi»?", let AC=null;
function beep(kind){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const seq=kind==='good'?[[660,0,.09],[880,.09,.16]]
      :kind==='bad'?[[250,0,.14],[180,.14,.24]]
      :kind==='win'?[[523,0,.11],[659,.11,.11],[784,.22,.11],[1047,.33,.34]]
      :[[600,0,.05]];
    seq.forEach(([f,s,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(.16,t+s+.02);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);
      o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+d+.03);
    });
  }catch(e){}
}

  try{ /* iPhone (iOS 17.4+): un interruptor invisible da un toque háptico */
    if(!hapEl){
      hapEl=document.createElement('label');hapEl.setAttribute('aria-hidden','true');
      hapEl.style.cssText='position:fixed;left:-99px;top:-99px;opacity:0;width:40px;height:20px;overflow:hidden';
      const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');hapEl.appendChild(i);document.body.appendChild(hapEl);
    }
    hapEl.click();
    if(Array.isArray(pat)&&pat.length>2)setTimeout(()=>{try{hapEl.click();}catch(e){}},110);
  }catch(e){}
}

function mcq(prompt,correct,pool,extra){
  const uniq=Array.from(new Set(pool.filter(x=>x!==correct)));
  const wrong=((extra&&extra.keep)?uniq:shuffle(uniq)).slice(0,3);
  const opts=shuffle([correct,...wrong]);
  return Object.assign({type:'mc',prompt,opts,a:opts.indexOf(correct),tries:0,nota:''},extra||{});
}
function pickCover(cands,n){
  /* al menos una pregunta por elemento y luego completa al azar hasta n */
  const by={};cands.forEach(c=>{(by[c[0]]=by[c[0]]||[]).push(c[1]);});
  const out=[];Object.keys(by).forEach(k=>{const f=pickOne(by[k]);out.push(f);by[k]=by[k].filter(x=>x!==f);});
  const rest=shuffle(Object.keys(by).flatMap(k=>by[k]));
  while(out.length<n&&rest.length)out.push(rest.pop());
  return shuffle(out).slice(0,n).map(f=>f());
}

   PLANES DE LECTURA — núcleo (datos + reparto en días)
   ============================================================ */
const RD_OT=39;                                   // libros 0–38 = Antiguo Testamento; 39–65 = Nuevo
const RD_ATOM={'0:32':1,'18:46':1,'63:0':1};      // capítulos que no se parten (Gn 33, Sal 47, 3 Jn): su conteo difiere entre ediciones
const RD_PLANS={
  a:{id:'a',name:'De tapa a tapa',icon:'📖',desc:'Del Génesis al Apocalipsis, en orden. Un solo pasaje cada día.'},
  b:{id:'b',name:'Antiguo y Nuevo Testamento',icon:'⚖️',desc:'Cada día lees un pasaje del Antiguo y uno del Nuevo Testamento.'}
};
let RD_FLAT=null;
function rdFlat(){
  if(RD_FLAT)return RD_FLAT;
  const ch=[];let cum=0;
  RD_B.forEach((b,bi)=>b[2].forEach((len,ci)=>{ch.push({bi,c:ci+1,len,s:cum,e:cum+len,at:!!RD_ATOM[bi+':'+ci]});cum+=len;}));
  RD_FLAT={ch,T:cum};return RD_FLAT;
}
function rdStreamDef(kind){          // kind: 'all' | 'ot' | 'nt'
  const F=rdFlat();
  const list=F.ch.filter(c=>kind==='all'||(kind==='ot'?c.bi<RD_OT:c.bi>=RD_OT));
  const off=list[0].s,T=list[list.length-1].e-off;
  return {list,off,T};
}
/* Divide un flujo de lectura en n días: porciones casi iguales (en versículos),
   terminando en final de capítulo cuando es posible. Cada versículo cae en un solo día. */
function rdEnds(def,n){
  const {list,off,T}=def,t=T/n,bounds=list.map(c=>c.e-off),ends=[];let prev=0;
  const lb=(a,x)=>{let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<x)lo=m+1;else hi=m;}return lo;};
  for(let d=0;d<n;d++){
    let e;
    if(d===n-1)e=T;
    else{
      const ideal=Math.round((d+1)*T/n),i=lb(bounds,ideal);let best=null;
      [bounds[i],i>0?bounds[i-1]:null].forEach(x=>{if(x!=null&&x>prev&&Math.abs(x-ideal)<=0.5*t&&(best===null||Math.abs(x-ideal)<Math.abs(best-ideal)))best=x;});
      e=best!==null?best:ideal;
      const ci=lb(bounds,e+1);                       // capítulo que contiene el versículo e (índice base 0)
      const c=list[ci];
      if(c&&c.at&&e>c.s-off&&e<c.e-off){            // no partir capítulos «atómicos»
        const a=c.s-off,b=c.e-off;
        e=(a>prev&&Math.abs(a-ideal)<=Math.abs(b-ideal))?a:b;
      }
      e=Math.max(prev+1,Math.min(e,T-(n-1-d)));
    }
    ends.push(e);prev=e;
  }
  return ends;
}
const RD_CACHE={};
function rdPlan(plan,n){
  const key=plan+':'+n;if(RD_CACHE[key])return RD_CACHE[key];
  let days;
  if(plan==='a'){
    const def=rdStreamDef('all'),ends=rdEnds(def,n);let p=0;
    days=ends.map(e=>{const r={a:[def.off+p,def.off+e]};p=e;return r;});
  }else{
    const o=rdStreamDef('ot'),t=rdStreamDef('nt'),eo=rdEnds(o,n),et=rdEnds(t,n);let po=0,pt=0;
    days=eo.map((e,i)=>{const r={ot:[o.off+po,o.off+e],nt:[t.off+pt,t.off+et[i]]};po=e;pt=et[i];return r;});
  }
  const vs=days.map(d=>rdDayParts(plan,d).reduce((a,p)=>a+(p[1][1]-p[1][0]),0));
  return RD_CACHE[key]={days,n,plan,vs};
}
/* Convierte un rango de versículos [s,e) en texto: «Génesis 3:10–24; 4–5; 6:1–12» */
function rdChIdx(v){const F=rdFlat();let lo=0,hi=F.ch.length;while(lo<hi){const m=(lo+hi)>>1;if(F.ch[m].e<=v)lo=m+1;else hi=m;}return lo;}
function rdPartRefs(part){
  const F=rdFlat(),s=part[0],e=part[1],items=[];
  for(let i=rdChIdx(s);i<F.ch.length&&F.ch[i].s<e;i++){
    const c=F.ch[i],a=Math.max(s,c.s)-c.s+1,b=Math.min(e,c.e)-c.s;
    items.push({bi:c.bi,c:c.c,a,b,whole:a===1&&b===c.len});
  }
  const out=[];let cur=null;
  items.forEach(it=>{
    if(!cur||cur.bi!==it.bi){cur={bi:it.bi,segs:[]};out.push(cur);}
    const last=cur.segs[cur.segs.length-1];
    if(it.whole&&last&&last.whole&&last.to===it.c-1)last.to=it.c;
    else cur.segs.push({whole:it.whole,from:it.c,to:it.c,a:it.a,b:it.b});
  });
  return out.map(g=>({bi:g.bi,name:RD_B[g.bi][0],txt:g.segs.map(sg=>sg.whole?(sg.from===sg.to?''+sg.from:sg.from+'–'+sg.to):(sg.a===sg.b?sg.from+':'+sg.a:sg.from+':'+sg.a+'–'+sg.b)).join('; ')}));
}
function rdPartText(part){return rdPartRefs(part).map(g=>g.name+' '+g.txt).join('; ');}
function rdPartVerses(part){return part[1]-part[0];}
function rdPartBooks(part){const F=rdFlat(),set=[];for(let i=rdChIdx(part[0]);i<F.ch.length&&F.ch[i].s<part[1];i++){if(set.indexOf(F.ch[i].bi)<0)set.push(F.ch[i].bi);}return set;}
function rdDayParts(plan,day){return plan==='a'?[['',day.a]]:[['Antiguo Testamento',day.ot],['Nuevo Testamento',day.nt]];}
/* Duración real del plan: 1 o 2 años de calendario desde la fecha de inicio (365/366 y 730/731 días) */
function rdSpan(start,yrs){
  const [y,m,d]=start.split('-').map(Number);
  const endD=new Date(y+yrs,m-1,d);                        // el 29 de febrero pasa al 1 de marzo si el año destino no es bisiesto
  const endS=dstr(endD),n=diffDays(start,endS),leaps=[];
  for(let yy=y;yy<=y+yrs;yy++){
    if((yy%4===0&&yy%100!==0)||yy%400===0){const f=yy+'-02-29';if(diffDays(start,f)>=0&&diffDays(f,endS)>0)leaps.push(f);}
  }
  return {n,end:addDays(start,n-1),leaps};
}

function rmQBlank(used){

  const out=Array.from({length:n},(_,i)=>fn[order[i%order.length]](used));save();return out;

function rmSplit(t){
  const w=t.split(/\s+/),n=w.length,k=Math.max(3,Math.min(8,Math.round(n/4))),size=n/k,cuts=[];
  for(let j=1;j<k;j++){
    const ideal=Math.round(j*size),last=cuts.length?cuts[cuts.length-1]:0;let best=null;
    for(let d=0;d<=2&&best===null;d++)for(const c of [ideal-d,ideal+d])if(best===null&&c>last&&c<=n-(k-j)&&/[,;:.!?»]$/.test(w[c-1]))best=c;
    if(best===null)best=Math.min(Math.max(ideal,last+1),n-(k-j));
    cuts.push(best);
  }
  const out=[];let prev=0;[...cuts,n].forEach(c=>{out.push(w.slice(prev,c).join(' '));prev=c;});
  return out;
}

ALLV.forEach(v=>v.t.split(/\s+/).forEach(w=>{const c=coreOf(w).core;if(c.length>=4)WORDPOOL.push({core:c,cap:/^\p{Lu}/u.test(c),u:v.u});}));

const KEY='lampara.rvr1960.v1';
const defaults=()=>({course:'bib',gw:{},dicSeen:{},sound:true,haptic:true,tipHide:false,g:{n:3,names:[],rounds:10,voice:false},gplays:0,xp:0,streak:0,best:0,lastDay:null,freezes:0,goal:20,days:{},done:{},verses:{},lessons:0,perfect:0,reviews:0,ach:{},froze:0,rd:null,rdDays:{},rdbest:0,rdDone:false,cards:[],badges:[],badge:'',giftsSent:0,giftsGot:0,rmplays:0});
let S=defaults();
function idbOpen(cb){
  try{
    const rq=indexedDB.open('lampara',1);
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
    rq.onsuccess=()=>cb(rq.result);
    rq.onerror=()=>cb(null);
  }catch(e){cb(null);}
}
function idbSet(val){idbOpen(db=>{if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(val,'S');}catch(e){}});}
function idbGet(cb){idbOpen(db=>{if(!db)return cb(null);try{const g=db.transaction('kv').objectStore('kv').get('S');g.onsuccess=()=>cb(g.result||null);g.onerror=()=>cb(null);}catch(e){cb(null);}});}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j);}catch(e){}idbSet(j);}
function load(){
  let found=false;
  try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(defaults(),JSON.parse(r));found=true;}}catch(e){}
  if(!found)idbGet(v=>{if(v){try{S=Object.assign(defaults(),JSON.parse(v));render();}catch(e){}}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}
function exportCode(){return 'LAMP1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function importCode(c){
  c=(c||'').trim();if(c.indexOf('LAMP1.')!==0)return false;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(6)))));if(!o||typeof o!=='object')return false;S=Object.assign(defaults(),o);save();return true;}catch(e){return false;}
}

function refreshStreak(){
  if(!S.lastDay||S.streak===0)return;
  const gap=diffDays(S.lastDay,today());
  if(gap<=1)return;
  const missed=gap-1;
  if(S.freezes>=missed){S.freezes-=missed;S.froze=missed;S.lastDay=addDays(today(),-1);}
  else{S.streak=0;}
  save();
}
function recordDay(xp){
  const t=today();let newDay=false,gotFreeze=false;
  if(S.lastDay!==t){
    newDay=true;
    S.streak=(S.streak>0&&S.lastDay===addDays(t,-1))?S.streak+1:1;
    S.lastDay=t;
    if(S.streak>S.best)S.best=S.streak;
    if(S.streak%7===0&&S.freezes<2){S.freezes++;gotFreeze=true;}
  }
  const before=S.days[t]||0;
  S.days[t]=before+xp;S.xp+=xp;
  return {newDay,gotFreeze,goalHit:before<S.goal&&S.days[t]>=S.goal};
}

/* ============================================================
   GENERADORES DE PREGUNTAS
   ============================================================ */
function mkMC(h){const opts=shuffle([h[1],...h[2]]);return {type:'mc',prompt:h[0],ref:h[3],opts,a:opts.indexOf(h[1]),tries:0,nota:h[4]||''};}
function mkRef(v){
  const same=ALLV.filter(x=>x.r!==v.r&&x.u===v.u),other=ALLV.filter(x=>x.u!==v.u);
  const ds=[...shuffle(other),...shuffle(same)].slice(0,3).map(x=>x.r); /* prefiere otros libros: más fácil de distinguir */
  const opts=shuffle([v.r,...ds]);
  return {type:'ref',prompt:'¿Qué pasaje es este?',ref:v.r,opts,a:opts.indexOf(v.r),tries:0};
}
function pickBlank(v){
  const bl=BLANKS[v.r];if(!bl||!bl.length)return null;
  const toks=v.t.split(/\s+/);
  const opts=shuffle(bl);
  for(const [word,ds] of opts){
    const idx=toks.findIndex(w=>coreOf(w).core===word);
    if(idx>=0){const p=coreOf(toks[idx]);return {toks,idx,pre:p.pre,suf:p.suf,word,ds};}
  }
  return null;
}
function mkFill(v){
  const b=pickBlank(v);
  if(!b)return mkOrder(v,true);
  const opts=shuffle([b.word,...b.ds]);
  return {type:'fill',prompt:'Completa el versículo',ref:v.r,toks:b.toks,idx:b.idx,pre:b.pre,suf:b.suf,opts,a:opts.indexOf(b.word),tries:0};
}
function mkOrder(v,noFill){
  const toks=v.t.split(/\s+/);
  if(toks.length>16||toks.length<4)return noFill?mkRef(v):mkFill(v);
  let bank=toks.map((w,i)=>({id:i,w})),n=0;
  do{bank=shuffle(bank);n++;}while(bank.map(b=>b.w).join(' ')===v.t&&n<10);
  return {type:'order',prompt:'Ordena las palabras del versículo',ref:v.r,toks,bank,tries:0};
}
const mk=(k,v)=>k==='fill'?mkFill(v):k==='ref'?mkRef(v):mkOrder(v);
/* ============================================================
   EJERCICIOS NUEVOS: ¿verdadero o falso? y unir pares
   ============================================================ */
function mkTF(v,hand){
  const fbv={v:v.t,r:v.r},roll=Math.random();
  /* 1) Preguntas de la lección con una respuesta propuesta: las falsas son los distractores
        escritos a mano (verosímiles), así que no se adivinan por el tono de la frase. */
  if(hand&&hand.length&&roll<0.55){
    const h=pickOne(hand),truth=Math.random()<0.5,prop=truth?h[1]:pickOne(h[2]),vv=VBY[h[3]];
    return {type:'tf',ref:h[3],tries:0,prompt:'¿Es correcta esta respuesta?',shown:h[0]+' — «'+prop+'»',cite:h[3],
      opts:['Sí, es correcta','No, es incorrecta'],a:truth?0:1,
      fb:Object.assign({t:truth?'Así es: «'+h[1]+'».':'La respuesta correcta es «'+h[1]+'», no «'+prop+'».'},vv?{v:vv.t,r:vv.r}:{})};
  }
  /* 2) ¿Es esta la cita correcta? Ahora la cita falsa sale de la misma unidad (otro capítulo si se puede): exige conocer el pasaje. */
  if(roll<0.75){
    const truth=Math.random()<0.5,ch=x=>x.r.replace(/:.*$/,'');
    const near=ALLV.filter(x=>x.r!==v.r&&x.u===v.u&&ch(x)!==ch(v)),same=ALLV.filter(x=>x.r!==v.r&&x.u===v.u),far=ALLV.filter(x=>x.r!==v.r);
    const o=pickOne(near.length?near:same.length?same:far);
    return Object.assign({type:'tf',ref:v.r,tries:0},{prompt:'¿Esta cita es correcta?',shown:v.t,cite:truth?v.r:o.r,opts:['Sí, es la cita correcta','No, es otro pasaje'],a:truth?0:1,
      fb:Object.assign({t:truth?'Así es: este versículo está en '+v.r+'.':'Este versículo es de '+v.r+', no de '+o.r+'.'},fbv)});
  }
  /* 3) El versículo tal cual o con una palabra cambiada. */
  const truth=Math.random()<0.5,b=truth?null:pickBlank(v),base={type:'tf',ref:v.r,tries:0};
  if(!b)return Object.assign(base,{prompt:'¿Así dice el versículo?',shown:v.t,cite:v.r,opts:['Sí, así dice','No, tiene un error'],a:0,fb:Object.assign({t:'Así es: el versículo dice exactamente eso.'},fbv)});
  const bad=pickOne(b.ds),toks=b.toks.slice();toks[b.idx]=b.pre+bad+b.suf;
  return Object.assign(base,{prompt:'¿Así dice el versículo?',shown:toks.join(' '),cite:v.r,opts:['Sí, así dice','No, tiene un error'],a:1,
    fb:Object.assign({t:'El versículo dice «'+b.word+'», no «'+bad+'».'},fbv)});
}
function mkMatch(items,prompt,lgk,rgk,done){
  const ids=items.map((_,i)=>i);
  return {type:'match',prompt,items,lo:shuffle(ids),ro:shuffle(ids),lgk:!!lgk,rgk:!!rgk,tries:0,ref:null,
    fb:{t:done||'Todas las parejas quedaron bien.'}};
}
function mkMatchVerses(vs){
  const picks=shuffle(vs).slice(0,Math.min(4,vs.length));
  if(picks.length<3)return null;
  const hs=picks.map(v=>({v,w:v.t.split(/\s+/),n:6}));
  const txt=h=>{const n=Math.min(h.n,h.w.length);return h.w.slice(0,n).join(' ').replace(/[\s,;:.]+$/,'')+(n<h.w.length?'…':'');};
  let g=0;while(new Set(hs.map(txt)).size<hs.length&&g++<8)hs.forEach(h=>{if(h.n<h.w.length)h.n++;});
  if(new Set(hs.map(txt)).size<hs.length)return null;
  const q=mkMatch(hs.map(h=>({l:h.v.r,r:txt(h),ref:h.v.r})),'Une cada cita con su versículo',false,false,'Cada cita quedó con su versículo.');
  return q;
}
function mkMatchLetters(idx){
  const pick=shuffle(idx).slice(0,Math.min(5,idx.length));
  if(pick.length<3)return null;
  return mkMatch(pick.map(i=>({l:GK_LET[i][0]+' '+GK_LET[i][1],r:GK_LET[i][2]})),'Une cada letra con su nombre',true,false,'Cada letra quedó con su nombre.');
}
function mkMatchWords(mine){
  const seen={},pick=[];
  shuffle(mine).forEach(e=>{const r=e.es.split(';')[0].trim();if(!seen[r]&&pick.length<4){seen[r]=1;pick.push({l:e.g,r,wid:e.id});}});
  return pick.length<3?null:mkMatch(pick,'Une cada palabra griega con su significado',true,false,'Cada palabra quedó con su significado.');
}
function withMatch(qs,m){if(m&&qs.length)qs.splice(rnd(qs.length),1,m);return qs;}
function matchTap(side,id){
  if(!L||!L.cur||L.cur.type!=='match'||L.ui.checked)return;
  const q=L.cur,m=L.ui.m||(L.ui.m={sel:null,done:{},wrong:0,wrongIds:{},flash:null});
  if(m.done[id]||m.flash)return;
  if(!m.sel||m.sel.s===side){m.sel=(m.sel&&m.sel.s===side&&m.sel.id===id)?null:{s:side,id};renderLesson();return;}
  const l=side==='l'?id:m.sel.id,r=side==='r'?id:m.sel.id;
  if(l===r){
    m.done[l]=true;m.sel=null;beep('good');haptic(10);
    if(Object.keys(m.done).length>=q.items.length){matchFinish();return;}
    renderLesson();return;
  }
  m.wrong++;m.wrongIds[l]=true;m.flash={l,r};m.sel=null;beep('bad');haptic([30,40,30]);renderLesson();
  setTimeout(()=>{if(L&&L.cur===q&&L.ui.m===m){m.flash=null;renderLesson();}},550);
}
function matchFinish(){
  const q=L.cur,ui=L.ui,m=ui.m;
  ui.checked=true;ui.ok=true;ui.fresh=false;
  q.items.forEach((it,i)=>{
    const bad=!!m.wrongIds[i];
    if(it.ref){const st=S.verses[it.ref]||(S.verses[it.ref]={c:0,w:0});if(bad)st.w++;else st.c++;}
    if(it.wid){S.gw=S.gw||{};const g=S.gw[it.wid]||(S.gw[it.wid]={c:0,w:0});if(bad)g.w++;else g.c++;}
  });
  L.done++;
  if(m.wrong===0){L.firstTry++;L.xp+=2;L.combo++;ui.fresh=true;ui.head=pickOne(['¡Todas unidas!','¡Pareja perfecta!','¡Sin un error!']);if(L.combo>0&&L.combo%5===0)confetti(50);}
  else{L.mistakes++;L.combo=0;ui.head=pickOne(['¡Las uniste todas!','¡Lo lograste!']);}
  beep('good');haptic(15);save();renderLesson();
}

function buildQuestions(verses,hand,max=10){
  const off=rnd(3);
  const kindsFor=v=>v.key?['fill','order','ref']:['fill','order'];
  const prim=verses.map((v,i)=>{const k=kindsFor(v);return mk(k[(i+off)%k.length],v);});
  const extras=shuffle(verses.map((v,i)=>{const k=kindsFor(v),p=(i+off)%k.length;return mk(k[(p+1+rnd(k.length-1))%k.length],v);}));
  const core=[...prim,...hand.map(mkMC)];
  const bonus=[],mt=verses.length>=3?mkMatchVerses(verses):null;
  if(mt)bonus.push(mt);
  shuffle(verses).slice(0,2).forEach(v=>bonus.push(mkTF(v,hand)));
  const qs=[...core,...bonus.slice(0,Math.max(0,max-core.length))];
  while(qs.length<max&&extras.length)qs.push(extras.pop());
  return shuffle(qs).slice(0,max);
}

/* ============================================================

let L=null;
function startLesson(meta,qs,intro){
  refreshStreak();
  L={meta,queue:qs.slice(),total:qs.length,done:0,firstTry:0,mistakes:0,xp:0,combo:0,cur:null,ui:null,intro:intro||null};
  $('#lesson').hidden=false;document.body.style.overflow='hidden';
  if(L.intro)renderIntro();else nextQ();
}
function renderIntro(){
  const i=L.intro;
  $('#lesson').innerHTML=
   '<div class="lh"><button class="x" data-a="close" aria-label="Salir de la lección">'+IC.close+'</button><div class="bar"><i style="width:0%"></i></div></div>'+
   '<div class="lb"><div class="intro"><div style="display:flex;justify-content:center;margin:4px 0 6px">'+mascot('happy',110)+'</div><span class="tag">💡 Antes de empezar</span><h2>'+esc(i.t)+'</h2><p>'+esc(i.p)+'</p></div></div>'+
   '<div class="lf"><div class="in"><button class="btn" data-a="begin">¡Vamos!</button></div></div>';
}
function nextQ(){
  L.cur=L.queue.shift();
  if(!L.cur){finishLesson();return;}
  L.ui={sel:null,placed:[],checked:false,ok:null};
  renderLesson();
}
function canCheck(){const q=L.cur,ui=L.ui;return !ui.checked&&q.type!=='match'&&(q.type==='order'?ui.placed.length===q.bank.length:ui.sel!=null);}
function optsHTML(q,ui){
  return '<div class="opts'+(q.gko?' gko':'')+'">'+q.opts.map((o,i)=>{
    let c='';if(ui.checked){if(i===q.a)c='good';else if(i===ui.sel)c='bad';}else if(i===ui.sel)c='sel';
    return '<button class="opt '+c+'" data-a="pick" data-i="'+i+'" '+(ui.checked?'disabled':'')+'><kbd>'+(i+1)+'</kbd><span>'+esc(o)+'</span></button>';
  }).join('')+'</div>';
}
function fbHTML(q,v,fbk,ans){
  if(!fbk)return '<p class="fv">'+ans+'<em>'+esc(v.t)+'</em> <cite>'+esc(v.r)+'</cite></p>';
  let s='';
  if(fbk.gl)s+='<div class="letchips" aria-label="Letra griega">'+fbk.gl.map(x=>'<div class="letchip"><b class="gk">'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></div>').join('')+'</div>';
  if(fbk.g)s+='<p class="fv gk gkline">'+esc(fbk.g)+'</p>';
  if(fbk.t||ans)s+='<p class="fv">'+ans+esc(fbk.t||'')+'</p>';
  if(fbk.v)s+='<p class="fv"><em>'+esc(fbk.v)+'</em> <cite>'+esc(fbk.r)+'</cite></p>';
  let bt='';
  if(fbk.sl!=null)bt+='<button class="btn ghost sm listen" data-a="say-l" data-i="'+fbk.sl+'">🔊 Escuchar</button> ';
  if(fbk.w)bt+='<button class="btn ghost sm listen" data-a="say-w" data-w="'+fbk.w+'">🔊 Escuchar</button> <button class="btn ghost sm" data-a="dic-peek" data-w="'+fbk.w+'">📚 Historia de la palabra</button>';
  if(fbk.say)bt+='<button class="btn ghost sm listen" data-a="say-t" data-t="'+esc(fbk.say)+'">🔊 Escuchar</button>';
  if(bt)s+='<div class="fbbtns">'+bt+'</div>';
  return s;
}
function renderLesson(){
  const q=L.cur,ui=L.ui,pct=Math.round(100*L.done/L.total);
  const mood=ui.checked?(ui.ok?'cheer':'sad'):(q.tries>0?'think':'happy');
  const say='<div class="say">'+mascot(mood,76)+'<div class="bubble"><p class="prompt">'+esc(q.prompt)+'</p></div></div>';
  let body='';
  if(q.tries>0&&!ui.checked)body+='<div class="retry">'+mascot('think',42)+'<span>¡Repaso! Esta te salió mal antes. Ahora sí.</span></div>';
  if(q.type==='mc')body+=say+(q.big?'<div class="gkbig gk'+(q.big.length<=6?' xl':'')+'">'+esc(q.big)+'</div>':'')+optsHTML(q,ui);
  else if(q.type==='tf')body+=say+'<blockquote class="verse">'+esc(q.shown)+'<cite class="vref">'+esc(q.cite)+'</cite></blockquote>'+optsHTML(q,ui);
  else if(q.type==='match'){
    const m=ui.m||{sel:null,done:{},wrong:0,wrongIds:{},flash:null};
    const col=(order,side)=>order.map(id=>{const it=q.items[id],on=m.sel&&m.sel.s===side&&m.sel.id===id,bad=m.flash&&m.flash[side]===id;
      return '<button class="mi'+(m.done[id]?' ok':'')+(on?' sel':'')+(bad?' bad':'')+((side==='l'?q.lgk:q.rgk)?' gko':'')+'" data-a="mi" data-s="'+side+'" data-id="'+id+'" '+(m.done[id]||ui.checked?'disabled':'')+'>'+esc(side==='l'?it.l:it.r)+'</button>';}).join('');
    body+=say+'<p class="mcount">'+Object.keys(m.done).length+' de '+q.items.length+' unidas</p><div class="mt"><div class="mcol">'+col(q.lo,'l')+'</div><div class="mcol">'+col(q.ro,'r')+'</div></div>';
  }
  else if(q.type==='ref')body+=say+'<blockquote class="verse">'+esc(VBY[q.ref].t)+'</blockquote>'+optsHTML(q,ui);
  else if(q.type==='fill'){
    const parts=q.toks.map((w,i)=>{
      if(i!==q.idx)return esc(w);
      const chosen=ui.sel!=null?esc(q.opts[ui.sel]):'&nbsp;&nbsp;&nbsp;';
      const cls=ui.checked?(ui.ok?' good':' bad'):'';
      return esc(q.pre)+'<span class="blank'+cls+'">'+chosen+'</span>'+esc(q.suf);
    }).join(' ');
    body+=say+'<blockquote class="verse">'+parts+'</blockquote>'+optsHTML(q,ui);
  }else{
    body+=say+'<div class="answer '+(ui.checked?(ui.ok?'good':'bad'):'')+'" aria-label="Tu respuesta">'+
     ui.placed.map(id=>{const b=q.bank.find(x=>x.id===id);return '<button class="w" data-a="unplace" data-id="'+id+'" '+(ui.checked?'disabled':'')+'>'+esc(b.w)+'</button>';}).join('')+'</div>'+
     '<div class="bank">'+q.bank.map(b=>'<button class="w '+(ui.placed.includes(b.id)?'used':'')+'" data-a="place" data-id="'+b.id+'" '+(ui.checked||ui.placed.includes(b.id)?'disabled':'')+'>'+esc(b.w)+'</button>').join('')+'</div>';
  }
  let foot;
  if(!ui.checked){
    foot='<div class="lf"><div class="in"><button class="btn" data-a="check" '+(canCheck()?'':'disabled')+'>'+(q.type==='match'?'Une todas las parejas':'Comprobar')+'</button></div></div>';
  }else{
    const v=q.ref?VBY[q.ref]:null,fbk=q.fb||null;
    let ans='';
    if(!ui.ok&&q.type!=='order')ans='Respuesta correcta: <b>'+esc(q.opts[q.a])+'</b><br>';
    const sub=ui.ok?(ui.fresh?'+2 XP':(q.tries>0?'¡Repasada! Ya la tienes':'')):'Volverá a salir al final para repasarla';
    foot='<div class="lf '+(ui.ok?'good':'bad')+'" role="status"><div class="in">'+(ui.fresh?'<div class="xpfloat">+2 XP</div>':'')+
     '<div class="fbhead">'+mascot(ui.ok?'cheer':'sad',58)+'<div><h4>'+esc(ui.head||'')+'</h4>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div></div>'+
     '<div class="fbox">'+fbHTML(q,v,fbk,ans)+(q.nota?'<div class="nota"><b>Nota:</b> '+esc(q.nota)+'</div>':'')+'</div>'+
     '<button class="btn '+(ui.ok?'good':'bad')+'" data-a="next">Continuar</button></div></div>';
  }
  $('#lesson').innerHTML=
   '<div class="lh"><button class="x" data-a="close" aria-label="Salir de la lección">'+IC.close+'</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+(L.combo>=3?'<div class="combo" aria-label="'+L.combo+' aciertos seguidos">'+IC.flame+L.combo+'</div>':'')+'</div>'+
   '<div class="lb">'+body+'</div>'+foot;
}
function check(){
  if(!canCheck())return;
  const q=L.cur,ui=L.ui;let ok;
  if(q.type==='order')ok=ui.placed.map(id=>q.bank.find(b=>b.id===id).w).join(' ')===q.toks.join(' ');
  else ok=ui.sel===q.a;
  ui.checked=true;ui.ok=ok;ui.fresh=false;
  const st=q.ref?(S.verses[q.ref]||(S.verses[q.ref]={c:0,w:0})):{c:0,w:0};
  const gw=q.wid?((S.gw=S.gw||{})[q.wid]||(S.gw[q.wid]={c:0,w:0})):null;
  if(ok){
    if(q.tries===0){L.firstTry++;L.xp+=2;st.c++;if(gw)gw.c++;L.combo++;ui.fresh=true;}
    L.done++;
    ui.head=L.combo>=3&&q.tries===0?'¡'+L.combo+' seguidas!':pickOne(['¡Eso es!','¡Perfecto!','¡Muy bien!','¡Así se hace!','¡Genial!','¡Excelente!']);
    beep('good');
    if(q.tries===0&&L.combo>0&&L.combo%5===0)confetti(50);
  }else{
    if(q.tries===0){st.w++;if(gw)gw.w++;}
    q.tries++;L.mistakes++;L.queue.push(q);L.combo=0;
    ui.head=pickOne(['¡Casi!','¡Uy, esa no!','¡Ups!','Se te escapó']);
    beep('bad');
  }
  haptic(ok?15:[30,40,30]);
  save();renderLesson();
}
function finishLesson(){
  const bonus=5+(L.mistakes===0?5:0);
  const xp=L.xp+bonus;
  const r=recordDay(xp);
  const isReview=L.meta.type==='review';
  if(isReview)S.reviews++;
  else{const p=S.done[L.meta.key]||{n:0};S.done[L.meta.key]={n:p.n+1,acc:Math.max(p.acc||0,L.firstTry/L.total)};}
  S.lessons++;if(L.mistakes===0)S.perfect++;
  S.froze=0;
  const fresh=ACH.filter(a=>!S.ach[a.id]&&a.f(S));fresh.forEach(a=>S.ach[a.id]=true);
  save();
  const acc=Math.round(100*L.firstTry/L.total);
  const vs=L.meta.verses||[];
  const gws=(L.meta.words||[]).map(id=>GK_BY[id]).filter(Boolean);
  $('#lesson').innerHTML=
   '<div class="lb"><div class="res"><div style="display:flex;justify-content:center">'+mascot('cheer',140)+'</div><h1>'+(isReview?'¡Repaso listo!':'¡Lección completada!')+'</h1>'+
   '<p class="muted" style="margin:0">'+esc(L.meta.title||'')+'</p>'+
   '<div class="rs"><div><i>⚡</i><b>+'+xp+'</b><span>XP</span></div><div><i>🎯</i><b>'+acc+'%</b><span>Al primer intento</span></div><div><i>🔥</i><b>'+S.streak+'</b><span>Días de racha</span></div></div>'+
   (L.mistakes>0?'<div class="revbox">🔄 Repasaste '+L.mistakes+(L.mistakes===1?' pregunta':' preguntas')+' que fallaste. ¡Así se aprende!</div>':'<div class="revbox" style="background:var(--green-bg);border-color:var(--green)">💯 ¡Sin errores! Lección perfecta.</div>')+
   (r.newDay?'<div class="note fl">🔥 <b>¡Racha de '+S.streak+(S.streak===1?' día':' días')+'!</b> Vuelve mañana para mantenerla.</div>':'<div class="note">Hoy tu racha ya estaba asegurada. ¡Sigue sumando!</div>')+
   (r.gotFreeze?'<div class="note fl">🛡️ <b>¡Ganaste un protector de racha!</b> Cubre un día si no puedes practicar.</div>':'')+
   (r.goalHit?'<div class="note">🎯 <b>¡Meta diaria cumplida!</b> '+S.days[today()]+' XP hoy.</div>':'')+
   fresh.map(a=>'<div class="note">'+(ACH_E[a.id]||'⭐')+' <b>Logro: '+a.t+'.</b> '+a.d+'.</div>').join('')+
   (gws.length?'<div class="vs"><h3>Palabras de esta lección</h3><div class="dlist">'+gws.map(e=>'<button class="dentry" data-a="dic-peek" data-w="'+e.id+'"><span class="dg gk">'+esc(e.g)+'</span><span class="dm"><b>'+esc(e.tr)+'</b> '+esc(e.es)+'</span></button>').join('')+'</div></div>':'')+
   (vs.length?'<div class="vs"><h3>Versículos de esta lección</h3><div class="list">'+vs.map(v=>'<div class="li"><cite>'+esc(v.r)+'</cite><p>'+esc(v.t)+'</p></div>').join('')+'</div></div>':'')+
   '</div></div><div class="lf"><div class="in"><div class="row2"><button class="btn ghost" data-a="share" data-k="lesson">📣 Compartir</button><button class="btn" data-a="finish">Continuar</button></div></div></div>';
  L.finished=true;
  LASTRES={title:L.meta.title||'una lección',xp,acc,streak:S.streak,review:isReview};
  setTimeout(famSync,400);
  setTimeout(()=>{prepShare('lesson').catch(()=>{});},200);
  beep('win');confetti(120);haptic([20,70,20,70,50]);
}
function closeLesson(){$('#lesson').hidden=true;$('#lesson').innerHTML='';document.body.style.overflow='';L=null;render();}

const canSpeak=()=>{try{return 'speechSynthesis' in window;}catch(e){return false;}};
const sayClean=t=>String(t).replace(/[«»]/g,'').replace(/_{2,}/g,'...');
const sayRef=r=>r.replace(':',' versículo ').replace('-',' al ');
function speak(t){
  if(!S.g.voice||!canSpeak()||!t)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(sayClean(t));
    const v=(speechSynthesis.getVoices()||[]).find(x=>/^es/i.test(x.lang));
    if(v){u.voice=v;u.lang=v.lang;}else u.lang='es-ES';
    u.rate=.95;speechSynthesis.speak(u);
  }catch(e){}
}
const nameOf=i=>((S.g.names[i]||'').trim())||('Jugador '+(i+1));

/* ---- Memoria de preguntas ya vistas: no se repite nada hasta recorrer todo el banco ---- */
function gSeen(id){S.gseen=S.gseen||{};return new Set(S.gseen[id]||[]);}
function gMark(id,k){S.gseen=S.gseen||{};const a=S.gseen[id]||(S.gseen[id]=[]);if(a.indexOf(k)<0)a.push(k);}
function gFresh(id,arr,kf){const s=gSeen(id),f=arr.filter(x=>!s.has(kf(x)));if(f.length)return f;S.gseen[id]=[];return arr;}
function gTake(id,arr,kf,n){
  const out=[];
  for(let i=0;i<n;i++){
    const pool=gFresh(id,arr.filter(x=>out.indexOf(x)<0),kf);
    if(!pool.length)break;
    const it=pickOne(pool);out.push(it);gMark(id,kf(it));
  }
  save();return out;
}
/* Verdadero o falso: frases escritas a mano + las preguntas de las lecciones con una respuesta propuesta (verosímil) */
let VFP=null;
function vfPool(){
  if(VFP)return VFP;
  VFP=GFALSO.map(x=>({k:x[0],f:x}));
  UNITS.forEach(u=>u.lessons.forEach(l=>(l.qs||[]).forEach(h=>VFP.push({k:'qa|'+h[0],h}))));
  return VFP;
}
function vfTake(n){return gTake('vf',vfPool(),p=>p.k,n);}
function vfItem(p){
  if(p.f){const x=p.f;return {c:x[0],truth:!!x[1],ref:x[2],why:x[3]};}
  const h=p.h,truth=Math.random()<0.5,prop=truth?h[1]:pickOne(h[2]);
  return {c:h[0]+' — «'+prop+'»',truth,ref:h[3],why:truth?'Así es: «'+h[1]+'».':'La respuesta correcta es «'+h[1]+'».'};
}
function mkItem(label,html,say,ansHtml,ansSay){return {label,html,say,ansHtml,ansSay};}
function dQuien(n){return gTake('quien',GQUIEN,x=>x.q,n).map(x=>mkItem('¿Quién dijo esto?','<blockquote class="verse gbig">'+esc(x.q)+'</blockquote>','¿Quién dijo esto? '+x.q,'<b>'+esc(x.a)+'</b><span>'+esc(x.ref)+'</span>',x.a+'. '+sayRef(x.ref)));}
function dVF(n){return vfTake(n).map(p=>{const x=vfItem(p);return mkItem('¿Verdadero o falso?','<blockquote class="verse gbig">'+esc(x.c)+'</blockquote>','¿Verdadero o falso? '+x.c,'<b>'+(x.truth?'Verdadero':'Falso')+'</b><span>'+esc(x.ref)+'</span><p>'+esc(x.why)+'</p>',(x.truth?'Verdadero. ':'Falso. ')+x.why+' '+sayRef(x.ref));});}
function dPers(n){return gTake('pers',GPERS,x=>x.a,n).map(x=>{const it=mkItem('¿Quién es este personaje?','','','<b>'+esc(x.a)+'</b>',x.a);it.clues=x.c;return it;});}
function dComp(n){
  const vs=gTake('comp',ALLV.filter(v=>v.t.split(/\s+/).length<=26&&BLANKS[v.r]),v=>v.r,n);

function gStart(){
  const c=S.g,deck=DECKS[G.id](c.rounds);
  G={id:G.id,game:G.game,deck,i:0,cl:1,phase:'q',win:[],scores:Array(c.n).fill(0),total:deck.length};

function gCur(){return G.deck[G.i];}
function gSpeakQ(){const it=gCur();speak(it.clues?it.label+'. Pista 1. '+it.clues[0][0]:it.say);}
function gRender(){
  const it=gCur(),sc=G.game.scored,pct=Math.round(100*G.i/G.total),last=G.i===G.total-1;
  const pts=it.clues?4-G.cl:1;
  let body='<div class="lb">';
  if(sc)body+='<div class="sb">'+G.scores.map((s,i)=>'<span class="sbp">'+av(i)+'<b>'+esc(nameOf(i))+'</b> '+s+'</span>').join('')+'</div>';
  body+='<p class="glabel">'+esc(it.label)+' <span>· '+(G.i+1)+' de '+G.total+'</span></p>';
  if(it.clues)body+='<ol class="clues">'+it.clues.slice(0,G.cl).map((c,k)=>'<li><span>Pista '+(k+1)+'</span>'+esc(c[0])+(G.phase==='a'?'<cite>'+esc(c[1])+'</cite>':'')+'</li>').join('')+'</ol>';
  else body+=it.html;
  if(G.phase==='a')body+='<div class="gans">'+it.ansHtml+'</div>';

  const rep=S.g.voice&&canSpeak()?'<button class="btn ghost" data-a="g-repeat">🔁 Repetir</button>':'';

  }else if(G.phase==='q'){
    const more=it.clues&&G.cl<it.clues.length?'<button class="btn ghost" data-a="g-clue">💡 Otra pista</button>':'';
    foot='<div class="lf"><div class="in">'+((rep||more)?'<div class="row2">'+rep+more+'</div>':'')+'<button class="btn" data-a="g-reveal" data-primary>Ver respuesta</button></div></div>';
  }else{
    foot='<div class="lf"><div class="in"><p style="margin:0 0 8px;font-weight:900">¿Quién acertó? <span class="muted" style="font-weight:800">(+'+pts+')</span></p><div class="who">'+
     G.scores.map((_,i)=>'<button class="pl '+(G.win.includes(i)?'on':'')+'" data-a="g-win" data-p="'+i+'" aria-pressed="'+G.win.includes(i)+'">'+av(i)+esc(nameOf(i))+'</button>').join('')+

}
function gNext(){
  if(G.game.scored){const pts=gCur().clues?4-G.cl:1;G.win.forEach(i=>{G.scores[i]+=pts;});}
  G.win=[];G.i++;G.cl=1;G.phase='q';

  gRender();gSpeakQ();

   fresh.map(a=>'<div class="note">'+(ACH_E[a.id]||'⭐')+' <b>Logro: '+a.t+'.</b> '+a.d+'.</div>').join('')+
   '</div></div><div class="lf"><div class="in"><div class="row2"><button class="btn ghost" data-a="g-exit">Salir</button><button class="btn" data-a="g-again" data-primary>Jugar otra vez</button></div></div></div>';
  G.finished=true;

function gAct(a,b){
  const c=S.g;
  if(a==='g-open')gSetup(b.dataset.g);
  else if(!G)return;
  else if(a==='g-n'){c.n=Math.max(2,Math.min(8,c.n+(+b.dataset.d)));save();gRenderSetup();}
  else if(a==='g-r'){c.rounds=+b.dataset.r;save();gRenderSetup();}
  else if(a==='g-voice'){c.voice=b.dataset.v==='1';save();gRenderSetup();if(c.voice)speak('Lectura en voz alta activada.');}
  else if(a==='g-start')gStart();
  else if(a==='g-reveal'){G.phase='a';gRender();speak(gCur().ansSay);}
  else if(a==='g-clue'){G.cl++;gRender();speak('Pista '+G.cl+'. '+gCur().clues[G.cl-1][0]);}
  else if(a==='g-win'){const p=+b.dataset.p,k=G.win.indexOf(p);if(k>=0)G.win.splice(k,1);else{G.win.push(p);beep('good');confetti(30);haptic(15);}gRender();}
  else if(a==='g-next')gNext();
  else if(a==='g-repeat'){if(G.phase==='a')speak(gCur().ansSay);else gSpeakQ();}
  else if(a==='g-close'){if(G.deck&&!G.finished)showModal('<h3>¿Salir del juego?</h3><p>Se perderá el marcador de esta partida.</p><button class="btn" data-a="stay">Seguir jugando</button><button class="btn ghost" data-a="g-leave">Salir</button>');else gClose();}
  else if(a==='g-leave'){hideModal();gClose();}
  else if(a==='g-again'){const id=G.id,game=G.game;G={id,game};gStart();}
  else if(a==='g-exit')gClose();
}

    if(L.ui&&L.ui.checked){e.preventDefault();nextQ();}
    else if(canCheck()){e.preventDefault();check();}
  }else if(/^[1-4]$/.test(e.key)&&!L.finished&&L.ui){pick(+e.key-1);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{if(famJoined())famPoll(true);if(RM.code)rmPoll();if(!L&&!G&&!RM.code)render();}});
window.addEventListener('pagehide',()=>{try{save();}catch(e){}});

load();render();
</script>
