<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F7F7F7; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5;
  --green:#58CC02; --green-d:#58A700; --green-bg:#D7FFB8; --green-ink:#3F8C00;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-bg:#DDF4FF; --blue-ink:#1273A6;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-bg:#FFDFE0; --red-ink:#C42B2B;
  --orange:#FF9600; --orange-d:#CC7900; --orange-bg:#FFEFD0; --orange-ink:#B05F00;
  --yellow:#FFC800; --yellow-d:#E5A600; --yellow-bg:#FFF6CC; --yellow-ink:#9A7000;
  --purple:#CE82FF; --purple-d:#A560E8; --purple-bg:#F3E3FF;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shade:rgba(0,0,0,.2);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131F24; --surface:#1B2B33; --surface2:#233640; --ink:#EAF2F6; --muted:#9FB0B8; --line:#2F4550;
    --green-bg:#1E3A14; --green-ink:#8CE63A; --blue-bg:#123A4D; --blue-ink:#6CCBF7;
    --red-bg:#40202A; --red-ink:#FF8A8A; --orange-bg:#40290F; --orange-ink:#FFB347;
    --yellow-bg:#3D3410; --yellow-ink:#FFD84D; --purple-bg:#32204A; --shade:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131F24; --surface:#1B2B33; --surface2:#233640; --ink:#EAF2F6; --muted:#9FB0B8; --line:#2F4550;
  --green-bg:#1E3A14; --green-ink:#8CE63A; --blue-bg:#123A4D; --blue-ink:#6CCBF7;
  --red-bg:#40202A; --red-ink:#FF8A8A; --orange-bg:#40290F; --orange-ink:#FFB347;
  --yellow-bg:#3D3410; --yellow-ink:#FFD84D; --purple-bg:#32204A; --shade:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}
#app{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3,h4{font-weight:900}

/* ---------- animaciones ---------- */
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.9}}
@keyframes floatup{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.94)}}
.mas{display:inline-block;flex:none;line-height:0}
.mas svg{width:100%;height:100%;overflow:visible}
.mas .fl{transform-origin:50px 32px;animation:flick 1.6s ease-in-out infinite}
.mas.cheer{animation:bounce .8s ease-out 2}
.mas.sad{animation:wiggle .9s ease-in-out 2}
.pop{animation:pop .35s ease-out}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:-.02em;color:var(--green)}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;padding:4px 8px;border-radius:12px}
.chip svg{width:22px;height:22px}
.chip.streak{color:var(--orange)}
.chip.streak.off{color:var(--muted);filter:grayscale(1)}
.chip.streak.risk svg{animation:pulse 1.2s infinite}
.chip.xp{color:var(--yellow-d)}
.chip.shield{color:var(--blue)}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:16px;margin:0 0 14px}
.hero{display:flex;gap:10px;align-items:center;margin:4px 0 16px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.3;flex:1}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.goalrow{display:flex;gap:14px;align-items:center}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:76px;height:76px}
.ring circle{fill:none;stroke-width:8}
.ring .rbg{stroke:var(--line)}
.ring .rfg{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900}
.goalrow h3{margin:0 0 2px;font-size:18px}
.goalrow p{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:800}
.dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:transparent}
.dot svg{width:15px;height:15px}
.dot.on{background:var(--orange);border-color:var(--orange);color:#fff}
.dot.today{border-color:var(--blue)}
.dot.on.today{border-color:var(--orange)}
.votd{background:var(--blue-bg);border-color:var(--blue)}
.votd .tagv{display:inline-block;background:var(--blue);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:2px 12px;margin-bottom:8px}
.votd q{display:block;quotes:none;font-size:19px;line-height:1.45;margin:2px 0 6px;font-weight:800}
.votd cite{font-style:normal;font-weight:900;color:var(--blue-ink);font-size:14px}
.votd .think{margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:15px;font-weight:800}
.votd .think b{color:var(--orange)}
.banner{background:var(--orange-bg);border:2px solid var(--orange);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:15px;font-weight:800}
.install{background:var(--purple-bg);border:2px solid var(--purple);border-radius:18px;padding:14px;margin:0 0 14px;font-size:15px}
.install b{font-weight:900}
.install button{margin-top:10px}

/* ---------- ruta ---------- */
.unit{margin:30px 0 8px}
.unit-h{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--u);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--shade)}
.unit-h h2{margin:0;font-size:21px;line-height:1.15}
.unit-h p{margin:2px 0 0;font-size:14px;opacity:.95;font-weight:800}
.uemo{font-size:40px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.count{display:inline-block;margin-top:6px;font-weight:900;background:rgba(255,255,255,.28);border-radius:999px;padding:1px 10px;font-size:13px}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 0 6px}
.stop{display:grid;justify-items:center;gap:8px;transform:translateX(var(--off,0px));max-width:200px;position:relative}
.node{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--u);color:#fff;box-shadow:0 7px 0 var(--shade);transition:transform .08s,box-shadow .08s;font-size:34px;line-height:1}
.node svg{width:34px;height:34px}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--shade)}
.node.done{background:var(--yellow);color:#fff}
.node.locked{background:var(--line);color:var(--muted);cursor:not-allowed}
.node.current{animation:pulse 1.8s ease-in-out infinite;outline:6px solid color-mix(in srgb,var(--u) 28%,transparent);outline-offset:3px}
.stop span{font-size:14px;font-weight:800;text-align:center;color:var(--muted)}
.stop.cur span{color:var(--ink);font-weight:900}
.start-tip{position:absolute;top:-30px;background:var(--surface);color:var(--green);border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-weight:900;font-size:14px;letter-spacing:.04em;animation:bounce 1.6s infinite;white-space:nowrap}
.start-tip::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-6px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- pestañas ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.tabs>div{display:flex;width:100%;max-width:560px;gap:6px}
.tab{flex:1;display:grid;justify-items:center;gap:1px;padding:6px 4px;border-radius:14px;font-size:12px;font-weight:900;color:var(--muted);border:2px solid transparent}
.tab svg{width:28px;height:28px}
.tab.on{color:var(--blue);background:var(--blue-bg);border-color:var(--blue)}

/* ---------- botones ---------- */
.btn{display:block;width:100%;background:var(--green);color:#fff;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px;border-radius:16px;border-bottom:4px solid var(--shade);text-align:center;transition:transform .08s,border-bottom-width .08s}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px}
.btn:disabled{background:var(--line);color:var(--muted);border-bottom-color:transparent;cursor:not-allowed}
.btn.blue{background:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.purple{background:var(--purple-d)}
.btn.good{background:var(--green)}
.btn.bad{background:var(--red)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);border-bottom-width:4px}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:14px}

/* ---------- progreso ---------- */
h1.page{font-size:30px;margin:10px 0 14px;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.stat .se{font-size:30px;line-height:1}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px;font-weight:800}
.stat.s1{background:var(--orange-bg);border-color:var(--orange)}
.stat.s2{background:var(--purple-bg);border-color:var(--purple)}
.stat.s3{background:var(--yellow-bg);border-color:var(--yellow)}
.stat.s4{background:var(--green-bg);border-color:var(--green)}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;font-weight:900;background:var(--surface)}
.seg button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a{display:grid;justify-items:center;text-align:center;gap:2px;padding:12px 8px;border-radius:18px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface)}
.a .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:28px;filter:grayscale(1);opacity:.6}
.a.on{border-color:var(--yellow);background:var(--yellow-bg)}
.a.on .ico{background:var(--yellow);filter:none;opacity:1}
.a b{display:block;font-size:14px;line-height:1.15;margin-top:4px}
.a small{color:var(--muted);font-size:12px;font-weight:700;line-height:1.2}
.list{display:grid;gap:10px}
.li{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
.li cite{font-style:normal;font-weight:900;color:var(--blue);font-size:14px}
.li p{margin:4px 0 0;font-size:16px;line-height:1.5;font-weight:700}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px}
.muted{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin:26px 0 0;line-height:1.5;font-weight:700}
.link-danger{color:var(--red);font-weight:900;padding:10px 0;text-align:left}
textarea.code{width:100%;min-height:76px;font:inherit;font-size:13px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2);color:var(--ink);resize:vertical;word-break:break-all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:900;z-index:80;animation:slideup .25s ease-out;max-width:90%;text-align:center}

/* ---------- lección ---------- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.overlay[hidden],.modal[hidden]{display:none}
.lh{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:640px;width:100%;margin:0 auto}
.x{width:38px;height:38px;display:grid;place-items:center;color:var(--muted);border-radius:12px;flex:none}
.x svg{width:26px;height:26px}
.bar{flex:1;height:18px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gcol,var(--green));border-radius:99px;transition:width .4s ease;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:99px;background:rgba(255,255,255,.35)}
.combo{display:flex;align-items:center;gap:2px;color:var(--orange);font-weight:900;font-size:18px;flex:none;animation:pop .3s ease-out}
.combo svg{width:24px;height:24px}
.lb{flex:1;overflow:auto;padding:6px 16px 24px;max-width:640px;width:100%;margin:0 auto}
.say{display:flex;gap:10px;align-items:center;margin:6px 0 16px}
.prompt{font-size:21px;line-height:1.25;margin:0;font-weight:900;letter-spacing:-.01em}
.say .bubble{font-size:20px;font-weight:900}
.verse{position:relative;margin:0 0 18px;padding:16px 16px 16px 44px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:18px;font-size:20px;line-height:1.6;font-weight:800}
.verse::before{content:"\201C";position:absolute;left:12px;top:6px;font-size:52px;line-height:1;color:var(--blue);font-weight:900}
.blank{display:inline-block;min-width:84px;text-align:center;border-bottom:4px solid var(--blue);color:var(--blue-ink);background:var(--blue-bg);border-radius:8px 8px 0 0;font-weight:900;padding:0 8px}
.blank.good{border-color:var(--green);color:var(--green-ink);background:var(--green-bg)}
.blank.bad{border-color:var(--red);color:var(--red-ink);background:var(--red-bg)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;font-weight:800;font-size:18px;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt kbd{font:inherit;font-size:14px;font-weight:900;border:2px solid var(--line);border-radius:10px;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}
.opt.sel kbd{border-color:var(--blue);color:var(--blue)}
.opt.good{border-color:var(--green);background:var(--green-bg);color:var(--green-ink);animation:pop .35s ease-out}
.opt.good kbd{border-color:var(--green);color:var(--green-ink)}
.opt.bad{border-color:var(--red);background:var(--red-bg);color:var(--red-ink);animation:shake .45s}
.opt.bad kbd{border-color:var(--red);color:var(--red-ink)}
.opt:disabled{cursor:default}
.answer{min-height:68px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.w{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 14px;font-size:18px;font-weight:800}
.w:active{transform:translateY(2px)}
.w.used{visibility:hidden}
.answer.good .w{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.answer.bad{animation:shake .45s}
.answer.bad .w{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.retry{display:flex;align-items:center;gap:10px;margin:2px 0 12px;padding:8px 14px 8px 8px;background:var(--orange-bg);border:2px dashed var(--orange);border-radius:18px;color:var(--orange-ink);font-weight:900;font-size:15px;animation:slideup .3s ease-out}
.lf{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--surface);position:relative}
.lf .in{max-width:640px;margin:0 auto}
.lf.good{background:var(--green-bg);border-color:var(--green)}
.lf.bad{background:var(--red-bg);border-color:var(--red)}
.lf.good .in,.lf.bad .in{animation:slideup .25s ease-out}
.fbhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lf h4{margin:0;font-size:24px;line-height:1.1}
.lf.good h4{color:var(--green-ink)}
.lf.bad h4{color:var(--red-ink)}
.lf .sub{font-size:14px;font-weight:800;color:var(--muted)}
.fbox{max-height:34vh;overflow:auto;margin-bottom:12px}
.lf .fv{margin:0 0 8px;font-size:16px;line-height:1.5;font-weight:700}
.lf .fv em{font-style:normal}
.lf .fv cite{font-style:normal;font-weight:900}
.lf.good .fv{color:var(--green-ink)}
.lf.bad .fv{color:var(--red-ink)}
.nota{font-size:14px;line-height:1.45;padding:9px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--ink);margin:0 0 4px;font-weight:700}
.nota b{color:var(--blue)}
.xpfloat{position:absolute;right:20px;top:-18px;font-weight:900;font-size:22px;color:var(--yellow-d);animation:floatup 1.1s ease-out forwards;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.intro{padding-top:6px}
.intro .tag{display:inline-block;font-size:13px;font-weight:900;color:#fff;background:var(--blue);border-radius:999px;padding:3px 14px;margin:6px 0 10px}
.intro h2{font-size:30px;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.intro p{font-size:19px;line-height:1.55;margin:0 0 14px;font-weight:700}

/* ---------- resultado ---------- */
.res{text-align:center;padding-top:10px}
.res h1{font-size:34px;margin:6px 0 2px;letter-spacing:-.02em;color:var(--green)}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rs div{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 4px;background:var(--surface);animation:pop .4s ease-out backwards}
.rs div:nth-child(1){background:var(--yellow-bg);border-color:var(--yellow);animation-delay:.1s}
.rs div:nth-child(2){background:var(--green-bg);border-color:var(--green);animation-delay:.25s}
.rs div:nth-child(3){background:var(--orange-bg);border-color:var(--orange);animation-delay:.4s}
.rs i{display:block;font-style:normal;font-size:22px;line-height:1}
.rs b{display:block;font-size:24px}
.rs span{font-size:12px;color:var(--muted);font-weight:800}
.note{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;text-align:left;font-size:15px;font-weight:700}
.note.fl{border-color:var(--orange);background:var(--orange-bg)}
.note b{font-weight:900}
.vs{text-align:left;margin-top:16px}
.vs h3{font-size:17px;margin:0 0 8px}
.revbox{text-align:left;margin-top:8px;background:var(--orange-bg);border:2px solid var(--orange);border-radius:16px;padding:10px 14px;font-weight:800;font-size:15px}

/* ---------- repaso ---------- */
.revhero{display:flex;gap:12px;align-items:center;background:var(--orange-bg);border:2px solid var(--orange);border-bottom-width:5px;border-radius:22px;padding:16px;margin-bottom:14px}
.revhero h2{margin:0 0 4px;font-size:22px;color:var(--orange-ink)}
.revhero p{margin:0 0 12px;font-size:15px;font-weight:800}
.lvl{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:1px 10px;color:#fff}

/* ---------- juegos ---------- */
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{display:grid;justify-items:center;gap:4px;text-align:center;width:100%;background:var(--surface);border:2px solid var(--gc);border-bottom-width:6px;border-radius:22px;padding:16px 10px 14px;transition:transform .08s}
.gcard:active{transform:translateY(3px);border-bottom-width:3px}
.gcard .gemo{font-size:44px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.gcard b{font-size:17px;line-height:1.15;color:var(--gc)}
.gcard span{color:var(--muted);font-size:13px;font-weight:700;line-height:1.25}
.inp{width:100%;font:inherit;font-weight:800;padding:11px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:26px;font-weight:900;color:var(--gc,var(--blue))}
.stepper b{font-size:28px;min-width:32px;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 8px;font-size:17px}
.gsetup{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.gsetup h1{margin:0;font-size:26px;line-height:1.1}
.gsetup p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.glabel{font-weight:900;color:var(--gc,var(--blue));margin:6px 0 10px;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.glabel span{color:var(--muted);font-weight:800}
.gbig{font-size:23px;line-height:1.5}
.vref{display:block;font-style:normal;font-size:14px;font-weight:900;color:var(--blue);margin-top:8px}
.gq{font-size:25px;line-height:1.35;margin:6px 0 14px;font-weight:900}
.gans{border:2px solid var(--green);border-bottom-width:5px;background:var(--green-bg);border-radius:18px;padding:12px 16px;margin-top:14px;animation:pop .35s ease-out}
.gans b{display:block;font-size:26px;color:var(--green-ink)}
.gans span{font-weight:900;color:var(--green-ink);font-size:14px}
.gans p{margin:8px 0 0;font-size:16px;line-height:1.5;font-weight:700}
.sb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sbp{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:3px;border-radius:999px;padding:2px 12px 2px 3px;font-weight:800}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none}
.sbp b{font-weight:900}
.clues{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.clues li{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--gc,var(--blue));border-radius:16px;padding:10px 14px;font-size:20px;line-height:1.4;font-weight:800;animation:slideup .3s ease-out}
.clues li span{display:block;font-size:12px;font-weight:900;color:var(--gc,var(--blue));letter-spacing:.05em;text-transform:uppercase}
.clues cite{display:block;font-style:normal;font-size:13px;font-weight:900;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:900}
.pl.on{border-color:var(--green);background:var(--green-bg);color:var(--green-ink);animation:pop .3s}
.row2{display:flex;gap:10px;margin-bottom:10px}
.row2 .btn{flex:1}
.rk{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rk .medal{font-size:26px;line-height:1}
.gamed .btn:not(.ghost):not(.good):not(.bad){background:var(--gc)}
.gamed .seg button.on{border-color:var(--gc);color:var(--gc);background:var(--surface2)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.6);z-index:40;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:24px;padding:20px;max-width:380px;width:100%;display:grid;gap:12px;text-align:center;animation:pop .25s ease-out}
.modal .box .mas{margin:0 auto}
.modal h3{margin:0;font-size:22px}
.modal p{margin:0;color:var(--muted)}
.cf{position:fixed;top:-16px;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    ["Según Génesis 2:25, ¿cómo estaban Adán y su mujer?","Desnudos, y no se avergonzaban",["Vestidos de pieles","Escondidos entre los árboles","Cubiertos de hojas"],"Génesis 2:25","Antes de la caída no había vergüenza ni miedo. La vergüenza llega con el pecado (Génesis 3:7)."]]}
 ]},
 {title:'La caída',sub:'Génesis 3 y sus consecuencias',lessons:[
  {title:'La serpiente y la pregunta',verses:[
    {r:'Génesis 3:1',t:"Pero la serpiente era astuta, más que todos los animales del campo que Jehová Dios había hecho; la cual dijo a la mujer: ¿Conque Dios os ha dicho: No comáis de todo árbol del huerto?"},
    {r:'Génesis 3:2-3',t:"Y la mujer respondió a la serpiente: Del fruto de los árboles del huerto podemos comer; pero del fruto del árbol que está en medio del huerto dijo Dios: No comeréis de él, ni le tocaréis, para que no muráis."},
    {r:'Génesis 3:4-5',t:"Entonces la serpiente dijo a la mujer: No moriréis; sino que sabe Dios que el día que comáis de él, serán abiertos vuestros ojos, y seréis como Dios, sabiendo el bien y el mal."}],
   qs:[
    ["Según Génesis 3:1, ¿cómo era la serpiente?","Astuta, más que todos los animales del campo",["Débil, entre los animales del campo","Sabia, como los ángeles","Mansa, como las ovejas"],"Génesis 3:1","Todo empieza con una duda: «¿Conque Dios os ha dicho…?». La serpiente cuestiona lo que Dios dijo."],
    ["Según Génesis 3:3, ¿qué pasaría si comían del árbol que estaba en medio del huerto?","Morirían",["Serían expulsados","Serían como Dios","Perderían el huerto"],"Génesis 3:2-3"],
    ["Según Génesis 3:4, ¿qué le dijo la serpiente a la mujer?","No moriréis",["Moriréis ese mismo día","Dios os ama","Comed y viviréis para siempre"],"Génesis 3:4-5"],
    ["Según Génesis 3:5, ¿qué prometió la serpiente que serían?","Como Dios, sabiendo el bien y el mal",["Reyes sobre toda la tierra","Inmortales en el huerto","Ángeles servidores de Dios"],"Génesis 3:4-5"]]},
  {title:'Comieron',verses:[
    {r:'Génesis 3:6',t:"Y vio la mujer que el árbol era bueno para comer, y que era agradable a los ojos, y árbol codiciable para alcanzar la sabiduría; y tomó de su fruto, y comió; y dio también a su marido, el cual comió así como ella."},
    {r:'Génesis 3:7',t:"Entonces fueron abiertos los ojos de ambos, y conocieron que estaban desnudos; entonces cosieron hojas de higuera, y se hicieron delantales."},
    {r:'Génesis 3:8',t:"Y oyeron la voz de Jehová Dios que se paseaba en el huerto, al aire del día; y el hombre y su mujer se escondieron de la presencia de Jehová Dios entre los árboles del huerto."}],
   qs:[
    ["Según Génesis 3:6, ¿a quién dio también la mujer del fruto?","A su marido",["A la serpiente","A sus hijos","A los animales"],"Génesis 3:6"],
    ["Según Génesis 3:7, ¿qué conocieron cuando fueron abiertos sus ojos?","Que estaban desnudos",["Que Dios los había abandonado","Que habían sido engañados","Que el árbol era bueno"],"Génesis 3:7"],
    ["Según Génesis 3:7, ¿qué se hicieron con hojas de higuera?","Delantales",["Techos","Coronas","Cestas"],"Génesis 3:7"],
    ["Según Génesis 3:8, ¿qué hicieron el hombre y su mujer al oír la voz de Jehová Dios?","Se escondieron entre los árboles",["Corrieron a su encuentro","Se postraron a orar","Salieron del huerto"],"Génesis 3:8"]]},
  {title:'¿Dónde estás tú?',verses:[
    {r:'Génesis 3:9',t:"Mas Jehová Dios llamó al hombre, y le dijo: ¿Dónde estás tú?"},
    {r:'Génesis 3:10',t:"Y él respondió: Oí tu voz en el huerto, y tuve miedo, porque estaba desnudo; y me escondí."},
    {r:'Génesis 3:11',t:"Y Dios le dijo: ¿Quién te enseñó que estabas desnudo? ¿Has comido del árbol de que yo te mandé no comieses?"},
    {r:'Génesis 3:12',t:"Y el hombre respondió: La mujer que me diste por compañera me dio del árbol, y yo comí."},
    {r:'Génesis 3:13',t:"Entonces Jehová Dios dijo a la mujer: ¿Qué es lo que has hecho? Y dijo la mujer: La serpiente me engañó, y comí."}],
   qs:[
    ["¿Qué le preguntó Jehová Dios al hombre en Génesis 3:9?","¿Dónde estás tú?",["¿Qué has hecho?","¿Por qué te escondes?","¿Quién te enseñó?"],"Génesis 3:9"],
    ["Según Génesis 3:10, ¿por qué tuvo miedo el hombre?","Porque estaba desnudo",["Porque oyó un trueno","Porque vio la espada encendida","Porque vio a la serpiente"],"Génesis 3:10"],
    ["¿A quién culpó el hombre en Génesis 3:12?","A la mujer que Dios le dio por compañera",["A la serpiente","A sí mismo","A los ángeles"],"Génesis 3:12","Nadie asume la culpa: el hombre señala a la mujer, y la mujer a la serpiente."],
    ["¿A quién culpó la mujer en Génesis 3:13?","A la serpiente",["Al hombre","A sí misma","A Dios"],"Génesis 3:13"]]},
  {title:'Las consecuencias',verses:[
    {r:'Génesis 3:14',t:"Y Jehová Dios dijo a la serpiente: Por cuanto esto hiciste, maldita serás entre todas las bestias y entre todos los animales del campo; sobre tu pecho andarás, y polvo comerás todos los días de tu vida."},
    {r:'Génesis 3:16',t:"A la mujer dijo: Multiplicaré en gran manera los dolores en tus preñeces; con dolor darás a luz los hijos; y tu deseo será para tu marido, y él se enseñoreará de ti."},
    {r:'Génesis 3:17',t:"Y al hombre dijo: Por cuanto obedeciste a la voz de tu mujer, y comiste del árbol de que te mandé diciendo: No comerás de él; maldita será la tierra por tu causa; con dolor comerás de ella todos los días de tu vida."},
    {r:'Génesis 3:19',t:"Con el sudor de tu rostro comerás el pan hasta que vuelvas a la tierra, porque de ella fuiste tomado; pues polvo eres, y al polvo volverás."}],
   qs:[
    ["Según Génesis 3:14, ¿sobre qué andaría la serpiente?","Sobre su pecho",["Sobre la tierra seca","Sobre sus pies","Sobre las aguas"],"Génesis 3:14"],
    ["Según Génesis 3:17, ¿qué fue maldecido por causa del hombre?","La tierra",["El huerto","El mar","El árbol"],"Génesis 3:17"],
    ["Según Génesis 3:19, ¿con qué comería el hombre el pan?","Con el sudor de su rostro",["Con la ayuda de los ángeles","Con gozo y reposo","Con las manos limpias"],"Génesis 3:19"],
    ["Según Génesis 3:19, ¿a qué volvería el hombre?","Al polvo",["Al huerto","Al mar","Al cielo"],"Génesis 3:19"]]},
  {title:'La promesa y la gracia',verses:[
    {r:'Génesis 3:15',t:"Y pondré enemistad entre ti y la mujer, y entre tu simiente y la simiente suya; ésta te herirá en la cabeza, y tú le herirás en el calcañar."},

    {r:'Génesis 3:21',t:"Y Jehová Dios hizo al hombre y a su mujer túnicas de pieles, y los vistió."}],
   qs:[
    ["Según Génesis 3:15, ¿qué puso Dios entre la serpiente y la mujer?","Enemistad",["Amistad","Un pacto","Silencio"],"Génesis 3:15"],
    ["Según Génesis 3:15, ¿quién herirá a la serpiente en la cabeza?","La simiente de la mujer",["El hombre","Los ángeles","Los animales del campo"],"Génesis 3:15","Desde antiguo se ve aquí la primera promesa del evangelio: el Mesías vencería a la serpiente."],
    ["¿Qué nombre puso Adán a su mujer, y por qué?","Eva, por ser madre de todos los vivientes",["Sara, por ser madre de naciones","Ana, por ser sierva del Señor","Eva, por ser la primera en pecar"],"Génesis 3:20"],
    ["Según Génesis 3:21, ¿qué hizo Jehová Dios por el hombre y su mujer?","Les hizo túnicas de pieles y los vistió",["Los dejó desnudos","Les dio hojas de higuera","Les dio un manto de lino"],"Génesis 3:21","Dios los cubre: sigue cuidando de ellos aun después de la caída."]]},
  {title:'Expulsados del huerto',verses:[
    {r:'Génesis 3:22',t:"Y dijo Jehová Dios: He aquí el hombre es como uno de nosotros, sabiendo el bien y el mal; ahora, pues, que no alargue su mano, y tome también del árbol de la vida, y coma, y viva para siempre."},
    {r:'Génesis 3:23',t:"Y lo sacó Jehová del huerto del Edén, para que labrase la tierra de que fue tomado."},
    {r:'Génesis 3:24',t:"Echó, pues, fuera al hombre, y puso al oriente del huerto de Edén querubines, y una espada encendida que se revolvía por todos lados, para guardar el camino del árbol de la vida."}],
   qs:[
    ["Según Génesis 3:23, ¿para qué lo sacó Jehová del huerto?","Para que labrase la tierra de que fue tomado",["Para que construyera una ciudad","Para que pastoreara ovejas","Para que llevara mensajes"],"Génesis 3:23"],
    ["Según Génesis 3:24, ¿qué puso Dios al oriente del huerto?","Querubines y una espada encendida",["Un muro de piedra","Un río de fuego","Dos ángeles con trompetas"],"Génesis 3:24"],
    ["Según Génesis 3:24, ¿qué debían guardar los querubines y la espada?","El camino del árbol de la vida",["El árbol de la ciencia del bien y del mal","La puerta del huerto","La tierra de Edén"],"Génesis 3:24"]]},
  {title:'El primer y el postrer Adán',verses:[

   qs:[

    ["Según Romanos 5:19, ¿por qué los muchos fueron constituidos pecadores?","Por la desobediencia de un hombre",["Por sus propias obras","Por la ley de Moisés","Por el engaño de la serpiente"],"Romanos 5:19"],
    ["Según Romanos 5:19, ¿por qué los muchos serán constituidos justos?","Por la obediencia de uno",["Por sus propias obras","Por la ley de Moisés","Por su esfuerzo"],"Romanos 5:19"],
    ["Según 1 Corintios 15:22, ¿qué pasa en Adán y qué pasa en Cristo?","En Adán todos mueren; en Cristo todos serán vivificados",["En Adán todos viven; en Cristo todos mueren","En Adán y en Cristo todos serán juzgados","En ninguno de los dos hay cambio"],"1 Corintios 15:22","Adán y Cristo actúan como cabezas: en cada uno están los suyos. Lo que hizo el primero trajo muerte; lo que hizo el segundo trae vida."]]}
 ]},
 {title:'Los Diez Mandamientos',sub:'Éxodo 20',lessons:[
  {title:'Primeros mandamientos',verses:[
    {r:'Éxodo 20:2',t:"Yo soy Jehová tu Dios, que te saqué de la tierra de Egipto, de casa de servidumbre."},
    {r:'Éxodo 20:3',t:"No tendrás dioses ajenos delante de mí."},
    {r:'Éxodo 20:7',t:"No tomarás el nombre de Jehová tu Dios en vano; porque no dará por inocente Jehová al que tomare su nombre en vano."},
    {r:'Éxodo 20:8',t:"Acuérdate del día de reposo para santificarlo."}],
   qs:[
    ["¿De dónde sacó Jehová al pueblo?","De la tierra de Egipto",["De Babilonia","De Canaán","Del desierto"],"Éxodo 20:2"],
    ["¿Qué dice el mandamiento que no se debe tomar en vano?","El nombre de Jehová tu Dios",["El día de reposo","La casa del prójimo","El pan de cada día"],"Éxodo 20:7"]]},
  {title:'Hacia el prójimo',verses:[
    {r:'Éxodo 20:12',t:"Honra a tu padre y a tu madre, para que tus días se alarguen en la tierra que Jehová tu Dios te da."},
    {r:'Éxodo 20:13',t:"No matarás."},
    {r:'Éxodo 20:14',t:"No cometerás adulterio."},
    {r:'Éxodo 20:15',t:"No hurtarás."},
    {r:'Éxodo 20:16',t:"No hablarás contra tu prójimo falso testimonio."},
    {r:'Éxodo 20:17',t:"No codiciarás la casa de tu prójimo, no codiciarás la mujer de tu prójimo, ni su siervo, ni su criada, ni su buey, ni su asno, ni cosa alguna de tu prójimo."}],
   qs:[
    ["¿Qué mandamiento va seguido de «para que tus días se alarguen»?","Honra a tu padre y a tu madre",["No hurtarás","No matarás","No cometerás adulterio"],"Éxodo 20:12"],
    ["¿Qué no se debe hablar contra el prójimo?","Falso testimonio",["Alabanza","Consejos","Oraciones"],"Éxodo 20:16"]]},
  {title:'Jesús y el homicidio',verses:[
    {r:'Mateo 5:17',t:"No penséis que he venido para abrogar la ley o los profetas; no he venido para abrogar, sino para cumplir."},
    {r:'Mateo 5:21',t:"Oísteis que fue dicho a los antiguos: No matarás; y cualquiera que matare será culpable de juicio."},
    {r:'Mateo 5:22',t:"Pero yo os digo que cualquiera que se enoje contra su hermano, será culpable de juicio; y cualquiera que diga: Necio, a su hermano, será culpable ante el concilio; y cualquiera que le diga: Fatuo, quedará expuesto al infierno de fuego."},
    {r:'1 Juan 3:15',t:"Todo aquel que aborrece a su hermano es homicida; y sabéis que ningún homicida tiene vida eterna permanente en él."}],
   qs:[
    ["Según Mateo 5:17, ¿para qué dijo Jesús que había venido, respecto a la ley y los profetas?","Para cumplir",["Para abrogar","Para reemplazar","Para olvidar"],"Mateo 5:17"],
    ["Según Mateo 5:21, ¿qué mandamiento cita Jesús?","No matarás",["No hurtarás","No cometerás adulterio","No codiciarás"],"Mateo 5:21"],
    ["Según Mateo 5:22, ¿quién será culpable de juicio?","Cualquiera que se enoje contra su hermano",["Solo el que mate con la mano","Solo el que robe","Solo el que mienta"],"Mateo 5:22","Jesús lleva el mandamiento hasta el corazón: el enojo y el desprecio ya son pecado ante Dios, no solo el acto de matar."],
    ["Según 1 Juan 3:15, ¿quién es homicida?","Todo aquel que aborrece a su hermano",["Solo quien hiere a otro","Quien discute con su hermano","Quien se aleja de su hermano"],"1 Juan 3:15"],
    ["Éxodo 20:13 dice «No matarás». ¿Qué muestra Jesús sobre este mandamiento?","Que alcanza también al enojo y al desprecio del corazón",["Que ya no está vigente","Que solo aplica a los jueces","Que solo aplica dentro de Israel"],"Éxodo 20:13"]]},
  {title:'Jesús y el adulterio',verses:[
    {r:'Mateo 5:27',t:"Oísteis que fue dicho: No cometerás adulterio."},
    {r:'Mateo 5:28',t:"Pero yo os digo que cualquiera que mira a una mujer para codiciarla, ya adulteró con ella en su corazón."},
    {r:'Mateo 5:29',t:"Por tanto, si tu ojo derecho te es ocasión de caer, sácalo, y échalo de ti; pues mejor te es que se pierda uno de tus miembros, y no que todo tu cuerpo sea echado al infierno."},
    {r:'Mateo 15:19',t:"Porque del corazón salen los malos pensamientos, los homicidios, los adulterios, las fornicaciones, los hurtos, los falsos testimonios, las blasfemias."}],
   qs:[
    ["Según Mateo 5:27, ¿qué mandamiento cita Jesús?","No cometerás adulterio",["No matarás","No hurtarás","No codiciarás"],"Mateo 5:27"],
    ["Según Mateo 5:28, ¿quién ya adulteró en su corazón?","El que mira a una mujer para codiciarla",["El que habla con una mujer","El que no cumple sus votos","El que no se casa"],"Mateo 5:28","Como con el homicidio, Jesús muestra que la ley de Dios mira el corazón: el deseo codicioso ya es pecado, aunque no llegue al acto."],
    ["Según Mateo 15:19, ¿de dónde salen los malos pensamientos, los homicidios y los adulterios?","Del corazón",["De los ojos","De las manos","Del mundo"],"Mateo 15:19"],
    ["Éxodo 20:14 dice «No cometerás adulterio». ¿Qué enseña Jesús sobre este mandamiento?","Que también alcanza a la mirada y al deseo del corazón",["Que ya no está vigente","Que solo aplica a los casados","Que solo se trata del acto físico"],"Éxodo 20:14"],
    ["Según Mateo 5:29, ¿qué tan en serio debemos tomar el pecado?","Es mejor perder un miembro que ser echado al infierno",["Solo importa si otros nos ven","Solo importa si es un pecado grande","Se resuelve con paciencia, sin cambiar nada"],"Mateo 5:29"]]},
  {title:'El resumen de la ley',verses:[
    {r:'Mateo 22:37',t:"Jesús le dijo: Amarás al Señor tu Dios con todo tu corazón, y con toda tu alma, y con toda tu mente."},
    {r:'Mateo 22:39',t:"Y el segundo es semejante: Amarás a tu prójimo como a ti mismo."},
    {r:'Mateo 22:40',t:"De estos dos mandamientos depende toda la ley y los profetas."},
    {r:'Romanos 13:10',t:"El amor no hace mal al prójimo; así que el cumplimiento de la ley es el amor."},
    {r:'Gálatas 5:14',t:"Porque toda la ley en esta sola palabra se cumple: Amarás a tu prójimo como a ti mismo."}],
   qs:[
    ["Según Mateo 22:37, ¿con qué debemos amar al Señor nuestro Dios?","Con todo el corazón, toda el alma y toda la mente",["Solo con obras y sacrificios","Solo con el corazón","Con la fuerza y el dinero"],"Mateo 22:37"],
    ["Según Mateo 22:39, ¿cómo debemos amar al prójimo?","Como a nosotros mismos",["Más que a nosotros mismos","Solo si nos aman","Según lo que merezca"],"Mateo 22:39","Los diez mandamientos se resumen así: los primeros, amar a Dios; los demás, amar al prójimo."],
    ["Según Mateo 22:40, ¿de qué depende toda la ley y los profetas?","De estos dos mandamientos",["De los diez mandamientos solamente","De los sacrificios","Del templo"],"Mateo 22:40"],
    ["Según Romanos 13:10, ¿cuál es el cumplimiento de la ley?","El amor",["El sacrificio","La obediencia externa","El temor"],"Romanos 13:10"]]}

 ]},

  {title:'Sal y luz',verses:[
    {r:'Mateo 5:13',t:"Vosotros sois la sal de la tierra; pero si la sal se desvaneciere, ¿con qué será salada? No sirve más para nada, sino para ser echada fuera y hollada por los hombres."},

    {r:'Mateo 5:16',t:"Así alumbre vuestra luz delante de los hombres, para que vean vuestras buenas obras, y glorifiquen a vuestro Padre que está en los cielos."}],
   qs:[
    ["Según Mateo 5:13, ¿qué dijo Jesús que son sus discípulos?","La sal de la tierra",["La raíz de la tierra","El fruto de la tierra","El fuego de la tierra"],"Mateo 5:13"],
    ["Según Mateo 5:14, ¿qué no se puede esconder?","Una ciudad asentada sobre un monte",["Una casa en el valle","Un camino en el desierto","Un pozo en el campo"],"Mateo 5:14"],
    ["Según Mateo 5:15, ¿dónde se pone una luz encendida?","Sobre el candelero",["Debajo de un almud","Detrás de la puerta","En el suelo"],"Mateo 5:15"],
    ["Según Mateo 5:16, ¿para qué debe alumbrar nuestra luz delante de los hombres?","Para que vean nuestras buenas obras y glorifiquen al Padre",["Para que nos admiren","Para que nos imiten","Para que nos teman"],"Mateo 5:16","La luz no es para lucirnos: el fin es que la gloria vaya al Padre."]]},
  {title:'La ley y la justicia mayor',verses:[
    {r:'Mateo 5:18',t:"Porque de cierto os digo que hasta que pasen el cielo y la tierra, ni una jota ni una tilde pasará de la ley, hasta que todo se haya cumplido."},
    {r:'Mateo 5:20',t:"Porque os digo que si vuestra justicia no fuere mayor que la de los escribas y fariseos, no entraréis en el reino de los cielos."},
    {r:'Mateo 5:23-24',t:"Por tanto, si traes tu ofrenda al altar, y allí te acuerdas de que tu hermano tiene algo contra ti, deja allí tu ofrenda delante del altar, y anda, reconcíliate primero con tu hermano, y entonces ven y presenta tu ofrenda."}],
   qs:[
    ["Según Mateo 5:18, ¿qué no pasará de la ley hasta que todo se haya cumplido?","Ni una jota ni una tilde",["Ni una palabra ni un nombre","Ni un libro ni un capítulo","Ni una fiesta ni un sábado"],"Mateo 5:18"],
    ["Según Mateo 5:20, ¿cómo debe ser nuestra justicia para entrar en el reino de los cielos?","Mayor que la de los escribas y fariseos",["Igual que la de los escribas y fariseos","Menor, pero sincera","Conocida por todos"],"Mateo 5:20"],
    ["Según Mateo 5:23-24, si tu hermano tiene algo contra ti, ¿qué haces antes de presentar tu ofrenda?","Reconciliarte primero con tu hermano",["Terminar la ofrenda y luego hablar","Esperar a que él venga","Orar en secreto por él"],"Mateo 5:23-24"]]},
  {title:'Amad a vuestros enemigos',verses:[
    {r:'Mateo 5:38-39',t:"Oísteis que fue dicho: Ojo por ojo, y diente por diente. Pero yo os digo: No resistáis al que es malo; antes, a cualquiera que te hiera en la mejilla derecha, vuélvele también la otra;"},
    {r:'Mateo 5:41',t:"Y a cualquiera que te obligue a llevar carga por una milla, ve con él dos."},
    {r:'Mateo 5:43-44',t:"Oísteis que fue dicho: Amarás a tu prójimo, y aborrecerás a tu enemigo. Pero yo os digo: Amad a vuestros enemigos, bendecid a los que os maldicen, haced bien a los que os aborrecen, y orad por los que os ultrajan y os persiguen;"},
    {r:'Mateo 5:45',t:"para que seáis hijos de vuestro Padre que está en los cielos, que hace salir su sol sobre malos y buenos, y que hace llover sobre justos e injustos."}],
   qs:[
    ["Según Mateo 5:39, si alguien te hiere en la mejilla derecha, ¿qué dijo Jesús que hicieras?","Volverle también la otra",["Devolver el golpe","Acusarlo ante el juez","Huir de él"],"Mateo 5:38-39"],
    ["Según Mateo 5:41, si alguien te obliga a llevar carga por una milla, ¿qué debes hacer?","Ir con él dos",["Negarte","Cobrarle","Ir solo una"],"Mateo 5:41"],
    ["Según Mateo 5:44, ¿qué dijo Jesús que hiciéramos con nuestros enemigos?","Amarlos y orar por los que nos persiguen",["Evitarlos","Olvidarlos","Vencerlos"],"Mateo 5:43-44"],
    ["Según Mateo 5:45, ¿sobre quiénes hace salir el Padre su sol?","Sobre malos y buenos",["Solo sobre los justos","Solo sobre Israel","Solo sobre los que oran"],"Mateo 5:45","Amar al enemigo refleja el carácter del Padre, que da su sol y su lluvia a todos."]]},
  {title:'Hijos del Padre',verses:[
    {r:'Mateo 5:46',t:"Porque si amáis a los que os aman, ¿qué recompensa tendréis? ¿No hacen también lo mismo los publicanos?"},
    {r:'Mateo 5:48',t:"Sed, pues, vosotros perfectos, como vuestro Padre que está en los cielos es perfecto."},
    {r:'Mateo 6:1',t:"Guardaos de hacer vuestra justicia delante de los hombres, para ser vistos de ellos; de otra manera no tendréis recompensa de vuestro Padre que está en los cielos."}],
   qs:[
    ["Según Mateo 5:46, ¿quiénes también aman a los que los aman?","Los publicanos",["Los sacerdotes","Los escribas","Los levitas"],"Mateo 5:46"],
    ["Según Mateo 5:48, ¿cómo dijo Jesús que debemos ser?","Perfectos, como nuestro Padre celestial es perfecto",["Fuertes, como nuestro Padre es fuerte","Sabios, como nuestro Padre es sabio","Piadosos solo delante de los hombres"],"Mateo 5:48"],
    ["Según Mateo 6:1, ¿de qué debemos guardarnos?","De hacer nuestra justicia delante de los hombres para ser vistos de ellos",["De orar en la mañana","De hablar con los pecadores","De ayunar los lunes"],"Mateo 6:1"]]},
  {title:'Dar y orar en secreto',verses:[
    {r:'Mateo 6:4',t:"para que sea tu limosna en secreto; y tu Padre que ve en lo secreto te recompensará en público."},
    {r:'Mateo 6:6',t:"Mas tú, cuando ores, entra en tu aposento, y cerrada la puerta, ora a tu Padre que está en secreto; y tu Padre que ve en lo secreto te recompensará en público."},
    {r:'Mateo 6:7',t:"Y orando, no uséis vanas repeticiones, como los gentiles, que piensan que por su palabrería serán oídos."},
    {r:'Mateo 6:8',t:"No os hagáis, pues, semejantes a ellos; porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis."}],
   qs:[
    ["Según Mateo 6:4, ¿cómo te recompensará el Padre que ve en lo secreto?","En público",["En secreto","Con silencio","Con riquezas"],"Mateo 6:4"],
    ["Según Mateo 6:6, ¿dónde debes orar?","En tu aposento, con la puerta cerrada",["En la plaza para ser visto","Solo en el templo","Solo en la sinagoga"],"Mateo 6:6"],
    ["Según Mateo 6:7, ¿qué no debemos usar al orar?","Vanas repeticiones",["Palabras en voz baja","Lágrimas","Cantos"],"Mateo 6:7"],
    ["Según Mateo 6:8, ¿qué sabe el Padre antes de que le pidamos?","De qué cosas tenemos necesidad",["Cuánto hemos pecado","Quién nos escucha","Cuántas oraciones hemos hecho"],"Mateo 6:8"]]},
  {title:'Padre nuestro',verses:[
    {r:'Mateo 6:9',t:"Vosotros, pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre."},
    {r:'Mateo 6:10',t:"Venga tu reino. Hágase tu voluntad, como en el cielo, así también en la tierra."},
    {r:'Mateo 6:11',t:"El pan nuestro de cada día, dánoslo hoy."},
    {r:'Mateo 6:12',t:"Y perdónanos nuestras deudas, como también nosotros perdonamos a nuestros deudores."}],
   qs:[
    ["«Hágase tu voluntad, como en el cielo…», ¿qué sigue?","Así también en la tierra",["Por siempre y para siempre","Hoy y todos los días","En tu santo nombre"],"Mateo 6:10"],
    ["¿Qué se pide que se nos dé hoy?","El pan nuestro de cada día",["Las riquezas del reino","El descanso de la noche","La sabiduría de lo alto"],"Mateo 6:11"]]},
  {title:'Perdonar y ser perdonado',verses:[
    {r:'Mateo 6:14',t:"Porque si perdonáis a los hombres sus ofensas, os perdonará también a vosotros vuestro Padre celestial;"},
    {r:'Mateo 6:15',t:"mas si no perdonáis a los hombres sus ofensas, tampoco vuestro Padre os perdonará vuestras ofensas."}],
   qs:[
    ["Según Mateo 6:14, si perdonáis a los hombres sus ofensas, ¿qué pasa?","Vuestro Padre celestial os perdonará también",["Los hombres os perdonarán","Seréis libres de toda deuda","Dios olvidará vuestras ofensas pasadas"],"Mateo 6:14"],
    ["Según Mateo 6:15, si no perdonáis a los hombres sus ofensas, ¿qué pasa?","Tampoco vuestro Padre os perdonará",["Los hombres se alejarán de vosotros","Dios os castigará de inmediato","Nada cambia"],"Mateo 6:15","Quien ha sido perdonado, perdona. Jesús lo ilustra con el siervo que no perdonó (Mateo 18:21-35)."],
    ["En el Padre nuestro (Mateo 6:12), ¿cómo pedimos que se nos perdonen las deudas?","Como nosotros perdonamos a nuestros deudores",["Según nuestros méritos","Cuando lo merezcamos","Solo al final de la vida"],"Mateo 6:12"]]},
  {title:'Tesoros en el cielo',verses:[
    {r:'Mateo 6:19',t:"No os hagáis tesoros en la tierra, donde la polilla y el orín corrompen, y donde ladrones minan y hurtan;"},
    {r:'Mateo 6:20',t:"sino haceos tesoros en el cielo, donde ni la polilla ni el orín corrompen, y donde ladrones no minan ni hurtan."},
    {r:'Mateo 6:21',t:"Porque donde esté vuestro tesoro, allí estará también vuestro corazón."},
    {r:'Mateo 6:24',t:"Ninguno puede servir a dos señores; porque o aborrecerá al uno y amará al otro, o estimará al uno y menospreciará al otro. No podéis servir a Dios y a las riquezas."}],
   qs:[
    ["Según Mateo 6:19, ¿qué corrompen la polilla y el orín?","Los tesoros de la tierra",["Las obras de la ley","Las ofrendas del templo","Los frutos del huerto"],"Mateo 6:19"],
    ["Según Mateo 6:20, ¿dónde debemos hacernos tesoros?","En el cielo",["En los graneros","En el templo","En la casa"],"Mateo 6:20"],
    ["Según Mateo 6:21, ¿dónde estará nuestro corazón?","Donde esté nuestro tesoro",["Donde esté nuestra familia","Donde esté nuestro trabajo","Donde esté nuestro hogar"],"Mateo 6:21"],
    ["Según Mateo 6:24, ¿a quiénes no podemos servir a la vez?","A Dios y a las riquezas",["A Dios y al César","A Dios y a los hombres","A Dios y a la ley"],"Mateo 6:24"]]},
  {title:'Las aves y los lirios',verses:[
    {r:'Mateo 6:25',t:"Por tanto os digo: No os afanéis por vuestra vida, qué habéis de comer o qué habéis de beber; ni por vuestro cuerpo, qué habéis de vestir. ¿No es la vida más que el alimento, y el cuerpo más que el vestido?"},
    {r:'Mateo 6:26',t:"Mirad las aves del cielo, que no siembran, ni siegan, ni recogen en graneros; y vuestro Padre celestial las alimenta. ¿No valéis vosotros mucho más que ellas?"},
    {r:'Mateo 6:28-29',t:"Y por el vestido, ¿por qué os afanáis? Considerad los lirios del campo, cómo crecen: no trabajan ni hilan; pero os digo, que ni aun Salomón con toda su gloria se vistió así como uno de ellos."}],
   qs:[
    ["Según Mateo 6:25, ¿qué dijo Jesús que no hiciéramos por nuestra vida?","Afanarnos por qué comer o beber",["Trabajar por el pan de cada día","Guardar para el futuro","Dar gracias antes de comer"],"Mateo 6:25"],
    ["Según Mateo 6:26, ¿quién alimenta a las aves del cielo?","Vuestro Padre celestial",["Los sembradores","La naturaleza","Los ángeles"],"Mateo 6:26"],
    ["Según Mateo 6:28-29, ¿qué ejemplo usa Jesús al hablar del vestido?","Los lirios del campo",["Las aves del cielo","Los árboles del huerto","Las ovejas del pastor"],"Mateo 6:28-29"],
    ["Según Mateo 6:29, ¿quién no se vistió con toda su gloria como uno de los lirios?","Salomón",["David","Moisés","Elías"],"Mateo 6:28-29"]]},
  {title:'Buscad primeramente el reino',verses:[
    {r:'Mateo 6:31-32',t:"No os afanéis, pues, diciendo: ¿Qué comeremos, o qué beberemos, o qué vestiremos? Porque los gentiles buscan todas estas cosas; pero vuestro Padre celestial sabe que tenéis necesidad de todas estas cosas."},
    {r:'Mateo 6:33',t:"Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas."},
    {r:'Mateo 6:34',t:"Así que, no os afanéis por el día de mañana, porque el día de mañana traerá su afán. Basta a cada día su propio mal."}],
   qs:[
    ["Según Mateo 6:32, ¿quiénes buscan todas estas cosas?","Los gentiles",["Los publicanos","Los escribas","Los fariseos"],"Mateo 6:31-32"],
    ["Según Mateo 6:33, ¿qué debemos buscar primeramente?","El reino de Dios y su justicia",["Las riquezas y la salud","La paz y el descanso","El reconocimiento de los hombres"],"Mateo 6:33"],
    ["Según Mateo 6:33, ¿qué nos será añadido?","Todas estas cosas",["Una larga vida","La sabiduría","Un gran nombre"],"Mateo 6:33"],
    ["Según Mateo 6:34, ¿qué basta a cada día?","Su propio mal",["Su propia luz","Su propio pan","Su propio descanso"],"Mateo 6:34"]]}
 ]},
 {title:'El Evangelio de Juan',sub:'Juan 1, 3, 6, 8, 10, 11, 14',lessons:[
  {title:'El Verbo y el amor de Dios',verses:[
    {r:'Juan 1:1',t:"En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios."},
    {r:'Juan 1:14',t:"Y aquel Verbo fue hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad."},
    {r:'Juan 3:16',t:"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna."},
    {r:'Juan 11:35',t:"Jesús lloró."}],
   qs:[
    ["¿Quién era con Dios y era Dios, según Juan 1:1?","El Verbo",["El profeta","El ángel","El sacerdote"],"Juan 1:1"],
    ["¿A quién ha dado Dios, según Juan 3:16?","A su Hijo unigénito",["A su siervo Moisés","A su pueblo Israel","A su ángel"],"Juan 3:16"]]},
  {title:'Yo soy',verses:[
    {r:'Juan 6:35',t:"Jesús les dijo: Yo soy el pan de vida; el que a mí viene, nunca tendrá hambre; y el que en mí cree, no tendrá sed jamás."},
    {r:'Juan 8:12',t:"Otra vez Jesús les habló, diciendo: Yo soy la luz del mundo; el que me sigue, no andará en tinieblas, sino que tendrá la luz de la vida."},
    {r:'Juan 10:11',t:"Yo soy el buen pastor; el buen pastor su vida da por las ovejas."},
    {r:'Juan 14:6',t:"Jesús le dijo: Yo soy el camino, y la verdad, y la vida; nadie viene al Padre, sino por mí."}],
   qs:[
    ["Según Juan 6:35, ¿qué dijo Jesús que es?","El pan de vida",["La sal de la tierra","El agua del pozo","La roca del desierto"],"Juan 6:35"],
    ["Según Juan 8:12, ¿qué tendrá el que sigue a Jesús?","La luz de la vida",["Riquezas","Reposo","Un nombre nuevo"],"Juan 8:12"],
    ["Según Juan 10:11, ¿qué da el buen pastor por las ovejas?","Su vida",["Su manto","Su vara","Su pan"],"Juan 10:11"]]}
 ]},
 {title:'Salvación por gracia',sub:'Romanos y Efesios',lessons:[
  {title:'Pecado y gracia',verses:[

    {r:'Romanos 8:1',t:"Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, sino conforme al Espíritu."}],

    ["Según Romanos 6:23, ¿qué es la dádiva de Dios en Cristo Jesús?","Vida eterna",["Paz en la tierra","Riquezas del cielo","Sabiduría"],"Romanos 6:23"],
    ["Según Romanos 5:8, ¿cuándo murió Cristo por nosotros?","Siendo aún pecadores",["Cuando lo buscamos","Cuando obedecimos la ley","Cuando lo pedimos"],"Romanos 5:8"]]},
  {title:'Fe y salvación',verses:[
    {r:'Romanos 8:28',t:"Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados."},
    {r:'Romanos 10:9',t:"que si confesares con tu boca que Jesús es el Señor, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo."},
    {r:'Efesios 2:8',t:"Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;"},

   qs:[

    ["Según Efesios 2:9, ¿para qué la salvación no es por obras?","Para que nadie se gloríe",["Para que todos trabajen","Para que la ley se cumpla","Para que haya reposo"],"Efesios 2:9"],
    ["Según Romanos 10:9, ¿qué se confiesa con la boca?","Que Jesús es el Señor",["Que Dios es justo","Que el pecado es grande","Que el cielo es eterno"],"Romanos 10:9"]]}
 ]}
 ,{title:'Atributos de Dios (1)',sub:'Su ser y su conocimiento',lessons:[
  {title:'Santo, espíritu y uno',verses:[
    {r:'Isaías 6:3',t:"Y el uno al otro daba voces, diciendo: Santo, santo, santo, Jehová de los ejércitos; toda la tierra está llena de su gloria."},
    {r:'Juan 4:24',t:"Dios es Espíritu; y los que le adoran, en espíritu y en verdad es necesario que adoren."},
    {r:'Deuteronomio 6:4',t:"Oye, Israel: Jehová nuestro Dios, Jehová uno es."}],
   qs:[
    ["¿Cuántas veces se repite «santo» en Isaías 6:3?","Tres veces",["Una vez","Dos veces","Siete veces"],"Isaías 6:3"],
    ["Según Juan 4:24, ¿qué es Dios?","Espíritu",["Un ángel","Un hombre","Una fuerza"],"Juan 4:24"],
    ["Según Deuteronomio 6:4, ¿cuántos es Jehová nuestro Dios?","Uno",["Dos","Tres","Muchos"],"Deuteronomio 6:4","Un solo Dios verdadero, que existe eternamente como Padre, Hijo y Espíritu Santo."]]},
  {title:'Dios por sí mismo',intro:{t:'Aseidad: Dios existe por sí mismo',p:'Aseidad significa que Dios tiene vida en sí mismo. No depende de nadie para existir ni para ser quien es; todo lo demás depende de él.'},
   verses:[
    {r:'Juan 5:26',t:"Porque como el Padre tiene vida en sí mismo, así también ha dado al Hijo el tener vida en sí mismo;"},
    {r:'Hechos 17:25',t:"ni es honrado por manos de hombres, como si necesitase de algo; pues él es quien da a todos vida y aliento y todas las cosas."},
    {r:'Jeremías 10:10',t:"Mas Jehová es el Dios verdadero; él es Dios vivo y Rey eterno; a su ira tiembla la tierra, y las naciones no pueden sufrir su indignación."}],
   qs:[
    ["Según Juan 5:26, ¿dónde tiene vida el Padre?","En sí mismo",["En el templo","En los cielos solamente","En sus obras"],"Juan 5:26"],
    ["Según Hechos 17:25, ¿por qué Dios no necesita ser servido por manos de hombres?","Porque él da a todos vida y aliento y todas las cosas",["Porque está lejos de los hombres","Porque los ángeles lo sirven","Porque no se interesa por los hombres"],"Hechos 17:25"],
    ["El nombre «YO SOY EL QUE SOY» apunta a un Dios que…","Existe por sí mismo",["Cambia con el tiempo","Depende de su pueblo","Solo existe en el templo"],"Éxodo 3:14","«YO SOY» expresa que Dios existe por sí mismo y no depende de nadie."],
    ["Según Jeremías 10:10, ¿cómo es Jehová?","El Dios verdadero, Dios vivo y Rey eterno",["Un dios entre muchos","Un dios de los montes","Un dios olvidado"],"Jeremías 10:10"]]},
  {title:'Creador de todas las cosas',verses:[
    {r:'Salmo 33:6',t:"Por la palabra de Jehová fueron hechos los cielos, Y todo el ejército de ellos por el aliento de su boca."},
    {r:'Salmo 33:9',t:"Porque él dijo, y fue hecho; Él mandó, y existió."},
    {r:'Apocalipsis 4:11',t:"Señor, digno eres de recibir la gloria y la honra y el poder; porque tú creaste todas las cosas, y por tu voluntad existen y fueron creadas."},
    {r:'Hebreos 11:3',t:"Por la fe entendemos haber sido constituido el universo por la palabra de Dios, de modo que lo que se ve fue hecho de lo que no se veía."},
    {r:'Colosenses 1:16',t:"Porque en él fueron creadas todas las cosas, las que hay en los cielos y las que hay en la tierra, visibles e invisibles; sean tronos, sean dominios, sean principados, sean potestades; todo fue creado por medio de él y para él."}],
   qs:[
    ["Según Salmo 33:6, ¿por qué fueron hechos los cielos?","Por la palabra de Jehová",["Por el poder de los ángeles","Por el paso del tiempo","Por la voluntad de los reyes"],"Salmo 33:6"],
    ["Según Salmo 33:9, ¿qué pasó cuando Dios dijo?","Fue hecho",["Fue detenido","Fue olvidado","Fue postergado"],"Salmo 33:9"],
    ["Según Apocalipsis 4:11, ¿por qué existen y fueron creadas todas las cosas?","Por la voluntad de Dios",["Por el azar","Por la necesidad","Por los hombres"],"Apocalipsis 4:11"]]},
  {title:'Sabio, presente y eterno',verses:[
    {r:'Salmo 147:5',t:"Grande es el Señor nuestro, y de mucho poder; Y su entendimiento es infinito."},
    {r:'Salmo 139:7',t:"¿A dónde me iré de tu Espíritu? ¿Y a dónde huiré de tu presencia?"},
    {r:'Salmo 90:2',t:"Antes que naciesen los montes Y formases la tierra y el mundo, Desde el siglo y hasta el siglo, tú eres Dios."}],
   qs:[
    ["Según Salmo 147:5, ¿cómo es el entendimiento del Señor?","Infinito",["Limitado","Oculto","Cambiante"],"Salmo 147:5"],
    ["En Salmo 139:7, el salmista pregunta: «¿A dónde huiré de…?»","Tu presencia",["Tu ley","Tu templo","Tu ira"],"Salmo 139:7"],
    ["Según Salmo 90:2, ¿desde cuándo y hasta cuándo es Dios?","Desde el siglo y hasta el siglo",["Desde el diluvio hasta hoy","Desde Abraham hasta Cristo","Desde la creación del hombre"],"Salmo 90:2"]]},
  {title:'Todo lo conoce',verses:[
    {r:'Salmo 139:1-2',t:"Oh Jehová, tú me has examinado y conocido. Tú has conocido mi sentarme y mi levantarme; Has entendido desde lejos mis pensamientos."},
    {r:'Hebreos 4:13',t:"Y no hay cosa creada que no sea manifiesta en su presencia; antes bien todas las cosas están desnudas y abiertas a los ojos de aquel a quien tenemos que dar cuenta."},
    {r:'1 Juan 3:20',t:"pues si nuestro corazón nos reprende, mayor que nuestro corazón es Dios, y él sabe todas las cosas."},
    {r:'Mateo 10:29-30',t:"¿No se venden dos pajarillos por un cuarto? Con todo, ni uno de ellos cae a tierra sin vuestro Padre. Pues aun vuestros cabellos están todos contados."}],

    ["Según 1 Juan 3:20, ¿qué sabe Dios?","Todas las cosas",["Solo lo que hacemos","Solo lo pasado","Solo lo bueno"],"1 Juan 3:20"],

  {title:'Presente en todo lugar',verses:[
    {r:'Jeremías 23:24',t:"¿Se ocultará alguno, dice Jehová, en escondrijos que yo no lo vea? ¿No lleno yo, dice Jehová, el cielo y la tierra?"},
    {r:'Salmo 139:8',t:"Si subiere a los cielos, allí estás tú; Y si en el Seol hiciere mi estrado, he aquí, allí tú estás."},
    {r:'Salmo 139:9-10',t:"Si tomare las alas del alba Y habitare en el extremo del mar, Aun allí me guiará tu mano, Y me asirá tu diestra."}],
   qs:[

    ["Según Salmo 139:9-10, aun en el extremo del mar, ¿qué lo guiaría?","La mano de Dios",["El viento","Una estrella","Su propia fuerza"],"Salmo 139:9-10"]]},
  {title:'Conoce lo por venir',intro:{t:'Presciencia de Dios',p:'Presciencia significa que Dios conoce de antemano lo que sucederá, desde el principio hasta el fin. Nada le sorprende: anuncia lo por venir desde el principio (Isaías 46:10).'},
   verses:[
    {r:'Isaías 46:9-10',t:"Acordaos de las cosas pasadas desde los tiempos antiguos; porque yo soy Dios, y no hay otro Dios, y nada hay semejante a mí, que anuncio lo por venir desde el principio, y desde la antigüedad lo que aún no era hecho; que digo: Mi consejo permanecerá, y haré todo lo que quiero;"},
    {r:'Hechos 2:23',t:"a éste, entregado por el determinado consejo y anticipado conocimiento de Dios, prendisteis y matasteis por manos de inicuos, crucificándole;"},
    {r:'1 Pedro 1:2',t:"elegidos según la presciencia de Dios Padre en santificación del Espíritu, para obedecer y ser rociados con la sangre de Jesucristo: Gracia y paz os sean multiplicadas."}],
   qs:[

    ["Según Hechos 2:23, ¿por medio de qué fue entregado Jesús?","Del determinado consejo y anticipado conocimiento de Dios",["Del enojo de los romanos","Del azar","De la decisión del pueblo"],"Hechos 2:23"],
    ["Según 1 Pedro 1:2, ¿según qué son elegidos los creyentes?","Según la presciencia de Dios Padre",["Según sus obras","Según su edad","Según la ley"],"1 Pedro 1:2"]]},
  {title:'Sabiduría de Dios',verses:[

    {r:'Proverbios 3:19',t:"Jehová con sabiduría fundó la tierra; Afirmó los cielos con inteligencia."}],
   qs:[
    ["Según Romanos 16:27, ¿cómo es Dios?","Único y sabio",["Grande y lejano","Justo y airado","Fuerte y oculto"],"Romanos 16:27"],
    ["Según Proverbios 3:19, ¿con qué fundó Jehová la tierra?","Con sabiduría",["Con fuerza","Con fuego","Con palabras solamente"],"Proverbios 3:19"],
    ["Según Romanos 11:33, ¿cómo son los juicios de Dios?","Insondables",["Fáciles de entender","Cambiantes","Apresurados"],"Romanos 11:33"]]},
  {title:'Grande e incomprensible',verses:[
    {r:'Salmo 145:3',t:"Grande es Jehová, y digno de suprema alabanza; Y su grandeza es inescrutable."},
    {r:'Isaías 55:8',t:"Porque mis pensamientos no son vuestros pensamientos, ni vuestros caminos mis caminos, dijo Jehová."},
    {r:'Isaías 55:9',t:"Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos, y mis pensamientos más que vuestros pensamientos."}],

    ["Según Isaías 55:8, ¿qué dice Jehová de sus pensamientos?","No son nuestros pensamientos",["Son iguales a los nuestros","Son un secreto para siempre","Son solo para los profetas"],"Isaías 55:8"]]}
 ]}
 ,{title:'Atributos de Dios (2)',sub:'Su poder y su carácter',lessons:[
  {title:'Todopoderoso',verses:[
    {r:'Génesis 17:1',t:"Era Abram de edad de noventa y nueve años, cuando le apareció Jehová y le dijo: Yo soy el Dios Todopoderoso; anda delante de mí y sé perfecto."},
    {r:'Job 42:2',t:"Yo conozco que todo lo puedes, Y que no hay pensamiento que se esconda de ti."},
    {r:'Lucas 1:37',t:"porque nada hay imposible para Dios."}],
   qs:[

  {title:'Poder, soberanía y justicia',verses:[
    {r:'Jeremías 32:17',t:"¡Oh Señor Jehová! he aquí que tú hiciste el cielo y la tierra con tu gran poder, y con tu brazo extendido, ni hay nada que sea difícil para ti;"},

    ["Según Deuteronomio 32:4, ¿cómo son todos los caminos de Dios?","Rectitud",["Misterio","Sombra","Tinieblas"],"Deuteronomio 32:4"]]},
  {title:'Soberano sobre todo',verses:[
    {r:'Daniel 4:35',t:"Todos los habitantes de la tierra son considerados como nada; y él hace según su voluntad en el ejército del cielo, y en los habitantes de la tierra, y no hay quien detenga su mano, y le diga: ¿Qué haces?"},

    ["Según Proverbios 21:1, ¿en la mano de quién está el corazón del rey?","En la mano de Jehová",["En la mano de sus consejeros","En la mano del pueblo","En la mano de sus enemigos"],"Proverbios 21:1"],
    ["Según Salmo 103:19, ¿sobre quiénes domina el reino de Jehová?","Sobre todos",["Solo sobre Israel","Solo sobre los justos","Solo sobre los ángeles"],"Salmo 103:19"]]},
  {title:'Los decretos de Dios',intro:{t:'Los decretos de Dios',p:'Los decretos de Dios son su plan eterno: lo que él determinó que sucedería. La Escritura dice que su consejo permanece para siempre y que hace todas las cosas según el designio de su voluntad.'},
   verses:[

    {r:'Salmo 33:11',t:"El consejo de Jehová permanecerá para siempre; Los pensamientos de su corazón por todas las generaciones."},
    {r:'Efesios 1:11',t:"En él asimismo tuvimos herencia, habiendo sido predestinados conforme al propósito del que hace todas las cosas según el designio de su voluntad,"}],
   qs:[
    ["Según Isaías 14:27, cuando Jehová determina algo, ¿quién puede impedirlo?","Nadie",["Los reyes","Los ángeles","El pueblo si ora"],"Isaías 14:27"],
    ["Según Salmo 33:11, ¿por cuánto tiempo permanece el consejo de Jehová?","Para siempre",["Por una generación","Hasta que el pueblo lo cambie","Por siete años"],"Salmo 33:11"],

    ["Según 1 Juan 4:8, el que no ama no ha conocido a Dios, porque Dios es…","Amor",["Justicia","Poder","Silencio"],"1 Juan 4:8"],

  {title:'Paciente y misericordioso',verses:[
    {r:'Éxodo 34:6',t:"Y pasando Jehová por delante de él, proclamó: ¡Jehová! ¡Jehová! fuerte, misericordioso y piadoso; tardo para la ira, y grande en misericordia y verdad;"},

    ["Según Romanos 2:4, ¿qué te guía al arrepentimiento?","La benignidad de Dios",["El temor de los hombres","La ley sola","El castigo"],"Romanos 2:4"]]},
  {title:'Fiel y veraz',verses:[

  {title:'Justicia e ira de Dios',verses:[

  {title:'Un Dios celoso',verses:[

    ["Según Deuteronomio 4:24, ¿qué es Jehová tu Dios?","Fuego consumidor",["Luz apacible","Roca sin voz","Río de paz"],"Deuteronomio 4:24"],

  {title:'El amor de Dios',verses:[

    {r:'Sofonías 3:17',t:"Jehová está en medio de ti, poderoso, él salvará; se gozará sobre ti con alegría, callará de amor, se regocijará sobre ti con cánticos."}],

 ,{title:'Doctrinas fundamentales',sub:'Lo esencial del evangelio',lessons:[
  {title:'Pecado',intro:{t:'¿Qué es el pecado?',p:'Según la Biblia, el pecado es infracción de la ley de Dios (1 Juan 3:4). Todos nacen en Adán con una naturaleza inclinada al mal y, por sí mismos, no pueden volverse a Dios.'},
   verses:[
    {r:'1 Juan 3:4',t:"Todo aquel que comete pecado, infringe también la ley; pues el pecado es infracción de la ley."},
    {r:'Romanos 5:12',t:"Por tanto, como el pecado entró en el mundo por un hombre, y por el pecado la muerte, así la muerte pasó a todos los hombres, por cuanto todos pecaron."},
    {r:'Salmo 51:5',t:"He aquí, en maldad he sido formado, Y en pecado me concibió mi madre."},
    {r:'Efesios 2:1',t:"Y él os dio vida a vosotros, cuando estabais muertos en vuestros delitos y pecados,"}],
   qs:[
    ["Según 1 Juan 3:4, ¿qué es el pecado?","Infracción de la ley",["Un error sin culpa","Una debilidad del cuerpo","Una idea equivocada"],"1 Juan 3:4"],
    ["Según Romanos 5:12, ¿cómo entró el pecado en el mundo?","Por un hombre",["Por el mar","Por la ley de Moisés","Por los ángeles"],"Romanos 5:12","Ese hombre es Adán, cabeza de la humanidad: por su pecado entró la muerte a todos (Romanos 5:12-19)."],
    ["Según Efesios 2:1, ¿cómo estaban los creyentes antes de que Dios les diera vida?","Muertos en delitos y pecados",["Enfermos, pero capaces de buscar a Dios","Dormidos en la fe","Ignorantes de la ley"],"Efesios 2:1","El pecado alcanza a toda la persona: mente, afectos y voluntad. Por eso la salvación comienza con Dios, que da vida al que está muerto."]]},
  {title:'Gracia y misericordia',intro:{t:'Gracia y misericordia',p:'Gracia es el favor inmerecido de Dios hacia quien merece castigo. Misericordia es que Dios no nos da el castigo que merecemos. La salvación es toda por gracia: desde la vida nueva que Dios da al muerto en pecados (Efesios 2:5) hasta la fe misma (Efesios 2:8).'},
   verses:[
    {r:'Romanos 11:6',t:"Y si por gracia, ya no es por obras; de otra manera la gracia ya no es gracia."},
    {r:'Efesios 2:4',t:"Pero Dios, que es rico en misericordia, por su gran amor con que nos amó,"},
    {r:'Efesios 2:5',t:"aun estando nosotros muertos en pecados, nos dio vida juntamente con Cristo (por gracia sois salvos),"},
    {r:'Lamentaciones 3:22-23',t:"Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad."},
    {r:'Tito 3:5',t:"nos salvó, no por obras de justicia que nosotros hubiéramos hecho, sino por su misericordia, por el lavamiento de la regeneración y por la renovación en el Espíritu Santo,"}],
   qs:[
    ["Según Romanos 11:6, si la salvación es por gracia, ¿qué ya no es?","Por obras",["Por fe","Por amor","Por la cruz"],"Romanos 11:6"],
    ["Según Tito 3:5, ¿por qué nos salvó Dios?","Por su misericordia",["Por nuestras obras de justicia","Por nuestra sabiduría","Por nuestra fidelidad"],"Tito 3:5"],
    ["Según Efesios 2:5, ¿qué hizo Dios con nosotros estando muertos en pecados?","Nos dio vida juntamente con Cristo",["Nos dio una segunda oportunidad","Nos envió un maestro","Nos dio más tiempo"],"Efesios 2:5","Dios da vida nueva al pecador, y la fe es fruto de esa obra suya."],
    ["¿Cuál es la diferencia entre gracia y misericordia?","Gracia: recibir lo que no merecemos. Misericordia: no recibir lo que merecemos",["Son exactamente lo mismo","Gracia es para los justos; misericordia, para los pecadores","Gracia es obra humana; misericordia es obra divina"],"Efesios 2:4"]]},
  {title:'Redención',intro:{t:'¿Qué es la redención?',p:'Redimir es liberar mediante el pago de un precio. Las Escrituras dicen que el precio fue la sangre de Cristo.'},
   verses:[
    {r:'Efesios 1:7',t:"en quien tenemos redención por su sangre, el perdón de pecados según las riquezas de su gracia,"},
    {r:'1 Pedro 1:18-19',t:"sabiendo que fuisteis rescatados de vuestra vana manera de vivir, la cual recibisteis de vuestros padres, no con cosas corruptibles, como oro o plata, sino con la sangre preciosa de Cristo, como de un cordero sin mancha y sin contaminación,"},
    {r:'Marcos 10:45',t:"Porque el Hijo del Hombre no vino para ser servido, sino para servir, y para dar su vida en rescate por muchos."}],
   qs:[
    ["Según Efesios 1:7, ¿por medio de qué tenemos redención?","Por su sangre",["Por la ley","Por el templo","Por el ayuno"],"Efesios 1:7"],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return dstr(new Date(y,m-1,d+n));};
const diffDays=(a,b)=>{const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);};

let AC=null;
function beep(kind){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const seq=kind==='good'?[[660,0,.09],[880,.09,.16]]
      :kind==='bad'?[[250,0,.14],[180,.14,.24]]
      :kind==='win'?[[523,0,.11],[659,.11,.11],[784,.22,.11],[1047,.33,.34]]
      :[[600,0,.05]];
    seq.forEach(([f,s,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type=kind==='bad'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+s);g.gain.exponentialRampToValueAtTime(.16,t+s+.02);g.gain.exponentialRampToValueAtTime(.0001,t+s+d);
      o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+d+.03);
    });
  }catch(e){}
}

function idbOpen(cb){
  try{
    const rq=indexedDB.open('lampara',1);
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('kv');}catch(e){}};
    rq.onsuccess=()=>cb(rq.result);
    rq.onerror=()=>cb(null);
  }catch(e){cb(null);}
}
function idbSet(val){idbOpen(db=>{if(!db)return;try{db.transaction('kv','readwrite').objectStore('kv').put(val,'S');}catch(e){}});}
function idbGet(cb){idbOpen(db=>{if(!db)return cb(null);try{const g=db.transaction('kv').objectStore('kv').get('S');g.onsuccess=()=>cb(g.result||null);g.onerror=()=>cb(null);}catch(e){cb(null);}});}
function save(){const j=JSON.stringify(S);try{localStorage.setItem(KEY,j);}catch(e){}idbSet(j);}
function load(){
  let found=false;
  try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(defaults(),JSON.parse(r));found=true;}}catch(e){}
  if(!found)idbGet(v=>{if(v){try{S=Object.assign(defaults(),JSON.parse(v));render();}catch(e){}}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}

  c=(c||'').trim();if(c.indexOf('LAMP1.')!==0)return false;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(6)))));if(!o||typeof o!=='object')return false;S=Object.assign(defaults(),o);save();return true;}catch(e){return false;}
}

function refreshStreak(){
  if(!S.lastDay||S.streak===0)return;
  const gap=diffDays(S.lastDay,today());
  if(gap<=1)return;
  const missed=gap-1;
  if(S.freezes>=missed){S.freezes-=missed;S.froze=missed;S.lastDay=addDays(today(),-1);}
  else{S.streak=0;}
  save();
}
function recordDay(xp){
  const t=today();let newDay=false,gotFreeze=false;
  if(S.lastDay!==t){
    newDay=true;
    S.streak=(S.streak>0&&S.lastDay===addDays(t,-1))?S.streak+1:1;
    S.lastDay=t;
    if(S.streak>S.best)S.best=S.streak;
    if(S.streak%7===0&&S.freezes<2){S.freezes++;gotFreeze=true;}
  }
  const before=S.days[t]||0;
  S.days[t]=before+xp;S.xp+=xp;
  return {newDay,gotFreeze,goalHit:before<S.goal&&S.days[t]>=S.goal};
}

/* ============================================================
   GENERADORES DE PREGUNTAS
   ============================================================ */
function mkMC(h){const opts=shuffle([h[1],...h[2]]);return {type:'mc',prompt:h[0],ref:h[3],opts,a:opts.indexOf(h[1]),tries:0,nota:h[4]||''};}
function mkRef(v){
  const same=ALLV.filter(x=>x.r!==v.r&&x.u===v.u),other=ALLV.filter(x=>x.u!==v.u);
  const ds=[...shuffle(other),...shuffle(same)].slice(0,3).map(x=>x.r); /* prefiere otros libros: más fácil de distinguir */
  const opts=shuffle([v.r,...ds]);
  return {type:'ref',prompt:'¿Qué pasaje es este?',ref:v.r,opts,a:opts.indexOf(v.r),tries:0};
}
function pickBlank(v){
  const bl=BLANKS[v.r];if(!bl||!bl.length)return null;
  const toks=v.t.split(/\s+/);
  const opts=shuffle(bl);
  for(const [word,ds] of opts){
    const idx=toks.findIndex(w=>coreOf(w).core===word);
    if(idx>=0){const p=coreOf(toks[idx]);return {toks,idx,pre:p.pre,suf:p.suf,word,ds};}
  }
  return null;
}
function mkFill(v){
  const b=pickBlank(v);
  if(!b)return mkOrder(v,true);
  const opts=shuffle([b.word,...b.ds]);
  return {type:'fill',prompt:'Completa el versículo',ref:v.r,toks:b.toks,idx:b.idx,pre:b.pre,suf:b.suf,opts,a:opts.indexOf(b.word),tries:0};
}
function mkOrder(v,noFill){
  const toks=v.t.split(/\s+/);
  if(toks.length>16||toks.length<4)return noFill?mkRef(v):mkFill(v);
  let bank=toks.map((w,i)=>({id:i,w})),n=0;
  do{bank=shuffle(bank);n++;}while(bank.map(b=>b.w).join(' ')===v.t&&n<10);
  return {type:'order',prompt:'Ordena las palabras del versículo',ref:v.r,toks,bank,tries:0};
}
const mk=(k,v)=>k==='fill'?mkFill(v):k==='ref'?mkRef(v):mkOrder(v);
function buildQuestions(verses,hand,max=10){
  const off=rnd(3);
  const kindsFor=v=>v.key?['fill','order','ref']:['fill','order'];
  const prim=verses.map((v,i)=>{const k=kindsFor(v);return mk(k[(i+off)%k.length],v);});
  const extras=shuffle(verses.map((v,i)=>{const k=kindsFor(v),p=(i+off)%k.length;return mk(k[(p+1+rnd(k.length-1))%k.length],v);}));
  const qs=[...prim,...hand.map(mkMC)];
  while(qs.length<max&&extras.length)qs.push(extras.pop());
  return shuffle(qs).slice(0,max);
}
